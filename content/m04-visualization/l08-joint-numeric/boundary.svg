<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Граница фильтрации на графике пробег — цена: прямая от 130 000 евро при нулевом пробеге до нуля при 600 000 км. Основная масса записей лежит под прямой у начала координат; записи выше прямой — кандидаты на проверку. При пробеге 300 000 км граница равна 65 000 евро">
  <defs><marker id="ba" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.6"/></marker></defs>
  <line x1="70" y1="226" x2="470" y2="226" stroke="currentColor" stroke-opacity="0.7" marker-end="url(#ba)"/>
  <line x1="70" y1="226" x2="70" y2="20" stroke="currentColor" stroke-opacity="0.7" marker-end="url(#ba)"/>
  <text x="470" y="248" text-anchor="end" fill="currentColor" font-size="11.5">пробег, км</text>
  <text x="62" y="18" text-anchor="end" fill="currentColor" font-size="11.5">цена, €</text>
  <g fill="currentColor" font-size="10.5" fill-opacity="0.8" text-anchor="middle">
    <text x="70" y="242">0</text><text x="250" y="242">300 000</text><text x="430" y="242">600 000</text>
  </g>
  <g fill="currentColor" font-size="10.5" fill-opacity="0.8" text-anchor="end">
    <text x="64" y="58">130 000</text><text x="64" y="146">65 000</text>
  </g>
  <path d="M70 226 L70 54 L430 226 Z" fill="#3d5bd9" fill-opacity="0.06"/>
  <ellipse cx="150" cy="208" rx="95" ry="16" fill="#3d5bd9" fill-opacity="0.35"/>
  <ellipse cx="128" cy="200" rx="52" ry="11" fill="#3d5bd9" fill-opacity="0.45"/>
  <text x="200" y="190" fill="currentColor" font-size="11">основная масса записей</text>
  <line x1="70" y1="54" x2="430" y2="226" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="7 5"/>
  <line x1="250" y1="226" x2="250" y2="140" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="70" y1="140" x2="250" y2="140" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <circle cx="250" cy="140" r="4" fill="#c2410c"/>
  <g fill="#c2410c">
    <circle cx="96" cy="34" r="4"/><circle cx="126" cy="60" r="4"/><circle cx="300" cy="104" r="4"/><circle cx="356" cy="150" r="4"/>
    <circle cx="452" cy="220" r="4"/><circle cx="460" cy="212" r="4"/>
  </g>
  <text x="140" y="38" fill="#c2410c" font-size="11.5">выше границы — проверить запись</text>
  <g fill="currentColor" font-size="12">
    <text x="500" y="60" font-weight="700">Прямая через (0; 130 000) и (600 000; 0):</text>
    <text x="500" y="84" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#3d5bd9">limit = 130_000 * (1 - x / 600_000)</text>
    <text x="500" y="112">При 300 000 км: 130 000 · (1 − 0,5)</text>
    <text x="500" y="128">= 65 000 евро.</text>
    <text x="500" y="156">Подозрительные записи:</text>
    <text x="500" y="172" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#3d5bd9">df['Price'] &gt; limit</text>
    <text x="500" y="200" fill-opacity="0.8">После 600 000 км граница</text>
    <text x="500" y="216" fill-opacity="0.8">отрицательна: такой пробег</text>
    <text x="500" y="232" fill-opacity="0.8">проверяют при любой цене.</text>
  </g>
</svg>
