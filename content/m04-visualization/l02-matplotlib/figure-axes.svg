<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Устройство графика Matplotlib: Figure — весь рисунок, Axes — область графика с заголовком, подписями осей, делениями, сеткой и легендой; каждую часть настраивает свой метод ax">
  <rect x="8" y="8" width="524" height="284" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <text x="18" y="26" fill="currentColor" fill-opacity="0.7" font-size="11.5">Figure (fig) — весь рисунок</text>
  <text x="290" y="44" text-anchor="middle" fill="currentColor" font-weight="700" font-size="12.5">Средняя цена Mercedes по году выпуска</text>
  <rect x="84" y="56" width="420" height="176" fill="#3d5bd9" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.7"/>
  <g stroke="currentColor" stroke-opacity="0.15">
    <line x1="84" y1="88" x2="504" y2="88"/><line x1="84" y1="124" x2="504" y2="124"/>
    <line x1="84" y1="160" x2="504" y2="160"/><line x1="84" y1="196" x2="504" y2="196"/>
  </g>
  <g fill="currentColor" fill-opacity="0.22">
    <circle cx="112" cy="214" r="2.3"/><circle cx="118" cy="205" r="2.3"/><circle cx="150" cy="210" r="2.3"/><circle cx="156" cy="196" r="2.3"/>
    <circle cx="190" cy="200" r="2.3"/><circle cx="196" cy="188" r="2.3"/><circle cx="230" cy="192" r="2.3"/><circle cx="236" cy="174" r="2.3"/>
    <circle cx="270" cy="182" r="2.3"/><circle cx="276" cy="160" r="2.3"/><circle cx="310" cy="166" r="2.3"/><circle cx="316" cy="146" r="2.3"/>
    <circle cx="350" cy="150" r="2.3"/><circle cx="356" cy="122" r="2.3"/><circle cx="390" cy="134" r="2.3"/><circle cx="396" cy="104" r="2.3"/>
    <circle cx="430" cy="112" r="2.3"/><circle cx="436" cy="84" r="2.3"/><circle cx="470" cy="96" r="2.3"/><circle cx="474" cy="70" r="2.3"/>
  </g>
  <polyline points="114,210 153,203 193,194 233,183 273,171 313,156 353,138 393,119 433,98 472,80" fill="none" stroke="#3d5bd9" stroke-width="2"/>
  <g fill="#3d5bd9">
    <circle cx="114" cy="210" r="3.4"/><circle cx="153" cy="203" r="3.4"/><circle cx="193" cy="194" r="3.4"/><circle cx="233" cy="183" r="3.4"/>
    <circle cx="273" cy="171" r="3.4"/><circle cx="313" cy="156" r="3.4"/><circle cx="353" cy="138" r="3.4"/><circle cx="393" cy="119" r="3.4"/>
    <circle cx="433" cy="98" r="3.4"/><circle cx="472" cy="80" r="3.4"/>
  </g>
  <rect x="94" y="64" width="164" height="42" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="currentColor" stroke-opacity="0.35"/>
  <circle cx="106" cy="76" r="3" fill="currentColor" fill-opacity="0.35"/>
  <text x="116" y="80" fill="#1c1c1a" font-size="11">Отдельные автомобили</text>
  <line x1="100" y1="95" x2="112" y2="95" stroke="#3d5bd9" stroke-width="2"/>
  <text x="116" y="99" fill="#1c1c1a" font-size="11">Средняя цена</text>
  <g stroke="currentColor" stroke-opacity="0.7">
    <line x1="114" y1="232" x2="114" y2="237"/><line x1="193" y1="232" x2="193" y2="237"/><line x1="273" y1="232" x2="273" y2="237"/>
    <line x1="353" y1="232" x2="353" y2="237"/><line x1="433" y1="232" x2="433" y2="237"/>
  </g>
  <g fill="currentColor" font-size="10.5" text-anchor="middle" fill-opacity="0.85">
    <text x="114" y="250">2000</text><text x="193" y="250">2004</text><text x="273" y="250">2008</text><text x="353" y="250">2012</text><text x="433" y="250">2016</text>
  </g>
  <text x="294" y="276" text-anchor="middle" fill="currentColor" font-size="11.5">Год выпуска</text>
  <text x="44" y="146" text-anchor="middle" fill="currentColor" font-size="11.5" transform="rotate(-90 44 146)">Цена, евро</text>
  <g fill="currentColor" font-size="11.5">
    <text x="548" y="44"><tspan font-family="JetBrains Mono, monospace" fill="#3d5bd9">ax.set_title(…)</tspan> заголовок</text>
    <text x="548" y="84"><tspan font-family="JetBrains Mono, monospace" fill="#3d5bd9">ax.legend()</tspan> — легенда;</text>
    <text x="548" y="100" fill-opacity="0.75">у слоёв нужен label='…'</text>
    <text x="548" y="134"><tspan font-weight="700">Axes (ax)</tspan> — область графика:</text>
    <text x="548" y="150" fill-opacity="0.75">ax.plot, ax.scatter, ax.bar…</text>
    <text x="548" y="184"><tspan font-family="JetBrains Mono, monospace" fill="#3d5bd9">ax.grid(alpha=0.3)</tspan> сетка</text>
    <text x="548" y="244"><tspan font-family="JetBrains Mono, monospace" fill="#3d5bd9">ax.set_xticks(…)</tspan> деления</text>
    <text x="548" y="276"><tspan font-family="JetBrains Mono, monospace" fill="#3d5bd9">ax.set_xlabel(…)</tspan> подпись оси</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.35" fill="none">
    <path d="M544 40 L440 40"/><path d="M544 80 L262 80"/><path d="M544 130 L506 130"/><path d="M544 180 L506 160"/>
    <path d="M544 240 L438 240"/><path d="M544 272 L340 272"/>
  </g>
</svg>
