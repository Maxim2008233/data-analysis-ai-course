- id: m4-l13-t7
  kind: plot
  title: "Шаг 7. ★ Два фактора сразу: образование и часы"
  difficulty: star
  introduces: []
  uses: [pd-apply, pd-pivot-table, heatmap-shares]
  statement: |
    Покажите на одном графике, как доля высокого дохода зависит **сразу** от образования и от часов работы.

    - Функция `edu_group(n)` по номеру образования возвращает `'без диплома школы'` (номер до 8 включительно), `'школа'` (9), `'колледж'` (10–12) или `'высшее'` (13 и выше); функция `hours_group(h)` — `'до 35'` (меньше 35 часов), `'35–45'` (от 35 до 45 включительно) или `'больше 45'`.
    - Добавьте колонки `edu_group` и `hours_group` через `apply`, колонку `high` и получите `table` — сводную долю дохода выше 50K: группы образования по строкам в порядке из списка выше, группы часов по колонкам в порядке `'до 35'`, `'35–45'`, `'больше 45'`.
    - Нарисуйте `table` тепловой картой с подписями в процентах (`annot=True, fmt='.0%'`) и заголовком.
  prelude: |
    import pandas as pd
    import matplotlib.pyplot as plt
    import seaborn as sns
    adult = pd.read_csv('adult.csv')
  starter: |
    def edu_group(n):
        ...

    def hours_group(h):
        ...

    adult['high'] = adult['salary'] == '>50K'
    adult['edu_group'] = ...
    adult['hours_group'] = ...
    rows = ['без диплома школы', 'школа', 'колледж', 'высшее']
    cols = ['до 35', '35–45', 'больше 45']
    table = ...
    fig, ax = plt.subplots(figsize=(7, 3.5))
    sns.heatmap(...)
    ax.set(title=..., xlabel='Часов в неделю', ylabel='Образование')
    plt.show()
  solution: |
    def edu_group(n):
        if n <= 8:
            return 'без диплома школы'
        if n == 9:
            return 'школа'
        if n <= 12:
            return 'колледж'
        return 'высшее'

    def hours_group(h):
        if h < 35:
            return 'до 35'
        if h <= 45:
            return '35–45'
        return 'больше 45'

    adult['high'] = adult['salary'] == '>50K'
    adult['edu_group'] = adult['education-num'].apply(edu_group)
    adult['hours_group'] = adult['hours-per-week'].apply(hours_group)
    rows = ['без диплома школы', 'школа', 'колледж', 'высшее']
    cols = ['до 35', '35–45', 'больше 45']
    table = adult.pivot_table(index='edu_group', columns='hours_group', values='high', aggfunc='mean').loc[rows, cols]
    fig, ax = plt.subplots(figsize=(7, 3.5))
    sns.heatmap(table, annot=True, fmt='.0%', cmap='Blues', ax=ax)
    ax.set(title='Доля дохода выше 50K растёт и с образованием, и с часами работы',
           xlabel='Часов в неделю', ylabel='Образование')
    plt.show()
  explanation: |
    - Функции с условиями (урок 0.8) превращают число в группу; `apply` применяет их к каждому значению колонки (урок 2.9).
    - `pivot_table` со средним логической колонки — доля в каждой клетке (урок 3.4); `.loc[rows, cols]` ставит строки и колонки в нужном порядке.
    - Тепловая карта показывает оба фактора сразу: от 1 % (без диплома, меньше 35 часов) до 63 % (высшее образование, больше 45 часов). Внутри каждой группы образования доля растёт с часами, а внутри каждой группы часов — с образованием.
  hints:
    - "Функции — цепочки `if`, которые возвращают название группы; колонки — `apply(edu_group)` и `apply(hours_group)`."
    - "`table = adult.pivot_table(index='edu_group', columns='hours_group', values='high', aggfunc='mean').loc[rows, cols]`."
    - "`sns.heatmap(table, annot=True, fmt='.0%', cmap='Blues', ax=ax)`."
  tests: |
    import numpy as np
    import pandas as pd
    eg = var('edu_group')
    hg = var('hours_group')
    ensure(callable(eg) and callable(hg), '`edu_group` и `hours_group` должны быть функциями.')
    for n, want in [(1, 'без диплома школы'), (8, 'без диплома школы'), (9, 'школа'), (10, 'колледж'), (12, 'колледж'), (13, 'высшее'), (16, 'высшее')]:
        equal(eg(n), want, 'edu_group({0}) должна вернуть «{1}», а вернула «{{actual}}».'.format(n, want))
    for h, want in [(20, 'до 35'), (34, 'до 35'), (35, '35–45'), (45, '35–45'), (46, 'больше 45'), (99, 'больше 45')]:
        equal(hg(h), want, 'hours_group({0}) должна вернуть «{1}», а вернула «{{actual}}».'.format(h, want))
    t = var('table', pd.DataFrame, 'таблицей DataFrame')
    ensure(list(t.index) == list(ref('rows')) and list(t.columns) == list(ref('cols')), 'Строки и колонки `table` должны идти в порядке списков `rows` и `cols`: `.loc[rows, cols]`.')
    if t.values.max() > 1.5:
        fail('В `table` должны быть доли (среднее `high`), а не количества: `aggfunc=\'mean\'`.')
    same_frame(t, ref('table'), 'Сводная доля дохода выше 50K не совпадает.', check_index=False)
    ax = axes()
    meshes = [c for c in ax.collections if type(c).__name__ == 'QuadMesh']
    ensure(len(meshes) >= 1, 'Нарисуйте тепловую карту: `sns.heatmap(table, ...)`.')
    arr = np.asarray(meshes[0].get_array()).reshape(t.shape)
    same_array(arr, ref('table').values, 'Цвета тепловой карты должны показывать доли из `table`.')
    texts = [x.get_text() for x in ax.texts]
    ensure(len(texts) >= t.size and all('%' in x for x in texts[:t.size]), 'Подпишите клетки процентами: `annot=True, fmt=\'.0%\'`.')
    ensure(ax.get_title().strip() != '', 'Добавьте заголовок.')
