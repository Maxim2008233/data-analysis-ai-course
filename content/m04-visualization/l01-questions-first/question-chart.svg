<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" font-family="Inter, Arial, sans-serif" font-size="12.5" role="img" aria-label="План графика: вопрос, показатель, график и действие. Пример: какие цены типичны — медиана и квартили — боксплот по маркам — ценовые ориентиры для сервиса">
  <defs><marker id="qa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.6"/></marker></defs>
  <g fill="currentColor">
    <rect x="12" y="22" width="160" height="58" rx="10" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9" stroke-opacity="0.65"/>
    <text x="92" y="46" text-anchor="middle" font-weight="700">1. Вопрос</text>
    <text x="92" y="66" text-anchor="middle" font-size="11.5" fill-opacity="0.8">что хотим узнать</text>
    <rect x="206" y="22" width="160" height="58" rx="10" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9" stroke-opacity="0.65"/>
    <text x="286" y="46" text-anchor="middle" font-weight="700">2. Показатель</text>
    <text x="286" y="66" text-anchor="middle" font-size="11.5" fill-opacity="0.8">какое число ответит</text>
    <rect x="400" y="22" width="160" height="58" rx="10" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9" stroke-opacity="0.65"/>
    <text x="480" y="46" text-anchor="middle" font-weight="700">3. График</text>
    <text x="480" y="66" text-anchor="middle" font-size="11.5" fill-opacity="0.8">как показать число</text>
    <rect x="594" y="22" width="154" height="58" rx="10" fill="#c2410c" fill-opacity="0.10" stroke="#c2410c" stroke-opacity="0.65"/>
    <text x="671" y="46" text-anchor="middle" font-weight="700">4. Для чего</text>
    <text x="671" y="66" text-anchor="middle" font-size="11.5" fill-opacity="0.8">какое решение примем</text>
  </g>
  <path d="M174 51 L202 51" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#qa)"/>
  <path d="M368 51 L396 51" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#qa)"/>
  <path d="M562 51 L590 51" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#qa)"/>
  <g fill="currentColor" font-size="12">
    <text x="12" y="112" font-weight="700" fill-opacity="0.75">Пример</text>
    <text x="92" y="136" text-anchor="middle">Какие цены</text>
    <text x="92" y="154" text-anchor="middle">типичны для марки?</text>
    <text x="286" y="136" text-anchor="middle">медиана и Q1–Q3</text>
    <text x="286" y="154" text-anchor="middle">цены по маркам</text>
    <text x="480" y="136" text-anchor="middle">боксплоты</text>
    <text x="480" y="154" text-anchor="middle">по маркам</text>
    <text x="671" y="136" text-anchor="middle">ценовые ориентиры</text>
    <text x="671" y="154" text-anchor="middle">для каждого сегмента</text>
  </g>
  <line x1="12" y1="174" x2="748" y2="174" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="12" y="198" fill="currentColor" fill-opacity="0.8" font-size="12">Граница выводов: данные — объявления (цены предложения). Спрос, продажи и выручку по ним не оценить.</text>
  <text x="12" y="218" fill="currentColor" fill-opacity="0.8" font-size="12">Если на шаге 4 нечего написать, график, скорее всего, не нужен.</text>
</svg>
