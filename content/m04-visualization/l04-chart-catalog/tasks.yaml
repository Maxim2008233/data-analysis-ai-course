    parts = df['Style'].value_counts().head(5)
    parts['Остальные'] = len(df) - parts.sum()
    quota = 100 * parts / parts.sum()
    squares = quota.astype(int)
    remainder = 100 - squares.sum()
    extra = (quota - squares).sort_values(ascending=False).index[:remainder]
    squares.loc[extra] += 1
    print(squares, squares.sum())

    if squares.sum() == 100:
        colors = list(plt.cm.tab10.colors[:5]) + ['lightgray']
        cell_colors = np.repeat(np.array(colors, dtype=object), squares.values)
        x, y = np.meshgrid(np.arange(10), np.arange(10))
        fig, ax = plt.subplots(figsize=(7, 5))
        ax.scatter(x.ravel(), -y.ravel(), c=list(cell_colors), marker='s', s=330)
        ax.set(title='Один квадрат ≈ 1 % объявлений', aspect='equal')
        ax.axis('off')
        plt.show()
  explanation: |
    - `quota` — доли в процентах; `astype(int)` отбрасывает дробную часть (для положительных чисел это округление вниз).
    - `remainder` — сколько квадратов потерялось при отбрасывании дробных частей.
    - Дробные части `quota - squares` по убыванию: первые `remainder` меток получают ещё по квадрату через `loc` (урок 2.9).
    - Простое `round()` здесь дало бы 99 квадратов: у SUV доля 9,499 % округлится вниз, хотя его дробная часть — среди наибольших.
