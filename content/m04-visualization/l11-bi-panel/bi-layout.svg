<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Схема BI-панели: заголовок с названием сегмента, в первой строке три ключевых числа — записей, медиана цены, медиана пробега; во второй строке три графика — топ марок, распределение цены, цена по коробке передач. Все элементы считаются по одному сегменту">
  <rect x="10" y="8" width="740" height="270" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <text x="26" y="34" fill="currentColor" font-weight="700" font-size="13">Предложения автомобилей — <tspan fill="#c2410c">сегмент: все записи</tspan></text>
  <g fill="#3d5bd9" fill-opacity="0.08" stroke="#3d5bd9" stroke-opacity="0.55">
    <rect x="26" y="48" width="226" height="70" rx="6"/><rect x="267" y="48" width="226" height="70" rx="6"/><rect x="508" y="48" width="226" height="70" rx="6"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="139" y="70" font-size="11.5" fill-opacity="0.75">Записей, шт.</text><text x="139" y="102" font-size="22" font-weight="700">32 067</text>
    <text x="380" y="70" font-size="11.5" fill-opacity="0.75">Медиана цены, евро</text><text x="380" y="102" font-size="22" font-weight="700">6 700</text>
    <text x="621" y="70" font-size="11.5" fill-opacity="0.75">Медиана пробега, км</text><text x="621" y="102" font-size="22" font-weight="700">180 000</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-opacity="0.35">
    <rect x="26" y="132" width="226" height="132" rx="6"/><rect x="267" y="132" width="226" height="132" rx="6"/><rect x="508" y="132" width="226" height="132" rx="6"/>
  </g>
  <g fill="currentColor" font-size="11.5" text-anchor="middle" fill-opacity="0.85">
    <text x="139" y="150">Топ-8 марок</text><text x="380" y="150">Распределение цены</text><text x="621" y="150">Цена по коробке</text>
  </g>
  <g fill="#3d5bd9" fill-opacity="0.7">
    <rect x="70" y="160" width="150" height="10"/><rect x="70" y="174" width="128" height="10"/><rect x="70" y="188" width="120" height="10"/><rect x="70" y="202" width="96" height="10"/>
    <rect x="70" y="216" width="80" height="10"/><rect x="70" y="230" width="66" height="10"/><rect x="70" y="244" width="52" height="10"/>
    <rect x="290" y="236" width="14" height="18"/><rect x="306" y="196" width="14" height="58"/><rect x="322" y="170" width="14" height="84"/><rect x="338" y="182" width="14" height="72"/>
    <rect x="354" y="206" width="14" height="48"/><rect x="370" y="222" width="14" height="32"/><rect x="386" y="232" width="14" height="22"/><rect x="402" y="240" width="14" height="14"/>
    <rect x="418" y="245" width="14" height="9"/><rect x="434" y="248" width="14" height="6"/><rect x="450" y="250" width="14" height="4"/>
  </g>
  <g stroke="#3d5bd9" stroke-width="1.5" fill="#3d5bd9" fill-opacity="0.15">
    <rect x="566" y="186" width="36" height="40"/><rect x="644" y="208" width="36" height="28"/>
  </g>
  <g stroke="#3d5bd9" stroke-width="1.5">
    <line x1="566" y1="204" x2="602" y2="204"/><line x1="584" y1="186" x2="584" y2="162"/><line x1="584" y1="226" x2="584" y2="250"/>
    <line x1="644" y1="224" x2="680" y2="224"/><line x1="662" y1="208" x2="662" y2="190"/><line x1="662" y1="236" x2="662" y2="252"/>
  </g>
  <g fill="currentColor" font-size="10.5" fill-opacity="0.7" text-anchor="middle">
    <text x="584" y="262">Automatic</text><text x="662" y="262">Manual</text>
  </g>
</svg>
