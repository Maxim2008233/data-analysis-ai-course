  statement: |
    Напишите `build_make_dashboard(data, make)` — панель одной марки по образцу лабораторной: `make_subplots(rows=2, cols=3, ...)`.

    - Строка 1 — три индикатора в таком порядке: число записей марки, медиана цены, медиана пробега.
    - Строка 2 — восемь самых частых **моделей** марки (горизонтальные столбцы `go.Bar`, по возрастанию), гистограмма цен (`go.Histogram`) и боксплоты цены по коробке передач: по `go.Box` на каждый тип коробки, `name` — тип коробки.
    - Заголовок содержит название марки, легенда скрыта.
    - Для марки, которой нет в данных, функция вызывает `ValueError`.

    Покажите панели для Mercedes и Renault.
