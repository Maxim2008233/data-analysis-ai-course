  solution: |
    def build_make_dashboard(data, make):
        cars = data[data['Make'] == make]
        if cars.empty:
            raise ValueError(f'Марки «{make}» нет в данных')
        fig = make_subplots(rows=2, cols=3, specs=[[{'type': 'indicator'}] * 3, [{'type': 'xy'}] * 3],
                            subplot_titles=['', '', '', 'Топ-8 моделей', 'Распределение цены', 'Цена по коробке'])
        metrics = [('Записей', len(cars)), ('Медиана цены, евро', cars['Price'].median()),
                   ('Медиана пробега, км', cars['Distance'].median())]
        for column, (label, value) in enumerate(metrics, start=1):
            fig.add_trace(go.Indicator(mode='number', value=float(value), title={'text': label},
                                       number={'valueformat': ',.0f'}), row=1, col=column)
        models = cars['Model'].value_counts().head(8).sort_values()
        fig.add_trace(go.Bar(x=models.values, y=models.index, orientation='h'), row=2, col=1)
        fig.add_trace(go.Histogram(x=cars['Price'], nbinsx=40), row=2, col=2)
        for transmission, group in cars.groupby('Transmission'):
            fig.add_trace(go.Box(y=group['Price'], name=transmission, boxpoints=False), row=2, col=3)
        fig.update_layout(height=620, showlegend=False, title=f'Панель марки: {make}')
        return fig

    build_make_dashboard(df, 'Mercedes').show()
    build_make_dashboard(df, 'Renault').show()
  explanation: |
    - Сегмент — объявления одной марки; все элементы считаются по `cars`.
    - Показатели собраны в список пар и добавляются циклом с `enumerate(..., start=1)` — номер колонки.
    - Вместо марок (в сегменте она одна) — восемь самых частых моделей: так панель отвечает на вопрос «из чего состоит предложение марки».
    - Цикл по группам `groupby('Transmission')` добавляет по боксплоту на тип коробки (урок 4.9).
  hints:
    - "Сегмент — `data[data['Make'] == make]`; три индикатора — циклом по списку пар «подпись, значение»."
    - "Модели — `cars['Model'].value_counts().head(8).sort_values()`; боксплоты — `for transmission, group in cars.groupby('Transmission'): fig.add_trace(go.Box(y=group['Price'], name=transmission), row=2, col=3)`."
    - "Индикатор: `go.Indicator(mode='number', value=float(value), title={'text': label})`, ячейка `row=1, col=column`; заголовок — `fig.update_layout(title=f'Панель марки: {make}', showlegend=False)`."
  tests: |
    import numpy as np
    f = var('build_make_dashboard')
    ensure(callable(f), '`build_make_dashboard` должна быть функцией.')
    d = ref('df')
    for make in ['Toyota', 'Skoda']:
        cars = d[d['Make'] == make]
        fig = f(d, make)
        ensure(fig is not None and hasattr(fig, 'data'), 'Функция должна возвращать рисунок: `return fig`.')
        ind = [t for t in fig.data if t.type == 'indicator']
        ensure(len(ind) == 3, 'Нужны три индикатора, а у вас {0}.'.format(len(ind)))
        exp = [len(cars), cars['Price'].median(), cars['Distance'].median()]
        ensure(np.allclose([float(t.value) for t in ind], exp), 'Для {0} индикаторы должны показывать {1} записей, медиану цены {2:.0f} и медиану пробега {3:.0f} — в этом порядке.'.format(make, *exp))
        bars = [t for t in fig.data if t.type == 'bar']
        models = cars['Model'].value_counts().head(8).sort_values()
        ensure(len(bars) == 1 and bars[0].orientation == 'h' and list(bars[0].y) == list(models.index), 'Столбцы должны показывать восемь самых частых моделей {0} по возрастанию (горизонтально).'.format(make))
        hist = [t for t in fig.data if t.type == 'histogram']
        ensure(len(hist) == 1 and len(hist[0].x) == len(cars), 'Гистограмма должна строиться по ценам марки.')
        boxes = [t for t in fig.data if t.type == 'box']
        ensure(sorted(t.name for t in boxes) == sorted(cars['Transmission'].unique()), 'Нужно по боксплоту на каждый тип коробки (`name` — тип коробки).')
        ensure(make in (fig.layout.title.text or ''), 'Заголовок должен содержать название марки.')
        ensure(fig.layout.showlegend is False, 'Скройте легенду: `showlegend=False`.')
    try:
        f(d, 'Нет такой марки')
    except ValueError:
        pass
    except Exception as e:
        fail('Для марки, которой нет в данных, нужна `ValueError`, а возникла {0}.'.format(type(e).__name__))
    else:
        fail('Для марки, которой нет в данных, функция должна остановиться с `ValueError`.')
