      expect: считайте по `data`

- id: m4-l11-t5
  kind: quiz
  title: Хорошая панель
  difficulty: main
  introduces: [bi-panel]
  uses: []
  statement: |
    Оцените решения для BI-панели сервиса.
  quiz:
    - q: "На панели «Сегмент: Toyota» индикатор «Записей» показывает 32 067. Что не так?"
      options:
        - Ничего, это нормально
        - Число посчитано по всей таблице, а не по сегменту — панель смешивает сегменты
        - Нужно показать среднюю цену вместо числа записей
      answer: 1
      explain: Все элементы панели должны считаться по одной таблице сегмента.
    - q: Какой набор элементов лучше для панели «предложения автомобилей»?
      options:
        - Три ключевых числа и три графика, каждый отвечает на свой вопрос
        - Все графики модуля на одном экране
        - Одна таблица на 32 тысячи строк
      answer: 0
      explain: Панель — ответы на заранее заданные вопросы, а не склад графиков.
