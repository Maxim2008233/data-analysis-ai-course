  </g>
  <g fill="currentColor" font-size="11.5">
    <text x="24" y="158">Вывод: топ-5 марок —</text>
    <text x="24" y="174">44,7 % записей</text>
    <text x="280" y="158">Вывод: различия и между</text>
    <text x="280" y="174">марками, и внутри них</text>
    <text x="536" y="158">Вывод: марки и года мало —</text>
    <text x="536" y="174">«пятна» широкие</text>
  </g>
  <rect x="12" y="196" width="736" height="58" rx="10" fill="#c2410c" fill-opacity="0.08" stroke="#c2410c" stroke-opacity="0.55"/>
  <g fill="currentColor" font-size="12">
    <text x="26" y="219"><tspan font-weight="700" fill="#c2410c">Действие:</tspan> оценивать цену по похожим машинам — с учётом модели, года и пробега.</text>
    <text x="26" y="241"><tspan font-weight="700" fill="#c2410c">Следующий шаг:</tspan> проверить точность оценки на отложенных данных. <tspan fill-opacity="0.75">Границы: это объявления, не сделки.</tspan></text>
