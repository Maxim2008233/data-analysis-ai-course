    <line x1="301" y1="86" x2="301" y2="68"/><line x1="301" y1="116" x2="301" y2="134"/><line x1="341" y1="78" x2="341" y2="64"/><line x1="341" y1="112" x2="341" y2="130"/>
    <line x1="381" y1="74" x2="381" y2="62"/><line x1="381" y1="114" x2="381" y2="134"/><line x1="421" y1="96" x2="421" y2="84"/><line x1="421" y1="118" x2="421" y2="134"/>
    <line x1="461" y1="90" x2="461" y2="76"/><line x1="461" y1="116" x2="461" y2="134"/>
