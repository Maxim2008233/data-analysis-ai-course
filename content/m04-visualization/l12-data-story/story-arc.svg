<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Дата-история из трёх слайдов: где сосредоточены записи — топ-5 марок охватывают 44,7 процента; насколько различаются цены — между марками и внутри них; что предлагаем — оценивать цену с учётом модели, года и пробега и проверить точность на отложенных данных">
  <defs><marker id="sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.6"/></marker></defs>
  <g fill="#3d5bd9" fill-opacity="0.07" stroke="#3d5bd9" stroke-opacity="0.55">
    <rect x="12" y="12" width="224" height="170" rx="10"/><rect x="268" y="12" width="224" height="170" rx="10"/><rect x="524" y="12" width="224" height="170" rx="10"/>
  </g>
  <path d="M238 97 L264 97" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#sa)"/>
  <path d="M494 97 L520 97" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#sa)"/>
  <g fill="currentColor">
    <text x="24" y="34" font-size="11" fill-opacity="0.7">СЛАЙД 1 · ВОПРОС</text>
    <text x="24" y="52" font-weight="700">Где сосредоточены записи?</text>
    <text x="280" y="34" font-size="11" fill-opacity="0.7">СЛАЙД 2 · ВОПРОС</text>
    <text x="280" y="52" font-weight="700">Насколько различаются цены?</text>
    <text x="536" y="34" font-size="11" fill-opacity="0.7">СЛАЙД 3 · ВОПРОС</text>
    <text x="536" y="52" font-weight="700">Что предлагаем сервису?</text>
  </g>
  <g fill="#3d5bd9" fill-opacity="0.7">
    <rect x="24" y="64" width="120" height="9"/><rect x="24" y="77" width="106" height="9"/><rect x="24" y="90" width="105" height="9"/><rect x="24" y="103" width="90" height="9"/><rect x="24" y="116" width="82" height="9"/>
  </g>
  <rect x="24" y="129" width="200" height="9" fill="currentColor" fill-opacity="0.25"/>
  <g stroke="#3d5bd9" stroke-width="1.4" fill="#3d5bd9" fill-opacity="0.15">
