    plt.show()
  explanation: |
    - `quantile(levels)` считает 99 квантилей сразу (урок 1.7), `to_numpy()` делает из них массив.
    - `norm.ppf(уровни, среднее, σ)` — квантили нормального распределения: обратная функция к накопленной доле.
    - Точки почти на диагонали: в середине отклонения малы, сильнее всего расходятся крайние уровни — хвосты распределения цен немного «тяжелее» нормальных.
    - Готовая функция того же графика — `scipy.stats.probplot`.
