- id: m4-l10-t6
  kind: plot
  title: Выпадающий список прямо в графике
  difficulty: star
  introduces: [segment-filter, plotly-express]
  uses: [hue-channel]
  statement: |
    Виджетов в тренажёре нет, но фильтр можно встроить в сам график Plotly. Постройте `fig = px.scatter(df, x='Year', y='Price', color='Transmission', ...)` — в нём два ряда точек (Automatic и Manual) — и добавьте выпадающий список `fig.update_layout(updatemenus=[{'buttons': [...]}])` с тремя кнопками:

    - `'Все'` — видны оба ряда: `{'label': 'Все', 'method': 'update', 'args': [{'visible': [True, True]}]}`;
    - `'Automatic'` — виден только ряд автоматов;
    - `'Manual'` — виден только ряд механики.

    Порядок значений в `visible` — порядок рядов в `fig.data`. Покажите график и попробуйте переключать список.
  prelude: |
    import pandas as pd
    import plotly.express as px
    df = pd.read_csv('cars_processed.csv')
  starter: |
    fig = px.scatter(df, x='Year', y='Price', color='Transmission', opacity=0.4, log_y=True,
                     labels={'Year': 'Год выпуска', 'Price': 'Цена, евро'})
    names = [trace.name for trace in fig.data]
    print(names)
    buttons = [
        {'label': 'Все', 'method': 'update', 'args': [{'visible': [True, True]}]},
        ...
    ]
    fig.update_layout(updatemenus=[{'buttons': buttons}], title='Цена и год выпуска: выберите коробку')
    fig.show()
  solution: |
    fig = px.scatter(df, x='Year', y='Price', color='Transmission', opacity=0.4, log_y=True,
                     labels={'Year': 'Год выпуска', 'Price': 'Цена, евро'})
    names = [trace.name for trace in fig.data]
    print(names)
    buttons = [{'label': 'Все', 'method': 'update', 'args': [{'visible': [True] * len(names)}]}]
    for name in names:
        buttons.append({'label': name, 'method': 'update', 'args': [{'visible': [n == name for n in names]}]})
    fig.update_layout(updatemenus=[{'buttons': buttons}], title='Цена и год выпуска: выберите коробку')
    fig.show()
  explanation: |
    - У `px.scatter` с `color=` каждая группа — отдельный ряд в `fig.data`; их названия — `trace.name`.
    - Кнопка с `method='update'` меняет свойства рядов: `visible` — список «показывать / скрыть» по рядам в их порядке.
    - Список кнопок удобно собрать циклом: для ряда `name` видимость `[n == name for n in names]` — `True` только у него.
    - Такой фильтр работает прямо в браузере, без Python: его можно сохранить в HTML (`fig.write_html`) и отправить заказчику.
  hints:
    - Узнайте порядок рядов (`names`) и для каждой кнопки задайте список видимости той же длины.
    - "Кнопка автоматов: `{'label': 'Automatic', 'method': 'update', 'args': [{'visible': [n == 'Automatic' for n in names]}]}`."
    - "Соберите кнопки циклом `for name in names:` и передайте их в `fig.update_layout(updatemenus=[{'buttons': buttons}])`."
  tests: |
    fig = pfig()
    names = [t.name for t in fig.data]
    ensure(set(names) == {'Automatic', 'Manual'}, 'Постройте `px.scatter(..., color=\'Transmission\')` — два ряда точек.')
    menus = fig.layout.updatemenus
    ensure(menus is not None and len(menus) >= 1, 'Добавьте выпадающий список: `fig.update_layout(updatemenus=[{\'buttons\': buttons}])`.')
    buttons = menus[0].buttons
    labels = [b.label for b in buttons]
    ensure(len(buttons) == 3 and set(labels) == {'Все', 'Automatic', 'Manual'}, 'Нужны три кнопки: `Все`, `Automatic`, `Manual`, а у вас {0}.'.format(labels))
    for b in buttons:
        ensure(b.method == 'update' and b.args and 'visible' in b.args[0], 'У каждой кнопки — `\'method\': \'update\'` и `\'args\': [{\'visible\': [...]}]`.')
        vis = list(b.args[0]['visible'])
        ensure(len(vis) == len(names), 'Список `visible` должен быть длины {0} — по значению на каждый ряд.'.format(len(names)))
        want = [True] * len(names) if b.label == 'Все' else [n == b.label for n in names]
        ensure(vis == want, 'Кнопка «{0}» должна показывать {1}, а у вас `visible={2}`. Порядок — как в `fig.data`: {3}.'.format(b.label, 'оба ряда' if b.label == 'Все' else 'только ряд ' + b.label, vis, names))
  files: [cars_processed.csv]
