description: >-
  Третье соревнование курса — по материалам «Baseline QA задачи». 786 вопросов теста с вариантами ответа: номер
  правильного варианта знает только сервер проверки. Отвечает большая языковая модель — GigaChat в Colab со своим
  ключом — или решение прямо в браузере. Ответы отправляются на сервер, и он считает долю верных по скрытым ответам.
  Результат сравнивается с базовым решением из ноутбука курса, ученики с аккаунтом попадают в таблицу лидеров.
