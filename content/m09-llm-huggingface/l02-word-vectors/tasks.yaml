  solution: |
    raw_unit = raw_vecs / np.linalg.norm(raw_vecs, axis=1, keepdims=True)
    en_unit = en_vecs / np.linalg.norm(en_vecs, axis=1, keepdims=True)
    pair_sims = (raw_unit * en_unit).sum(axis=1)
    by_language = pd.Series(pair_sims).groupby(pd.Series(languages)).mean()
    latin = [i for i, lang in enumerate(languages) if lang == 'Latina']
    worst_latin = [raw_names[i] for i in sorted(latin, key=lambda i: pair_sims[i])[:5]]
    print(by_language.round(3))
    print(worst_latin)
  explanation: |
    - `(raw_unit * en_unit).sum(axis=1)` — скалярные произведения строк попарно: косинус для каждого класса сразу, без цикла.
    - Для английских названий сходство 0,98 — подписи почти совпадают. Для испанских — 0,80, для латинских — 0,68: научные названия редких видов модель почти не связывает с животными.
    - Хуже всего — «passerina-ciris», певчая птица painted bunting: сходство 0,36. А «gorilla-gorilla» и «dugong-dugon» модель узнаёт (0,95): их латынь почти совпадает с английским «gorilla» и «dugong». Отсюда главный приём урока 9.8 — переводить названия классов на понятный модели английский.
