    def acc_with(C, rows):
        model = LogisticRegression(C=C, max_iter=1000).fit(X_train[rows], y_train[rows])
        return (model.predict(X_test) == y_test).mean()

    all_rows = np.arange(len(y_train))
    table = pd.DataFrame({'all': [acc_with(C, all_rows) for C in Cs],
                          'k5': [np.mean([acc_with(C, p) for p in picks5]) for C in Cs]}, index=Cs)
    best_C_all = table['all'].idxmax()
    best_C_k5 = table['k5'].idxmax()
    print(table.round(3))
    print(best_C_all, best_C_k5)
