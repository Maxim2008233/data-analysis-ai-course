    - На всех 343 картинках слабый штраф лучше: при C = 100 доля верных 0,988 против 0,959 при C = 1 по умолчанию. При C = 0,01 модель почти не может разделять группы (0,44): признаки CLIP — маленькие числа, и сильный штраф не даёт коэффициентам вырасти.
    - На 15 картинках C почти не важен: от 0,89 до 0,91, а лучший — C = 1. Когда примеров мало, свободная модель легко подстраивается под случайные особенности выборки.
    - Здесь мы смотрели на test, чтобы увидеть закономерность. В настоящей работе C выбирают кросс-валидацией на обучающей части (урок 6.8), а test трогают один раз.
