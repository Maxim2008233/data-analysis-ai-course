- id: m9-l9-t4
  title: Пример или название
  difficulty: main
  introduces: []
  uses: [transfer-learning, prompt-template]
  statement: |
    Сравните два описания класса для CLIP: **прототип** — среднее векторов картинок класса из `dev`, нормированное к длине 1, — и **название** в шаблоне `photo_group` (матрица `names`). Кандидаты — только классы с той же группой и языком (`allowed`). Получите:

    - `proto` — матрицу прототипов 349 × 512 (порядок классов — как в `classes`; если у класса нет картинок в `dev`, его строка остаётся нулевой);
    - `acc_proto` и `acc_names` — долю верных ответов на картинках `test` для прототипов и для названий;
    - `gap` — `acc_names − acc_proto`.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    allowed = (images['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) & (images['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :])
    names = prompt_emb[(prompts['variant'] == 'photo_group').to_numpy()]
    y_class = images['class'].to_numpy()
  starter: |
    proto = np.zeros((len(classes), X.shape[1]), dtype=np.float32)
    for j, c in enumerate(classes):
        rows = X[dev & (y_class == c)]
        if len(rows):
            v = ...
            proto[j] = ...

    def test_acc(E):
        pred = classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)]
        return ...

    acc_proto = test_acc(proto)
    acc_names = test_acc(names)
    gap = ...
    print(round(acc_proto, 3), round(acc_names, 3), round(gap, 3))
  solution: |
    proto = np.zeros((len(classes), X.shape[1]), dtype=np.float32)
    for j, c in enumerate(classes):
        rows = X[dev & (y_class == c)]
        if len(rows):
            v = rows.mean(axis=0)
            proto[j] = v / np.linalg.norm(v)

    def test_acc(E):
        pred = classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)]
        return (pred == y_class)[test].mean()

    acc_proto = test_acc(proto)
    acc_names = test_acc(names)
    gap = acc_names - acc_proto
    print(round(acc_proto, 3), round(acc_names, 3), round(gap, 3))
  explanation: |
    - У большинства классов в `dev` одна картинка, и прототип — это её вектор. Классы с четырьмя картинками получают среднее двух.
    - Прототипы дают 0,558, названия — 0,873: разница 31 пункт. Название описывает класс точнее, чем одна случайная фотография с фоном и посторонними деталями.
    - Считать точность прототипов на `dev` нельзя: там каждая картинка и есть прототип своего класса, и ответ почти всегда «верный».
  hints:
    - "Прототип — `rows.mean(axis=0)`, затем деление на `np.linalg.norm(v)`."
    - "Точность на test — `(pred == y_class)[test].mean()`."
    - "`gap = acc_names - acc_proto`."
  tests: |
    import numpy as np
    pr = np.asarray(var('proto'), dtype=float)
    ensure(pr.shape == ref('proto').shape, '`proto` — матрица 349 × 512, а у вас {0}.'.format(pr.shape))
    norms = np.linalg.norm(pr, axis=1)
    if not np.all((np.abs(norms - 1) < 1e-4) | (norms < 1e-9)):
        fail('Строки `proto` должны иметь длину 1: нормируйте среднее векторов.')
    same_array(pr, np.asarray(ref('proto'), dtype=float), '`proto` — нормированное среднее векторов картинок класса из `dev`.', atol=1e-5)
    ap = var('acc_proto', 'number', 'числом')
    if ap > 0.95:
        fail('Точность прототипов считают на картинках `test`: на `dev` прототип — это сама картинка.')
    close(ap, ref('acc_proto'), 'Доля верных у прототипов — {expected}, а у вас {actual}.')
    close(var('acc_names', 'number', 'числом'), ref('acc_names'), 'Доля верных у названий — {expected}, а у вас {actual}.')
    close(var('gap', 'number', 'числом'), ref('gap'), 'Разница — {expected}, а у вас {actual}.')
    close(alt('gap'), alt_ref('gap'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz]
  wrong:
