  solution: |
    def probe_acc(k, seed):
        rng = np.random.default_rng(seed)
        pick = np.concatenate([rng.choice(np.where(y_train == g)[0], size=k, replace=False) for g in groups])
        model = LogisticRegression(max_iter=1000).fit(X_train[pick], y_train[pick])
        return (model.predict(X_test) == y_test).mean()

    curve = pd.Series({k: np.mean([probe_acc(k, s) for s in range(5)]) for k in ks})
    print(curve.round(3))
  explanation: |
