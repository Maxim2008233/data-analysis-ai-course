- id: m9-l9-t5
  title: Регуляризация и число примеров
  difficulty: star
  introduces: []
  uses: [transfer-learning, regularization]
  statement: |
    У `LogisticRegression` сила регуляризации задаётся параметром `C`: чем он **меньше**, тем сильнее штраф за большие коэффициенты (C — обратная величина к α из урока 7.6). Проверим, как штраф влияет на зонд при разном числе примеров. Для каждого `C` из `Cs` получите долю верных на `X_test`:

    - при обучении на всех обучающих картинках;
    - при обучении на 5 картинках каждой группы — среднее по выборкам `picks5` (пять готовых наборов номеров).

    Сохраните результат в `table` — DataFrame с индексом `Cs` и столбцами `all` и `k5`. Получите `best_C_all` и `best_C_k5` — значения `C` с наибольшей долей верных в каждом столбце.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    y = images['group'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    big = images['group'].isin(['Animalia', 'Dishes', 'Other']).to_numpy()
    X_train, y_train = X[dev & big], y[dev & big]
    X_test, y_test = X[~dev & big], y[~dev & big]
    Cs = [0.01, 0.1, 1, 10, 100]
    picks5 = []
    for seed in range(5):
        rng = np.random.default_rng(seed)
        picks5.append(np.concatenate([rng.choice(np.where(y_train == g)[0], size=5, replace=False) for g in ['Animalia', 'Dishes', 'Other']]))
  starter: |
    def acc_with(C, rows):
        model = LogisticRegression(C=C, max_iter=1000).fit(X_train[rows], y_train[rows])
