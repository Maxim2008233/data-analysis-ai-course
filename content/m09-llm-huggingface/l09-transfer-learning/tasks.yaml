- id: m9-l9-t1
  title: Признаки и части
  difficulty: warmup
  introduces: [transfer-learning]
  uses: [zero-shot, pd-value-counts]
  statement: |
    `X` — векторы CLIP всех картинок, `y` — их группы, `dev` и `test` — маски частей. Оставьте только картинки трёх больших групп (маска `big`) и получите:

    - `X_train`, `y_train` — признаки и группы картинок из `dev`;
    - `X_test`, `y_test` — то же для картинок из `test`;
    - `train_share` — Series: доля каждой группы в обучающей части.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    y = images['group'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
    big = images['group'].isin(['Animalia', 'Dishes', 'Other']).to_numpy()
  starter: |
    X_train, y_train = ..., ...
    X_test, y_test = ..., ...
    train_share = ...
    print(X_train.shape, X_test.shape)
    print(train_share.round(3))
  solution: |
    X_train, y_train = X[dev & big], y[dev & big]
    X_test, y_test = X[test & big], y[test & big]
    train_share = pd.Series(y_train).value_counts(normalize=True)
    print(X_train.shape, X_test.shape)
    print(train_share.round(3))
  explanation: |
    - Маски соединяют через `&`: картинка должна быть и в нужной части, и в одной из трёх групп. Получается по 343 картинки в каждой части, у каждой — 512 признаков.
    - Животных 44 %, блюд 29 %, предметов 27 %. Части одинаковые по составу: от каждого класса — по одной картинке в каждую.
    - Сами признаки мы не придумывали: их «выучил» CLIP на сотнях миллионов картинок. Это и есть перенос обучения.
  hints:
    - "Маска обучающей части — `dev & big`, проверочной — `test & big`."
    - "`X[dev & big]` и `y[dev & big]` — строки и метки нужных картинок."
    - "Доли — `pd.Series(y_train).value_counts(normalize=True)`."
  tests: |
    import numpy as np
    import pandas as pd
    xt = np.asarray(var('X_train'), dtype=float)
    if xt.shape[0] == int(ref('dev').sum()):
        fail('Оставьте только три большие группы: маска `dev & big`, а не просто `dev`.')
    same_array(xt, np.asarray(ref('X_train'), dtype=float), '`X_train` — признаки картинок из `dev` трёх больших групп.')
    equal(list(var('y_train')), list(ref('y_train')), '`y_train` — группы тех же картинок.')
    same_array(np.asarray(var('X_test'), dtype=float), np.asarray(ref('X_test'), dtype=float), '`X_test` — признаки картинок из `test` трёх больших групп.')
    equal(list(var('y_test')), list(ref('y_test')), '`y_test` — группы проверочных картинок.')
    ts = var('train_share', pd.Series, 'Series')
    if abs(float(ts.sum()) - 1) > 1e-9:
        fail('`train_share` — доли, их сумма 1: `value_counts(normalize=True)`.')
    same_array(ts.reindex(ref('train_share').index).to_numpy(dtype=float), ref('train_share').to_numpy(dtype=float), '`train_share` — доля каждой группы в обучающей части.')
    equal(len(alt('y_train')), len(alt_ref('y_train')), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy]
  wrong:
    - code: |
        X_train, y_train = X[dev], y[dev]
        X_test, y_test = X[test], y[test]
        train_share = pd.Series(y_train).value_counts(normalize=True)
      expect: три большие группы
    - code: |
        X_train, y_train = X[dev & big], y[dev & big]
        X_test, y_test = X[test & big], y[test & big]
        train_share = pd.Series(y_train).value_counts()
      expect: сумма 1

- id: m9-l9-t2
  title: Линейный зонд
  difficulty: main
  introduces: []
  uses: [transfer-learning, binary-classification]
  statement: |
    Обучите логистическую регрессию (`LogisticRegression(max_iter=1000)`) узнавать группу картинки по признакам CLIP. Получите:

    - `probe` — обученную модель;
    - `acc` — долю верных ответов на `X_test`;
    - `errors_by_group` — Series: сколько ошибок пришлось на каждую настоящую группу;
    - `wrong_classes` — список классов картинок, на которых модель ошиблась, по алфавиту.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    y = images['group'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    big = images['group'].isin(['Animalia', 'Dishes', 'Other']).to_numpy()
    train_g, test_g = dev & big, ~dev & big
    X_train, y_train, X_test, y_test = X[train_g], y[train_g], X[test_g], y[test_g]
    test_classes = images.loc[test_g, 'class'].to_numpy()
  starter: |
    probe = ...
    pred = probe.predict(X_test)
    acc = ...
    wrong = pred != y_test
    errors_by_group = ...
    wrong_classes = ...
    print(round(acc, 3), errors_by_group.to_dict())
    print(wrong_classes)
  solution: |
    probe = LogisticRegression(max_iter=1000).fit(X_train, y_train)
    pred = probe.predict(X_test)
    acc = (pred == y_test).mean()
    wrong = pred != y_test
    errors_by_group = pd.Series(y_test[wrong]).value_counts()
    wrong_classes = sorted(test_classes[wrong])
    print(round(acc, 3), errors_by_group.to_dict())
    print(wrong_classes)
  explanation: |
    - Доля верных 0,959 — по 343 обучающим картинкам. Модель училась минуты, а признаки CLIP — недели на сотнях миллионов картинок.
    - Все 14 ошибок — в группе Other: ibis, emu, beaver, okapi и другие животные. Модель отнесла их к Animalia, и по содержанию картинки она права. Группа здесь говорит о происхождении класса, а не о том, что изображено.
    - Это частая картина в реальных данных: часть «ошибок» — спорная разметка или неудачная постановка задачи.
  hints:
    - "`LogisticRegression(max_iter=1000).fit(X_train, y_train)`."
    - "Ошибки по группам — `pd.Series(y_test[wrong]).value_counts()`."
    - "Классы ошибок — `sorted(test_classes[wrong])`."
  tests: |
    import numpy as np
    import pandas as pd
    pr = var('probe')
    ensure(hasattr(pr, 'predict') and hasattr(pr, 'coef_'), '`probe` — обученная `LogisticRegression`: вызовите `.fit(X_train, y_train)`.')
    close(var('acc', 'number', 'числом'), ref('acc'), 'Доля верных на test — {expected}, а у вас {actual}.')
    eg = var('errors_by_group', pd.Series, 'Series')
    equal({str(k): int(v) for k, v in eg.items() if v}, {str(k): int(v) for k, v in ref('errors_by_group').items()}, 'Ошибки по настоящим группам — {expected}, а у вас {actual}.')
    wc = list(var('wrong_classes', list, 'списком'))
    if sorted(wc) == list(ref('wrong_classes')) and wc != list(ref('wrong_classes')):
        fail('Отсортируйте классы по алфавиту: `sorted(...)`.')
    equal(wc, list(ref('wrong_classes')), 'Модель ошиблась на классах {expected}, а у вас {actual}.')
    close(alt('acc'), alt_ref('acc'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy]
  wrong:
    - code: |
        probe = LogisticRegression(max_iter=1000).fit(X_train, y_train)
        pred = probe.predict(X_test)
        acc = (pred == y_test).mean()
        wrong = pred != y_test
        errors_by_group = pd.Series(pred[wrong]).value_counts()
        wrong_classes = sorted(test_classes[wrong])
      expect: настоящим группам
    - code: |
        probe = LogisticRegression(max_iter=1000).fit(X_train, y_train)
        pred = probe.predict(X_train)
        acc = (pred == y_train).mean()
        wrong = probe.predict(X_test) != y_test
        errors_by_group = pd.Series(y_test[wrong]).value_counts()
        wrong_classes = sorted(test_classes[wrong])
      expect: Доля верных на test

