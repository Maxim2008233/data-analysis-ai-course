    - На `dev` лучшим оказался `photo_group` (0,878), на `test` он даёт 0,873. Оценка по `dev` завышена на полпункта — это и есть цена выбора по тем же данным.
    - На `test` лучше всех `bad_photo` (0,878), но узнать это заранее нельзя: мы бы подглядели в проверочные данные. Честная оценка выбранного решения — 0,873, а не 0,878.
    - Вариантов всего десять, поэтому подгонка небольшая. Если перебирать сотни шаблонов и их сочетаний, разрыв растёт. Скрытая половина соревнования покажет его честно.
