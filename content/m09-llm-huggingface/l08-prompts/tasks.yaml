- id: m9-l8-t1
  title: Точность одного варианта
  difficulty: warmup
  introduces: [prompt-template]
  uses: [zero-shot]
  statement: |
    Напишите функцию `accuracy(variant)` — долю верных ответов CLIP, если подписями классов служат подписи варианта `variant` (столбец `variant` таблицы `prompts`). Кандидаты — все классы. Получите `acc_raw`, `acc_en` и `acc_photo` — точность вариантов `'raw'`, `'en'` и `'photo'`.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    image_emb = np.load('zs_public.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant', 'prompt']})
        prompt_emb = data['emb'].astype(np.float32)
    classes = prompts.loc[prompts['variant'] == 'raw', 'class'].to_numpy()
  starter: |
    def accuracy(variant):
        rows = ...
        S = ...
        pred = classes[S.argmax(axis=1)]
        return ...

    acc_raw = accuracy('raw')
    acc_en = accuracy('en')
    acc_photo = accuracy('photo')
    print(round(acc_raw, 3), round(acc_en, 3), round(acc_photo, 3))
  solution: |
    def accuracy(variant):
        rows = (prompts['variant'] == variant).to_numpy()
        S = image_emb @ prompt_emb[rows].T
        pred = classes[S.argmax(axis=1)]
        return (pred == images['class']).mean()

    acc_raw = accuracy('raw')
    acc_en = accuracy('en')
    acc_photo = accuracy('photo')
    print(round(acc_raw, 3), round(acc_en, 3), round(acc_photo, 3))
  explanation: |
    - Маска `prompts['variant'] == variant` выбирает 349 строк — по подписи на класс в одном и том же порядке классов. Поэтому номер столбца с наибольшим косинусом — номер класса в `classes`.
    - Голое исходное название даёт 0,568, английский перевод — 0,776, перевод в шаблоне «a photo of a …» — 0,799. Перевод добавляет больше всего: модель училась на английских подписях.
  hints:
    - "Строки варианта — `(prompts['variant'] == variant).to_numpy()`."
    - "Косинусы — `image_emb @ prompt_emb[rows].T`."
    - "Доля верных — `(pred == images['class']).mean()`."
  tests: |
    f = var('accuracy')
    ensure(callable(f), '`accuracy` должна быть функцией.')
    g = ref('accuracy')
    for v in ['closeup', 'drawing']:
        close(float(f(v)), float(g(v)), 'Для варианта «' + v + '» точность {expected}, а `accuracy` дала {actual}.')
    for name in ['acc_raw', 'acc_en', 'acc_photo']:
        close(var(name, 'number', 'числом'), ref(name), '`' + name + '` — {expected}, а у вас {actual}.')
    close(alt('acc_en'), alt_ref('acc_en'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz]
  wrong:
