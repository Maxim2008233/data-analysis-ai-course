    def correct_of(variant):
        rows = (prompts['variant'] == variant).to_numpy()
        S = np.where(allowed, image_emb @ prompt_emb[rows].T, -np.inf)
        return classes[S.argmax(axis=1)] == images['class'].to_numpy()

    table = {}
    for v in prompts['variant'].unique():
        ok = correct_of(v)
        table[v] = {'dev': ok[dev].mean(), 'test': ok[test].mean()}
    scores = pd.DataFrame(table).T
    chosen = scores['dev'].idxmax()
    chosen_test = scores.loc[chosen, 'test']
    oracle_test = scores['test'].max()
    optimism = scores.loc[chosen, 'dev'] - chosen_test
    print(scores.round(3))
    print(chosen, round(chosen_test, 4), round(oracle_test, 4), round(optimism, 4))
