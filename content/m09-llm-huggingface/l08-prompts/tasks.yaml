            pred = classes[S.argmin(axis=1)]
            return (pred == images['class']).mean()
        acc_raw = accuracy('raw')
        acc_en = accuracy('en')
        acc_photo = accuracy('photo')
      expect: "`accuracy` дала"
    - code: |
