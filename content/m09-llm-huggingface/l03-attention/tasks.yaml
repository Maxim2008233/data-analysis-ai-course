    - "Голов с долей не меньше 0,9 — `(next_share >= 0.9).sum()`; номера для ответа — `(int(l) + 1, int(h) + 1)`."
  tests: |
    import numpy as np
    f = var('share')
    ensure(callable(f), '`share` должна быть функцией.')
    rng = np.random.default_rng(13)
    for T, off, k in [(6, 1, 3), (9, -1, 5), (8, 2, 4)]:
        M = rng.random((T, T))
        rows = np.arange(1, T - 1)
        ok = [i for i in rows if 0 <= i + off < T]
        for i in rng.choice(ok, size=k, replace=False):
            M[i, i + off] += 5
        for i in (0, T - 1):
            if 0 <= i + off < T:
                M[i, i + off] += 5
        M = M / M.sum(axis=1, keepdims=True)
        exp = float((M[rows].argmax(axis=1) == rows + off).mean())
        got = float(f(M, off))
        every = float((M.argmax(axis=1) == np.arange(T) + off).mean())
        if abs(got - exp) > 1e-9 and abs(got - every) < 1e-9:
            fail('Считайте только настоящие токены — строки с 1 по T − 2, без [CLS] и [SEP].')
        close(got, exp, 'На другой матрице (T = ' + str(T) + ', сдвиг ' + str(off) + ') доля {expected}, а у вас {actual}.')
    same_array(np.asarray(var('next_share'), dtype=float), ref('next_share'), '`next_share` — доли «на следующий токен» для всех 6 × 12 голов.')
    same_array(np.asarray(var('prev_share'), dtype=float), ref('prev_share'), '`prev_share` — доли «на предыдущий токен» для всех 6 × 12 голов.')
    equal(int(var('n_next', 'number', 'числом')), int(ref('n_next')), 'Голов, которые смотрят на следующий токен у 90 % токенов или больше, — {expected}, а у вас {actual}.')
    bp = tuple(int(x) for x in var('best_prev'))
    if bp == tuple(x - 1 for x in ref('best_prev')):
        fail('В ответе слои и головы нумеруются с 1, как в уроке: прибавьте 1 к номерам из массива.')
    equal(bp, tuple(ref('best_prev')), 'Чаще всех на предыдущий токен смотрит голова {expected}, а у вас {actual}.')
