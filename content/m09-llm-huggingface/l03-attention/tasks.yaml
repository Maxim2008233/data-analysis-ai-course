  solution: |
    def share(A, offset):
        T = A.shape[0]
        rows = np.arange(1, T - 1)
        target = A[rows].argmax(axis=1)
        return (target == rows + offset).mean()

    prev_share = np.array([[share(attn[l, h], -1) for h in range(12)] for l in range(6)])
    next_share = np.array([[share(attn[l, h], 1) for h in range(12)] for l in range(6)])
    n_next = int((next_share >= 0.9).sum())
    l, h = np.unravel_index(prev_share.argmax(), prev_share.shape)
    best_prev = (int(l) + 1, int(h) + 1)
    print(next_share.round(2))
    print(n_next, best_prev)
  explanation: |
    - `A[rows].argmax(axis=1)` — для каждого настоящего токена номер токена, на который он смотрит сильнее всего. Сравнение с `rows + offset` и `.mean()` дают долю.
    - Три головы смотрят на следующий токен: головы 1 и 10 второго слоя — у всех 14 настоящих токенов, голова 11 первого слоя — у 13. Чаще всех на предыдущий токен смотрит голова 3 первого слоя: у 12 токенов из 14. Так первые слои собирают сведения о соседях каждого слова.
    - В массиве слои и головы нумеруются с нуля, а в тексте урока — с единицы, отсюда `+ 1`.
