<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Три семейства трансформеров. Только кодировщик (BERT, DistilBERT): каждое слово видит всю фразу — матрица внимания закрашена целиком; учится восстанавливать пропущенное слово; для понимания текста — классификации и поиска ответа. Только декодировщик (GPT, ChatGPT, GigaChat): слово видит себя и предыдущие слова — закрашен нижний треугольник, будущие слова закрыты маской; учится предсказывать следующее слово; для генерации текста. Кодировщик и декодировщик (T5, BART): кодировщик читает вход целиком, декодировщик пишет ответ по порядку и через внимание смотрит на вход; для перевода и пересказа.">
