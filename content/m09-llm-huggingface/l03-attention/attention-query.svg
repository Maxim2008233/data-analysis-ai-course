<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Механизм внимания на примере из лекции. Пять слов фразы «почему бы тебе не дать» с векторами из двух чисел. Запрос переводчика перед первым английским словом — вектор (0,2; −2,1). Оценки — скалярные произведения запроса с каждым словом: 2,54, −0,06, −1,15, −8,87 и −0,74. Softmax превращает их в веса 0,880, 0,065, 0,022, 0,000 и 0,033: почти всё внимание у слова «почему». Контекст — взвешенная сумма векторов, (0,38; −1,00); переводчик пишет «Why».">
  <defs><marker id="aq-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#64748b"/></marker></defs>
  <text x="12" y="22" fill="currentColor" font-weight="700">Внимание: перед первым словом переводчик решает, на какие слова смотреть</text>
  <rect x="24" y="40" width="96" height="42" rx="6" fill="#3d5bd9" fill-opacity="0.52" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="72" y="57" fill="currentColor" text-anchor="middle" font-weight="700">почему</text>
  <text x="72" y="74" fill="currentColor" text-anchor="middle" font-size="11" opacity="0.8">(0,11; −1,2)</text>
  <text x="72" y="100" fill="currentColor" text-anchor="middle" font-size="11">оценка 2,54</text>
  <text x="72" y="117" fill="#3d5bd9" text-anchor="middle" font-weight="700">вес 0,880</text>
  <path d="M72 126 C72 170 215.0 175 215.0 214" fill="none" stroke="#3d5bd9" stroke-width="10.7" stroke-opacity="0.87"/>
  <rect x="134" y="40" width="96" height="42" rx="6" fill="#3d5bd9" fill-opacity="0.11" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="182" y="57" fill="currentColor" text-anchor="middle" font-weight="700">бы</text>
  <text x="182" y="74" fill="currentColor" text-anchor="middle" font-size="11" opacity="0.8">(1,8; 0,2)</text>
  <text x="182" y="100" fill="currentColor" text-anchor="middle" font-size="11">оценка −0,06</text>
  <text x="182" y="117" fill="#3d5bd9" text-anchor="middle" font-weight="700">вес 0,065</text>
  <path d="M182 126 C182 170 253.5 175 253.5 214" fill="none" stroke="#3d5bd9" stroke-width="1.7" stroke-opacity="0.30"/>
  <rect x="244" y="40" width="96" height="42" rx="6" fill="#3d5bd9" fill-opacity="0.09" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="292" y="57" fill="currentColor" text-anchor="middle" font-weight="700">тебе</text>
  <text x="292" y="74" fill="currentColor" text-anchor="middle" font-size="11" opacity="0.8">(3,7; 0,9)</text>
  <text x="292" y="100" fill="currentColor" text-anchor="middle" font-size="11">оценка −1,15</text>
  <text x="292" y="117" fill="#3d5bd9" text-anchor="middle" font-weight="700">вес 0,022</text>
  <path d="M292 126 C292 170 292.0 175 292.0 214" fill="none" stroke="#3d5bd9" stroke-width="1.2" stroke-opacity="0.27"/>
  <rect x="354" y="40" width="96" height="42" rx="6" fill="#3d5bd9" fill-opacity="0.08" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="402" y="57" fill="currentColor" text-anchor="middle" font-weight="700">не</text>
  <text x="402" y="74" fill="currentColor" text-anchor="middle" font-size="11" opacity="0.8">(−1,3; 4,1)</text>
  <text x="402" y="100" fill="currentColor" text-anchor="middle" font-size="11">оценка −8,87</text>
  <text x="402" y="117" fill="#3d5bd9" text-anchor="middle" font-weight="700">вес 0,000</text>
  <path d="M402 126 C402 170 330.5 175 330.5 214" fill="none" stroke="#3d5bd9" stroke-width="1.0" stroke-opacity="0.25"/>
  <rect x="464" y="40" width="96" height="42" rx="6" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="512" y="57" fill="currentColor" text-anchor="middle" font-weight="700">дать</text>
  <text x="512" y="74" fill="currentColor" text-anchor="middle" font-size="11" opacity="0.8">(2,6; 0,6)</text>
  <text x="512" y="100" fill="currentColor" text-anchor="middle" font-size="11">оценка −0,74</text>
  <text x="512" y="117" fill="#3d5bd9" text-anchor="middle" font-weight="700">вес 0,033</text>
  <path d="M512 126 C512 170 369.0 175 369.0 214" fill="none" stroke="#3d5bd9" stroke-width="1.4" stroke-opacity="0.27"/>
  <rect x="162" y="214" width="260" height="44" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-opacity="0.7"/>
  <text x="292.0" y="233" fill="currentColor" text-anchor="middle" font-weight="700">запрос q = (0,2; −2,1)</text>
  <text x="292.0" y="250" fill="currentColor" text-anchor="middle" font-size="11">переводчик перед первым словом (BOS)</text>
  <path d="M422 236.0 L472 236.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#aq-a)"/>
  <rect x="478" y="218" width="86" height="36" rx="8" fill="#15803d" fill-opacity="0.12" stroke="#15803d" stroke-opacity="0.7"/>
  <text x="521" y="241" fill="currentColor" text-anchor="middle" font-weight="700">«Why»</text>
  <text x="292.0" y="284" fill="currentColor" text-anchor="middle" font-size="11">контекст c = 0,880 · почему + 0,065 · бы + … = (0,38; −1,00)</text>
  <rect x="580" y="40" width="172" height="188" rx="8" fill="#64748b" fill-opacity="0.08" stroke="#64748b" stroke-opacity="0.4"/>
  <text x="592" y="62" fill="currentColor" font-weight="700" font-size="11.5">1. Оценки</text>
  <text x="592" y="79" fill="currentColor" font-size="11">q · k для каждого слова</text>
  <text x="592" y="108" fill="currentColor" font-weight="700" font-size="11.5">2. Веса</text>
  <text x="592" y="125" fill="currentColor" font-size="11">softmax: все веса</text>
  <text x="592" y="140" fill="currentColor" font-size="11">положительные, сумма 1</text>
  <text x="592" y="169" fill="currentColor" font-weight="700" font-size="11.5">3. Контекст</text>
  <text x="592" y="186" fill="currentColor" font-size="11">сумма векторов слов</text>
  <text x="592" y="201" fill="currentColor" font-size="11">с этими весами</text>
</svg>
