    sub = make_submission(images.loc[test, ['ID', 'group', 'language']], X[test])
    sub_acc = ...
    print(sub.head())
    print(len(sub), round(sub_acc, 3))
  solution: |
    def make_submission(table, emb):
        allowed = ((table['group'].to_numpy()[:, None] == cls_group[None, :]) &
                   (table['language'].to_numpy()[:, None] == cls_lang[None, :]))
        S = np.where(allowed, emb @ E.T, -np.inf)
        return pd.DataFrame({'ID': table['ID'].to_numpy(), 'predicted_class': classes[S.argmax(axis=1)]})

    sub = make_submission(images.loc[test, ['ID', 'group', 'language']], X[test])
    sub_acc = (sub['predicted_class'].to_numpy() == images.loc[test, 'class'].to_numpy()).mean()
    print(sub.head())
    print(len(sub), round(sub_acc, 3))
