- id: m9-l10-t6
  title: "Шаг 6. Уверенность и отказ от ответа"
  difficulty: main
  introduces: []
  uses: [zero-shot, logits]
  statement: |
    `S` — косинусы картинок с подписями выбранного варианта, у чужих классов — `-np.inf`. Вероятности CLIP — softmax от `100 · S` по строкам (у чужих классов вероятность 0). Получите:

    - `top_p` — массив: наибольшая вероятность для каждой картинки;
    - `conf` — DataFrame для порогов `thresholds`: столбцы `coverage` (доля картинок `test`, где `top_p` не ниже порога) и `accuracy` (точность среди них), индекс — пороги;
    - `p_ok` и `p_err` — средняя `top_p` на верных и на ошибочных ответах в `test`.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant', 'prompt']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
    allowed = ((images['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
               (images['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
    E = prompt_emb[(prompts['variant'] == 'photo_group').to_numpy()]
    S = np.where(allowed, X @ E.T, -np.inf)
    ok = classes[S.argmax(axis=1)] == images['class'].to_numpy()
    thresholds = [0.3, 0.5, 0.7, 0.9]
    def softmax(z):
        e = np.exp(z - z.max(axis=-1, keepdims=True))
        return e / e.sum(axis=-1, keepdims=True)
  starter: |
    P = softmax(100 * S)
    top_p = ...
    rows = []
    for t in thresholds:
        sure = test & (top_p >= t)
        rows.append({'coverage': ..., 'accuracy': ...})
    conf = pd.DataFrame(rows, index=thresholds)
    p_ok = ...
    p_err = ...
    print(conf.round(3))
    print(round(p_ok, 3), round(p_err, 3))
  solution: |
    P = softmax(100 * S)
    top_p = P.max(axis=1)
    rows = []
    for t in thresholds:
        sure = test & (top_p >= t)
        rows.append({'coverage': sure.sum() / test.sum(), 'accuracy': ok[sure].mean()})
    conf = pd.DataFrame(rows, index=thresholds)
    p_ok = top_p[test & ok].mean()
    p_err = top_p[test & ~ok].mean()
    print(conf.round(3))
    print(round(p_ok, 3), round(p_err, 3))
  explanation: |
    - `-np.inf` после умножения на 100 остаётся минус бесконечностью, и softmax даёт чужим классам ровно 0.
    - На верных ответах средняя уверенность 0,91, на ошибках — 0,55. Если модель отвечает только при уверенности не ниже 0,9, она берётся за 65 % картинок и ошибается лишь в 2 % из них. Остальные можно отдать на ручную проверку.
    - В соревновании отказаться от ответа нельзя — ответ нужен для каждой картинки. Но та же уверенность подскажет, где искать ошибки и какие классы проверить глазами.
  hints:
    - "Наибольшая вероятность в строке — `P.max(axis=1)`."
    - "Доля отвеченных — `sure.sum() / test.sum()`, точность — `ok[sure].mean()`."
    - "Средние — `top_p[test & ok].mean()` и `top_p[test & ~ok].mean()`."
  tests: |
    import numpy as np
    import pandas as pd
    tp = np.asarray(var('top_p'), dtype=float)
    ensure(tp.shape == ref('top_p').shape, '`top_p` — по числу на каждую картинку.')
    if np.allclose(tp, np.where(np.isfinite(ref('S')), ref('S'), -np.inf).max(axis=1)):
        fail('Это наибольший косинус, а нужна наибольшая вероятность: softmax от `100 * S`.')
    same_array(tp, ref('top_p'), '`top_p` — наибольшая вероятность для каждой картинки.', atol=1e-6)
    cf = var('conf', pd.DataFrame, 'таблицей')
    ensure(set(['coverage', 'accuracy']) <= set(cf.columns), 'В `conf` нужны столбцы `coverage` и `accuracy`.')
    cov = cf['coverage'].to_numpy(dtype=float)
    if np.allclose(cov, [float((ref('top_p') >= t).mean()) for t in ref('thresholds')]):
        fail('Долю отвеченных считайте среди картинок `test`: `sure = test & (top_p >= t)`, делите на `test.sum()`.')
    same_array(cf[['coverage', 'accuracy']].to_numpy(dtype=float), ref('conf')[['coverage', 'accuracy']].to_numpy(dtype=float), '`conf` — доля отвеченных и точность среди них для каждого порога.')
    close(var('p_ok', 'number', 'числом'), ref('p_ok'), 'Средняя уверенность на верных ответах — {expected}, а у вас {actual}.')
    close(var('p_err', 'number', 'числом'), ref('p_err'), 'Средняя уверенность на ошибках — {expected}, а у вас {actual}.')
    close(alt('p_err'), alt_ref('p_err'), HARDCODE_MSG)
