- id: m9-l10-t1
  title: "Шаг 1. Функция точности и базовое решение"
  difficulty: main
  introduces: []
  uses: [zero-shot, prompt-template]
  statement: |
    Напишите функцию `accuracy(E, part)`: `E` — матрица векторов подписей классов (349 строк в порядке `classes`), `part` — логическая маска картинок. Функция выбирает для каждой картинки класс с наибольшим косинусом и возвращает долю верных среди картинок `part`. Получите:

    - `E_base` — векторы подписей варианта `'pipeline'` («This is a photo of {класс}.»);
    - `base_dev` — точность базового решения на `dev`.

    На `test` пока не смотрим: его проверим один раз в шаге 4.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant', 'prompt']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
  starter: |
    def accuracy(E, part):
        pred = ...
        return ...

    E_base = ...
    base_dev = accuracy(E_base, dev)
    print(round(base_dev, 3))
  solution: |
    def accuracy(E, part):
        pred = classes[(X @ E.T).argmax(axis=1)]
        return (pred == images['class'].to_numpy())[part].mean()

    E_base = prompt_emb[(prompts['variant'] == 'pipeline').to_numpy()]
    base_dev = accuracy(E_base, dev)
    print(round(base_dev, 3))
  explanation: |
    - Базовое решение соревнования — названия классов в шаблоне pipeline — даёт на `dev` 0,592.
    - Функция понадобится во всех шагах: с ней любой вариант подписей проверяется одной строкой.
    - Маску части применяем к массиву верных ответов: `(pred == ...)[part]`. Так предсказание считается для всех картинок сразу, а доля — только по нужной части.
  hints:
    - "Ответы — `classes[(X @ E.T).argmax(axis=1)]`."
    - "Доля верных в части — `(pred == images['class'].to_numpy())[part].mean()`."
    - "Векторы варианта — `prompt_emb[(prompts['variant'] == 'pipeline').to_numpy()]`."
  tests: |
    import numpy as np
    f = var('accuracy')
    ensure(callable(f), '`accuracy` должна быть функцией.')
    g = ref('accuracy')
    pe, pr = ref('prompt_emb'), ref('prompts')
    for v, part in [('en', ref('test')), ('photo', ref('dev'))]:
        E = pe[(pr['variant'] == v).to_numpy()]
        close(float(f(E, part)), float(g(E, part)), 'Для варианта «' + v + '» точность {expected}, а `accuracy` дала {actual}.')
    same_array(np.asarray(var('E_base'), dtype=float), np.asarray(ref('E_base'), dtype=float), '`E_base` — векторы подписей варианта `pipeline`.')
    close(var('base_dev', 'number', 'числом'), ref('base_dev'), 'Точность базового решения на dev — {expected}, а у вас {actual}.')
    close(alt('base_dev'), alt_ref('base_dev'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz]
  wrong:
    - code: |
        def accuracy(E, part):
            pred = classes[(X @ E.T).argmax(axis=1)]
            return (pred == images['class'].to_numpy()).mean()
        E_base = prompt_emb[(prompts['variant'] == 'pipeline').to_numpy()]
        base_dev = accuracy(E_base, dev)
      expect: "`accuracy` дала"
    - code: |
        def accuracy(E, part):
            pred = classes[(X @ E.T).argmax(axis=1)]
            return (pred == images['class'].to_numpy())[part].mean()
        E_base = prompt_emb[(prompts['variant'] == 'raw').to_numpy()]
        base_dev = accuracy(E_base, dev)
      expect: "`pipeline`"

