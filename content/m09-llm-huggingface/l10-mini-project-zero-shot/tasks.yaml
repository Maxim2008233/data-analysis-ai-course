    - `sub` — ответы для картинок `test` (возьмите из `images` только колонки `ID`, `group`, `language` — класс функции не нужен);
    - `sub_acc` — точность `sub` по настоящим классам картинок `test`.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
