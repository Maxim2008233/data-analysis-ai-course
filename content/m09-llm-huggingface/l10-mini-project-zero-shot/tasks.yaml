  wrong:
    - code: |
        P = softmax(100 * S)
        top_p = P.max(axis=1)
        rows = []
        for t in thresholds:
            sure = top_p >= t
            rows.append({'coverage': sure.mean(), 'accuracy': ok[sure].mean()})
        conf = pd.DataFrame(rows, index=thresholds)
        p_ok = top_p[test & ok].mean()
        p_err = top_p[test & ~ok].mean()
      expect: среди картинок `test`
    - code: |
        P = softmax(S)
        top_p = P.max(axis=1)
        rows = []
        for t in thresholds:
            sure = test & (top_p >= t)
            rows.append({'coverage': sure.sum() / test.sum(), 'accuracy': ok[sure].mean() if sure.any() else 0.0})
        conf = pd.DataFrame(rows, index=thresholds)
        p_ok = top_p[test & ok].mean()
        p_err = top_p[test & ~ok].mean()
