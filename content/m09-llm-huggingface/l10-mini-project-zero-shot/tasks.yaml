- id: m9-l10-t3
  title: "Шаг 3. Шаблоны и ансамбли на dev"
  difficulty: main
  introduces: []
  uses: [prompt-template, zero-shot]
  statement: |
    Сравните на `dev` (с кандидатами своей группы и языка) все десять вариантов подписей и два ансамбля из урока 9.8: `'ens6'` — среднее шести шаблонов `six`, `'ens3'` — среднее трёх шаблонов `three`. Средние нормируйте к длине 1. Получите:

    - `configs` — словарь «название → матрица векторов подписей» из 12 вариантов;
    - `dev_table` — Series: точность каждого варианта на `dev`, по убыванию.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant', 'prompt']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
    allowed = ((images['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
               (images['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
    def accuracy_r(E, part):
        pred = classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)]
        return (pred == images['class'].to_numpy())[part].mean()
    def emb(variant):
        return prompt_emb[(prompts['variant'] == variant).to_numpy()]
    six = ['photo', 'photo_group', 'closeup', 'bad_photo', 'photo_the', 'drawing']
    three = ['photo', 'photo_group', 'bad_photo']
  starter: |
    def ensemble(variants):
        E = ...
        return ...

    configs = {v: emb(v) for v in prompts['variant'].unique()}
    configs['ens6'] = ...
    configs['ens3'] = ...
    dev_table = ...
    print(dev_table.round(3))
  solution: |
    def ensemble(variants):
        E = np.mean([emb(v) for v in variants], axis=0)
        return E / np.linalg.norm(E, axis=1, keepdims=True)

    configs = {v: emb(v) for v in prompts['variant'].unique()}
    configs['ens6'] = ensemble(six)
    configs['ens3'] = ensemble(three)
    dev_table = pd.Series({name: accuracy_r(E, dev) for name, E in configs.items()}).sort_values(ascending=False)
    print(dev_table.round(3))
  explanation: |
    - На `dev` лучший — одиночный шаблон `photo_group` (0,878). За ним `closeup` (0,873), `photo` и ансамбль трёх шаблонов (по 0,867). Ансамбли здесь не обогнали лучший одиночный шаблон.
    - Варианты без перевода (`raw`, `clean`, `pipeline`) отстают на 20 с лишним пунктов: перевод — главное улучшение.
    - Разница между первыми пятью вариантами — один-пять верных ответов из 353. Такую разницу легко получить случайно, и это стоит помнить при выборе.
  hints:
    - "Ансамбль — `np.mean([emb(v) for v in variants], axis=0)`, затем нормировка строк."
    - "`configs['ens6'] = ensemble(six)` и `configs['ens3'] = ensemble(three)`."
    - "Таблица — `pd.Series({name: accuracy_r(E, dev) for name, E in configs.items()}).sort_values(ascending=False)`."
  tests: |
    import numpy as np
    import pandas as pd
    cf = var('configs', dict, 'словарём')
    ensure(set(cf) == set(ref('configs')), '`configs` — 10 вариантов подписей и два ансамбля: `ens6` и `ens3`.')
    for name in ['ens6', 'ens3']:
        E = np.asarray(cf[name], dtype=float)
        if not np.allclose(np.linalg.norm(E, axis=1), 1, atol=1e-4):
            fail('Строки ансамбля `' + name + '` должны иметь длину 1: нормируйте среднее.')
        same_array(E, np.asarray(ref('configs')[name], dtype=float), '`' + name + '` — нормированное среднее векторов шаблонов.', atol=1e-5)
    dt = var('dev_table', pd.Series, 'Series')
    same_array(dt.reindex(ref('dev_table').index).to_numpy(dtype=float), ref('dev_table').to_numpy(dtype=float), '`dev_table` — точность каждого варианта на dev.')
    ensure(dt.is_monotonic_decreasing, 'Отсортируйте `dev_table` по убыванию точности.')
    if np.allclose(dt.reindex(ref('dev_table').index).to_numpy(dtype=float), [ref('accuracy_r')(ref('configs')[k], ref('test')) for k in ref('dev_table').index]):
        fail('Сравнивайте варианты на `dev`: test откладываем до шага 4.')
    same_array(alt('dev_table').sort_index().to_numpy(dtype=float), alt_ref('dev_table').sort_index().to_numpy(dtype=float), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz]
