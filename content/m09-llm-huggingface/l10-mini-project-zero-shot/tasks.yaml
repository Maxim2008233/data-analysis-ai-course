- id: m9-l10-t4
  title: "Шаг 4. Выбор и одна проверка на test"
  difficulty: main
  introduces: []
  uses: [prompt-template, zero-shot]
  statement: |
    Выберите вариант с наибольшей точностью на `dev` (`dev_table` уже посчитана) и один раз проверьте его на `test`. Для сравнения проверьте на `test` и базовое решение из шага 1 — подписи `pipeline` без ограничения кандидатов. Получите:

    - `chosen` — название выбранного варианта;
    - `test_chosen` — его точность на `test` (с кандидатами своей группы и языка);
    - `test_base` — точность базового решения на `test`;
    - `gain` — прирост `test_chosen − test_base`.
  prelude: |
    import numpy as np
    import pandas as pd
    images = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant', 'prompt']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    y = images['class'].to_numpy()
    dev = (images.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
    allowed = ((images['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
               (images['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
    def accuracy(E, part):
        return (classes[(X @ E.T).argmax(axis=1)] == y)[part].mean()
    def accuracy_r(E, part):
        return (classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)] == y)[part].mean()
    def emb(variant):
        return prompt_emb[(prompts['variant'] == variant).to_numpy()]
    def ensemble(variants):
        E = np.mean([emb(v) for v in variants], axis=0)
        return E / np.linalg.norm(E, axis=1, keepdims=True)
    configs = {v: emb(v) for v in prompts['variant'].unique()}
    configs['ens6'] = ensemble(['photo', 'photo_group', 'closeup', 'bad_photo', 'photo_the', 'drawing'])
    configs['ens3'] = ensemble(['photo', 'photo_group', 'bad_photo'])
    dev_table = pd.Series({name: accuracy_r(E, dev) for name, E in configs.items()}).sort_values(ascending=False)
  starter: |
    chosen = ...
    test_chosen = ...
    test_base = ...
    gain = ...
    print(chosen, round(test_chosen, 3), round(test_base, 3), round(gain, 3))
  solution: |
    chosen = dev_table.idxmax()
    test_chosen = accuracy_r(configs[chosen], test)
    test_base = accuracy(configs['pipeline'], test)
    gain = test_chosen - test_base
    print(chosen, round(test_chosen, 3), round(test_base, 3), round(gain, 3))
  explanation: |
    - Выбран `photo_group`: на `dev` 0,878, на `test` 0,873. Оценка почти подтвердилась, а базовое решение даёт на `test` 0,598 — прирост 27 пунктов.
    - На `test` лучше всех оказались бы `bad_photo` и ансамбль шести шаблонов (0,878). Но выбрать их можно было только подглядев в test, и тогда оценка 0,878 была бы нечестной.
    - Именно такую оценку — по данным, которые не участвовали в выборе, — стоит ожидать и на скрытой половине соревнования.
  hints:
    - "Выбранный вариант — `dev_table.idxmax()`."
    - "Точность на test — `accuracy_r(configs[chosen], test)`; базовое решение — `accuracy(configs['pipeline'], test)`."
    - "`gain = test_chosen - test_base`."
  tests: |
    ch = var('chosen', str, 'строкой')
    if ch != ref('chosen') and ch == max(ref('configs'), key=lambda k: ref('accuracy_r')(ref('configs')[k], ref('test'))):
        fail('Вариант выбирают по `dev`, а не по `test`: `dev_table.idxmax()`.')
    equal(ch, ref('chosen'), 'По dev выбирается {expected}, а у вас {actual}.')
    close(var('test_chosen', 'number', 'числом'), ref('test_chosen'), 'Точность выбранного варианта на test — {expected}, а у вас {actual}.')
    tb = var('test_base', 'number', 'числом')
    if abs(tb - float(ref('accuracy_r')(ref('configs')['pipeline'], ref('test')))) < 1e-9:
        fail('Базовое решение — подписи `pipeline` без ограничения кандидатов: функция `accuracy`, а не `accuracy_r`.')
    close(tb, ref('test_base'), 'Точность базового решения на test — {expected}, а у вас {actual}.')
    close(var('gain', 'number', 'числом'), ref('gain'), 'Прирост — {expected}, а у вас {actual}.')
    close(alt('gain'), alt_ref('gain'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz]
  wrong:
    - code: |
        chosen = dev_table.idxmax()
        test_chosen = accuracy_r(configs[chosen], test)
        test_base = accuracy_r(configs['pipeline'], test)
        gain = test_chosen - test_base
      expect: без ограничения кандидатов
    - code: |
        chosen = dev_table.idxmax()
        test_chosen = accuracy_r(configs[chosen], dev)
        test_base = accuracy(configs['pipeline'], test)
        gain = test_chosen - test_base
      expect: на test

