    import numpy as np
    ls = np.asarray(var('losses'), dtype=float)
    ensure(ls.shape == ref('losses').shape, '`losses` — по потере на каждую температуру из `temps`, а у вас форма {0}.'.format(ls.shape))
    if np.allclose(ls, -ref('losses')):
        fail('Потеря — со знаком минус перед средним: она положительная, и чем меньше, тем лучше.')
    same_array(ls, ref('losses'), '`losses` — логистическая потеря для каждой температуры.')
    close(var('T_best', 'number', 'числом'), ref('T_best'), 'Лучшая температура — {expected}, а у вас {actual}.')
    close(var('loss_1', 'number', 'числом'), ref('loss_1'), 'Потеря при T = 1 — {expected}, а у вас {actual}.')
    close(var('loss_best', 'number', 'числом'), ref('loss_best'), 'Потеря при лучшей температуре — {expected}, а у вас {actual}.')
    pc = var('p_customer', 'number', 'числом')
    if abs(pc - (1 - ref('p_customer'))) < 1e-6:
        fail('Модель ответила NEGATIVE, поэтому её уверенность — вероятность NEGATIVE (столбец 0).')
    close(pc, ref('p_customer'), 'Уверенность в ошибочном ответе при лучшей температуре — {expected}, а у вас {actual}.')
    close(alt('loss_1'), alt_ref('loss_1'), HARDCODE_MSG)
