- id: m9-l6-t5
  title: Температура
  difficulty: star
  introduces: []
  uses: [logits, binary-classification]
  statement: |
    Если перед softmax разделить логиты на число T («температуру»), класс с наибольшей вероятностью не изменится, а вероятности станут мягче (T > 1) или резче (T < 1). Подберём T, при которой вероятности модели лучше всего согласуются с правильными ответами. Для каждой температуры из `temps` посчитайте логистическую потерю (log loss, урок 8.7) на всех отзывах:

    $$
    \text{log loss} = -\frac{1}{n}\sum_i \left[y_i \ln p_i + (1 - y_i)\ln(1 - p_i)\right],
    $$

    где p — вероятность POSITIVE после softmax логитов, делённых на T, а y — правильный ответ `y`. Получите:

    - `losses` — массив потерь для всех температур;
    - `T_best` — температуру с наименьшей потерей;
    - `loss_1` и `loss_best` — потери при T = 1 и при `T_best`;
    - `p_customer` — уверенность модели в её (ошибочном) ответе NEGATIVE на отзыв «Customer support solved my problem in five minutes.» при `T_best`, то есть вероятность NEGATIVE. Номер этого отзыва — `i`.
  prelude: |
    import numpy as np
    import pandas as pd
    from transformers import AutoTokenizer, AutoModelForSequenceClassification
    name = 'distilbert-base-uncased-finetuned-sst-2-english'
    tokenizer = AutoTokenizer.from_pretrained(name)
    model = AutoModelForSequenceClassification.from_pretrained(name)
    reviews = pd.read_csv('reviews.csv')
    logits = model(**tokenizer(list(reviews['text']), padding=True, truncation=True, return_tensors='np')).logits
    y = reviews['label'].to_numpy()
    temps = np.round(np.arange(0.5, 5.01, 0.1), 1)
    found = np.where(reviews['text'] == 'Customer support solved my problem in five minutes.')[0]
    i = int(found[0]) if len(found) else 0          # номер отзыва о службе поддержки
    def softmax(z):
        e = np.exp(z - z.max(axis=-1, keepdims=True))
        return e / e.sum(axis=-1, keepdims=True)
