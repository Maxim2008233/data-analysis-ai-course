  solution: |
    def log_loss_at(T):
        p = softmax(logits / T)[:, 1]
        return -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))

    losses = np.array([log_loss_at(T) for T in temps])
    T_best = float(temps[losses.argmin()])
    loss_1 = log_loss_at(1.0)
    loss_best = losses.min()
    p_customer = softmax(logits[i] / T_best)[0]
    print(T_best, round(loss_1, 4), round(loss_best, 4), round(p_customer, 3))
  explanation: |
    - Наименьшая потеря — при T = 1,9: 0,184 вместо 0,234 при T = 1. Модель слишком уверена в себе, и, если «смягчить» её вероятности, они лучше согласуются с ответами. Доля верных не меняется: деление на положительное число не меняет, какой логит больше.
    - Уверенность в самой обидной ошибке падает с 0,991 до 0,922, а на русских отзывах вероятности становятся ещё ближе к 0,5 — честнее.
    - Так калибруют модели на практике: T подбирают на validation и применяют к новым данным. Здесь мы подбирали T на тех же 88 отзывах, на которых считали потерю, поэтому 0,184 — оптимистичная оценка.
