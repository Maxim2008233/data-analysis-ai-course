  solution: |
    trigrams = Counter()
    for s in sents:
        seq = ['<s>', '<s>'] + s + ['</s>']
        trigrams.update(zip(seq, seq[1:], seq[2:]))
    n_trigrams = len(trigrams)
    single_share = {'bigram': sum(c == 1 for c in bigrams.values()) / len(bigrams),
                    'trigram': sum(c == 1 for c in trigrams.values()) / len(trigrams)}
    top_trigram = next(t for t, c in trigrams.most_common() if '<s>' not in t and '</s>' not in t)
    print(n_trigrams, {k: round(v, 3) for k, v in single_share.items()}, top_trigram)
  explanation: |
    - Разных триграмм — 44 157, больше, чем биграмм (33 962): сочетаний из трёх слов гораздо больше.
    - Ровно один раз встретились 81 % разных биграмм и 93 % разных триграмм. Чем длиннее контекст, тем меньше шансов увидеть его в корпусе снова, а невиданное получает вероятность ноль.
    - Модель с длинным контекстом на подсчётах не построить даже на огромных корпусах. Нейросетевые модели заменяют подсчёты векторами и вниманием (уроки 9.2–9.3).
  hints:
    - "Тройки — `zip(seq, seq[1:], seq[2:])` для `seq = ['<s>', '<s>'] + s + ['</s>']`."
    - "Доля встретившихся один раз — `sum(c == 1 for c in trigrams.values()) / len(trigrams)`, то же для биграмм."
    - "Самая частая без меток — первая из `trigrams.most_common()`, где нет `'<s>'` и `'</s>'`."
  tests: |
    n = int(var('n_trigrams', 'number', 'числом'))
    equal(n, int(ref('n_trigrams')), 'Разных триграмм — {expected}, а у вас {actual}. Начало предложения — две метки `<s>`.')
    d = var('single_share', dict, 'словарём')
    ensure(set(d) == {'bigram', 'trigram'}, 'Ключи `single_share` — bigram и trigram.')
    close(d['bigram'], ref('single_share')['bigram'], 'Доля биграмм, встретившихся один раз, — {expected}, а у вас {actual}.')
    close(d['trigram'], ref('single_share')['trigram'], 'Доля триграмм, встретившихся один раз, — {expected}, а у вас {actual}.')
    t = tuple(var('top_trigram'))
    ensure(len(t) == 3, '`top_trigram` — тройка слов.')
    if '<s>' in t or '</s>' in t:
        fail('В `top_trigram` не должно быть меток `<s>` и `</s>`.')
    equal(t, tuple(ref('top_trigram')), 'Самая частая триграмма — {expected}, а у вас {actual}.')
    equal(int(alt('n_trigrams')), int(alt_ref('n_trigrams')), HARDCODE_MSG)
