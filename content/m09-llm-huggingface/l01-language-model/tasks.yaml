- id: m9-l1-t4
  title: Сглаживание Лапласа
  difficulty: main
  introduces: []
  uses: [n-gram, language-model]
  statement: |
    Чтобы невиданные пары не обнуляли вероятность, к каждому числу пар прибавляют 1: P(b | a) = (число пар (a, b) + 1) / (first[a] + V), где `V` — размер словаря (все слова корпуса и метка `</s>`). Это **сглаживание Лапласа**. Напишите `smooth_prob(sentence)` — вероятность фразы со сглаживанием. Получите:

    - `smoothed` — словарь «фраза → сглаженная вероятность» для фраз из `phrases`;
    - `ratio` — во сколько раз сглаживание уменьшило вероятность фразы `'Случайный лес.'`: обычная вероятность, делённая на сглаженную.
  prelude: |
    import re
    from collections import Counter
    with open('course_texts.txt', encoding='utf-8') as fh:
        text = fh.read()
    sentences = [s for s in re.split(r'(?<=[.!?…])\s+|\n', text) if s.strip()]

    def words(sentence):
        return re.findall(r'[а-яёa-z0-9]+', sentence.lower())

    sents = [w for w in (words(s) for s in sentences) if w]
    bigrams = Counter()
    for s in sents:
        seq = ['<s>'] + s + ['</s>']
        bigrams.update(zip(seq, seq[1:]))
    first = Counter()
    for (a, b), c in bigrams.items():
        first[a] += c
    V = len({w for s in sents for w in s}) + 1      # слова корпуса и метка </s>

    def phrase_prob(sentence):
        seq = ['<s>'] + words(sentence) + ['</s>']
        p = 1.0
        for a, b in zip(seq, seq[1:]):
            p *= bigrams[(a, b)] / first[a] if first[a] else 0.0
        return p

    phrases = ['Случайный лес.', 'Градиентный спуск.', 'Линейная регрессия предсказывает цену.']
  starter: |
    def smooth_prob(sentence):
        seq = ['<s>'] + words(sentence) + ['</s>']
        p = 1.0
        for a, b in zip(seq, seq[1:]):
            p *= ...
        return p

    smoothed = {s: smooth_prob(s) for s in phrases}
    ratio = ...
    print({s: f'{v:.2e}' for s, v in smoothed.items()}, round(ratio))
  solution: |
    def smooth_prob(sentence):
        seq = ['<s>'] + words(sentence) + ['</s>']
        p = 1.0
        for a, b in zip(seq, seq[1:]):
            p *= (bigrams[(a, b)] + 1) / (first[a] + V)
        return p

    smoothed = {s: smooth_prob(s) for s in phrases}
    ratio = phrase_prob('Случайный лес.') / smooth_prob('Случайный лес.')
    print({s: f'{v:.2e}' for s, v in smoothed.items()}, round(ratio))
  explanation: |
    - Нулей больше нет: «Градиентный спуск.» получает 5,5·10⁻¹¹, «Линейная регрессия предсказывает цену.» — 7,6·10⁻¹⁷.
    - Плата за это: вероятность фразы «Случайный лес.», которую модель видела, упала в 173 тысячи раз. Каждое из 7 434 слов словаря получило добавку, и у настоящих продолжений почти не осталось доли.
    - Поэтому на практике используют более аккуратные способы сглаживания, а главное — нейросети, которые оценивают вероятность невиданной пары по похожим словам.
  hints:
    - "Множитель со сглаживанием — `(bigrams[(a, b)] + 1) / (first[a] + V)`."
    - "Обычная вероятность уже есть — функция `phrase_prob`."
    - "`ratio = phrase_prob('Случайный лес.') / smooth_prob('Случайный лес.')`."
  tests: |
    f = var('smooth_prob')
    ensure(callable(f), '`smooth_prob` должна быть функцией.')
    for s in ['Это урок.', 'Средняя цена машин.']:
        close(f(s), ref('smooth_prob')(s), 'Сглаженная вероятность фразы «' + s + '» — {expected}, а у вас {actual}.', rtol=1e-9, atol=0)
    sm = var('smoothed', dict, 'словарём')
    for s in ref('phrases'):
        ensure(sm[s] > 0, 'Сглаженная вероятность не должна быть нулём: прибавьте 1 к числу пар.')
        close(sm[s], ref('smoothed')[s], 'Сглаженная вероятность фразы «' + s + '» — {expected}, а у вас {actual}.', rtol=1e-9, atol=0)
    r = var('ratio', 'number', 'числом')
    if abs(r * ref('ratio') - 1) < 1e-6:
        fail('`ratio` — обычная вероятность, делённая на сглаженную, а не наоборот.')
    close(r, ref('ratio'), '`ratio` — {expected}, а у вас {actual}.', rtol=1e-6)
    close(alt('ratio'), alt_ref('ratio'), HARDCODE_MSG, rtol=1e-6)
  files: [course_texts.txt]
  wrong:
    - code: |
        def smooth_prob(sentence):
            seq = ['<s>'] + words(sentence) + ['</s>']
            p = 1.0
            for a, b in zip(seq, seq[1:]):
                p *= (bigrams[(a, b)] + 1) / (first[a] + 1)
            return p
        smoothed = {s: smooth_prob(s) for s in phrases}
        ratio = phrase_prob('Случайный лес.') / smooth_prob('Случайный лес.')
      expect: Сглаженная вероятность
    - code: |
        def smooth_prob(sentence):
            seq = ['<s>'] + words(sentence) + ['</s>']
            p = 1.0
            for a, b in zip(seq, seq[1:]):
                p *= (bigrams[(a, b)] + 1) / (first[a] + V)
            return p
        smoothed = {s: smooth_prob(s) for s in phrases}
        ratio = smooth_prob('Случайный лес.') / phrase_prob('Случайный лес.')
      expect: а не наоборот

- id: m9-l1-t5
  title: Чем длиннее n-грамма, тем она реже
  difficulty: star
  introduces: []
  uses: [n-gram, pd-value-counts]
  statement: |
    Сравните биграммы и **триграммы** — тройки соседних слов. Для триграмм в начало предложения ставьте две метки: `['<s>', '<s>'] + s + ['</s>']`. Получите:

    - `n_trigrams` — сколько разных триграмм в корпусе;
    - `single_share` — словарь `{'bigram': ..., 'trigram': ...}`: доля разных n-грамм, встретившихся ровно один раз;
    - `top_trigram` — самая частая триграмма без меток `<s>` и `</s>`.
  prelude: |
    import re
    from collections import Counter
    with open('course_texts.txt', encoding='utf-8') as fh:
        text = fh.read()
    sentences = [s for s in re.split(r'(?<=[.!?…])\s+|\n', text) if s.strip()]

    def words(sentence):
        return re.findall(r'[а-яёa-z0-9]+', sentence.lower())

    sents = [w for w in (words(s) for s in sentences) if w]
    bigrams = Counter()
    for s in sents:
        seq = ['<s>'] + s + ['</s>']
        bigrams.update(zip(seq, seq[1:]))
