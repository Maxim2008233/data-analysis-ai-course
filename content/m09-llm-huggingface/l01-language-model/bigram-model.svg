<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Биграммная языковая модель. Слева: фраза «Кошка села на окошко» с метками начала и конца предложения разбита на пары соседних слов; вероятность фразы — произведение вероятностей каждого слова при предыдущем: P(кошка | начало) · P(села | кошка) · P(на | села) · P(окошко | на) · P(конец | окошко). Каждая вероятность — число пар, делённое на число вхождений первого слова. Справа: по текстам курса после слова «средняя» идут «цена» с вероятностью 0,575, «ошибка» — 0,125, «абсолютная» — 0,075, «марка» и «или» — по 0,05.">
  <defs><marker id="bg-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d5bd9"/></marker></defs>
  <text x="12" y="22" fill="currentColor" font-weight="700">Биграммная модель: каждое слово зависит только от предыдущего</text>
  <rect x="16" y="46" width="74" height="34" rx="6" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="53.0" y="68" fill="currentColor" text-anchor="middle" font-weight="400">&lt;s&gt;</text>
  <rect x="106" y="46" width="74" height="34" rx="6" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="143.0" y="68" fill="currentColor" text-anchor="middle" font-weight="700">кошка</text>
  <rect x="196" y="46" width="74" height="34" rx="6" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="233.0" y="68" fill="currentColor" text-anchor="middle" font-weight="700">села</text>
  <rect x="286" y="46" width="74" height="34" rx="6" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="323.0" y="68" fill="currentColor" text-anchor="middle" font-weight="700">на</text>
  <rect x="376" y="46" width="74" height="34" rx="6" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <text x="413.0" y="68" fill="currentColor" text-anchor="middle" font-weight="700">окошко</text>
  <rect x="466" y="46" width="74" height="34" rx="6" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="503.0" y="68" fill="currentColor" text-anchor="middle" font-weight="400">&lt;/s&gt;</text>
  <path d="M 59.0 82 Q 98.0 112 137.0 82" fill="none" stroke="#3d5bd9" stroke-width="1.5" marker-end="url(#bg-a)"/>
  <path d="M 149.0 82 Q 188.0 112 227.0 82" fill="none" stroke="#3d5bd9" stroke-width="1.5" marker-end="url(#bg-a)"/>
  <path d="M 239.0 82 Q 278.0 112 317.0 82" fill="none" stroke="#3d5bd9" stroke-width="1.5" marker-end="url(#bg-a)"/>
  <path d="M 329.0 82 Q 368.0 112 407.0 82" fill="none" stroke="#3d5bd9" stroke-width="1.5" marker-end="url(#bg-a)"/>
  <path d="M 419.0 82 Q 458.0 112 497.0 82" fill="none" stroke="#3d5bd9" stroke-width="1.5" marker-end="url(#bg-a)"/>
  <text x="98.0" y="128" fill="currentColor" text-anchor="middle" font-size="11">P(кошка | &lt;s&gt;)</text>
  <text x="188.0" y="144" fill="currentColor" text-anchor="middle" font-size="11">P(села | кошка)</text>
  <text x="278.0" y="128" fill="currentColor" text-anchor="middle" font-size="11">P(на | села)</text>
  <text x="368.0" y="144" fill="currentColor" text-anchor="middle" font-size="11">P(окошко | на)</text>
  <text x="458.0" y="128" fill="currentColor" text-anchor="middle" font-size="11">P(&lt;/s&gt; | окошко)</text>
  <text x="16" y="182" fill="currentColor">P(фразы) = произведение пяти вероятностей</text>
  <rect x="16" y="196" width="524" height="52" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="28" y="218" fill="currentColor">P(села | кошка) = <tspan font-weight="700">число пар «кошка села»</tspan> / <tspan font-weight="700">число «кошка»</tspan></text>
  <text x="28" y="238" fill="currentColor" fill-opacity="0.85" font-size="11">&lt;s&gt; и &lt;/s&gt; — метки начала и конца предложения: модель учится и тому, с чего фразы начинаются и чем кончаются</text>
  <text x="16" y="276" fill="currentColor" fill-opacity="0.85">Если какой-то пары в корпусе не было, её вероятность 0 — и вся фраза получает 0,</text>
  <text x="16" y="294" fill="currentColor" fill-opacity="0.85">даже если она грамотная. А слово дальше одного шага назад модель не видит вовсе.</text>
  <text x="566" y="52" fill="currentColor" font-weight="700">Тексты курса: после «средняя»</text>
  <text x="566" y="86" fill="currentColor">цена</text>
  <rect x="644" y="75" width="92.0" height="14" rx="3" fill="#c2410c" fill-opacity="0.75"/>
  <text x="742.0" y="86" fill="currentColor" font-size="11">0,575</text>
  <text x="566" y="116" fill="currentColor">ошибка</text>
  <rect x="644" y="105" width="20.0" height="14" rx="3" fill="#c2410c" fill-opacity="0.75"/>
  <text x="670.0" y="116" fill="currentColor" font-size="11">0,125</text>
  <text x="566" y="146" fill="currentColor">абсолютная</text>
  <rect x="644" y="135" width="12.0" height="14" rx="3" fill="#c2410c" fill-opacity="0.75"/>
  <text x="662.0" y="146" fill="currentColor" font-size="11">0,075</text>
  <text x="566" y="176" fill="currentColor">марка</text>
  <rect x="644" y="165" width="8.0" height="14" rx="3" fill="#c2410c" fill-opacity="0.75"/>
  <text x="658.0" y="176" fill="currentColor" font-size="11">0,05</text>
  <text x="566" y="206" fill="currentColor">или</text>
  <rect x="644" y="195" width="8.0" height="14" rx="3" fill="#c2410c" fill-opacity="0.75"/>
  <text x="658.0" y="206" fill="currentColor" font-size="11">0,05</text>
  <text x="566" y="240" fill="currentColor" fill-opacity="0.85" font-size="11">«средняя» встретилась 40 раз,</text>
  <text x="566" y="256" fill="currentColor" fill-opacity="0.85" font-size="11">из них 23 раза — «средняя цена»:</text>
  <text x="566" y="272" fill="currentColor" fill-opacity="0.85" font-size="11">23 / 40 = 0,575</text>
</svg>
