<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" font-family="Inter, Arial, sans-serif" font-size="12.5" role="img" aria-label="pivot_table превращает длинную таблицу объявлений в широкую сводную: марки по строкам, кузова по колонкам, в ячейках — число объявлений">
  <defs><marker id="p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.65"/></marker></defs>
  <text x="20" y="22" font-weight="700" fill="currentColor">объявления (длинная таблица)</text>
  <g font-family="JetBrains Mono, monospace" font-size="11.5" fill="currentColor">
    <text x="20" y="48" font-weight="700">Make     Style</text>
    <text x="20" y="68">Toyota   Sedan</text><text x="20" y="86">BMW      SUV</text><text x="20" y="104">Toyota   Sedan</text>
    <text x="20" y="122">Toyota   SUV</text><text x="20" y="140">BMW      Sedan</text><text x="20" y="158">…        …</text>
  </g>
  <path d="M180 104 L300 104" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#p)"/>
  <text x="188" y="94" fill="currentColor" font-size="11" font-family="JetBrains Mono, monospace">pivot_table</text>
  <text x="196" y="122" fill="currentColor" font-size="11" fill-opacity="0.7">aggfunc='size'</text>
  <text x="320" y="22" font-weight="700" fill="currentColor">сводная таблица (широкая)</text>
  <g font-family="JetBrains Mono, monospace" font-size="11.5" fill="currentColor">
    <text x="320" y="48" fill-opacity="0.6">Style →</text>
    <text x="420" y="48" font-weight="700">Sedan</text><text x="490" y="48" font-weight="700">SUV</text><text x="550" y="48" font-weight="700">…</text>
    <text x="320" y="72" font-weight="700">BMW</text><text x="436" y="72">1520</text><text x="500" y="72">305</text>
    <text x="320" y="94" font-weight="700">Toyota</text><text x="436" y="94">658</text><text x="500" y="94">284</text>
    <text x="320" y="116" font-weight="700">…</text>
    <text x="320" y="140" fill-opacity="0.6">Make ↓</text>
  </g>
  <rect x="426" y="80" width="50" height="20" rx="3" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
  <text x="600" y="78" fill="#3d5bd9" font-size="12">pivot.loc['Toyota', 'Sedan']</text>
  <text x="600" y="96" fill="currentColor" font-size="12">→ 658 объявлений</text>
  <text x="20" y="196" fill="currentColor"><tspan font-family="JetBrains Mono, monospace" font-weight="700">index=</tspan> — группы по строкам, <tspan font-family="JetBrains Mono, monospace" font-weight="700">columns=</tspan> — по колонкам, <tspan font-family="JetBrains Mono, monospace" font-weight="700">values=</tspan> + <tspan font-family="JetBrains Mono, monospace" font-weight="700">aggfunc=</tspan> — что считать в ячейке</text>
  <text x="20" y="218" fill="currentColor" fill-opacity="0.75">Пустые сочетания для количеств заполняют нулём (<tspan font-family="JetBrains Mono, monospace">fill_value=0</tspan>), для цен оставляют пропуском.</text>
</svg>
