<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" font-family="Inter, Arial, sans-serif" font-size="12.5" role="img" aria-label="Схема groupby: строки разбиваются на группы по марке, в каждой группе считается медиана цены, результаты собираются в одну Series с марками в индексе">
  <defs><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.65"/></marker></defs>
  <text x="20" y="22" font-weight="700" fill="currentColor">таблица</text>
  <text x="250" y="22" font-weight="700" fill="currentColor">1. разделить по Make</text>
  <text x="470" y="22" font-weight="700" fill="currentColor">2. применить median</text>
  <text x="640" y="22" font-weight="700" fill="currentColor">3. объединить</text>
  <g font-family="JetBrains Mono, monospace" font-size="11.5" fill="currentColor">
    <text x="20" y="48">VW    6000</text><text x="20" y="68">BMW  12000</text><text x="20" y="88">VW    4000</text>
    <text x="20" y="108">BMW   9000</text><text x="20" y="128">VW    8000</text><text x="20" y="148">Opel  3000</text>
    <rect x="240" y="34" width="150" height="62" rx="5" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9"/>
    <text x="252" y="54">VW 6000</text><text x="252" y="70">VW 4000</text><text x="252" y="86">VW 8000</text>
    <rect x="240" y="104" width="150" height="46" rx="5" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c"/>
    <text x="252" y="124">BMW 12000</text><text x="252" y="140">BMW  9000</text>
    <rect x="240" y="158" width="150" height="30" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.4"/>
    <text x="252" y="178">Opel 3000</text>
    <text x="480" y="70">6000</text><text x="480" y="132">10500</text><text x="480" y="178">3000</text>
    <rect x="630" y="104" width="110" height="74" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="642" y="124">BMW  10500</text><text x="642" y="144">Opel  3000</text><text x="642" y="164">VW    6000</text>
  </g>
  <path d="M120 98 L232 98" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#g)"/>
  <path d="M396 66 L470 66" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#g)"/>
  <path d="M396 128 L470 128" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#g)"/>
  <path d="M396 174 L470 174" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#g)"/>
  <path d="M540 66 C 590 66, 600 120, 626 128" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#g)"/>
  <path d="M540 128 L626 140" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#g)"/>
  <path d="M540 174 C 590 174, 600 160, 626 156" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#g)"/>
  <text x="20" y="222" fill="currentColor"><tspan font-family="JetBrains Mono, monospace" font-weight="700">df.groupby('Make')['Price'].median()</tspan> — группы становятся индексом результата (по алфавиту)</text>
</svg>
