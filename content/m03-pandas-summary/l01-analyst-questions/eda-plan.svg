<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Inter, Arial, sans-serif" font-size="12.5" role="img" aria-label="Четыре вопроса аналитика и инструменты модуля: представленность — describe и value_counts; типичная цена и разброс — groupby и agg; где данных мало — pivot_table и crosstab; простая оценка — оценка по группе и метрики MAE и MAPE">
  <g fill="currentColor">
    <rect x="16" y="20" width="350" height="46" rx="6" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
    <text x="28" y="40" font-weight="700">1. Какие марки и сегменты представлены?</text>
    <text x="28" y="57" fill-opacity="0.75">сколько записей, какие категории</text>
    <rect x="16" y="76" width="350" height="46" rx="6" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
    <text x="28" y="96" font-weight="700">2. Какая цена типична, велик ли разброс?</text>
    <text x="28" y="113" fill-opacity="0.75">среднее, медиана, квартили по группам</text>
    <rect x="16" y="132" width="350" height="46" rx="6" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
    <text x="28" y="152" font-weight="700">3. Где данных мало, выводы осторожны?</text>
    <text x="28" y="169" fill-opacity="0.75">размер групп, редкие сочетания</text>
    <rect x="16" y="188" width="350" height="46" rx="6" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
    <text x="28" y="208" font-weight="700">4. Годится ли цена похожих как оценка?</text>
    <text x="28" y="225" fill-opacity="0.75">ошибка оценки в евро и процентах</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <text x="420" y="47">describe · value_counts</text>
    <text x="420" y="103">groupby · agg</text>
    <text x="420" y="159">pivot_table · crosstab</text>
    <text x="420" y="215">transform · MAE · MAPE</text>
  </g>
  <g fill="currentColor" font-size="11.5" fill-opacity="0.65">
    <text x="640" y="47">уроки 3.1</text><text x="640" y="103">3.2–3.3</text><text x="640" y="159">3.4–3.6</text><text x="640" y="215">3.7</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.5" stroke-width="1.3">
    <line x1="370" y1="43" x2="412" y2="43"/><line x1="370" y1="99" x2="412" y2="99"/>
    <line x1="370" y1="155" x2="412" y2="155"/><line x1="370" y1="211" x2="412" y2="211"/>
  </g>
</svg>
