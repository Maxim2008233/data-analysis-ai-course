- id: m1-l1-t1
  title: Номер столбца с пробегом
  difficulty: warmup
  introduces: [observation-feature]
  uses: [py-lists]
  statement: |
    Список `header` с названиями столбцов уже прочитан из файла. Получите переменную `distance_col` — номер столбца `Distance` (нумерация с нуля). Не вписывайте число вручную — найдите его в списке `header`.
  prelude: |
    import csv
    with open('cars.csv', encoding='utf-8-sig', newline='') as file:
        header = next(csv.reader(file))
  starter: |
    distance_col = ...
    print(distance_col)
  solution: |
    distance_col = header.index('Distance')
    print(distance_col)
  explanation: |
    - `header` — обычный список строк: `['Make', 'Model', 'Year', 'Style', 'Distance', ...]`.
    - Метод `.index('Distance')` возвращает позицию первого совпадения — `4` (счёт с нуля: Make — 0, Model — 1, Year — 2, Style — 3, Distance — 4).
  hints:
    - У списка есть метод, который по значению возвращает его позицию.
    - "Метод `список.index(значение)` — см. справочник «Список (list)»."
    - "`distance_col = header.index(...)` — в скобках название столбца в кавычках."
  tests: |
    v = var('distance_col', 'int', 'целым числом — номером столбца')
    equal(v, ref('distance_col'), 'Номер столбца Distance — {expected}, а у вас {actual}. Помните: нумерация начинается с 0.')
    ensure('header' in source(), 'Номер найден верно, но вписан вручную. Получите его из списка header — так код не сломается, если порядок столбцов изменится.')
  wrong:
    - code: |
        distance_col = 5
      expect: нумерация начинается с 0
    - code: |
        distance_col = 4
      expect: вписан вручную

- id: m1-l1-t2
  title: Только год и цена
  difficulty: main
  introduces: [np-genfromtxt]
  uses: [observation-feature]
  statement: |
    Прочитайте из `cars.csv` два столбца — `Year` и `Price(euro)` — в матрицу `year_price` с помощью `np.genfromtxt`. Ожидаемая форма — `(число записей, 2)`, без строки заголовка.

    Номера столбцов найдите через `header.index(...)` (список `header` уже есть).
  prelude: |
    import csv
    import numpy as np
    with open('cars.csv', encoding='utf-8-sig', newline='') as file:
        header = next(csv.reader(file))
  starter: |
    columns = [header.index('Year'), header.index('Price(euro)')]
    year_price = ...
    print(year_price[:3])
  solution: |
    columns = [header.index('Year'), header.index('Price(euro)')]
    year_price = np.genfromtxt('cars.csv', delimiter=',', skip_header=1,
                               usecols=columns, dtype=float, ndmin=2)
    print(year_price[:3])
  explanation: |
    - `columns` — номера нужных столбцов: `[2, 8]`.
    - `delimiter=','` — значения разделены запятыми; `skip_header=1` — пропускаем строку заголовка.
    - `usecols=columns` — читаем только два столбца; `dtype=float` — как числа; `ndmin=2` гарантирует матрицу.
  hints:
    - "Нужна функция NumPy, которая читает числа из текстового файла, и параметры: разделитель, пропуск заголовка, выбор столбцов."
    - "`np.genfromtxt('cars.csv', delimiter=..., skip_header=..., usecols=..., dtype=float, ndmin=2)` — разобрано в теории урока."
    - "`year_price = np.genfromtxt('cars.csv', delimiter=',', skip_header=1, usecols=columns, dtype=float, ndmin=2)`"
  tests: |
    import numpy as np
    yp = var('year_price', 'ndarray', 'массивом NumPy (результатом np.genfromtxt)')
    ensure(yp.ndim == 2, 'Нужна матрица (2 оси), а у вас осей: %d. Добавьте ndmin=2.' % yp.ndim)
    ensure(yp.shape[1] == 2, 'В матрице должно быть 2 столбца (Year и Price(euro)), а у вас %d. Проверьте usecols.' % yp.shape[1])
    ensure(not np.isnan(yp[0]).any(), 'В первой строке матрицы есть nan — похоже, заголовок прочитан как данные. Добавьте skip_header=1.')
    exp = ref('year_price')
    ensure(yp.shape[0] == exp.shape[0], 'Строк %d, а должно быть %d — по одной на каждое объявление.' % (yp.shape[0], exp.shape[0]))
    same_array(yp, exp, 'Значения не совпадают — проверьте номера столбцов: нужны Year и Price(euro), в таком порядке.')
    same_array(alt('year_price'), alt_ref('year_price'), 'На другой части данных результат не совпал — читайте файл cars.csv, а не вписывайте значения.')
  wrong:
    - code: |
        columns = [header.index('Year'), header.index('Price(euro)')]
        year_price = np.genfromtxt('cars.csv', delimiter=',', usecols=columns, dtype=float, ndmin=2)
      expect: skip_header=1
    - code: |
        year_price = np.genfromtxt('cars.csv', delimiter=',', skip_header=1, usecols=[2, 4], dtype=float, ndmin=2)
      expect: проверьте номера столбцов
  alternatives:
    - |
      columns = [header.index('Year'), header.index('Price(euro)')]
      year_price = np.genfromtxt('cars.csv', delimiter=',', skip_header=1, usecols=columns, dtype=float)

- id: m1-l1-t3
  title: Что хранится в ячейке
  kind: quiz
  difficulty: main
  introduces: []
  uses: [observation-feature, np-genfromtxt]
  statement: |
    Матрица прочитана так: `X = np.genfromtxt('cars.csv', delimiter=',', skip_header=1, usecols=[2, 4, 5, 8], dtype=float, ndmin=2)` — столбцы Year, Distance, Engine_capacity(cm3), Price(euro). Ответьте на вопросы.
  quiz:
    - q: Что означает число `X[2, 1]`?
      options:
        - Год выпуска второй записи
        - Пробег третьей записи
        - Пробег второй записи
        - Объём двигателя третьей записи
      answer: 1
      explain: Нумерация с нуля — строка 2 это третья запись, столбец 1 — второй признак списка, Distance (пробег).
    - q: В `X` прочитаны 41 007 строк и 4 столбца. Сколько наблюдений описывает матрица?
      options:
        - "4"
        - "41 007"
        - "164 028"
        - "41 008"
      answer: 1
      explain: Каждая строка — одно объявление (наблюдение). 164 028 = 41 007 × 4 — число всех ячеек, а не наблюдений.
    - q: Какие утверждения о файле верны? Выберите все подходящие.
      options:
        - Сумма цен — это выручка продавцов
        - Цена в файле — цена, указанная в объявлении
        - По первым трём строкам можно описать типичную цену
        - Один автомобиль мог попасть в файл дважды
      answer: [1, 3]
      explain: Цены — из объявлений, о сделках мы не знаем, поэтому «выручки» в данных нет. Наблюдение — объявление, а одно авто могли выставить повторно. Трёх строк мало для описания набора.
  hints:
    - Вспомните, что нумерация в Python начинается с нуля, и какой признак стоит в каждом столбце.
    - "Порядок признаков: 0 — Year, 1 — Distance, 2 — Engine_capacity(cm3), 3 — Price(euro). Наблюдение — строка."
    - "`X[2, 1]` — строка с номером 2 (третья) и столбец 1 (Distance). Наблюдений столько же, сколько строк."

- id: m1-l1-t4
  kind: bug
  title: "Найдите ошибку: откуда nan в первой строке?"
  difficulty: main
  introduces: []
  uses: [np-genfromtxt]
  statement: |
    Коллега прочитал числовые столбцы, но в первой строке матрицы `X_fixed` оказались `nan`, а строк стало на одну больше. Исправьте код так, чтобы `X_fixed` содержала только данные: форма `(41007, 4)` для полного файла.
  prelude: |
    import numpy as np
  starter: |
    X_fixed = np.genfromtxt('cars.csv', delimiter=',',
                            usecols=[2, 4, 5, 8], dtype=float, ndmin=2)
    print(X_fixed[:2])
    print(X_fixed.shape)
  solution: |
    X_fixed = np.genfromtxt('cars.csv', delimiter=',', skip_header=1,
                            usecols=[2, 4, 5, 8], dtype=float, ndmin=2)
    print(X_fixed[:2])
    print(X_fixed.shape)
  explanation: |
    - Первая строка файла — заголовок `Make,Model,Year,...`. Без `skip_header=1` NumPy пытается прочитать его как числа и получает `nan`.
    - Параметр `skip_header=1` пропускает одну верхнюю строку.
  hints:
    - Посмотрите на первую строку файла cars.csv — что в ней написано?
    - Первая строка — заголовок; у genfromtxt есть параметр, который пропускает строки сверху.
    - "Добавьте в вызов `skip_header=1`."
  tests: |
    import numpy as np
    xf = var('X_fixed', 'ndarray', 'массивом NumPy')
    ensure(xf.ndim == 2 and xf.shape[1] == 4, 'Должна получиться матрица с 4 столбцами, а форма %s.' % (xf.shape,))
    ensure(not np.isnan(xf[0]).any(), 'В первой строке всё ещё nan — заголовок читается как данные. Пропустите его параметром skip_header.')
    same_array(xf, ref('X_fixed'), 'Матрица не совпадает с ожидаемой. Не меняйте номера столбцов — ошибка только в чтении заголовка.')
    same_array(alt('X_fixed'), alt_ref('X_fixed'), 'На другой части данных результат не совпал.')
  wrong:
    - code: |
        X_fixed = np.genfromtxt('cars.csv', delimiter=',', usecols=[2, 4, 5, 8], dtype=float, ndmin=2)
      expect: всё ещё nan
  alternatives:
    - |
      X_fixed = np.genfromtxt('cars.csv', delimiter=',', usecols=[2, 4, 5, 8], dtype=float, ndmin=2)[1:]

- id: m1-l1-t5
  title: Функция чтения по названиям столбцов
  difficulty: star
  introduces: []
  uses: [np-genfromtxt, py-functions]
  statement: |
    Напишите функцию `read_numeric(path, names)`, которая читает из CSV-файла `path` столбцы с названиями из списка `names` (в указанном порядке) и возвращает матрицу NumPy. Номера столбцов функция должна находить сама по заголовку файла.

    Например, `read_numeric('cars.csv', ['Price(euro)', 'Year'])` вернёт матрицу формы `(41007, 2)`, где первый столбец — цена. Даже для одного названия результат должен быть матрицей формы `(n, 1)`.
  prelude: |
    import csv
    import numpy as np
  starter: |
    def read_numeric(path, names):
        # 1) прочитайте заголовок файла модулем csv
        # 2) найдите номера столбцов для names
        # 3) прочитайте их через np.genfromtxt
        ...

    print(read_numeric('cars.csv', ['Price(euro)', 'Year'])[:3])
  solution: |
    def read_numeric(path, names):
        with open(path, encoding='utf-8-sig', newline='') as file:
            header = next(csv.reader(file))
        columns = [header.index(name) for name in names]
        return np.genfromtxt(path, delimiter=',', skip_header=1,
                             usecols=columns, dtype=float, ndmin=2)

    print(read_numeric('cars.csv', ['Price(euro)', 'Year'])[:3])
  explanation: |
    - Заголовок читаем так же, как в теории: `next(csv.reader(file))`.
    - Генератор списка `[header.index(name) for name in names]` сохраняет порядок из `names` — поэтому столбцы матрицы идут в нужном порядке.
    - `usecols` с номерами в любом порядке: NumPy вернёт столбцы именно в этом порядке.
    - `ndmin=2` — чтобы один столбец тоже был матрицей `(n, 1)`.
  hints:
    - "Функция повторяет шаги из теории урока: заголовок → номера столбцов → genfromtxt. Не забудьте `return`."
    - "Заголовок: `with open(path, encoding='utf-8-sig', newline='') as file: header = next(csv.reader(file))`; номера — генератор списка с `header.index`."
    - "`columns = [header.index(name) for name in names]`, затем `return np.genfromtxt(path, delimiter=',', skip_header=1, usecols=columns, dtype=float, ndmin=2)`."
  tests: |
    import numpy as np
    f = var('read_numeric')
    ensure(callable(f), 'read_numeric должна быть функцией: def read_numeric(path, names): ...')
    r = f('cars.csv', ['Price(euro)', 'Year'])
    ensure(r is not None, 'Функция ничего не вернула — добавьте return.')
    ensure(hasattr(r, 'shape'), 'Функция должна вернуть массив NumPy.')
    ensure(r.ndim == 2 and r.shape[1] == 2, 'Для двух названий нужна матрица с 2 столбцами, а форма %s.' % (r.shape,))
    same_array(r, ref('read_numeric')('cars.csv', ['Price(euro)', 'Year']), 'Столбцы или значения не совпадают — порядок столбцов должен быть как в списке names (сначала цена, потом год).')
    one = f('cars.csv', ['Engine_capacity(cm3)'])
    ensure(one.ndim == 2 and one.shape[1] == 1, 'Для одного названия нужна матрица (n, 1), а форма %s. Используйте ndmin=2.' % (one.shape,))
    same_array(one, ref('read_numeric')('cars.csv', ['Engine_capacity(cm3)']), 'Неверный результат для одного столбца Engine_capacity(cm3).')
  wrong:
    - code: |
        def read_numeric(path, names):
            return np.genfromtxt(path, delimiter=',', skip_header=1, usecols=[8, 2], dtype=float, ndmin=2)
      expect: Для одного названия
    - code: |
        def read_numeric(path, names):
            with open(path, encoding='utf-8-sig', newline='') as file:
                header = next(csv.reader(file))
            columns = [header.index(name) for name in names]
            np.genfromtxt(path, delimiter=',', skip_header=1, usecols=columns, dtype=float, ndmin=2)
      expect: return
