<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 300" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Из CSV-файла выбираем четыре числовых столбца и получаем матрицу X: строки — записи, столбцы — признаки">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- CSV -->
  <text x="20" y="22" font-weight="700" fill="currentColor">cars.csv (текст)</text>
  <g font-family="JetBrains Mono, monospace" font-size="11.5" fill="currentColor">
    <rect x="20" y="34" width="330" height="150" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="30" y="56" font-weight="700">Make,Model,<tspan fill="#3d5bd9">Year</tspan>,Style,<tspan fill="#3d5bd9">Distance</tspan>,</text>
    <text x="30" y="72" font-weight="700"><tspan fill="#3d5bd9">Engine…</tspan>,Fuel_type,…,<tspan fill="#3d5bd9">Price(euro)</tspan></text>
    <text x="30" y="98">Toyota,Prius,<tspan fill="#3d5bd9">2011</tspan>,…,<tspan fill="#3d5bd9">195000.0</tspan>,</text>
    <text x="30" y="114"><tspan fill="#3d5bd9">1800.0</tspan>,Hybrid,True,<tspan fill="#3d5bd9">7750.0</tspan></text>
    <text x="30" y="140">Renault,Grand Scenic,<tspan fill="#3d5bd9">2014</tspan>,…</text>
    <text x="30" y="166" fill-opacity="0.6">… ещё 41 005 строк</text>
  </g>
  <text x="20" y="206" fill="currentColor" fill-opacity="0.75">Первая строка — заголовок (skip_header=1)</text>
  <text x="20" y="224" fill="currentColor" fill-opacity="0.75">Синим — столбцы 2, 4, 5, 8 (usecols)</text>
  <!-- arrow -->
  <line x1="365" y1="110" x2="425" y2="110" stroke="currentColor" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="372" y="98" font-size="11" fill="currentColor" fill-opacity="0.8">genfromtxt</text>
  <!-- Matrix -->
  <text x="440" y="22" font-weight="700" fill="currentColor">матрица X, shape (41007, 4)</text>
  <g font-family="JetBrains Mono, monospace" font-size="11.5" fill="currentColor">
    <rect x="440" y="34" width="300" height="150" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="452" y="54" font-size="10.5" fill-opacity="0.7">  Year  Distance Engine  Price</text>
    <text x="452" y="78">2011. 195000. 1800.  7750.</text>
    <text x="452" y="100">2014. 135000. 1500.  8550.</text>
    <text x="452" y="122">1998.      1. 1400.  2200.</text>
    <text x="452" y="146" fill-opacity="0.6">  …      …      …      …</text>
    <rect x="447" y="64" width="286" height="20" rx="4" fill="#3d5bd9" fill-opacity="0.12"/>
    <rect x="667" y="62" width="62" height="92" rx="4" fill="none" stroke="#c0362c" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <text x="452" y="206" fill="currentColor" fill-opacity="0.85">▭ строка = запись (наблюдение), ось 0</text>
  <text x="452" y="226" fill="#c0362c">┆ столбец = признак, ось 1</text>
  <text x="452" y="252" fill="currentColor" fill-opacity="0.85">X[0, 3] = 7750.0 — цена первой записи</text>
  <text x="452" y="272" fill="currentColor" fill-opacity="0.65">Марка и модель — текст: в X их нет</text>
</svg>
