<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Матрица X: ось 0 идёт вниз по записям, ось 1 — вправо по признакам; вектор price имеет одну ось">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="24" font-weight="700" fill="currentColor">Матрица X: X.ndim = 2, X.shape = (41007, 4)</text>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <g stroke="currentColor" stroke-opacity="0.35" fill="none">
      <rect x="60" y="62" width="300" height="140" rx="6"/>
      <line x1="135" y1="62" x2="135" y2="202"/>
      <line x1="210" y1="62" x2="210" y2="202"/>
      <line x1="285" y1="62" x2="285" y2="202"/>
      <line x1="60" y1="97" x2="360" y2="97"/>
      <line x1="60" y1="132" x2="360" y2="132"/>
      <line x1="60" y1="167" x2="360" y2="167"/>
    </g>
    <text x="74" y="55" font-size="10.5" fill-opacity="0.75">Year</text>
    <text x="145" y="55" font-size="10.5" fill-opacity="0.75">Distance</text>
    <text x="222" y="55" font-size="10.5" fill-opacity="0.75">Engine</text>
    <text x="300" y="55" font-size="10.5" fill-opacity="0.75">Price</text>
    <text x="68" y="84">2011.</text><text x="140" y="84">195000.</text><text x="220" y="84">1800.</text><text x="292" y="84">7750.</text>
    <text x="68" y="119">2014.</text><text x="140" y="119">135000.</text><text x="220" y="119">1500.</text><text x="292" y="119">8550.</text>
    <text x="68" y="154">1998.</text><text x="160" y="154">1.</text><text x="220" y="154">1400.</text><text x="292" y="154">2200.</text>
    <text x="90" y="190" fill-opacity="0.6">…</text><text x="165" y="190" fill-opacity="0.6">…</text><text x="240" y="190" fill-opacity="0.6">…</text><text x="315" y="190" fill-opacity="0.6">…</text>
    <text x="22" y="84" font-size="10.5" fill-opacity="0.6">0</text>
    <text x="22" y="119" font-size="10.5" fill-opacity="0.6">1</text>
    <text x="22" y="154" font-size="10.5" fill-opacity="0.6">2</text>
  </g>
  <line x1="44" y1="66" x2="44" y2="205" stroke="#3d5bd9" stroke-width="2" marker-end="url(#ax)"/>
  <text x="20" y="232" fill="#3d5bd9">ось 0 — записи (41 007)</text>
  <line x1="64" y1="40" x2="362" y2="40" stroke="#c0362c" stroke-width="2" marker-end="url(#ax)" stroke-opacity="0"/>
  <line x1="64" y1="215" x2="362" y2="215" stroke="#c0362c" stroke-width="2" marker-end="url(#ax)"/>
  <text x="200" y="232" fill="#c0362c">ось 1 — признаки (4)</text>
  <text x="20" y="256" fill="currentColor" fill-opacity="0.8">X.size = 41007 × 4 = 164028 элементов</text>

  <text x="420" y="24" font-weight="700" fill="currentColor">Вектор price: ndim = 1, shape = (41007,)</text>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <rect x="440" y="62" width="80" height="140" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
    <text x="456" y="84">7750.</text>
    <text x="456" y="119">8550.</text>
    <text x="456" y="154">2200.</text>
    <text x="474" y="190" fill-opacity="0.6">…</text>
  </g>
  <text x="540" y="96" fill="currentColor" fill-opacity="0.85">одна ось;</text>
  <text x="540" y="116" fill="currentColor" fill-opacity="0.85">запятая в (41007,)</text>
  <text x="540" y="136" fill="currentColor" fill-opacity="0.85">означает кортеж</text>
  <text x="540" y="156" fill="currentColor" fill-opacity="0.85">из одного числа</text>
  <text x="420" y="232" fill="currentColor" fill-opacity="0.8">Это не «столбец» и не «строка» —</text>
  <text x="420" y="252" fill="currentColor" fill-opacity="0.8">просто последовательность значений</text>
</svg>
