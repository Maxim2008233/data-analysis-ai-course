<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Broadcasting: столбец формы (3, 1) плюс вектор формы (3,) даёт матрицу (3, 3); столбец растягивается вправо, вектор — вниз">
  <g font-family="JetBrains Mono, monospace" font-size="12.5" fill="currentColor">
    <text x="20" y="24" font-weight="700" font-family="Inter, Arial, sans-serif">столбец (3, 1)</text>
    <rect x="30" y="40" width="70" height="120" rx="5" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9"/>
    <text x="44" y="70">5000</text><text x="44" y="106">8000</text><text x="40" y="142">10000</text>
    <text x="120" y="106" font-size="20">+</text>
    <text x="150" y="24" font-weight="700" font-family="Inter, Arial, sans-serif">вектор (3,)</text>
    <rect x="150" y="40" width="210" height="36" rx="5" fill="#c2611b" fill-opacity="0.12" stroke="#c2611b"/>
    <text x="162" y="64">5000</text><text x="232" y="64">8000</text><text x="296" y="64">10000</text>
    <text x="380" y="106" font-size="20">=</text>
    <text x="412" y="24" font-weight="700" font-family="Inter, Arial, sans-serif">результат (3, 3)</text>
    <rect x="410" y="40" width="270" height="120" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
    <text x="422" y="70">10000</text><text x="508" y="70">13000</text><text x="594" y="70">15000</text>
    <text x="422" y="106">13000</text><text x="508" y="106">16000</text><text x="594" y="106">18000</text>
    <text x="422" y="142">15000</text><text x="508" y="142">18000</text><text x="594" y="142">20000</text>
  </g>
  <path d="M100 70 H 140" stroke="#3d5bd9" stroke-dasharray="3 3"/>
  <path d="M255 78 V 160" stroke="#c2611b" stroke-dasharray="3 3"/>
  <text x="20" y="190" fill="currentColor">Формы сравниваются справа налево: (3, 1) и (3,) → (3, 1) и (1, 3): размеры 1 растягиваются → (3, 3).</text>
  <text x="20" y="212" fill="currentColor" fill-opacity="0.75">Осторожно: (41007,) и (41007, 1) дадут матрицу 41007 × 41007 — 1,7 млрд чисел, памяти не хватит.</text>
</svg>
