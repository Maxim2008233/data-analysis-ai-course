<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Из полного файла выбирают несколько случайных частей по 100 записей; медианы частей разбросаны вокруг медианы файла 6600">
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="130" height="70" rx="8" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9"/>
  <text x="38" y="98" fill="currentColor" font-weight="700">весь файл</text>
  <text x="38" y="118" fill="currentColor" font-size="12">41 007 цен</text>
  <text x="38" y="134" fill="currentColor" font-size="12">медиана 6600</text>
  <g stroke="currentColor" stroke-opacity="0.55" stroke-width="1.3" fill="none">
    <path d="M152 92 L228 40" marker-end="url(#sa)"/>
    <path d="M152 100 L228 85" marker-end="url(#sa)"/>
    <path d="M152 112 L228 130" marker-end="url(#sa)"/>
    <path d="M152 122 L228 175" marker-end="url(#sa)"/>
  </g>
  <g font-size="12" fill="currentColor">
    <rect x="232" y="26" width="120" height="26" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text x="242" y="44">часть 1: 6400</text>
    <rect x="232" y="72" width="120" height="26" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text x="242" y="90">часть 2: 6875</text>
    <rect x="232" y="117" width="120" height="26" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text x="242" y="135">часть 3: 5900</text>
    <rect x="232" y="162" width="120" height="26" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><text x="242" y="180">часть 4: 6000</text>
  </g>
  <!-- шкала медиан 5000..8000 → 420..700 -->
  <line x1="420" y1="120" x2="700" y2="120" stroke="currentColor" stroke-opacity="0.5"/>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="currentColor" fill-opacity="0.7">
    <text x="410" y="140">5000</text><text x="503" y="140">6000</text><text x="596" y="140">7000</text><text x="672" y="140">8000</text>
  </g>
  <line x1="569.3" y1="88" x2="569.3" y2="132" stroke="#c0362c" stroke-width="2"/>
  <text x="532" y="82" fill="#c0362c" font-size="12">весь файл 6600</text>
  <g fill="#3d5bd9">
    <circle cx="550.7" cy="112" r="5"/><circle cx="594.9" cy="112" r="5"/><circle cx="503.7" cy="112" r="5"/><circle cx="513" cy="104" r="5"/>
  </g>
  <text x="420" y="176" fill="currentColor" fill-opacity="0.8">медианы частей по 100 цен</text>
  <text x="420" y="196" fill="currentColor" fill-opacity="0.8">разбросаны вокруг значения файла</text>
</svg>
