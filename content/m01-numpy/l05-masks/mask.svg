<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Сравнение price > 10000 даёт маску из True и False; маска отбирает значения, её сумма — количество, среднее — доля">
  <g font-family="JetBrains Mono, monospace" font-size="12.5" fill="currentColor">
    <text x="20" y="30" font-weight="700">price</text>
    <text x="20" y="80" font-weight="700">price &gt; 10000</text>
    <text x="20" y="130" font-weight="700">price[mask]</text>
    <!-- значения -->
    <g>
      <text x="170" y="30">7750</text><text x="240" y="30">8550</text><text x="310" y="30">11400</text><text x="390" y="30">2200</text><text x="460" y="30">11800</text><text x="540" y="30">35500</text>
    </g>
    <g>
      <rect x="160" y="62" width="62" height="26" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
      <rect x="230" y="62" width="62" height="26" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
      <rect x="300" y="62" width="62" height="26" rx="4" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
      <rect x="380" y="62" width="62" height="26" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
      <rect x="450" y="62" width="62" height="26" rx="4" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
      <rect x="530" y="62" width="62" height="26" rx="4" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
      <text x="168" y="80" fill-opacity="0.7">False</text><text x="238" y="80" fill-opacity="0.7">False</text><text x="312" y="80">True</text>
      <text x="388" y="80" fill-opacity="0.7">False</text><text x="462" y="80">True</text><text x="542" y="80">True</text>
    </g>
    <text x="310" y="130">11400</text><text x="460" y="130">11800</text><text x="540" y="130">35500</text>
  </g>
  <path d="M331 92 L331 114 M481 92 L481 114 M561 92 L561 114" stroke="#3d5bd9" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="20" y="176" fill="currentColor">mask.sum() → 3  (True считается как 1)</text>
  <text x="20" y="198" fill="currentColor">mask.mean() → 3 / 6 = 0.5  — доля записей с ценой выше 10 000 €</text>
  <text x="20" y="220" fill="currentColor" fill-opacity="0.7">Маска имеет ту же длину, что и вектор, и отбирает элементы с True.</text>
</svg>
