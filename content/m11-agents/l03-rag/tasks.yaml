        fail('На вопрос «Рецепт борща» модель была вызвана, хотя сходство ниже порога: решение «не знаю» принимается до запроса.')
    equal(got, ('Не знаю: в уроках курса об этом нет.', []), 'На вопрос не по курсу ожидалось {expected}, а у вас {actual}.')
    got = f('Что такое кросс-валидация?', m)
    equal(len(m.calls), 1, 'На вопрос по курсу модель вызывается один раз, а у вас {actual}.')
    sent = ' '.join(x.content for x in m.calls[0])
    ensure('Что такое кросс-валидация?' in sent and '[6.8]' in sent, 'Модель должна получить сообщения из `build_messages`: вопрос и контекст с найденными разделами.')
    equal(got[0], 'Кросс-валидация проверяет модель на каждом блоке [6.8].', 'Ответ модели без чужих ссылок возвращается как есть: {expected}, а у вас {actual}.')
    ensure(got[1] and got[1][0] == '6.8' and len(set(got[1])) == len(got[1]), 'Источники — уроки найденных разделов без повторов, первым — 6.8; у вас {0}.'.format(got[1]))
    m2 = FakeListChatModel(responses=['Ответ со ссылкой на чужой урок [9.9].'])
    got2 = f('Что такое кросс-валидация?', m2)
    ensure('9.9' in got2[0] and 'не из найденных разделов' in got2[0], 'Ссылку на урок 9.9 (не из найденных) нужно пометить строкой «(Ссылки [...] не из найденных разделов — проверьте их.)», а ответ: {0!r}.'.format(got2[0]))
    r = var('result', tuple, 'кортежем')
