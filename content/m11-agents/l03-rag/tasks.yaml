  solution: |
    def ungrounded(answer):
        if answer.strip().startswith('Не знаю'):
            return []
        sentences = [s for s in re.split(r'(?<=[.!?])\s+', answer.strip()) if s]
        return [s for s in sentences if not re.search(r'\[\s*\d+\.\d+', s)]

    flagged = [ungrounded(a) for a in answers]
    for a, f in zip(answers, flagged):
        print(f, '←', a[:50])
  explanation: |
    - `(?<=[.!?])\s+` — пробелы, перед которыми стоит конец предложения. Сам знак `(?<=...)` не «съедает», и точка остаётся в предложении.
    - Ссылку ищем по началу: открывающая скобка и номер урока `\[\s*\d+\.\d+`. Так находится и `[10.2]`, и `[9.1, 9.2]`.
    - «(об этом урок 10.2)» без квадратных скобок — тоже не ссылка в заданном формате. Модель нарушила инструкцию, и программа это видит. Короткое «Да.» после вопроса — формально предложение без ссылки; на таких мелочах строгие проверки и спотыкаются, поэтому их результат — повод посмотреть, а не автоматический приговор.
  hints:
    - "Предложение без ссылки — `not re.search(r'\\[\\s*\\d+\\.\\d+', s)`."
    - "Отказ проверяется до разбора: `answer.strip().startswith('Не знаю')`."
    - "Пустые куски убирает условие `if s` в списке предложений."
  tests: |
    f = var('ungrounded')
    ensure(callable(f), '`ungrounded` должна быть функцией.')
    equal(f('Первое [1.1]. Второе [2.2].'), [], 'Все предложения со ссылками — пустой список, а у вас {actual}.')
    equal(f('Первое [1.1]. Второе без ссылки.'), ['Второе без ссылки.'], 'Ожидалось {expected}, а у вас {actual}.')
    equal(f('Несколько сразу [1.1, 2.2]! А тут нет?'), ['А тут нет?'], 'Ссылка с несколькими номерами — тоже ссылка, а «?» — конец предложения: ожидалось {expected}, а у вас {actual}.')
    equal(f('Список [1, 2] — не ссылка.'), ['Список [1, 2] — не ссылка.'], 'Квадратные скобки без номера урока — не ссылка.')
    equal(f('Не знаю: в уроках об этом нет.'), [], 'Честный отказ «Не знаю…» не проверяется — пустой список.')
    equal(f('  Одно утверждение.  '), ['Одно утверждение.'], 'Пробелы по краям ответа не дают пустых предложений: ожидалось {expected}, а у вас {actual}.')
    equal(var('flagged', list, 'списком'), ref('flagged'), 'Результаты проверки ответов — {expected}, а у вас {actual}.')
