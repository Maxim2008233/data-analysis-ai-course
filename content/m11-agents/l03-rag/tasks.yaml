- id: m11-l3-t5
  title: Утверждения без ссылок
  difficulty: star
  introduces: []
  uses: [rag]
  statement: |
    Инструкция требует ссылку после каждого утверждения. Напишите проверку `ungrounded(answer)`: список предложений ответа, в которых нет ни одной ссылки вида `[x.y]` (в том числе внутри скобок с несколькими номерами: `[9.1, 10.2]`). Предложения разделяются концом предложения (`.`, `!` или `?`) и пробелами после него: `re.split(r'(?<=[.!?])\s+', answer.strip())`. Пустые куски не считаются. Ответ «Не знаю…» — честный отказ: для него список пустой.

    Получите `flagged` — результаты проверки для ответов из `answers`.
  prelude: |
    import re
    answers = [
        'Температура меняет вероятности токенов [10.2]. При низкой температуре ответы стабильнее [10.2].',
        'Кросс-валидация надёжнее одной проверки [6.8]. Обычно берут пять блоков. Это занимает больше времени!',
        'Не знаю.',
