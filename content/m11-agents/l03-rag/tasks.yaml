    def rag_answer(question, model, threshold=0.20, k=3):
        hits = search(question, k)
        if hits[0][0] < threshold:
            return 'Не знаю: в уроках курса об этом нет.', []
        sources = []
        for score, d in hits:
            if d['lesson'] not in sources:
                sources.append(d['lesson'])
        answer = model.invoke(build_messages(question, hits)).content
        bad = [c for c in re.findall(r'\[(\d+\.\d+)\]', answer) if c not in sources]
        if bad:
            answer += f'\n(Ссылки {bad} не из найденных разделов — проверьте их.)'
        return answer, sources

    result = rag_answer('Как работает градиентный бустинг?', model)
    print(result[0])
    print('источники:', result[1], '| вызовов модели:', len(model.calls))
  explanation: |
    - Проверка порога стоит до вызова модели: «не знаю» без запроса — и честнее, и бесплатно.
    - `model.invoke(сообщения).content` — текст ответа. Та же строка работает и с настоящим GigaChat из `langchain_gigachat`.
    - Поиск нашёл разделы уроков 7.7 и 5.2 — урок о градиентном спуске тоже попал в контекст, поэтому ссылка [5.2] здесь законна, и предупреждения нет. Проверка не судит, хорош ли ответ, — только опирается ли он на то, что модель видела.
  hints:
    - "Порог — `if hits[0][0] < threshold:`; `hits[0]` — самый похожий раздел."
    - "Ответ модели — `model.invoke(build_messages(question, hits)).content`."
    - "Вызовы тестовой модели видны в `model.calls`: на вопросе ниже порога список не должен расти."
  tests: |
    from langchain_core.language_models import FakeListChatModel
    f = var('rag_answer')
    ensure(callable(f), '`rag_answer` должна быть функцией.')
    m = FakeListChatModel(responses=['Кросс-валидация проверяет модель на каждом блоке [6.8].'])
    got = f('Рецепт борща', m)
    ensure(isinstance(got, tuple) and len(got) == 2, '`rag_answer` должна вернуть кортеж (ответ, источники), а вернула {0}.'.format(got))
