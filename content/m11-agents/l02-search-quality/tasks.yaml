  solution: |
    dev_mrr, test_mrr = {}, {}
    for nr in candidates:
        vec = TfidfVectorizer(analyzer='char_wb', ngram_range=nr)
        X = vec.fit_transform(texts)
        dev_mrr[nr] = mrr(ranks_for(vec, X, dev))
        test_mrr[nr] = mrr(ranks_for(vec, X, test))

    chosen = max(candidates, key=lambda nr: dev_mrr[nr])
    dev_score = dev_mrr[chosen]
    honest = test_mrr[chosen]
    for nr in candidates:
        print(nr, 'dev', round(dev_mrr[nr], 3), 'test', round(test_mrr[nr], 3))
    print('выбран', chosen, '| на dev', round(dev_score, 3), '| на test', round(honest, 3))
  explanation: |
    - Векторизатор обучается на разделах один раз для каждого варианта, а запросы `dev` и `test` только переводятся — так быстрее и честнее: запросы не влияют на словарь.
    - На `dev` лучший вариант — (3, 6) с MRR 0,914. На `test` у него 0,858 — хуже всех четырёх вариантов. Сообщи мы 0,914, оценка была бы завышена почти на 6 пунктов.
    - Победитель на одной половине — худший на другой. Значит, разница между этими вариантами — шум: на 117 запросах один запрос, поднявшийся с пятого места на первое, меняет MRR на 0,007. Честный вывод скромнее: длины 2–6 работают примерно одинаково, а символьные n-граммы в целом лучше слов.
