id: m11
number: 11
label: Модуль 11
title: "Контекст-инженерия и ИИ-агенты"
short: "ИИ-агенты"
firstLessonIndex: 0
description: >-
  Как выйти за пределы знаний языковой модели и дать ей действовать. Поиск по документам (TF-IDF, символьные n-граммы)
  и честная оценка поиска; RAG — ответ по найденным разделам уроков со ссылками и честным «не знаю»; ИИ-агент и цикл
  ReAct — сначала свой на Python, потом на инструментах LangChain; стандартный протокол инструментов MCP; безопасность
  агентов — prompt injection, отравление инструментов, ограничители и случай Replit; контекст-инженерия — что положить
  в контекст модели и как уложиться в бюджет; голосовой бот на SaluteSpeech и GigaChat. База знаний модуля — разделы
  уроков самого курса. Агентов проверяем на тестовой модели с заготовленными ответами и настоящими инструментами;
  настоящий GigaChat — в Colab со своим ключом.
