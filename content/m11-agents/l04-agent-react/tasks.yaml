    - перед вызовом проверьте, был ли уже вызов с той же парой (инструмент, вход). Если был — инструмент **не вызывается**, а Observation: `'Ты уже вызывал {инструмент} с этим входом. Результат: {прошлый результат}. Используй его или напиши Final Answer.'`;
    - если такой повтор случился уже второй раз за работу агента, остановитесь и верните `('Агент зациклился: повторяет одно и то же действие.', число_вызовов)`;
    - остальное — как в цикле агента: Final Answer → ответ; ошибка формата или неизвестный инструмент → Observation с ошибкой.

    `parse_step` и `run_tool` уже есть. Получите `result` для тестовой модели `model`, которая трижды просит одно и то же.
