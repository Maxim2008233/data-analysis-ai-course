- id: m11-l4-t2
  title: Безопасный вызов инструмента
  difficulty: main
  introduces: [ai-agent]
  uses: [function-calling]
  statement: |
    Инструмент может не найтись, упасть с исключением или вернуть слишком длинный результат — а агент не должен падать. Напишите функцию `run_tool(tools, name, arg, max_chars=300)`, которая всегда возвращает строку-Observation:

    - инструмента `name` нет в реестре `tools` → `'Ошибка: инструмента {name} нет. Есть: {имена через запятую и пробел}.'`;
    - функция инструмента выбросила исключение → `'Ошибка инструмента {name}: {тип исключения}: {сообщение}'` (тип — `type(e).__name__`);
    - иначе результат превращается в строку (`str`), и если он длиннее `max_chars`, обрезается до `max_chars` символов с добавлением `'…'`.

    Реестр — как в уроке: `{'имя': {'func': функция, 'description': описание}}`. Получите `observations` — результаты для вызовов из списка `calls`.
  prelude: |
    def get_schedule(day):
        table = {'завтра': '9:00 — История, ауд. 203; 11:00 — Мировая культура, онлайн; 14:00 — Консультация с группой Б-21, ауд. 105'}
        return table[day.strip().lower()]

    def word_count(text):
        return len(text.split())

    TOOLS = {'get_schedule': {'func': get_schedule, 'description': 'расписание на день'},
             'word_count': {'func': word_count, 'description': 'число слов в тексте'}}
    calls = [('get_schedule', 'завтра'), ('get_schedule', 'послезавтра'), ('calculator', '2 + 2'),
             ('word_count', 'один два три'), ('get_schedule', 'Завтра')]
  starter: |
    def run_tool(tools, name, arg, max_chars=300):
        if name not in tools:
            return ...
        try:
            result = tools[name]['func'](arg)
        except Exception as e:
            return ...
        text = str(result)
        if len(text) > max_chars:
            text = ...
        return text

    observations = [run_tool(TOOLS, name, arg) for name, arg in calls]
    for o in observations:
        print(o)
    print(run_tool(TOOLS, 'get_schedule', 'завтра', max_chars=20))
  solution: |
    def run_tool(tools, name, arg, max_chars=300):
        if name not in tools:
            return f'Ошибка: инструмента {name} нет. Есть: {", ".join(tools)}.'
        try:
            result = tools[name]['func'](arg)
        except Exception as e:
            return f'Ошибка инструмента {name}: {type(e).__name__}: {e}'
        text = str(result)
        if len(text) > max_chars:
            text = text[:max_chars] + '…'
        return text

    observations = [run_tool(TOOLS, name, arg) for name, arg in calls]
    for o in observations:
        print(o)
    print(run_tool(TOOLS, 'get_schedule', 'завтра', max_chars=20))
  explanation: |
    - `", ".join(tools)` перебирает ключи словаря — имена инструментов. Модель увидит, какие инструменты есть, и сможет исправиться.
    - `except Exception as e` ловит любую ошибку внутри инструмента: `get_schedule('послезавтра')` падает с `KeyError`, а агент получает понятный текст и продолжает работу.
    - `str(result)` нужен, потому что инструмент может вернуть число (`word_count` вернул 3), а Observation — это текст.
    - Обрезка — защита контекста: инструмент может вернуть целую страницу, а каждый символ в истории агент будет пересылать модели на всех следующих шагах (урок 11.7).
  hints:
    - "Нет инструмента — `f'Ошибка: инструмента {name} нет. Есть: {\", \".join(tools)}.'`."
    - "Исключение — `f'Ошибка инструмента {name}: {type(e).__name__}: {e}'`."
    - "Обрезка — `text[:max_chars] + '…'`."
  tests: |
    f = var('run_tool')
    ensure(callable(f), '`run_tool` должна быть функцией.')
    def boom(x):
        raise ValueError('плохой вход')
    reg = {'echo': {'func': lambda x: x, 'description': 'повтор'},
           'boom': {'func': boom, 'description': 'падает'},
           'num': {'func': lambda x: 42, 'description': 'число'}}
    equal(f(reg, 'echo', 'привет'), 'привет', 'Результат инструмента возвращается как есть: {expected}, а у вас {actual}.')
    equal(f(reg, 'nope', 'x'), 'Ошибка: инструмента nope нет. Есть: echo, boom, num.', 'Неизвестный инструмент: ожидалось {expected}, а у вас {actual}.')
    try:
        got = f(reg, 'boom', 'x')
    except Exception as e:
        fail('Исключение внутри инструмента вылетело наружу ({0}): агент не должен падать — верните ошибку текстом.'.format(type(e).__name__))
    equal(got, 'Ошибка инструмента boom: ValueError: плохой вход', 'Ошибка внутри инструмента: ожидалось {expected}, а у вас {actual}.')
    equal(f(reg, 'num', 'x'), '42', 'Результат-число превращается в строку: ожидалось {expected}, а у вас {actual}.')
    equal(f(reg, 'echo', 'а' * 10, max_chars=4), 'аааа…', 'Длинный результат обрезается до max_chars символов с «…»: ожидалось {expected}, а у вас {actual}.')
    equal(f(reg, 'echo', 'а' * 4, max_chars=4), 'аааа', 'Результат длиной ровно max_chars не обрезается.')
    equal(var('observations', list, 'списком'), ref('observations'), 'Результаты вызовов — {expected}, а у вас {actual}.')
  files: []
  wrong:
    - code: |
        def run_tool(tools, name, arg, max_chars=300):
            if name not in tools:
                return f'Ошибка: инструмента {name} нет. Есть: {", ".join(tools)}.'
            text = str(tools[name]['func'](arg))
            if len(text) > max_chars:
                text = text[:max_chars] + '…'
            return text
        observations = [run_tool(TOOLS, name, arg) for name, arg in calls[:1]]
      expect: вылетело наружу
    - code: |
        def run_tool(tools, name, arg, max_chars=300):
            if name not in tools:
                return f'Ошибка: инструмента {name} нет. Есть: {", ".join(tools)}.'
            try:
                result = tools[name]['func'](arg)
            except Exception as e:
                return f'Ошибка инструмента {name}: {type(e).__name__}: {e}'
            return str(result)[:max_chars]
        observations = [run_tool(TOOLS, name, arg) for name, arg in calls]
      expect: с «…»

- id: m11-l4-t3
  title: Цикл агента
  difficulty: main
  introduces: []
  uses: [react-loop, ai-agent, llm-chain]
  statement: |
    Соберите цикл агента `run_agent(question, model, tools, max_steps=5)`. Готовы `react_prompt(tools)`, `parse_step(reply)` (словарь, как в первом задании) и `run_tool(tools, name, arg)` (как во втором). Функция возвращает кортеж `(ответ, шаги)`, где шаги — список кортежей `(инструмент, вход, Observation)`:

    1. история начинается с `react_prompt(tools) + f'Question: {question}\n'`;
    2. на каждом шаге модель получает всю историю (`model.invoke(history).content`), а в историю дописывается её ответ — без всего, что начиная с `Observation:` (обрезанный справа от пробелов и с переносом строки в конце);
    3. Final Answer → вернуть его и шаги; действие → `run_tool`, шаг в список и `Observation: …\n` в историю; ошибка формата → `Observation: Ошибка формата: …\n` с текстом ошибки из `parse_step`, без шага в списке;
    4. если за `max_steps` шагов ответа нет — вернуть `'Не удалось ответить за отведённое число шагов.'` и шаги.

    Проверьте на тестовой модели `model`: получите `answer` и `steps` для вопроса о минутах занятий.
  prelude: |
    import re
    from langchain_core.language_models import FakeListChatModel

    def get_schedule(day):
        table = {'завтра': '9:00 — История, ауд. 203; 11:00 — Мировая культура, онлайн; 14:00 — Консультация с группой Б-21, ауд. 105'}
        return table.get(day.strip().lower(), f'Нет расписания на «{day}».')

    def calculate(expression):
        if not re.fullmatch(r'[\d\s+\-*/().]+', expression) or '**' in expression:
            return 'Ошибка: допустимы только числа, + - * / и скобки'
        return str(eval(expression, {'__builtins__': {}}, {}))

    TOOLS = {'get_schedule': {'func': get_schedule, 'description': 'расписание занятий; вход — день'},
             'calculate': {'func': calculate, 'description': 'калькулятор; вход — выражение'}}

    def react_prompt(tools):
        lines = '\n'.join(f'- {name}: {t["description"]}' for name, t in tools.items())
        return ('Ответь на вопрос пользователя. Тебе доступны инструменты:\n' + lines + '\n\nФормат: Thought, Action, '
                'Action Input, Observation (её допишет программа), …, Final Answer.\n\n')

    def parse_step(reply):
        reply = reply.split('Observation:')[0]
        thought = re.search(r'Thought:\s*(.+)', reply)
        step = {'thought': thought.group(1).strip() if thought else ''}
        final = re.search(r'Final Answer:\s*(.+)', reply, re.S)
        if final:
            step['final'] = final.group(1).strip()
        else:
            action = re.search(r'Action:\s*(\w+)\s*\nAction Input:\s*(.+)', reply)
            if action:
                step['action'], step['input'] = action.group(1), action.group(2).strip()
            else:
                step['error'] = 'нет ни Action с Action Input, ни Final Answer'
        return step

    def run_tool(tools, name, arg, max_chars=300):
        if name not in tools:
            return f'Ошибка: инструмента {name} нет. Есть: {", ".join(tools)}.'
        try:
            text = str(tools[name]['func'](arg))
        except Exception as e:
            return f'Ошибка инструмента {name}: {type(e).__name__}: {e}'
        return text if len(text) <= max_chars else text[:max_chars] + '…'

    model = FakeListChatModel(responses=[
        'Thought: Узнаю расписание.\nAction: get_schedule\nAction Input: завтра\nObservation: два занятия',
        'Thought: Посчитаю минуты.\nAction: calculator\nAction Input: 3 * 90',
        'Thought: Нужен calculate.\nAction: calculate\nAction Input: 3 * 90',
        'Thought: Готово.\nFinal Answer: Завтра у вас 270 минут занятий.',
    ])
  starter: |
    def run_agent(question, model, tools, max_steps=5):
        history = react_prompt(tools) + f'Question: {question}\n'
        steps = []
        for _ in range(max_steps):
            reply = model.invoke(history).content
            step = parse_step(reply)
            history += ...
            if 'final' in step:
                return step['final'], steps
            if 'action' in step:
                observation = ...
                steps.append((step['action'], step['input'], observation))
            else:
                observation = 'Ошибка формата: ' + step['error']
            history += f'Observation: {observation}\n'
        return 'Не удалось ответить за отведённое число шагов.', steps

    answer, steps = run_agent('Сколько минут займут мои занятия завтра, если каждое идёт 90 минут?', model, TOOLS)
    print(answer)
    for s in steps:
        print(s)
  solution: |
    def run_agent(question, model, tools, max_steps=5):
        history = react_prompt(tools) + f'Question: {question}\n'
        steps = []
        for _ in range(max_steps):
            reply = model.invoke(history).content
            step = parse_step(reply)
            history += reply.split('Observation:')[0].rstrip() + '\n'
            if 'final' in step:
                return step['final'], steps
            if 'action' in step:
                observation = run_tool(tools, step['action'], step['input'])
                steps.append((step['action'], step['input'], observation))
            else:
                observation = 'Ошибка формата: ' + step['error']
            history += f'Observation: {observation}\n'
        return 'Не удалось ответить за отведённое число шагов.', steps

    answer, steps = run_agent('Сколько минут займут мои занятия завтра, если каждое идёт 90 минут?', model, TOOLS)
    print(answer)
    for s in steps:
        print(s)
  explanation: |
    - В историю идёт ответ модели без выдуманного результата: `reply.split('Observation:')[0]`. Иначе на следующем шаге модель увидела бы своё «два занятия» как настоящий результат инструмента.
    - Вызов инструмента — только через `run_tool`: неизвестный `calculator` превращается в Observation с ошибкой, и на следующем шаге модель исправилась.
    - Шагов три: расписание, неудачный и удачный вызов калькулятора. Список шагов — журнал агента: по нему видно, что он делал и почему ответил именно так.
  hints:
    - "Ответ модели в историю — `reply.split('Observation:')[0].rstrip() + '\\n'`."
    - "Результат инструмента — `run_tool(tools, step['action'], step['input'])`."
    - "Проверьте себя: вторая строка `model.calls[1]` должна содержать `Observation:` с настоящим расписанием."
  tests: |
    from langchain_core.language_models import FakeListChatModel
    f = var('run_agent')
    ensure(callable(f), '`run_agent` должна быть функцией.')
    reg = {'echo': {'func': lambda x: 'эхо: ' + x, 'description': 'повтор'}}
    m = FakeListChatModel(responses=['Thought: а\nAction: echo\nAction Input: привет\nObservation: выдумка', 'Thought: б\nFinal Answer: готово'])
    got = f('вопрос', m, reg)
    ensure(isinstance(got, tuple) and len(got) == 2, '`run_agent` должна вернуть кортеж (ответ, шаги), а вернула {0}.'.format(got))
    equal(got[0], 'готово', 'Ответ — текст после Final Answer: {expected}, а у вас {actual}.')
    equal(got[1], [('echo', 'привет', 'эхо: привет')], 'Шаги — список (инструмент, вход, Observation): ожидалось {expected}, а у вас {actual}.')
    ensure(len(m.calls) == 2, 'Модель должна быть вызвана 2 раза, а вызвана {0}.'.format(len(m.calls)))
    second = m.calls[1][-1].content
    if 'выдумка' in second:
        fail('Во второй запрос попал выдуманный моделью Observation («выдумка»): в историю дописывается ответ модели только до `Observation:`.')
    ensure('Observation: эхо: привет' in second, 'Во втором запросе модель должна увидеть настоящий результат: «Observation: эхо: привет».')
