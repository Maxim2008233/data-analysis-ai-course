            if final:
                step['final'] = final.group(1).strip()
                return step
            action = re.search(r'Action:\s*(\w+)\s*\nAction Input:\s*(.+)', reply)
            if action:
                step['action'] = action.group(1)
                step['input'] = action.group(2).strip()
                return step
            step['error'] = 'нет ни Action с Action Input, ни Final Answer'
            return step
        steps = [parse_step(r) for r in replies]
      expect: выдуманного Observation
    - code: |
