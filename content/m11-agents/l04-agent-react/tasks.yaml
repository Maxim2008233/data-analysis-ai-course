    def run_agent_guarded(question, model, tools, max_steps=6):
        history = f'Question: {question}\n'
        done = {}                      # (инструмент, вход) → результат
        repeats = 0
        n_calls = 0
        for _ in range(max_steps):
            reply = model.invoke(history).content
            history += reply.split('Observation:')[0].rstrip() + '\n'
            step = parse_step(reply)
            if 'final' in step:
                return step['final'], n_calls
            if 'action' in step:
                key = (step['action'], step['input'])
                if key in done:
                    repeats += 1
                    if repeats == 2:
                        return 'Агент зациклился: повторяет одно и то же действие.', n_calls
                    observation = (f'Ты уже вызывал {key[0]} с этим входом. Результат: {done[key]}. '
                                   'Используй его или напиши Final Answer.')
                else:
                    observation = run_tool(tools, *key)
                    done[key] = observation
                    n_calls += 1
            else:
                observation = 'Ошибка формата: ' + step['error']
            history += f'Observation: {observation}\n'
        return 'Не удалось ответить за отведённое число шагов.', n_calls

    result = run_agent_guarded('Что у меня завтра?', model, TOOLS)
    print(result, '| настоящих вызовов get_schedule:', len(calls_made))
  explanation: |
    - Словарь `done` помнит каждую пару (инструмент, вход) и её результат. Повтор не тратит вызов инструмента — а это бывает и деньги, и действие во внешнем мире: дважды отправленное письмо не отзовёшь.
    - Первый повтор — подсказка модели с прошлым результатом: возможно, она просто не заметила его в длинной истории. Второй повтор — остановка: агент застрял, и честнее сказать об этом, чем жечь шаги до `max_steps`.
    - Тестовая модель трижды попросила одно и то же. Настоящий вызов был один, на третьем шаге агент остановился.
  hints:
    - "Повтор: `repeats += 1`; при `repeats == 2` — `return 'Агент зациклился: повторяет одно и то же действие.', n_calls`."
    - "Иначе Observation — подсказка с прошлым результатом `done[key]`."
    - "Не вызывайте `run_tool` для повтора: проверьте себя по `len(calls_made)`."
