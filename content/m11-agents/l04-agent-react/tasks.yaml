    def lesson_info(number):
        number = number.strip()
        sections = [d['section'] for d in docs if d['lesson'] == number]
        if not sections:
            return f'Урока {number} нет в курсе.'
        title = next(d['lesson_title'] for d in docs if d['lesson'] == number)
        return f'Урок {number} «{title}». Разделы: {"; ".join(sections)}.'

    TOOLS['lesson_info'] = {'func': lesson_info,
                            'description': 'название урока курса и заголовки его разделов; вход — номер урока, например 10.2'}
    print(lesson_info('10.6'))
    print(lesson_info(' 99.9 '))
    answer = run_agent(question, model, TOOLS)
    print(answer)
    print(model.calls[1][-1].content[-300:])
  explanation: |
    - Инструмент — обычная функция над данными курса: отбор разделов по номеру урока, как фильтр в pandas, только списком.
    - Описание говорит модели, что делает инструмент и **что подать на вход**. Без примера номера модель вполне может отправить «урок про функции» вместо «10.6».
    - Чтобы добавить агенту умение, достаточно одной записи в реестре: `react_prompt(TOOLS)` сам включит инструмент в инструкцию, а цикл найдёт его по имени.
    - Ответ тестовой модели заготовлен, а Observation во втором запросе — настоящий: оглавление урока 10.6 из базы знаний.
