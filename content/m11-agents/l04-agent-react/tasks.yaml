    import re
    from langchain_core.language_models import FakeListChatModel

    def parse_step(reply):
        reply = reply.split('Observation:')[0]
        final = re.search(r'Final Answer:\s*(.+)', reply, re.S)
        if final:
            return {'final': final.group(1).strip()}
        action = re.search(r'Action:\s*(\w+)\s*\nAction Input:\s*(.+)', reply)
        if action:
            return {'action': action.group(1), 'input': action.group(2).strip()}
        return {'error': 'нет ни Action с Action Input, ни Final Answer'}

    def run_tool(tools, name, arg):
        if name not in tools:
            return f'Ошибка: инструмента {name} нет. Есть: {", ".join(tools)}.'
        return str(tools[name]['func'](arg))

