- id: m11-l4-t1
  title: Разбор шага ReAct
  difficulty: warmup
  introduces: [react-loop]
  uses: [structured-output]
  statement: |
    Напишите функцию `parse_step(reply)`: она разбирает ответ модели в формате ReAct и возвращает словарь.

    - Всё, что модель написала начиная с `Observation:`, отбрасывается — результат инструмента пишет программа.
    - Ключ `'thought'` — текст после `Thought:` до конца строки (без пробелов по краям) или пустая строка, если рассуждения нет.
    - Если есть `Final Answer:`, добавляется ключ `'final'` — весь текст после него (без пробелов по краям; может занимать несколько строк).
    - Иначе, если есть строка `Action:` с именем инструмента и следующая строка `Action Input:`, добавляются ключи `'action'` и `'input'`.
    - Иначе добавляется ключ `'error'` со строкой-описанием проблемы.

    Получите `steps` — результаты разбора ответов из списка `replies`.
  prelude: |
    import re
    replies = [
        'Thought: Нужно узнать расписание.\nAction: get_schedule\nAction Input: завтра',
        'Thought: Всё известно.\nFinal Answer: Завтра три занятия.\nПервое — в 9:00.',
        'Thought: Посчитаю.\nAction: calculate\nAction Input:  3 * 90  \nObservation: 300',
        'Я думаю, надо посмотреть расписание.',
        'Action: search_course\nAction Input: кросс-валидация',
        'Thought: Отвечу сразу.\nAction: get_schedule\nObservation: всё готово\nFinal Answer: выдумка',
    ]
  starter: |
    def parse_step(reply):
        reply = reply.split('Observation:')[0]
        thought = re.search(r'Thought:\s*(.+)', reply)
        step = {'thought': thought.group(1).strip() if thought else ''}
        final = re.search(r'Final Answer:\s*(.+)', reply, re.S)
        if final:
            step['final'] = ...
            return step
        action = re.search(r'Action:\s*(\w+)\s*\nAction Input:\s*(.+)', reply)
        if action:
            ...
            return step
        step['error'] = 'нет ни Action с Action Input, ни Final Answer'
        return step

    steps = [parse_step(r) for r in replies]
    for s in steps:
        print(s)
  solution: |
    def parse_step(reply):
        reply = reply.split('Observation:')[0]
        thought = re.search(r'Thought:\s*(.+)', reply)
        step = {'thought': thought.group(1).strip() if thought else ''}
        final = re.search(r'Final Answer:\s*(.+)', reply, re.S)
        if final:
            step['final'] = final.group(1).strip()
            return step
        action = re.search(r'Action:\s*(\w+)\s*\nAction Input:\s*(.+)', reply)
        if action:
            step['action'] = action.group(1)
            step['input'] = action.group(2).strip()
            return step
        step['error'] = 'нет ни Action с Action Input, ни Final Answer'
        return step

    steps = [parse_step(r) for r in replies]
    for s in steps:
        print(s)
  explanation: |
    - `reply.split('Observation:')[0]` — всё до первого `Observation:`. В последнем ответе модель выдумала и результат, и Final Answer после него — оба отброшены, а `Action:` без `Action Input:` даёт ошибку формата.
    - `re.S` позволяет точке захватывать переносы строк: Final Answer из двух строк попадает целиком.
    - В `(.+)` после `Thought:` точка без `re.S` останавливается на конце строки — рассуждение не захватывает Action.
    - Ответ без Thought (пятый) разбирается: рассуждение — пустая строка, а действие на месте. Строгость к формату нужна там, где без неё программа ошибётся, а не везде.
  hints:
    - "Final Answer — `final.group(1).strip()`."
    - "Действие — `step['action'] = action.group(1)`, вход — `action.group(2).strip()`."
    - "Обрезка выдуманного результата уже есть в первой строке функции."
  tests: |
    f = var('parse_step')
    ensure(callable(f), '`parse_step` должна быть функцией.')
    equal(f('Thought: т\nAction: tool_a\nAction Input: вход 1'), {'thought': 'т', 'action': 'tool_a', 'input': 'вход 1'}, 'Шаг с действием: ожидалось {expected}, а у вас {actual}.')
    equal(f('Thought: готово\nFinal Answer: строка 1\nстрока 2  '), {'thought': 'готово', 'final': 'строка 1\nстрока 2'}, 'Final Answer из двух строк попадает целиком: ожидалось {expected}, а у вас {actual}.')
    got = f('Thought: т\nAction: tool_a\nAction Input: x\nObservation: выдумка\nFinal Answer: тоже выдумка')
    if 'final' in got:
        fail('Final Answer после выдуманного Observation нужно отбросить: всё, начиная с `Observation:`, пишет программа, а не модель.')
    equal(got, {'thought': 'т', 'action': 'tool_a', 'input': 'x'}, 'Ожидалось {expected}, а у вас {actual}.')
    bad = f('Просто текст без формата.')
    ensure('error' in bad and 'action' not in bad and 'final' not in bad, 'Ответ без Action и Final Answer — словарь с ключом `error`, а у вас {0}.'.format(bad))
    equal(bad.get('thought'), '', 'Если Thought нет, рассуждение — пустая строка.')
    equal(var('steps', list, 'списком'), ref('steps'), 'Результаты разбора ответов модели не совпадают с ожидаемыми.')
  files: []
  wrong:
