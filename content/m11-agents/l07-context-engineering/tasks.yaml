  tests: |
    import numpy as np
    f = var('select_tools')
    ensure(callable(f), '`select_tools` должна быть функцией.')
    tools = {'apple_tool': 'работает с яблоками', 'pear_tool': 'работает с грушами', 'plum_tool': 'работает со сливами'}
    equal(f('нужны груши', tools, 1), ['pear_tool'], 'Для запроса «нужны груши» лучший инструмент — pear_tool, а у вас {actual}.')
    got = f('что-то про яблоки и груши', tools, 3)
    equal(sorted(got), sorted(tools), 'При k=3 возвращаются все три инструмента, а у вас {actual}.')
    ensure(got[2] == 'plum_tool', 'Инструменты идут по убыванию сходства: «сливы» в запросе нет, plum_tool — последний, а у вас порядок {0}.'.format(got))
    close(var('recall3', 'number', 'числом'), ref('recall3'), 'Доля запросов с нужным инструментом в тройке — {expected}, а у вас {actual}.')
    bt = var('better_tools', dict, 'словарём')
    TOOLS0 = ref('TOOLS')
    equal(sorted(bt), sorted(TOOLS0), 'В `better_tools` должны остаться те же двенадцать инструментов.')
    changed = [n for n in TOOLS0 if bt[n] != TOOLS0[n]]
    ensure(changed, 'Ни одно описание не изменено: исправьте описание инструмента, на котором поиск промахивается.')
    ensure(changed == ['convert_currency'], 'Менять нужно только описание инструмента, на котором поиск промахивается, а изменены: {0}.'.format(changed))
    ensure(len(bt['convert_currency']) <= 150, 'Описание не длиннее 150 символов, а у вас {0}.'.format(len(bt['convert_currency'])))
    ensure('150' not in bt['convert_currency'] and 'Сколько будет' not in bt['convert_currency'], 'Не вписывайте в описание сам запрос: описание должно помогать любым похожим вопросам.')
    close(var('recall3_better', 'number', 'числом'), 1.0, 'С новым описанием нужный инструмент должен попадать в тройку для всех запросов, а доля {actual}.')
