  solution: |
    def select_tools(query, tools, k):
        names = list(tools)
        vectorizer = TfidfVectorizer(analyzer='char_wb', ngram_range=(3, 5))
        X = vectorizer.fit_transform([f'{n} {d}' for n, d in tools.items()])
        scores = (X @ vectorizer.transform([query]).T).toarray().ravel()
        return [names[i] for i in np.argsort(-scores, kind='stable')[:k]]

    def recall_at3(tools):
        return float(np.mean([right in select_tools(q, tools, 3) for q, right in REQUESTS]))

    recall3 = recall_at3(TOOLS)
    print([q for q, right in REQUESTS if right not in select_tools(q, TOOLS, 3)])
    better_tools = dict(TOOLS)
    better_tools['convert_currency'] = 'Переводит сумму из одной валюты в другую по курсу Центробанка: рубли, доллары, евро.'
    recall3_better = recall_at3(better_tools)
    print(recall3, recall3_better)
  explanation: |
    - Это поиск из уроков 11.1–11.2, только документы — описания инструментов. Тройка из двенадцати описаний — четверть токенов, а нужный инструмент попадает в неё в 11 запросах из 12 (91,7 %).
    - Промах — «Сколько будет 150 долларов в рублях?»: в описании `convert_currency` нет ни «долларов», ни «рублей», только «валюта» и «курс». Поиск по буквам не знает, что доллар — это валюта.
    - Лечится описанием: стоит назвать в нём слова, которыми пользователи будут просить инструмент, — «рубли, доллары, евро». Хорошее описание помогает дважды: и при отборе инструментов, и модели, которая решает, звать ли инструмент. Другой путь — искать по эмбеддингам нейросети, которые знают о синонимах (урок 9.2).
