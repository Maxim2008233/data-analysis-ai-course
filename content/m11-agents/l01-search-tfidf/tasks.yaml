  solution: |
    def my_tfidf(counts):
        n = counts.shape[0]
        df = (counts > 0).sum(axis=0)
        idf = np.log((1 + n) / (1 + df)) + 1
        W = counts * idf
        norms = np.linalg.norm(W, axis=1, keepdims=True)
        norms[norms == 0] = 1                    # нулевую строку делим на 1 — она останется нулевой
        return W / norms

    max_diff = float(np.abs(my_tfidf(counts) - X_sklearn).max())
    print(max_diff)
  explanation: |
    - `counts * idf` — каждый столбец (слово) умножается на свой idf: массив idf формы (слова,) растягивается на все строки (broadcasting).
    - `keepdims=True` оставляет длины столбцом (документы, 1), и деление идёт построчно.
    - Длину 0 заменяем на 1: деление 0 / 1 оставляет нулевую строку нулевой, а 0 / 0 дало бы `nan`. Такая строка бывает у документа, все слова которого выброшены или неизвестны.
    - Отличие от scikit-learn — порядка 10⁻¹⁶, ошибки округления: формулы совпадают.
  hints:
    - "idf — как в задании «idf своими руками»: `np.log((1 + n) / (1 + df)) + 1`."
    - "Нулевые длины: `norms[norms == 0] = 1` перед делением."
    - "Нормировка — `W / norms`, где `norms` формы (n, 1)."
  tests: |
    import numpy as np
    from sklearn.feature_extraction.text import TfidfTransformer
    f = var('my_tfidf')
    ensure(callable(f), '`my_tfidf` должна быть функцией.')
    rng = np.random.default_rng(3)
    C = rng.integers(0, 3, size=(6, 5))
    C[2] = 0
    with np.errstate(all='raise'):
        try:
            got = np.asarray(f(C), dtype=float)
        except FloatingPointError:
            fail('На строке из одних нулей получилось деление 0 / 0. Замените нулевые длины на 1 перед делением.')
    ensure(got.shape == C.shape, 'Матрица TF-IDF должна быть той же формы, что счётчики: {0}, а у вас {1}.'.format(C.shape, got.shape))
    ensure(not np.isnan(got).any(), 'В матрице есть nan: строку из одних нулей нужно оставить нулевой.')
    expected = TfidfTransformer().fit_transform(C).toarray()
    same_array(got, expected, 'На случайной матрице счётчиков ваш TF-IDF отличается от scikit-learn.')
    ensure(float(var('max_diff', 'number', 'числом')) < 1e-9, 'Отличие от `X_sklearn` должно быть порядка ошибок округления, а у вас {0}.'.format(var('max_diff')))
