- id: m11-l5-t5
  title: Инструменты MCP-сервера в агенте
  difficulty: star
  introduces: []
  uses: [mcp, langchain-tools, function-calling]
  statement: |
    Подключите MCP-сервер к агенту на `tool_calls`. Сервер — функция `server(request)` (как в уроке). Напишите:

    1. `tools_for_model(server)` — запрос `tools/list` и список описаний для модели в формате `{'type': 'function', 'function': {'name', 'description', 'parameters'}}`, где `parameters` — `inputSchema` инструмента. Их передают модели через `bind_tools`.
    2. `call_via_mcp(server, call, request_id)` — выполняет вызов из `AIMessage.tool_calls` запросом `tools/call` (номер запроса — `request_id`) и возвращает `ToolMessage` с `tool_call_id` вызова:
       - ответ с `error` → содержимое `'Ошибка протокола: {message}'`;
       - результат с `isError` → `'Ошибка инструмента: {текст}'`;
       - иначе — текст результата (тексты всех блоков контента подряд, через перенос строки).

    Затем запустите цикл агента с тестовой моделью `model` (номера запросов — 1, 2, 3, … по порядку вызовов) и получите `answer` и `log` — содержимое всех `ToolMessage`.
  prelude: |
    from langchain_core.messages import AIMessage, HumanMessage, ToolMessage
    from langchain_core.language_models import FakeMessagesListChatModel
    SCHEDULE = {'завтра': ['9:00 — История, ауд. 203', '11:00 — Мировая культура, онлайн',
                           '14:00 — Консультация с группой Б-21, ауд. 105']}
    TOOLS = {
        'get_schedule': {'description': 'Расписание занятий пользователя на день.',
                         'inputSchema': {'type': 'object', 'properties': {'day': {'type': 'string'}}, 'required': ['day']},
                         'func': lambda args: '; '.join(SCHEDULE[args['day']])},
    }
    seen_ids = []

    def server(request):
        seen_ids.append(request.get('id'))
        rid = request.get('id')
        if request['method'] == 'tools/list':
            return {'jsonrpc': '2.0', 'id': rid, 'result': {'tools': [
                {'name': n, 'description': t['description'], 'inputSchema': t['inputSchema']} for n, t in TOOLS.items()]}}
        name, args = request['params']['name'], request['params'].get('arguments', {})
        if name not in TOOLS:
            return {'jsonrpc': '2.0', 'id': rid, 'error': {'code': -32602, 'message': f'Unknown tool: {name}'}}
        try:
            return {'jsonrpc': '2.0', 'id': rid, 'result': {'content': [{'type': 'text', 'text': TOOLS[name]['func'](args)}], 'isError': False}}
        except Exception as e:
            return {'jsonrpc': '2.0', 'id': rid, 'result': {'content': [{'type': 'text', 'text': f'{type(e).__name__}: {e}'}], 'isError': True}}

    model = FakeMessagesListChatModel(responses=[
        AIMessage(content='', tool_calls=[{'name': 'get_schedule', 'args': {'day': 'послезавтра'}, 'id': 'c1'}]),
        AIMessage(content='', tool_calls=[{'name': 'get_calendar', 'args': {'day': 'завтра'}, 'id': 'c2'}]),
        AIMessage(content='', tool_calls=[{'name': 'get_schedule', 'args': {'day': 'завтра'}, 'id': 'c3'}]),
        AIMessage(content='Завтра три занятия: история, мировая культура и консультация.'),
    ])
  starter: |
    def tools_for_model(server):
        listing = server({'jsonrpc': '2.0', 'id': 0, 'method': 'tools/list'})
        return [{'type': 'function', 'function': {'name': t['name'], 'description': t['description'], 'parameters': ...}}
                for t in listing['result']['tools']]

    def call_via_mcp(server, call, request_id):
        response = server({'jsonrpc': '2.0', 'id': request_id, 'method': 'tools/call',
                           'params': {'name': call['name'], 'arguments': call['args']}})
        if 'error' in response:
            content = ...
        else:
            text = '\n'.join(block['text'] for block in response['result']['content'] if block['type'] == 'text')
            content = ...
        return ToolMessage(content=content, tool_call_id=call['id'])

    schemas = tools_for_model(server)
    messages = [HumanMessage('Что у меня завтра?')]
    request_id = 0
    for _ in range(5):
        ai = model.invoke(messages)
        messages.append(ai)
        if not ai.tool_calls:
            break
        for call in ai.tool_calls:
            request_id += 1
            messages.append(call_via_mcp(server, call, request_id))
    answer = messages[-1].content
    log = [m.content for m in messages if isinstance(m, ToolMessage)]
    print(schemas)
    print(answer)
    for line in log:
        print(line)
  solution: |
    def tools_for_model(server):
        listing = server({'jsonrpc': '2.0', 'id': 0, 'method': 'tools/list'})
        return [{'type': 'function', 'function': {'name': t['name'], 'description': t['description'], 'parameters': t['inputSchema']}}
                for t in listing['result']['tools']]

    def call_via_mcp(server, call, request_id):
        response = server({'jsonrpc': '2.0', 'id': request_id, 'method': 'tools/call',
                           'params': {'name': call['name'], 'arguments': call['args']}})
        if 'error' in response:
            content = 'Ошибка протокола: ' + response['error']['message']
        else:
            text = '\n'.join(block['text'] for block in response['result']['content'] if block['type'] == 'text')
            content = 'Ошибка инструмента: ' + text if response['result'].get('isError') else text
        return ToolMessage(content=content, tool_call_id=call['id'])

    schemas = tools_for_model(server)
    messages = [HumanMessage('Что у меня завтра?')]
    request_id = 0
    for _ in range(5):
        ai = model.invoke(messages)
        messages.append(ai)
        if not ai.tool_calls:
            break
        for call in ai.tool_calls:
            request_id += 1
            messages.append(call_via_mcp(server, call, request_id))
    answer = messages[-1].content
    log = [m.content for m in messages if isinstance(m, ToolMessage)]
    print(schemas)
    print(answer)
    for line in log:
        print(line)
  explanation: |
    - `inputSchema` из MCP — тот же JSON Schema, что `parameters` в описании функции для модели. Поэтому инструменты любого MCP-сервера подключаются к любой модели с вызовом функций: клиент только перекладывает поля. В LangChain это делает пакет `langchain-mcp-adapters`.
    - Два вида ошибок доходят до модели по-разному подписанными: «Ошибка инструмента: KeyError: 'послезавтра'» — вызов был верным, но данных нет; «Ошибка протокола: Unknown tool: get_calendar» — такого инструмента нет вовсе. Модель исправилась на третьем шаге.
    - Номер запроса растёт с каждым вызовом: по `id` клиент сопоставляет ответы сервера с запросами, когда их отправлено несколько.
