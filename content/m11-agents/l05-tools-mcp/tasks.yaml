- id: m11-l5-t3
  title: "MCP-сервер: список инструментов"
  difficulty: main
  introduces: [mcp]
  uses: [function-calling, structured-output]
  statement: |
    Начните свой MCP-сервер. Напишите функцию `handle(request, registry)`: она принимает запрос JSON-RPC (словарь) и реестр инструментов `{'имя': {'description': ..., 'inputSchema': ..., 'func': ...}}` и возвращает ответ:

    - у любого ответа есть `'jsonrpc': '2.0'` и тот же `'id'`, что у запроса;
    - метод `tools/list` → `'result': {'tools': [...]}` — для каждого инструмента словарь с ключами `name`, `description`, `inputSchema` (функцию `func` наружу не отдавать) в порядке реестра;
    - любой другой метод → `'error': {'code': -32601, 'message': 'Method not found: {метод}'}`.

    Получите `listing` — ответ сервера на запрос `{'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list'}` с реестром `REGISTRY`.
  prelude: |
    SCHEDULE = {'сегодня': ['16:00 — Анализ данных, ауд. 301'],
                'завтра': ['9:00 — История, ауд. 203', '11:00 — Мировая культура, онлайн']}
    REGISTRY = {
        'get_schedule': {
            'description': 'Расписание занятий пользователя на день.',
            'inputSchema': {'type': 'object', 'properties': {'day': {'type': 'string', 'description': '«сегодня» или «завтра»'}},
                            'required': ['day']},
            'func': lambda args: '; '.join(SCHEDULE[args['day']]),
        },
        'lesson_minutes': {
            'description': 'Сколько минут займут занятия.',
            'inputSchema': {'type': 'object', 'properties': {'lessons': {'type': 'integer'}, 'length': {'type': 'integer'}},
                            'required': ['lessons']},
            'func': lambda args: str(args['lessons'] * args.get('length', 90)),
        },
    }
  starter: |
    def handle(request, registry):
        response = {'jsonrpc': '2.0', 'id': request.get('id')}
        if request.get('method') == 'tools/list':
            response['result'] = {'tools': [...]}
        else:
            response['error'] = ...
        return response

    listing = handle({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list'}, REGISTRY)
    print(listing)
    print(handle({'jsonrpc': '2.0', 'id': 2, 'method': 'resources/list'}, REGISTRY))
  solution: |
    def handle(request, registry):
        response = {'jsonrpc': '2.0', 'id': request.get('id')}
        if request.get('method') == 'tools/list':
            response['result'] = {'tools': [{'name': name, 'description': t['description'], 'inputSchema': t['inputSchema']}
                                            for name, t in registry.items()]}
        else:
            response['error'] = {'code': -32601, 'message': f'Method not found: {request.get("method")}'}
        return response

    listing = handle({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list'}, REGISTRY)
    print(listing)
    print(handle({'jsonrpc': '2.0', 'id': 2, 'method': 'resources/list'}, REGISTRY))
  explanation: |
    - Ответ всегда несёт `id` запроса: клиент может отправить несколько запросов подряд и сопоставляет ответы по номеру.
    - Наружу уходят только имя, описание и схема входа. Сама функция — внутреннее дело сервера: клиент и модель видят инструмент только через описание.
    - `resources/list` — настоящий метод MCP (данные для контекста), но наш сервер его не поддерживает. Код −32601 — стандартная ошибка JSON-RPC «метод не найден».
  hints:
    - "Описание инструмента — `{'name': name, 'description': t['description'], 'inputSchema': t['inputSchema']}`."
    - "Перебор реестра по порядку — `for name, t in registry.items()`."
    - "Ошибка — `{'code': -32601, 'message': f'Method not found: {request.get(\"method\")}'}`."
  tests: |
    import json
    f = var('handle')
    ensure(callable(f), '`handle` должна быть функцией.')
    reg = {'b': {'description': 'инструмент b', 'inputSchema': {'type': 'object', 'properties': {}}, 'func': lambda a: 'B'},
           'a': {'description': 'инструмент a', 'inputSchema': {'type': 'object', 'properties': {'x': {'type': 'string'}}, 'required': ['x']}, 'func': lambda a: 'A'}}
    got = f({'jsonrpc': '2.0', 'id': 7, 'method': 'tools/list'}, reg)
    ensure(isinstance(got, dict), '`handle` должна вернуть словарь, а вернула {0}.'.format(type(got).__name__))
    equal(got.get('jsonrpc'), '2.0', 'В ответе нужен ключ `jsonrpc` со значением «2.0».')
    equal(got.get('id'), 7, 'В ответе нужен тот же `id`, что в запросе (7), а у вас {actual}.')
    tools = got.get('result', {}).get('tools')
    ensure(isinstance(tools, list), 'Ответ на tools/list — `result` со списком `tools`.')
    if tools and 'func' in tools[0]:
