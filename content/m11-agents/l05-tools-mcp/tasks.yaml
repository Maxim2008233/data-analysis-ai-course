  statement: |
    Добавьте в сервер метод `tools/call`. Функция `handle_call(request, registry)` получает запрос с `params` = `{'name': ..., 'arguments': {...}}` и возвращает ответ JSON-RPC (`jsonrpc` и `id`, как в прошлом задании):

    - инструмента нет → ошибка протокола: `'error': {'code': -32602, 'message': 'Unknown tool: {имя}'}`;
    - не хватает обязательных аргументов из `inputSchema['required']` → тоже ошибка протокола: `'error': {'code': -32602, 'message': 'Missing required arguments: {имена через запятую и пробел}'}`;
    - функция выбросила исключение → ошибка инструмента: `'result': {'content': [{'type': 'text', 'text': '{тип}: {сообщение}'}], 'isError': True}`;
    - иначе → `'result': {'content': [{'type': 'text', 'text': str(результат)}], 'isError': False}`.

    Получите `responses` — ответы сервера на запросы из списка `requests`.
