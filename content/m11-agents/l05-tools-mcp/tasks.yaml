    equal(f(req(1, 'echo', {'x': 'а', 'y': 'б'}), reg), {'jsonrpc': '2.0', 'id': 1, 'result': {'content': [{'type': 'text', 'text': 'аб'}], 'isError': False}}, 'Успешный вызов: ожидалось {expected}, а у вас {actual}.')
    equal(f(req(2, 'nope', {}), reg), {'jsonrpc': '2.0', 'id': 2, 'error': {'code': -32602, 'message': 'Unknown tool: nope'}}, 'Неизвестный инструмент: ожидалось {expected}, а у вас {actual}.')
    got = f(req(3, 'echo', {'y': 'б'}), reg)
