- id: m11-l5-t1
  title: Инструмент из функции
  difficulty: warmup
  introduces: [langchain-tools]
  uses: [function-calling]
  statement: |
    Сделайте два инструмента LangChain.

    1. `word_count(text: str, unique: bool = False) -> int` с декоратором `@tool`: число слов в тексте (`text.split()`), а при `unique=True` — число разных слов без учёта регистра. Строка документации — описание инструмента (хотя бы 20 символов).
    2. `lesson_minutes(lessons: int, length: int = 90) -> int` с декоратором `@tool(parse_docstring=True)`: сколько минут займут `lessons` занятий по `length` минут. Строка документации — в стиле Google: описание, пустая строка, раздел `Args:` с описанием обоих аргументов.

    Получите `schema` — описание `lesson_minutes` для модели: `convert_to_openai_tool(lesson_minutes)`.
  prelude: |
    from langchain_core.tools import tool
    from langchain_core.utils.function_calling import convert_to_openai_tool
  starter: |
    @tool
    def word_count(text: str, unique: bool = False) -> int:
        """..."""
        words = text.lower().split()
        return ...

    @tool(parse_docstring=True)
    def lesson_minutes(lessons: int, length: int = 90) -> int:
        """...

        Args:
            lessons: ...
            length: ...
        """
        return lessons * length

    schema = convert_to_openai_tool(lesson_minutes)
    print(word_count.args)
    print(schema)
    print(word_count.invoke({'text': 'Модель учится, модель ошибается'}), lesson_minutes.invoke({'lessons': 3}))
  solution: |
    @tool
    def word_count(text: str, unique: bool = False) -> int:
        """Число слов в тексте. Если unique=True — число разных слов без учёта регистра."""
        words = text.lower().split()
        return len(set(words)) if unique else len(words)

    @tool(parse_docstring=True)
    def lesson_minutes(lessons: int, length: int = 90) -> int:
        """Сколько минут займут занятия.

        Args:
            lessons: число занятий
            length: длина одного занятия в минутах
        """
        return lessons * length

    schema = convert_to_openai_tool(lesson_minutes)
    print(word_count.args)
    print(schema)
    print(word_count.invoke({'text': 'Модель учится, модель ошибается'}), lesson_minutes.invoke({'lessons': 3}))
  explanation: |
    - Схема аргументов строится из подсказок типов: `str` → `string`, `bool` → `boolean`, `int` → `integer`. У аргумента со значением по умолчанию есть `default`, и он не входит в `required`.
    - `parse_docstring=True` разбирает строку документации: текст до `Args:` — описание инструмента, строки «аргумент: описание» — описания аргументов. В схеме для модели они станут полями `description`.
    - `word_count.invoke({'text': ...})` сначала проверяет аргументы по схеме, потом вызывает функцию. Вызвать инструмент как обычную функцию — `word_count('…')` — нельзя: это инструмент, а не функция.
  hints:
    - "Разные слова — `len(set(words))`, все — `len(words)`."
    - "Строка документации — первая строка в теле функции: `\"\"\"Число слов в тексте…\"\"\"`."
    - "Для `parse_docstring=True` нужен формат: описание, пустая строка, `Args:`, строки «имя: описание» с отступом."
  tests: |
    from langchain_core.tools import BaseTool
    from langchain_core.utils.function_calling import convert_to_openai_tool
    wc = var('word_count')
    ensure(isinstance(wc, BaseTool), '`word_count` должен быть инструментом: поставьте над функцией декоратор `@tool`.')
    ensure(len(wc.description) >= 20 and wc.description != '...', 'Нужно описание `word_count` в строке документации — хотя бы 20 символов: модель узнаёт об инструменте только из него.')
    equal(wc.args, {'text': {'title': 'Text', 'type': 'string'}, 'unique': {'default': False, 'title': 'Unique', 'type': 'boolean'}}, 'Схема аргументов `word_count` — {expected}, а у вас {actual}. Проверьте подсказки типов и значение по умолчанию.')
    equal(wc.invoke({'text': 'Да да нет'}), 3, 'Слов в «Да да нет» — 3, а у вас {actual}.')
    equal(wc.invoke({'text': 'Да да нет', 'unique': True}), 2, 'Разных слов без учёта регистра в «Да да нет» — 2, а у вас {actual}.')
    lm = var('lesson_minutes')
    ensure(isinstance(lm, BaseTool), '`lesson_minutes` должен быть инструментом: `@tool(parse_docstring=True)`.')
    equal(lm.invoke({'lessons': 2}), 180, 'Два занятия по 90 минут — {expected}, а у вас {actual}.')
    equal(lm.invoke({'lessons': 2, 'length': 45}), 90, 'Два занятия по 45 минут — {expected}, а у вас {actual}.')
    props = lm.args
    ensure(all(len(props[a].get('description', '')) >= 3 and props[a].get('description') != '...' for a in ['lessons', 'length']), 'У обоих аргументов `lesson_minutes` нужны описания в разделе `Args:` строки документации.')
    ensure(len(lm.description) >= 10 and 'Args' not in lm.description, 'Описание `lesson_minutes` — текст до раздела `Args:`, хотя бы 10 символов.')
    sc = var('schema', dict, 'словарём')
    equal(sc, convert_to_openai_tool(lm), '`schema` должна быть результатом `convert_to_openai_tool(lesson_minutes)`.')
    equal(sc['function']['parameters']['required'], ['lessons'], 'Обязательный аргумент — только `lessons`, у `length` есть значение по умолчанию.')
  files: []
  wrong:
    - code: |
        def word_count(text: str, unique: bool = False) -> int:
            """Число слов в тексте. Если unique=True — число разных слов без учёта регистра."""
            words = text.lower().split()
            return len(set(words)) if unique else len(words)
        @tool(parse_docstring=True)
        def lesson_minutes(lessons: int, length: int = 90) -> int:
            """Сколько минут займут занятия.

            Args:
                lessons: число занятий
                length: длина одного занятия в минутах
            """
            return lessons * length
        schema = convert_to_openai_tool(lesson_minutes)
      expect: декоратор `@tool`
    - code: |
        @tool
        def word_count(text, unique=False):
            """Число слов в тексте. Если unique=True — число разных слов без учёта регистра."""
            words = text.lower().split()
            return len(set(words)) if unique else len(words)
        @tool(parse_docstring=True)
        def lesson_minutes(lessons: int, length: int = 90) -> int:
            """Сколько минут займут занятия.

            Args:
                lessons: число занятий
                length: длина одного занятия в минутах
            """
            return lessons * length
        schema = convert_to_openai_tool(lesson_minutes)
      expect: подсказки типов

- id: m11-l5-t2
  title: Агент на tool_calls
  difficulty: main
  introduces: []
  uses: [langchain-tools, react-loop]
  statement: |
    Напишите цикл агента `run_tool_agent(question, model, tools, max_steps=5)`. `tools` — словарь «имя → инструмент LangChain». Функция возвращает кортеж `(ответ, messages)`:

    1. `messages` начинается с `HumanMessage(question)`; на каждом шаге модель получает весь список, её ответ (`AIMessage`) добавляется в него;
    2. если вызовов нет (`ai.tool_calls` пуст) — ответ `ai.content`, конец;
    3. каждый вызов выполняется, и в `messages` добавляется `ToolMessage` с его `tool_call_id`. Агент не падает: для неизвестного инструмента содержимое — `'Ошибка: инструмента {имя} нет. Есть: {имена через запятую и пробел}.'`, для исключения при вызове (в том числе неверных аргументов) — `'Ошибка: {текст исключения}'`;
    4. если за `max_steps` шагов ответа нет — `'Не удалось ответить за отведённое число шагов.'`.

    Получите `answer` и `messages` для тестовой модели `model`: она просит два инструмента сразу, а потом ошибается в имени аргумента.
  prelude: |
    from langchain_core.tools import tool
    from langchain_core.messages import AIMessage, HumanMessage, ToolMessage
    from langchain_core.language_models import FakeMessagesListChatModel

    @tool
    def get_schedule(day: str) -> str:
        """Расписание занятий пользователя на день: «сегодня» или «завтра»."""
        table = {'сегодня': '16:00 — Анализ данных', 'завтра': '9:00 — История; 11:00 — Мировая культура; 14:00 — Консультация'}
        return table.get(day.strip().lower(), f'Нет расписания на «{day}».')

    @tool
    def lesson_minutes(lessons: int, length: int = 90) -> int:
        """Сколько минут займут lessons занятий по length минут."""
        return lessons * length

    TOOLS = {t.name: t for t in [get_schedule, lesson_minutes]}
    model = FakeMessagesListChatModel(responses=[
        AIMessage(content='', tool_calls=[{'name': 'get_schedule', 'args': {'day': 'сегодня'}, 'id': 'c1'},
                                          {'name': 'get_schedule', 'args': {'day': 'завтра'}, 'id': 'c2'}]),
        AIMessage(content='', tool_calls=[{'name': 'lesson_minutes', 'args': {'count': 4}, 'id': 'c3'}]),
        AIMessage(content='', tool_calls=[{'name': 'lesson_minutes', 'args': {'lessons': 4}, 'id': 'c4'}]),
        AIMessage(content='Сегодня и завтра у вас четыре занятия — 360 минут.'),
    ])
  starter: |
    def run_tool_agent(question, model, tools, max_steps=5):
        messages = [HumanMessage(question)]
        for _ in range(max_steps):
            ai = model.invoke(messages)
            messages.append(ai)
            if not ai.tool_calls:
                return ai.content, messages
            for call in ai.tool_calls:
                if call['name'] not in tools:
                    result = ToolMessage(content=..., tool_call_id=call['id'])
                else:
                    try:
                        result = ...
                    except Exception as e:
                        result = ToolMessage(content=f'Ошибка: {e}', tool_call_id=call['id'])
                messages.append(result)
        return 'Не удалось ответить за отведённое число шагов.', messages

    answer, messages = run_tool_agent('Сколько минут занятий у меня сегодня и завтра?', model, TOOLS)
    print(answer)
    for m in messages:
        print(type(m).__name__, getattr(m, 'tool_call_id', ''), m.content[:70].replace('\n', ' '))
  solution: |
    def run_tool_agent(question, model, tools, max_steps=5):
        messages = [HumanMessage(question)]
        for _ in range(max_steps):
            ai = model.invoke(messages)
            messages.append(ai)
            if not ai.tool_calls:
                return ai.content, messages
            for call in ai.tool_calls:
                if call['name'] not in tools:
                    result = ToolMessage(content=f'Ошибка: инструмента {call["name"]} нет. Есть: {", ".join(tools)}.',
                                         tool_call_id=call['id'])
                else:
                    try:
                        result = tools[call['name']].invoke(call)
                    except Exception as e:
                        result = ToolMessage(content=f'Ошибка: {e}', tool_call_id=call['id'])
                messages.append(result)
        return 'Не удалось ответить за отведённое число шагов.', messages

    answer, messages = run_tool_agent('Сколько минут занятий у меня сегодня и завтра?', model, TOOLS)
    print(answer)
    for m in messages:
        print(type(m).__name__, getattr(m, 'tool_call_id', ''), m.content[:70].replace('\n', ' '))
  explanation: |
    - `tools[call['name']].invoke(call)` выполняет вызов и сразу возвращает `ToolMessage` с правильным `tool_call_id`.
    - На первом шаге модель попросила два вызова сразу. Оба выполняются, и каждый результат приходит со своим номером — `c1` и `c2`.
    - На втором шаге модель перепутала аргумент: `count` вместо `lessons`. Схема инструмента это поймала, агент вернул модели текст ошибки, и на третьем шаге модель исправилась. Агент не упал ни на одной ошибке.
  hints:
    - "Нет инструмента — `f'Ошибка: инструмента {call[\"name\"]} нет. Есть: {\", \".join(tools)}.'`."
    - "Вызов — `tools[call['name']].invoke(call)`: результат уже `ToolMessage`."
    - "Исключения ловятся вокруг `invoke` — и ошибка в аргументах, и сбой внутри функции."
  tests: |
    from langchain_core.tools import tool
    from langchain_core.messages import AIMessage, HumanMessage, ToolMessage
    from langchain_core.language_models import FakeMessagesListChatModel
    f = var('run_tool_agent')
    ensure(callable(f), '`run_tool_agent` должна быть функцией.')
    @tool
    def double(x: int) -> int:
        """Удваивает число x."""
        return 2 * x
    reg = {'double': double}
    m = FakeMessagesListChatModel(responses=[
        AIMessage(content='', tool_calls=[{'name': 'double', 'args': {'x': 2}, 'id': 'a'}, {'name': 'triple', 'args': {'x': 2}, 'id': 'b'}]),
        AIMessage(content='', tool_calls=[{'name': 'double', 'args': {'y': 2}, 'id': 'c'}]),
        AIMessage(content='готово')])
    try:
        ans, msgs = f('вопрос', m, reg)
    except Exception as e:
        fail('Агент упал с {0}: {1}. Неизвестный инструмент и неверные аргументы — повод вернуть ошибку в ToolMessage, а не падать.'.format(type(e).__name__, e))
    equal(ans, 'готово', 'Ответ — содержимое последнего AIMessage без вызовов: {expected}, а у вас {actual}.')
    kinds = [type(x).__name__ for x in msgs]
    equal(kinds, ['HumanMessage', 'AIMessage', 'ToolMessage', 'ToolMessage', 'AIMessage', 'ToolMessage', 'AIMessage'], 'Порядок сообщений — {expected}, а у вас {actual}.')
    tm = [x for x in msgs if isinstance(x, ToolMessage)]
    equal([x.tool_call_id for x in tm], ['a', 'b', 'c'], 'У каждого ToolMessage — tool_call_id своего вызова: {expected}, а у вас {actual}.')
    equal(tm[0].content, '4', 'Результат double(2) — «4», а у вас {actual}.')
    equal(tm[1].content, 'Ошибка: инструмента triple нет. Есть: double.', 'Для неизвестного инструмента ожидалось {expected}, а у вас {actual}.')
    ensure(tm[2].content.startswith('Ошибка: '), 'Неверные аргументы — ToolMessage с текстом «Ошибка: …», а у вас {0!r}.'.format(tm[2].content))
    equal(len(m.calls), 3, 'Модель вызывается 3 раза, а у вас {actual}.')
    ensure(len(m.calls[1]) == 4, 'На втором шаге модель должна получить всю историю: вопрос, свой ответ и два результата — 4 сообщения, а получила {0}.'.format(len(m.calls[1])))
    m2 = FakeMessagesListChatModel(responses=[AIMessage(content='', tool_calls=[{'name': 'double', 'args': {'x': 1}, 'id': 'z'}])])
    ans2, _ = f('вопрос', m2, reg, max_steps=2)
    equal(ans2, 'Не удалось ответить за отведённое число шагов.', 'Если ответа нет за max_steps шагов — {expected}, а у вас {actual}.')
    equal(var('answer', str, 'строкой'), ref('answer'), 'Ответ агента — {expected}, а у вас {actual}.')
  files: []
  wrong:
    - code: |
        def run_tool_agent(question, model, tools, max_steps=5):
            messages = [HumanMessage(question)]
            for _ in range(max_steps):
                ai = model.invoke(messages)
                messages.append(ai)
                if not ai.tool_calls:
                    return ai.content, messages
                for call in ai.tool_calls:
                    messages.append(tools[call['name']].invoke(call))
            return 'Не удалось ответить за отведённое число шагов.', messages
        answer, messages = run_tool_agent('Сколько минут занятий у меня сегодня и завтра?', model, TOOLS)
      expect: Неподходящее значение
    - code: |
