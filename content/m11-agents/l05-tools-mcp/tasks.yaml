  solution: |
    def handle_call(request, registry):
        response = {'jsonrpc': '2.0', 'id': request.get('id')}
        name = request['params']['name']
        args = request['params'].get('arguments', {})
        if name not in registry:
            response['error'] = {'code': -32602, 'message': f'Unknown tool: {name}'}
            return response
        missing = [a for a in registry[name]['inputSchema'].get('required', []) if a not in args]
        if missing:
            response['error'] = {'code': -32602, 'message': 'Missing required arguments: ' + ', '.join(missing)}
            return response
        try:
            text, failed = str(registry[name]['func'](args)), False
        except Exception as e:
            text, failed = f'{type(e).__name__}: {e}', True
        response['result'] = {'content': [{'type': 'text', 'text': text}], 'isError': failed}
        return response

    responses = [handle_call(r, REGISTRY) for r in requests]
    for r in responses:
        print(r)
  explanation: |
    - Неизвестный инструмент и пропущенные обязательные аргументы — ошибки протокола: запрос составлен неверно, вызывать нечего. Сервер проверяет это по описанию инструмента, ещё не запуская его.
    - Исключение внутри функции — ошибка инструмента: запрос верный, но выполнить не удалось. Такой ответ — обычный `result` с `isError: True`. Его текст «KeyError: 'вчера'» клиент передаст модели, и та сможет попросить другой день.
    - Результат всегда превращается в текст (`str`): у `lesson_minutes` это число 270. Контент MCP-ответа — список блоков, у нас один текстовый.
    - Запрос «delete_schedule» отклонён: такого инструмента на сервере нет. Чего нет на сервере, того агент не сделает, — это тоже защита (урок 11.6).
  hints:
    - "Неизвестный инструмент — `{'code': -32602, 'message': f'Unknown tool: {name}'}`."
    - "Пропущенные аргументы — `'Missing required arguments: ' + ', '.join(missing)`."
    - "Исключение — `text, failed = f'{type(e).__name__}: {e}', True`."
  tests: |
    f = var('handle_call')
    ensure(callable(f), '`handle_call` должна быть функцией.')
    def boom(args):
        raise ValueError('сбой')
    reg = {'echo': {'description': 'повтор', 'inputSchema': {'type': 'object', 'properties': {'x': {'type': 'string'}, 'y': {'type': 'string'}}, 'required': ['x', 'y']}, 'func': lambda a: a['x'] + a['y']},
           'boom': {'description': 'падает', 'inputSchema': {'type': 'object', 'properties': {}}, 'func': boom},
           'num': {'description': 'число', 'inputSchema': {'type': 'object', 'properties': {}}, 'func': lambda a: 5}}
