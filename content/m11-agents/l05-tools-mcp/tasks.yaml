    equal(tf(srv), [{'type': 'function', 'function': {'name': 'x', 'description': 'инструмент x', 'parameters': {'type': 'object', 'properties': {'q': {'type': 'string'}}, 'required': ['q']}}}], 'Описание для модели: ожидалось {expected}, а у вас {actual}.')
    ok = cv(srv, {'name': 'x', 'args': {'q': 'a'}, 'id': 'k1', 'type': 'tool_call'}, 10)
    ensure(isinstance(ok, ToolMessage), '`call_via_mcp` должна вернуть ToolMessage.')
    equal(ok.tool_call_id, 'k1', 'У ToolMessage — tool_call_id вызова: {expected}, а у вас {actual}.')
    equal(ok.content, 'раз\nдва', 'Тексты блоков контента — через перенос строки: ожидалось {expected}, а у вас {actual}.')
