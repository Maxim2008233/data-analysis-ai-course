  solution: |
    def parse_call(text):
        try:
            data = json.loads(text)
        except json.JSONDecodeError:
            return None
        if not isinstance(data, dict):
            return None
        name, args = data.get('name'), data.get('arguments')
        if not isinstance(name, str) or not isinstance(args, dict):
            return None
        return name, args

    parsed = [parse_call(r) for r in replies]
    for reply, result in zip(replies, parsed):
        print(f'{reply[:45]:47} → {result}')
  explanation: |
    - `json.loads` падает на одинарных кавычках и на тексте вокруг JSON — это ответы 2 и 3.
    - `data.get('name')` возвращает `None`, если ключа нет. Поэтому одна проверка `isinstance` ловит сразу и отсутствие ключа, и неверный тип — ответы 4 и 6.
    - Список (ответ 5) — тоже правильный JSON, но не словарь: для него `data.get` упал бы, поэтому проверка `isinstance(data, dict)` стоит раньше.
    - Порядок ключей в JSON не важен — последний ответ разбирается. Из семи ответов модели разобрать можно только два: строгий разбор показывает, что формат вызова нужно задавать модели явно и проверять.
  hints:
    - "Условие отказа — `not isinstance(name, str) or not isinstance(args, dict)`."
    - "Если ключа нет, `data.get(...)` вернёт `None` — он не строка и не словарь."
    - "Список результатов — `[parse_call(r) for r in replies]`."
  tests: |
    f = var('parse_call')
    ensure(callable(f), '`parse_call` должна быть функцией.')
    equal(f('{"name": "calc", "arguments": {"expression": "2+2"}}'), ('calc', {'expression': '2+2'}), 'Правильный вызов должен разобраться в {expected}, а получилось {actual}.')
    equal(f('{"name": "calc", "arguments": {}}'), ('calc', {}), 'Пустой словарь аргументов — тоже правильный вызов: {expected}, а у вас {actual}.')
    equal(f("{'name': 'calc', 'arguments': {}}"), None, 'Одинарные кавычки — не JSON: нужен None.')
    equal(f('не JSON вовсе'), None, 'Текст без JSON — None.')
    equal(f('[1, 2]'), None, 'JSON-список — не вызов: нужен None.')
    equal(f('"calc"'), None, 'JSON-строка — не вызов: нужен None.')
    equal(f('{"name": 5, "arguments": {}}'), None, 'Имя инструмента — строка; для `"name": 5` нужен None.')
    equal(f('{"name": "calc", "arguments": "2+2"}'), None, 'Аргументы — словарь; для строки вместо словаря нужен None.')
    equal(f('{"arguments": {}}'), None, 'Без имени инструмента — None.')
    equal(var('parsed', list, 'списком'), ref('parsed'), 'Результаты для ответов модели — {expected}, а у вас {actual}.')
