- id: m11-l9-t7
  kind: quiz
  title: "Шаг 7. Выводы"
  difficulty: main
  introduces: []
  uses: [rag, llm-evaluation]
  statement: |
    Подведите итоги проекта.
  quiz:
    - q: Почему извлекающий помощник не выдумывает фактов?
      options:
        - Он не пишет текст сам, а цитирует предложение из найденного раздела курса
        - Он проверяет каждый факт в интернете
        - Он всегда отвечает «не знаю»
      answer: 0
      explain: Цитата может оказаться не про то, но выдуманной она не будет. Языковая модель пишет связнее, зато может выдумать — поэтому её ссылки проверяют.
    - q: Порог и вес выбирались на dev. Что даёт оценка на test?
      options:
        - Честную оценку на вопросах, под которые ничего не подгонялось
        - Ещё один шанс подобрать порог получше
        - То же самое, что оценка на dev
      answer: 0
      explain: На dev решение «отвечать или нет» было верным у всех 30 вопросов, на test — у 29. Так и должно быть.
    - q: Правильная ссылка у 12 вопросов из 15, интервал — примерно от 60 до 100 %. Что из этого следует?
      options:
        - Чтобы сравнивать версии помощника, нужно больше размеченных вопросов
        - Помощник точно лучше любой языковой модели
        - Интервал можно сузить, увеличив n_boot
      answer: 0
      explain: Ширину интервала задаёт число вопросов, а не число бутстрэп-выборок.
    - q: Как подключить помощника к GigaChat в Colab?
      options:
        - Заменить выбор предложения вызовом модели с промптом из урока 11.3, оставив поиск, порог, фильтр и проверку ссылок
        - Переписать всё с нуля
        - "Убрать порог «не знаю»: модель сама разберётся"
      answer: 0
      explain: Модель меняет только шаг «как сформулировать ответ». Остальные шаги защищают от вопросов не по теме, атак и выдуманных ссылок.
  hints:
    - Вспомните шаги 3, 4 и 6.
    - "Цитата не выдумана; test честнее dev; 15 вопросов дают широкий интервал; модель меняет только формулировку ответа."
    - "Ответы: первый вариант во всех четырёх вопросах."
