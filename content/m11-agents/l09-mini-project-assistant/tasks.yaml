- id: m11-l9-t1
  title: "Шаг 1. Предложения из разделов"
  difficulty: main
  introduces: []
  uses: [rag]
  statement: |
    Ответ помощника — одно предложение из раздела урока. Напишите функцию `split_sentences(text, min_len=20)`: она режет текст раздела на куски по концу предложения (`.`, `!`, `?`, `…` и пробелы после них) и по переносам строк — `re.split(r'(?<=[.!?…])\s+|\n+', text)`. Остаются куски, которые после удаления пробелов по краям:

    - не короче `min_len` символов;
    - заканчиваются точкой или восклицательным знаком — это утверждения. Вопросы, заголовки списков (с двоеточием в конце) и обрывки без точки ответом не годятся.

    Получите `n_sentences` — сколько предложений-кандидатов во всех разделах `docs`.
  prelude: |
    import json
    import re
    with open('course_docs.json', encoding='utf-8') as fh:
        docs = json.load(fh)
  starter: |
    def split_sentences(text, min_len=20):
        parts = [p.strip() for p in re.split(r'(?<=[.!?…])\s+|\n+', text)]
        return [p for p in parts if ...]

    n_sentences = sum(len(split_sentences(d['text'])) for d in docs)
    print(n_sentences)
    print(split_sentences(docs[100]['text']))
  solution: |
    def split_sentences(text, min_len=20):
        parts = [p.strip() for p in re.split(r'(?<=[.!?…])\s+|\n+', text)]
        return [p for p in parts if len(p) >= min_len and p[-1] in '.!']

    n_sentences = sum(len(split_sentences(d['text'])) for d in docs)
    print(n_sentences)
    print(split_sentences(docs[100]['text']))
  explanation: |
    - `(?<=[.!?…])\s+` режет по пробелам после конца предложения и оставляет знак в предложении; `\n+` режет по переносам — так отделяются пункты списков.
    - Проверка `p[-1] in '.!'` стоит после проверки длины, и пустых кусков к ней не доходит: пустая строка короче 20 символов.
    - Из разделов курса получилось 3968 предложений-кандидатов. Вопросы вроде «Какое число лучше всего по MSE?» отброшены: процитировать вопрос как ответ — плохая идея, а такое случается, если их не убрать.
  hints:
    - "Условие — `len(p) >= min_len and p[-1] in '.!'`."
    - "Пустые куски отсекает проверка длины."
    - "Вопрос заканчивается на «?», заголовок списка — на «:»: их проверка конца отбросит."
  tests: |
    f = var('split_sentences')
    ensure(callable(f), '`split_sentences` должна быть функцией.')
    text = ('Первое предложение достаточно длинное. Короткое. Это вопрос, и он довольно длинный?\n'
            'Заголовок списка с двоеточием:\nВосклицание тоже подходит для ответа! Многоточие в конце не годится…')
    got = f(text)
    if 'Это вопрос, и он довольно длинный?' in got:
        fail('Вопросы — не ответы: оставляйте куски, которые заканчиваются точкой или «!».')
    equal(got, ['Первое предложение достаточно длинное.', 'Восклицание тоже подходит для ответа!'], 'Для тестового текста ожидалось {expected}, а у вас {actual}.')
    equal(f('Короткое, но с точкой.', min_len=30), [], 'Кусок короче min_len отбрасывается.')
    equal(f('Короткое, но с точкой.', min_len=5), ['Короткое, но с точкой.'], 'min_len берётся из аргумента.')
    equal(f(''), [], 'Пустой текст — пустой список.')
    equal(int(var('n_sentences', 'number', 'числом')), int(ref('n_sentences')), 'Предложений-кандидатов во всех разделах — {expected}, а у вас {actual}.')
  files: [course_docs.json]
  wrong:
    - code: |
        def split_sentences(text, min_len=20):
            parts = [p.strip() for p in re.split(r'(?<=[.!?…])\s+|\n+', text)]
            return [p for p in parts if len(p) >= min_len]
        n_sentences = sum(len(split_sentences(d['text'])) for d in docs)
      expect: Вопросы — не ответы
    - code: |
        def split_sentences(text, min_len=20):
            parts = [p.strip() for p in re.split(r'(?<=[.!?…])\s+|\n+', text)]
            return [p for p in parts if len(p) >= 20 and p[-1] in '.!']
        n_sentences = sum(len(split_sentences(d['text'])) for d in docs)
      expect: короче min_len

