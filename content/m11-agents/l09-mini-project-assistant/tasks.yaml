    from sklearn.feature_extraction.text import TfidfVectorizer
    f = var('best_sentence')
    ensure(callable(f), '`best_sentence` должна быть функцией.')
    a = {'lesson': '1.1', 'text': 'Кошки любят спать на солнце целый день. Собаки любят гулять.'}
    b = {'lesson': '2.2', 'text': 'Рыбы живут в воде и не любят солнце совсем. Птицы поют по утрам громко.'}
    vec = TfidfVectorizer(analyzer='char_wb', ngram_range=(3, 5)).fit([a['text'], b['text']])
    got = f('где спят кошки', [(0.5, a), (0.4, b)], vec, 0.0)
    equal(got, ('Кошки любят спать на солнце целый день.', '1.1'), 'Для вопроса «где спят кошки» лучшее предложение — {expected}, а у вас {actual}.')
    got_w = f('кошки на солнце', [(0.1, a), (0.9, b)], vec, 10.0)
    equal(got_w[1], '2.2', 'С большим весом w побеждает предложение из раздела с большим сходством (урок 2.2), а у вас {actual}.')
    equal(f('что угодно', [(0.3, {'lesson': '3.3', 'text': 'Вопрос?\nЗаголовок:'})], vec, 0.5), (None, None), 'Если кандидатов нет — (None, None).')
    dc = var('dev_counts', dict, 'словарём')
    equal(dc, ref('dev_counts'), 'Число верных уроков на dev — {expected}, а у вас {actual}.')
    close(var('best_w', 'number', 'числом'), ref('best_w'), 'Лучший вес на dev — {expected}, а у вас {actual}.')
