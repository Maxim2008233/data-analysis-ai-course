  solution: |
    def best_sentence(question, hits, vectorizer, w=0.5):
        cands = [(s, d['lesson'], score) for score, d in hits for s in split_sentences(d['text'])]
        if not cands:
            return None, None
        S = vectorizer.transform([s for s, lesson, score in cands])
        sims = (S @ vectorizer.transform([question]).T).toarray().ravel()
        total = sims + w * np.array([score for s, lesson, score in cands])
        i = int(np.argmax(total))
        return cands[i][0], cands[i][1]

    dev_counts = {}
    for w in [0.0, 0.5, 1.0]:
        dev_counts[w] = sum(best_sentence(q['question'], search(q['question']), vectorizer, w)[1] in q['lessons']
                            for q in dev_course)
    best_w = max(dev_counts, key=dev_counts.get)
    print(dev_counts, best_w)
  explanation: |
    - Сходство одного предложения с вопросом — шумная оценка: короткое предложение может случайно разделить с вопросом пару кусочков слов. Сходство раздела добавляет уверенность «мы в нужном месте».
    - `np.argmax` при равенстве берёт первый максимум, а `max(dev_counts, key=...)` — первый ключ с наибольшим значением. Ключи идут по возрастанию, поэтому при равенстве выбирается меньший вес.
    - На `dev` вес 0 даёт верный урок у 13 вопросов из 15, вес 0,5 — у 14. Выбираем 0,5, а проверим на `test` в шаге 4 — там этот выбор не настраивался.
  hints:
    - "Оценка — `sims + w * np.array([score for s, lesson, score in cands])`."
    - "Лучший вес — `max(dev_counts, key=dev_counts.get)`."
    - "Если кандидатов нет — `return None, None`: такое бывает, когда в найденных разделах одни вопросы и заголовки."
  tests: |
