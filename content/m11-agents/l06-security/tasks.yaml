- id: m11-l6-t5
  title: Заморозка кода
  difficulty: star
  introduces: []
  uses: [guardrails]
  statement: |
    Защитите базу данных от агента так, как не сделали в случае Replit. Агент выполняет SQL-запросы, а программа проверяет каждый до выполнения.

    1. `sql_risk(query)` — уровень риска: сначала убрать комментарии (`-- …` до конца строки и `/* … */`), затем разрезать по `;` на команды (пустые пропустить) и оценить каждую по первому слову без учёта регистра: `SELECT`, `WITH`, `SHOW`, `EXPLAIN` → `'read'`; `INSERT`, `UPDATE` → `'write'`; всё остальное (`DELETE`, `DROP`, `TRUNCATE`, `ALTER`, незнакомые слова) → `'destroy'`. Риск запроса — наибольший из рисков команд (`read` < `write` < `destroy`); у пустого запроса — `'read'`.
    2. `decide(query, freeze)` — решение: `read` → `'auto'`; `write` → `'confirm'`, а во время заморозки (`freeze=True`) → `'deny'`; `destroy` → всегда `'deny'`.

    Получите `decisions` — решения для запросов `queries` во время заморозки.
