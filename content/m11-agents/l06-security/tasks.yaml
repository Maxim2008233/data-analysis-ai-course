  solution: |
    LEVELS = ['read', 'write', 'destroy']

    def sql_risk(query):
        clean = re.sub(r'--[^\n]*', ' ', query)
        clean = re.sub(r'/\*.*?\*/', ' ', clean, flags=re.S)
        risk = 'read'
        for command in clean.split(';'):
            words = command.split()
            if not words:
                continue
            first = words[0].upper()
            if first in ('SELECT', 'WITH', 'SHOW', 'EXPLAIN'):
                level = 'read'
            elif first in ('INSERT', 'UPDATE'):
                level = 'write'
            else:
                level = 'destroy'
            if LEVELS.index(level) > LEVELS.index(risk):
                risk = level
        return risk

    def decide(query, freeze):
        risk = sql_risk(query)
        if risk == 'read':
            return 'auto'
        if risk == 'write':
            return 'deny' if freeze else 'confirm'
        return 'deny'

    decisions = [decide(q, freeze=True) for q in queries]
    for q, d in zip(queries, decisions):
        print(f'{d:8} {q!r}')
  explanation: |
    - Риск оценивается по каждой команде, а итог — по самой опасной. Иначе `SELECT …; DROP TABLE users` прошёл бы как безобидное чтение.
    - Комментарии убираются до разбора. Иначе `-- очистка…` спрятал бы `DELETE`, а первое слово команды оказалось бы не тем.
    - Слова внутри строк не мешают: в `select 'drop table'` первое слово — `SELECT`. Поиск слова «drop» где угодно в запросе дал бы ложную тревогу.
    - Незнакомые команды (`VACUUM`) считаются опасными. Список разрешённого надёжнее списка запрещённого: всё, что не опознано как чтение или запись, запрещено.
    - Простой разбор ошибается в сторону осторожности: `;` внутри строки разрежет команду, и кусок может оказаться «опасным». Для защиты такая ошибка лучше обратной. Надёжнее всего — дать агенту пользователя базы с правами только на чтение: тогда опасную команду отклонит сама база.
  hints:
    - "Запись — `elif first in ('INSERT', 'UPDATE'):`, всё прочее — `'destroy'`."
    - "Решение: `read` → `'auto'`; `write` → `'deny' if freeze else 'confirm'`; иначе `'deny'`."
    - "Проверьте себя на `'SELECT 1; DROP TABLE t'` — это `'destroy'`."
  tests: |
    r = var('sql_risk')
    d = var('decide')
    ensure(callable(r) and callable(d), '`sql_risk` и `decide` должны быть функциями.')
    equal(r('select * from t'), 'read', 'select — чтение (регистр не важен), а у вас {actual}.')
    equal(r('INSERT INTO t VALUES (1)'), 'write', 'INSERT — запись, а у вас {actual}.')
    if r('SELECT 1; DROP TABLE t') != 'destroy':
        fail('«SELECT 1; DROP TABLE t» — две команды, вторая разрушает: риск запроса — наибольший из рисков команд, то есть destroy.')
    if r("SELECT 'drop table' AS x") != 'read':
        fail('В «SELECT \'drop table\' AS x» первое слово команды — SELECT: это чтение. Оценивайте команду по первому слову, а не по любому слову в тексте.')
    equal(r('-- комментарий\nDROP TABLE t'), 'destroy', 'Комментарий не должен прятать команду: «-- комментарий\\nDROP TABLE t» — destroy, а у вас {actual}.')
    equal(r('/* x */ update t set a = 1'), 'write', 'Комментарий /* … */ убирается до разбора: это запись, а у вас {actual}.')
    equal(r('GRANT ALL ON t TO agent'), 'destroy', 'Незнакомая команда (GRANT) — опасная: destroy, а у вас {actual}.')
    equal(r('   ;  ; '), 'read', 'Пустой запрос — read, а у вас {actual}.')
    equal(d('UPDATE t SET a = 1', False), 'confirm', 'Запись без заморозки — confirm, а у вас {actual}.')
    equal(d('UPDATE t SET a = 1', True), 'deny', 'Запись во время заморозки — deny, а у вас {actual}.')
    equal(d('DROP TABLE t', False), 'deny', 'Разрушение — всегда deny, а у вас {actual}.')
    equal(d('SELECT 1', True), 'auto', 'Чтение — auto даже во время заморозки, а у вас {actual}.')
    equal(var('decisions', list, 'списком'), ref('decisions'), 'Решения во время заморозки — {expected}, а у вас {actual}.')
