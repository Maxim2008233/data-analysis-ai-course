- id: m11-l8-t4
  title: Разбор ответа распознавания
  difficulty: main
  introduces: [speech-pipeline]
  uses: [digital-audio]
  statement: |
    Исправьте ошибку ноутбука. Напишите функцию `parse_stt(response)`, которая всегда возвращает словарь `{'ok': ..., 'text': ..., 'emotion': ...}`:

    - `response` — словарь со `status` 200 → `ok` = `True`; `text` — все **непустые** фразы из `result` (без пробелов по краям) через пробел; `emotion` — эмоция с наибольшей суммой оценок по этим непустым фразам (оценки — в `emotions`, по одной на фразу, в том же порядке). Если непустых фраз нет — `text` пустой, `emotion` = `None`;
    - что угодно другое (строка с текстом ошибки, как возвращает `stt` из ноутбука, или статус не 200) → `{'ok': False, 'text': '', 'emotion': None}`.

    Получите `parsed` — результаты для ответов SaluteSpeech из ноутбука (`responses`) и для двух ошибочных ответов (`failures`).
  prelude: |
    import json
    with open('voice_bot_notebook.json', encoding='utf-8') as fh:
        responses = [r['response'] for r in json.load(fh)['records'] if r['kind'] == 'stt']
    failures = ['{"status":401,"message":"Unauthorized"}', {'status': 400, 'result': [], 'emotions': []}]
  starter: |
    def parse_stt(response):
        if not isinstance(response, dict) or response.get('status') != 200:
            return {'ok': False, 'text': '', 'emotion': None}
        pairs = [(p.strip(), e) for p, e in zip(response['result'], response['emotions']) if p.strip()]
        if not pairs:
            return {'ok': True, 'text': '', 'emotion': None}
        totals = {}
        for phrase, emotions in pairs:
            for name, value in emotions.items():
                totals[name] = ...
        return {'ok': True, 'text': ..., 'emotion': max(totals, key=totals.get)}

    parsed = [parse_stt(r) for r in responses + failures]
    for p in parsed:
        print(p)
  solution: |
    def parse_stt(response):
        if not isinstance(response, dict) or response.get('status') != 200:
            return {'ok': False, 'text': '', 'emotion': None}
        pairs = [(p.strip(), e) for p, e in zip(response['result'], response['emotions']) if p.strip()]
        if not pairs:
            return {'ok': True, 'text': '', 'emotion': None}
        totals = {}
        for phrase, emotions in pairs:
            for name, value in emotions.items():
                totals[name] = totals.get(name, 0) + value
        return {'ok': True, 'text': ' '.join(p for p, e in pairs), 'emotion': max(totals, key=totals.get)}

    parsed = [parse_stt(r) for r in responses + failures]
    for p in parsed:
        print(p)
  explanation: |
    - Первая проверка отсекает и строку с ошибкой, которую возвращает `stt` из ноутбука, и словарь с другим статусом. Дальше код работает только с правильным ответом, а вызывающий код узнаёт об ошибке по `ok`, а не по первой букве строки.
    - `zip(result, emotions)` держит вместе фразу и её оценки. Пустая вторая фраза в ответе из Gradio не попадает ни в текст, ни в подсчёт эмоций.
    - Все четыре настоящих ответа — нейтральные. Оценка эмоций полезна, например, чтобы передать модели: «пользователь, похоже, раздражён — отвечай короче и спокойнее».
  hints:
    - "Сумма оценок — `totals[name] = totals.get(name, 0) + value`."
    - "Текст — `' '.join(p for p, e in pairs)`."
    - "Строка с ошибкой — не словарь: её отсекает `not isinstance(response, dict)`."
  tests: |
    f = var('parse_stt')
    ensure(callable(f), '`parse_stt` должна быть функцией.')
    try:
        bad = f('Ошибка: 401 Unauthorized')
    except Exception as e:
        fail('На строке с текстом ошибки функция упала ({0}). Ответ stt при ошибке — строка; верните {{"ok": False, ...}}.'.format(type(e).__name__))
    equal(bad, {'ok': False, 'text': '', 'emotion': None}, 'Строка с текстом ошибки — {expected}, а у вас {actual}.')
    equal(f({'status': 500, 'result': ['x'], 'emotions': [{'neutral': 1}]}), {'ok': False, 'text': '', 'emotion': None}, 'Статус не 200 — неуспех, даже если есть result.')
    two = {'status': 200, 'result': [' Привет. ', '', 'Как дела?'], 'emotions': [{'negative': 0.1, 'neutral': 0.5, 'positive': 0.4}, {'negative': 0, 'neutral': 1, 'positive': 0}, {'negative': 0.1, 'neutral': 0.2, 'positive': 0.7}]}
    got = f(two)
    equal(got['text'], 'Привет. Как дела?', 'Непустые фразы без пробелов по краям через пробел: ожидалось {expected}, а у вас {actual}.')
    if got['emotion'] == 'neutral':
        fail('Эмоции пустой фразы не учитываются: без неё сумма positive (1.1) больше neutral (0.7).')
