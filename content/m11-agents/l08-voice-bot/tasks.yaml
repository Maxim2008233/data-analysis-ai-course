- id: m11-l8-t1
  title: Параметры записи
  difficulty: warmup
  introduces: [digital-audio]
  uses: []
  statement: |
    Напишите функцию `wav_info(path)`: она открывает WAV-файл модулем `wave` и возвращает словарь с ключами `'rate'` (частота дискретизации), `'channels'` (число каналов), `'sampwidth'` (байт на отсчёт), `'frames'` (число отсчётов в канале) и `'duration'` — длительность в секундах (`frames / rate`).

    Получите `info` для файла `recording.wav` и `n_samples_16k` — сколько отсчётов было бы в той же записи при частоте 16 000 Гц (`round(duration * 16000)`).
  prelude: |
    import wave
  starter: |
    def wav_info(path):
        with wave.open(path) as w:
            rate = w.getframerate()
            frames = ...
            return {'rate': rate, 'channels': w.getnchannels(), 'sampwidth': ...,
                    'frames': frames, 'duration': ...}

    info = wav_info('recording.wav')
    n_samples_16k = round(info['duration'] * 16000)
    print(info, n_samples_16k)
  solution: |
    def wav_info(path):
        with wave.open(path) as w:
            rate = w.getframerate()
            frames = w.getnframes()
            return {'rate': rate, 'channels': w.getnchannels(), 'sampwidth': w.getsampwidth(),
                    'frames': frames, 'duration': frames / rate}

    info = wav_info('recording.wav')
    n_samples_16k = round(info['duration'] * 16000)
    print(info, n_samples_16k)
  explanation: |
    - `with wave.open(path) as w:` закрывает файл сам — даже если внутри случится ошибка.
    - Длительность — число отсчётов, делённое на их число в секунду: 164 160 / 48 000 = 3,42 с.
    - При 16 000 Гц та же запись заняла бы 54 720 отсчётов — втрое меньше данных. Для распознавания речи этого хватает, поэтому запись перед отправкой часто пересчитывают на меньшую частоту.
  hints:
    - "Число отсчётов — `w.getnframes()`, байт на отсчёт — `w.getsampwidth()`."
    - "Длительность — `frames / rate`."
    - "Значения нужно прочитать внутри `with`: после выхода файл закрыт."
  tests: |
    import wave
    import numpy as np
    f = var('wav_info')
    ensure(callable(f), '`wav_info` должна быть функцией.')
    with wave.open('tone_check.wav', 'wb') as w:
        w.setnchannels(1)
        w.setsampwidth(2)
        w.setframerate(8000)
        w.writeframes((np.sin(np.arange(4000) / 5) * 1000).astype(np.int16).tobytes())
    got = f('tone_check.wav')
    ensure(isinstance(got, dict), '`wav_info` должна вернуть словарь, а вернула {0}.'.format(type(got).__name__))
    equal(sorted(got), ['channels', 'duration', 'frames', 'rate', 'sampwidth'], 'Ключи словаря — {expected}, а у вас {actual}.')
    equal({k: got[k] for k in ['rate', 'channels', 'sampwidth', 'frames']}, {'rate': 8000, 'channels': 1, 'sampwidth': 2, 'frames': 4000}, 'Для тестового файла (8000 Гц, моно, 16 бит, 4000 отсчётов) ожидалось {expected}, а у вас {actual}.')
    close(got['duration'], 0.5, 'Длительность 4000 отсчётов при 8000 Гц — 0.5 с, а у вас {actual}.')
    equal(var('info', dict, 'словарём'), ref('info'), 'Параметры recording.wav — {expected}, а у вас {actual}.')
    equal(int(var('n_samples_16k', 'number', 'числом')), int(ref('n_samples_16k')), 'При 16 000 Гц отсчётов было бы {expected}, а у вас {actual}.')
  files: [recording.wav]
  wrong:
    - code: |
        def wav_info(path):
            with wave.open(path) as w:
                rate = w.getframerate()
                frames = w.getnframes()
                return {'rate': rate, 'channels': w.getnchannels(), 'sampwidth': w.getsampwidth(), 'frames': frames, 'duration': rate / frames}
        info = wav_info('recording.wav')
        n_samples_16k = round(info['duration'] * 16000)
      expect: Длительность 4000 отсчётов
    - code: |
        def wav_info(path):
            with wave.open(path) as w:
                rate = w.getframerate()
                frames = w.getnframes() * w.getsampwidth()
                return {'rate': rate, 'channels': w.getnchannels(), 'sampwidth': w.getsampwidth(), 'frames': frames, 'duration': frames / rate}
        info = wav_info('recording.wav')
        n_samples_16k = round(info['duration'] * 16000)
      expect: Для тестового файла

- id: m11-l8-t2
  title: Громкость кадров
  difficulty: main
  introduces: []
  uses: [digital-audio]
  statement: |
    Напишите функцию `frame_rms(samples, rate, frame_ms=20)`: отсчёты 16-битной записи (`int16`) переводятся в доли от предела (делением на 32768), режутся на кадры по `frame_ms` миллисекунд (последний неполный кадр отбрасывается), и для каждого кадра считается RMS — корень из среднего квадрата. Результат — массив NumPy.

    Получите `rms` для записи `samples` (частота `rate`) и `noise` — медиану RMS кадров: так оценивают громкость фонового шума.
  prelude: |
    import wave
    import numpy as np
    with wave.open('recording.wav') as w:
        rate = w.getframerate()
        samples = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16)
  starter: |
    def frame_rms(samples, rate, frame_ms=20):
        x = samples.astype(np.float64) / 32768
        frame = int(rate * frame_ms / 1000)
        k = ...                                       # число полных кадров
        return np.sqrt((x[:k * frame].reshape(k, frame) ** 2).mean(axis=1))

    rms = frame_rms(samples, rate)
    noise = ...
    print(len(rms), round(float(rms.max()), 3), round(float(noise), 4))
  solution: |
    def frame_rms(samples, rate, frame_ms=20):
        x = samples.astype(np.float64) / 32768
        frame = int(rate * frame_ms / 1000)
        k = len(x) // frame                           # число полных кадров
        return np.sqrt((x[:k * frame].reshape(k, frame) ** 2).mean(axis=1))

    rms = frame_rms(samples, rate)
    noise = float(np.median(rms))
    print(len(rms), round(float(rms.max()), 3), round(float(noise), 4))
  explanation: |
    - `astype(np.float64)` до деления обязательно: квадраты 16-битных чисел не помещаются в `int16` и «переполнились» бы.
    - `len(x) // frame` — целое число полных кадров; `reshape(k, frame)` раскладывает отсчёты по строкам-кадрам, и среднее по строке (`axis=1`) — средний квадрат каждого кадра.
    - 171 кадр по 20 мс. Медиана RMS — около 0,004: больше половины кадров — тишина, и медиана показывает уровень шума. Самый громкий кадр — 0,28, в 66 раз громче.
  hints:
    - "Число полных кадров — `len(x) // frame`."
    - "Уровень шума — `float(np.median(rms))`."
    - "Проверьте себя: постоянный сигнал 16384 даёт RMS 0,5."
  tests: |
    import numpy as np
    f = var('frame_rms')
    ensure(callable(f), '`frame_rms` должна быть функцией.')
    loud = np.array([30000, -30000] * 50, dtype=np.int16)
    with np.errstate(all='ignore'):
        first = float(f(loud, 1000, 100)[0])
    close(first, 30000 / 32768, 'RMS сигнала ±30000 — {expected}, а у вас {actual}. Если получилось странное число или nan, переведите отсчёты в float до возведения в квадрат: квадраты не помещаются в int16.')
    pulse = np.array([0, 0, 0, 30000] * 25, dtype=np.int16)
    close(float(f(pulse, 1000, 100)[0]), 0.5 * 30000 / 32768, 'RMS — корень из среднего квадрата, а не средний модуль: для сигнала [0, 0, 0, 30000, …] RMS = {expected}, а у вас {actual}.')
    const = np.full(1000, 16384, dtype=np.int16)
    got = np.asarray(f(const, 1000, 100))
    equal(got.shape, (10,), '1000 отсчётов при 1000 Гц по 100 мс — 10 кадров, а у вас форма {actual}.')
    same_array(got, np.full(10, 0.5), 'Постоянный сигнал 16384 — это 0.5 от предела: RMS каждого кадра 0.5.')
    tail = np.ones(1050, dtype=np.int16)
    equal(len(f(tail, 1000, 100)), 10, 'Неполный последний кадр (50 отсчётов) отбрасывается: кадров 10, а у вас {actual}.')
    same_array(np.asarray(var('rms')), ref('rms'), 'RMS кадров записи не совпадает с ожидаемым.')
    close(var('noise', 'number', 'числом'), ref('noise'), 'Медиана RMS — {expected}, а у вас {actual}.')
  files: [recording.wav]
  wrong:
    - code: |
        def frame_rms(samples, rate, frame_ms=20):
            x = samples / 32768
            frame = int(rate * frame_ms / 1000)
            k = len(x) // frame
            return np.sqrt((samples[:k * frame].reshape(k, frame) ** 2).mean(axis=1)) / 32768
        rms = frame_rms(samples, rate)
        noise = float(np.median(rms))
      expect: в float
    - code: |
        def frame_rms(samples, rate, frame_ms=20):
            x = samples.astype(np.float64) / 32768
            frame = int(rate * frame_ms / 1000)
            k = len(x) // frame
            return np.abs(x[:k * frame].reshape(k, frame)).mean(axis=1)
        rms = frame_rms(samples, rate)
        noise = float(np.median(rms))
      expect: корень из среднего квадрата

- id: m11-l8-t3
  title: Обрезать тишину
  difficulty: main
  introduces: []
  uses: [digital-audio]
  statement: |
    1. Напишите функцию `speech_bounds(rms, frame_s, ratio=0.1)`: начало и конец речи в секундах — от начала первого кадра до конца последнего кадра, у которых RMS не меньше `ratio` от максимального. Кадр длится `frame_s` секунд. Если вся запись — нули (максимум 0), функция возвращает `None`.
    2. Напишите функцию `trim(samples, rate, bounds, margin=0.1)`: отсчёты от `bounds[0] - margin` до `bounds[1] + margin` секунд, но не за пределами записи.

    Получите `bounds` для записи, `trimmed` — обрезанную запись и `saved` — долю отсчётов, которую не придётся отправлять в сервис распознавания (`1 - len(trimmed) / len(samples)`).
  prelude: |
    import wave
    import numpy as np
    with wave.open('recording.wav') as w:
        rate = w.getframerate()
        samples = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16)
    x = samples.astype(np.float64) / 32768
    frame = int(rate * 0.02)
    k = len(x) // frame
    rms = np.sqrt((x[:k * frame].reshape(k, frame) ** 2).mean(axis=1))
  starter: |
    def speech_bounds(rms, frame_s, ratio=0.1):
        if rms.max() == 0:
            return None
        loud = np.nonzero(rms >= ratio * rms.max())[0]
        return ...

    def trim(samples, rate, bounds, margin=0.1):
        start = max(int(round((bounds[0] - margin) * rate)), 0)
        end = ...
        return samples[start:end]

    bounds = speech_bounds(rms, 0.02)
    trimmed = trim(samples, rate, bounds)
    saved = 1 - len(trimmed) / len(samples)
    print(bounds, len(trimmed) / rate, round(saved, 3))
  solution: |
    def speech_bounds(rms, frame_s, ratio=0.1):
        if rms.max() == 0:
            return None
        loud = np.nonzero(rms >= ratio * rms.max())[0]
        return loud[0] * frame_s, (loud[-1] + 1) * frame_s

    def trim(samples, rate, bounds, margin=0.1):
        start = max(int(round((bounds[0] - margin) * rate)), 0)
        end = min(int(round((bounds[1] + margin) * rate)), len(samples))
        return samples[start:end]

    bounds = speech_bounds(rms, 0.02)
    trimmed = trim(samples, rate, bounds)
    saved = 1 - len(trimmed) / len(samples)
    print(bounds, len(trimmed) / rate, round(saved, 3))
  explanation: |
    - Конец речи — конец последнего громкого кадра: `(номер + 1) × длительность кадра`. Без `+ 1` обрезался бы последний кусочек слова.
    - Запас `margin` по 0,1 с с каждой стороны сохраняет тихие начала и концы слов: первые и последние звуки бывают тише порога.
    - `max(…, 0)` и `min(…, len(samples))` не дают выйти за пределы записи, если речь у самого края.
    - Речь — от 1,26 до 2,70 с; с запасом остаётся 1,64 с из 3,42 — отправлять придётся вдвое меньше. Для длинных записей с паузами экономия ещё больше.
  hints:
    - "Границы — `loud[0] * frame_s` и `(loud[-1] + 1) * frame_s`."
    - "Конец обрезки — `min(int(round((bounds[1] + margin) * rate)), len(samples))`."
    - "Экономия — `1 - len(trimmed) / len(samples)`."
  tests: |
    import numpy as np
    sb = var('speech_bounds')
    tr = var('trim')
    ensure(callable(sb) and callable(tr), '`speech_bounds` и `trim` должны быть функциями.')
    r = np.array([0.0, 0.01, 0.5, 1.0, 0.3, 0.05, 0.0])
    got = sb(r, 0.1)
    ensure(got is not None, 'Для ненулевой записи границы не могут быть None.')
    if abs(got[1] - 0.4) < 1e-9:
        fail('Конец речи — конец последнего громкого кадра: (номер + 1) × длительность кадра. Для кадров 2–4 по 0.1 с это 0.5 с, а у вас 0.4.')
    close(float(got[0]), 0.2, 'Начало речи — начало первого громкого кадра (кадр 2 по 0.1 с = 0.2 с), а у вас {actual}.')
    close(float(got[1]), 0.5, 'Конец речи — {expected}, а у вас {actual}.')
    close(float(sb(r, 0.1, ratio=0.01)[0]), 0.1, 'При ratio=0.01 громким считается и кадр 1 (0.01): начало 0.1 с, а у вас {actual}.')
    equal(sb(np.zeros(5), 0.1), None, 'Если вся запись — тишина (максимум 0), нужен None.')
    s = np.arange(100)
    equal(list(tr(s, 10, (2.0, 5.0), margin=1.0)), list(range(10, 60)), 'Обрезка 10-Гц записи по (2, 5) с запасом 1 с — отсчёты 10…59, а у вас другие.')
    equal(len(tr(s, 10, (0.5, 9.9), margin=1.0)), 100, 'Обрезка не выходит за пределы записи: если речь у краёв, остаётся вся запись.')
    b = var('bounds')
    ensure(abs(float(b[0]) - float(ref('bounds')[0])) < 1e-9 and abs(float(b[1]) - float(ref('bounds')[1])) < 1e-9, 'Границы речи в записи — {0}, а у вас {1}.'.format(ref('bounds'), b))
    equal(len(var('trimmed')), len(ref('trimmed')), 'В обрезанной записи {expected} отсчётов, а у вас {actual}.')
    close(var('saved', 'number', 'числом'), ref('saved'), 'Доля сэкономленных отсчётов — {expected}, а у вас {actual}.')
  files: [recording.wav]
  wrong:
