  solution: |
    def for_speech(text, max_chars):
        sentences = re.split(r'(?<=[.!?])\s+', text.strip())
        out = ''
        for s in sentences:
            candidate = s if not out else out + ' ' + s
            if len(candidate) > max_chars:
                break
            out = candidate
        if not out:
            cut = text[:max_chars - 1]
            out = (cut[:cut.rfind(' ')] if ' ' in cut else cut) + '…'
        return out

    def voice_turn(stt_response, chat, max_chars=120):
        heard = parse_stt(stt_response)
        if not heard['ok'] or not heard['text']:
            return 'Не расслышал. Повторите, пожалуйста.'
        return for_speech(chat.conversation_predict(heard['text']), max_chars)

    replies = [voice_turn(t, chat, max_chars=60) for t in turns]
    for r in replies:
        print(r)
    print('сообщений в истории:', len(chat.history))
  explanation: |
    - Бот переспрашивает, не обращаясь к модели: ни ошибка сервиса, ни пустая фраза не попадают в историю. Поэтому второй настоящий вопрос («Просто удивительно.») ушёл модели с той же историей, что в ноутбуке, — и учебная версия GigaChat нашла записанный ответ.
    - Из ответа «Нормально удивлён? Или есть конкретная причина удивления? Расскажи подробнее.» в 60 символов поместились два первых предложения. Синтез речи получает короткий текст — его быстрее озвучить и легче слушать.
    - Обрезка по пробелу не режет слово пополам, а «…» честно показывает, что текст не весь.
  hints:
    - "Переспрос — если `not heard['ok'] or not heard['text']`."
    - "Обрезка первого предложения — `cut[:cut.rfind(' ')]` и `'…'` в конце."
    - "Проверьте себя: в истории чата после всех ходов — 4 сообщения, по два на каждый настоящий вопрос."
  tests: |
    f = var('voice_turn')
    ensure(callable(f), '`voice_turn` должна быть функцией.')
    class FakeChat:
        def __init__(self, answer):
            self.answer, self.asked = answer, []
        def conversation_predict(self, text):
            self.asked.append(text)
            return self.answer
    c = FakeChat('Первое предложение. Второе предложение! Третье?')
    equal(f('Ошибка: 500', c), 'Не расслышал. Повторите, пожалуйста.', 'При ошибке распознавания бот переспрашивает: ожидалось {expected}, а у вас {actual}.')
    equal(f({'status': 200, 'result': ['  '], 'emotions': [{}]}, c), 'Не расслышал. Повторите, пожалуйста.', 'Пустой распознанный текст — тоже переспрос.')
    if c.asked:
        fail('При ошибке или пустом тексте модель не вызывается, а у вас её спросили: {0}.'.format(c.asked))
    ok = {'status': 200, 'result': ['Привет', 'бот'], 'emotions': [{}, {}]}
    equal(f(ok, c, max_chars=200), 'Первое предложение. Второе предложение! Третье?', 'Ответ короче max_chars — целиком: ожидалось {expected}, а у вас {actual}.')
    equal(c.asked, ['Привет бот'], 'Модель получает распознанный текст: {expected}, а у вас {actual}.')
    equal(f(ok, c, max_chars=45), 'Первое предложение. Второе предложение!', 'В 45 символов помещаются два целых предложения: ожидалось {expected}, а у вас {actual}.')
    c2 = FakeChat('Очень длинное первое предложение без точки до самого конца строки.')
    got = f(ok, c2, max_chars=20)
    ensure(got.endswith('…') and len(got) <= 20, 'Если не помещается даже первое предложение, обрезайте по пробелу и ставьте «…» (не длиннее max_chars), а у вас {0!r}.'.format(got))
    equal(got, 'Очень длинное…', 'Обрезка первого предложения в 20 символов: ожидалось {expected}, а у вас {actual}.')
    equal(var('replies', list, 'списком'), ref('replies'), 'Ответы бота — {expected}, а у вас {actual}.')
