  statement: |
    Соберите текстовую середину голосового бота — функцию `voice_turn(stt_response, chat, max_chars=120)`. Функция `parse_stt` из прошлого задания уже есть, `chat` — объект с методом `conversation_predict(text)`, как `AudioChat` в уроке.

    1. Ответ распознавания разбирается `parse_stt`. Если он неуспешный или текст пустой, бот возвращает `'Не расслышал. Повторите, пожалуйста.'` и **не** обращается к модели.
    2. Иначе ответ модели — `chat.conversation_predict(text)`.
    3. Ответ готовится к озвучиванию: длинный текст в синтез речи не отправляют. Оставьте столько **целых предложений** с начала, сколько помещается в `max_chars` (предложения разделяются как `re.split(r'(?<=[.!?])\s+', текст)`, между ними пробел). Если не помещается даже первое предложение, обрежьте его по последнему пробелу не дальше `max_chars - 1` символов и добавьте `'…'`.

