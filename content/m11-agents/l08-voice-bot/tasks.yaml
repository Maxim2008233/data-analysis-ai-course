        def speech_bounds(rms, frame_s, ratio=0.1):
            if rms.max() == 0:
                return None
            loud = np.nonzero(rms >= ratio * rms.max())[0]
            return loud[0] * frame_s, loud[-1] * frame_s
        def trim(samples, rate, bounds, margin=0.1):
            start = max(int(round((bounds[0] - margin) * rate)), 0)
            end = min(int(round((bounds[1] + margin) * rate)), len(samples))
            return samples[start:end]
        bounds = speech_bounds(rms, 0.02)
        trimmed = trim(samples, rate, bounds)
        saved = 1 - len(trimmed) / len(samples)
      expect: конец последнего громкого кадра
    - code: |
