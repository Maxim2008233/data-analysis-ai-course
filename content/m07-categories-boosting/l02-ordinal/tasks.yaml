    - "Маску удобно сделать массивом (`.to_numpy()`), чтобы фильтровать и `y_valid`, и `pred`."
    - "Доля `Rare` — среднее маски `X_valid.loc[unknown, 'Make'] == 'Rare'`."
  tests: |
