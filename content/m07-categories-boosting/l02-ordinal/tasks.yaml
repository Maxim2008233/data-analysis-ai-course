    close(var('mae_known', 'number', 'числом'), ref('mae_known'), 'MAE на остальных — {expected}, а у вас {actual}.')
    close(var('rare_make_share', 'number', 'числом'), ref('rare_make_share'), 'Доля марки Rare среди незнакомых — {expected}, а у вас {actual}.')
