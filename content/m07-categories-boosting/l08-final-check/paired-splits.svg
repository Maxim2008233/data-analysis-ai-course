<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Парное сравнение на 10 разбиениях. Для каждого разбиения две точки: MAE LightGBM без логарифма — от 1 880 до 2 000 евро и с логарифмом — от 1 782 до 1 955 евро. Диапазоны перекрываются, но в каждой паре модель с логарифмом левее, то есть точнее, на 43–138 евро">
  <text x="12" y="22" fill="currentColor" font-weight="700">LightGBM без логарифма и с ним: MAE на 10 разбиениях train + validation</text>
  <circle cx="20" cy="40" r="5" fill="#3d5bd9"/><text x="30" y="44" fill="currentColor">без логарифма</text>
  <circle cx="140" cy="40" r="5" fill="#c2410c"/><text x="150" y="44" fill="currentColor">на log(цены)</text>
  <text x="620" y="44" fill="currentColor" fill-opacity="0.85" font-weight="700">разница</text>
  <line x1="156.9" y1="54" x2="156.9" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="156.9" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1 780</text>
  <line x1="230.8" y1="54" x2="230.8" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="230.8" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1 820</text>
  <line x1="304.6" y1="54" x2="304.6" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="304.6" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1 860</text>
  <line x1="378.5" y1="54" x2="378.5" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="378.5" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1 900</text>
  <line x1="452.3" y1="54" x2="452.3" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="452.3" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1 940</text>
  <line x1="526.2" y1="54" x2="526.2" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="526.2" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1 980</text>
  <line x1="600.0" y1="54" x2="600.0" y2="290" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="600.0" y="308" fill="currentColor" fill-opacity="0.75" text-anchor="middle">2 020</text>
  <text x="360" y="328" fill="currentColor" fill-opacity="0.85" text-anchor="middle">MAE на проверочной части, евро</text>
  <text x="12" y="68" fill="currentColor" fill-opacity="0.85">разбиение 1</text>
  <line x1="189.9" y1="64" x2="347.0" y2="64" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="347.0" cy="64" r="5" fill="#3d5bd9"/>
  <circle cx="189.9" cy="64" r="5" fill="#c2410c"/>
  <text x="620" y="68" fill="currentColor">−85 евро</text>
  <text x="12" y="92" fill="currentColor" fill-opacity="0.85">разбиение 2</text>
  <line x1="195.2" y1="88" x2="443.0" y2="88" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="443.0" cy="88" r="5" fill="#3d5bd9"/>
  <circle cx="195.2" cy="88" r="5" fill="#c2410c"/>
  <text x="620" y="92" fill="currentColor">−134 евро</text>
  <text x="12" y="116" fill="currentColor" fill-opacity="0.85">разбиение 3</text>
  <line x1="160.6" y1="112" x2="342.2" y2="112" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="342.2" cy="112" r="5" fill="#3d5bd9"/>
  <circle cx="160.6" cy="112" r="5" fill="#c2410c"/>
  <text x="620" y="116" fill="currentColor">−98 евро</text>
  <text x="12" y="140" fill="currentColor" fill-opacity="0.85">разбиение 4</text>
  <line x1="301.1" y1="136" x2="459.0" y2="136" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="459.0" cy="136" r="5" fill="#3d5bd9"/>
  <circle cx="301.1" cy="136" r="5" fill="#c2410c"/>
  <text x="620" y="140" fill="currentColor">−86 евро</text>
  <text x="12" y="164" fill="currentColor" fill-opacity="0.85">разбиение 5</text>
  <line x1="409.4" y1="160" x2="488.3" y2="160" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="488.3" cy="160" r="5" fill="#3d5bd9"/>
  <circle cx="409.4" cy="160" r="5" fill="#c2410c"/>
  <text x="620" y="164" fill="currentColor">−43 евро</text>
  <text x="12" y="188" fill="currentColor" fill-opacity="0.85">разбиение 6</text>
  <line x1="334.5" y1="184" x2="485.2" y2="184" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="485.2" cy="184" r="5" fill="#3d5bd9"/>
  <circle cx="334.5" cy="184" r="5" fill="#c2410c"/>
  <text x="620" y="188" fill="currentColor">−82 евро</text>
  <text x="12" y="212" fill="currentColor" fill-opacity="0.85">разбиение 7</text>
  <line x1="258.7" y1="208" x2="514.3" y2="208" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="514.3" cy="208" r="5" fill="#3d5bd9"/>
  <circle cx="258.7" cy="208" r="5" fill="#c2410c"/>
  <text x="620" y="212" fill="currentColor">−138 евро</text>
  <text x="12" y="236" fill="currentColor" fill-opacity="0.85">разбиение 8</text>
  <line x1="479.3" y1="232" x2="563.2" y2="232" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="563.2" cy="232" r="5" fill="#3d5bd9"/>
  <circle cx="479.3" cy="232" r="5" fill="#c2410c"/>
  <text x="620" y="236" fill="currentColor">−45 евро</text>
  <text x="12" y="260" fill="currentColor" fill-opacity="0.85">разбиение 9</text>
  <line x1="434.0" y1="256" x2="546.6" y2="256" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="546.6" cy="256" r="5" fill="#3d5bd9"/>
  <circle cx="434.0" cy="256" r="5" fill="#c2410c"/>
  <text x="620" y="260" fill="currentColor">−61 евро</text>
  <text x="12" y="284" fill="currentColor" fill-opacity="0.85">разбиение 10</text>
  <line x1="391.2" y1="280" x2="496.8" y2="280" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="496.8" cy="280" r="5" fill="#3d5bd9"/>
  <circle cx="391.2" cy="280" r="5" fill="#c2410c"/>
  <text x="620" y="284" fill="currentColor">−57 евро</text>
  <text x="12" y="356" fill="currentColor" fill-opacity="0.85">MAE каждой модели меняется от разбиения к разбиению на 120–170 евро, и диапазоны перекрываются.</text>
  <text x="12" y="376" fill="currentColor" fill-opacity="0.85">Но в каждой паре (одни и те же машины) модель на log(цены) точнее — это устойчивое преимущество.</text>
</svg>
