  <text x="368.0" y="131.8" fill="#0f766e" font-weight="700">57 %</text>
  <polyline points="78.0,52.0 172.0,64.8 266.0,141.8 360.0,231.8 454.0,249.8 548.0,251.8" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <circle cx="78.0" cy="52.0" r="3.5" fill="#c2410c"/>
  <circle cx="172.0" cy="64.8" r="3.5" fill="#c2410c"/>
  <circle cx="266.0" cy="141.8" r="3.5" fill="#c2410c"/>
  <circle cx="360.0" cy="231.8" r="3.5" fill="#c2410c"/>
  <circle cx="454.0" cy="249.8" r="3.5" fill="#c2410c"/>
  <circle cx="548.0" cy="251.8" r="3.5" fill="#c2410c"/>
  <text x="368.0" y="224.8" fill="#c2410c" font-weight="700">10 %</text>
  <text x="558" y="116.4" fill="currentColor">Год — все 19 239 машин</text>
  <text x="558" y="223.6" fill="currentColor">BMW — 1 544 машины</text>
  <text x="558" y="247.0" fill="currentColor">Kia Clarus — 1 машина</text>
</svg>
