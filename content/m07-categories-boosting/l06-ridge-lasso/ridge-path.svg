  <circle cx="172.0" cy="52.4" r="3.5" fill="#3d5bd9"/>
  <circle cx="266.0" cy="57.4" r="3.5" fill="#3d5bd9"/>
  <circle cx="360.0" cy="74.6" r="3.5" fill="#3d5bd9"/>
  <circle cx="454.0" cy="92.2" r="3.5" fill="#3d5bd9"/>
  <circle cx="548.0" cy="112.4" r="3.5" fill="#3d5bd9"/>
  <text x="368.0" y="67.6" fill="#3d5bd9" font-weight="700">89 %</text>
  <polyline points="78.0,52.0 172.0,62.8 266.0,84.4 360.0,138.8 454.0,194.4 548.0,228.6" fill="none" stroke="#0f766e" stroke-width="2.5"/>
