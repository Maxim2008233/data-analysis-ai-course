<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="График: как Ridge сжимает коэффициенты при росте альфа от 0,01 до 1000. Коэффициент года выпуска, за которым стоят все машины, к альфа 10 сохраняет 89 процентов величины, коэффициент марки BMW — 57 процентов, а коэффициент модели Kia Clarus, у которой в train одна машина, — 10 процентов">
  <text x="12" y="24" fill="currentColor" font-weight="700">Ridge: какая доля коэффициента остаётся с ростом α (за 100 % взят коэффициент при α = 0,01)</text>
  <line x1="78" y1="52.0" x2="548" y2="52.0" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="70" y="56.0" fill="currentColor" fill-opacity="0.75" text-anchor="end">100 %</text>
  <line x1="78" y1="102.0" x2="548" y2="102.0" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="70" y="106.0" fill="currentColor" fill-opacity="0.75" text-anchor="end">75 %</text>
  <line x1="78" y1="152.0" x2="548" y2="152.0" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="70" y="156.0" fill="currentColor" fill-opacity="0.75" text-anchor="end">50 %</text>
  <line x1="78" y1="202.0" x2="548" y2="202.0" stroke="currentColor" stroke-opacity="0.12"/>
  <text x="70" y="206.0" fill="currentColor" fill-opacity="0.75" text-anchor="end">25 %</text>
  <line x1="78" y1="252.0" x2="548" y2="252.0" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="70" y="256.0" fill="currentColor" fill-opacity="0.75" text-anchor="end">0</text>
  <line x1="78.0" y1="252" x2="78.0" y2="257" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="78.0" y="271" fill="currentColor" fill-opacity="0.75" text-anchor="middle">0,01</text>
  <line x1="172.0" y1="252" x2="172.0" y2="257" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="172.0" y="271" fill="currentColor" fill-opacity="0.75" text-anchor="middle">0,1</text>
  <line x1="266.0" y1="252" x2="266.0" y2="257" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="266.0" y="271" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1</text>
  <line x1="360.0" y1="252" x2="360.0" y2="257" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="360.0" y="271" fill="currentColor" fill-opacity="0.75" text-anchor="middle">10</text>
  <line x1="454.0" y1="252" x2="454.0" y2="257" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="454.0" y="271" fill="currentColor" fill-opacity="0.75" text-anchor="middle">100</text>
  <line x1="548.0" y1="252" x2="548.0" y2="257" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="548.0" y="271" fill="currentColor" fill-opacity="0.75" text-anchor="middle">1000</text>
  <text x="313" y="292" fill="currentColor" fill-opacity="0.85" text-anchor="middle">α (шаг по оси — в 10 раз)</text>
  <line x1="360.0" y1="44" x2="360.0" y2="252" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <text x="366.0" y="42" fill="currentColor" fill-opacity="0.8">α = 10</text>
  <polyline points="78.0,52.0 172.0,52.4 266.0,57.4 360.0,74.6 454.0,92.2 548.0,112.4" fill="none" stroke="#3d5bd9" stroke-width="2.5"/>
