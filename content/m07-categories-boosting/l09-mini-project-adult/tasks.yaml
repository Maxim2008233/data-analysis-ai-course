    print(best_alpha, round(ridge_gain, 4), ridge_needed)
  solution: |
    result = {}
    for a in alphas:
        pipe = Pipeline([('enc', make_enc()), ('model', Ridge(alpha=a))]).fit(X_train, y_train)
        result[a] = mean_absolute_error(y_valid, pipe.predict(X_valid))
    alpha_mae = pd.Series(result)
    best_alpha = alpha_mae.idxmin()
    ridge_gain = mae_linear - alpha_mae.min()
    ridge_needed = bool(ridge_gain > 0.05)
    print(alpha_mae.round(3))
    print(best_alpha, round(ridge_gain, 4), ridge_needed)
