    - Почему не так, как на машинах (урок 7.6)? Там было 770 столбцов и сотни моделей с одной-двумя машинами. Здесь 90 столбцов на 19 521 человека, и почти все категории хорошо наполнены. Коэффициентам не на чем переобучаться — линейная модель и так не переобучается.
    - Вывод проекта: регуляризация — средство от конкретной беды (много столбцов, мало данных на столбец). Применять её «на всякий случай» незачем, и проверка на validation это показывает.
