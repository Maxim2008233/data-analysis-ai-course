  statement: |
    Сформулируйте выводы проекта.
  quiz:
    - q: Почему одно семейное положение снизило ошибку с 11,1 до 8,6 года, а все признаки в линейной модели — только до 8,2?
      options:
        - Возраст сильнее всего связан с семейным положением; остальные признаки добавляют немного, особенно линейно
        - Линейная модель обучена неправильно
        - Оценка по группе всегда лучше модели
      answer: 0
      explain: "«Никогда не был в браке» — в основном молодые, «вдовец» — пожилые. В LightGBM на семейное положение приходится почти половина важности признаков."
    - q: Почему Ridge здесь не помог, хотя на машинах помогал?
      options:
        - Столбцов 90 на 19 521 человека, категории наполнены — коэффициентам не на чем переобучаться
        - Ridge не работает с One-Hot
        - Неправильно выбрано α
      answer: 0
      explain: Регуляризация лечит много столбцов при малом числе записей на столбец. Здесь линейная модель и без неё не переобучается.
    - q: "LightGBM с `objective='l1'` лучше обычного всего на 0,06 года. Почему этот выбор оправдан?"
      options:
        - Метрика проекта — MAE, и на повторных разбиениях `l1` выигрывает во всех случаях
        - Потому что разница положительная
        - Потому что на test он лучше
      answer: 0
      explain: Маленькая, но устойчивая разница в нужной метрике — честное основание. Test для выбора не используют.
    - q: Какую фразу стоит записать в отчёт?
      options:
        - "«Модель ошибается в среднем на 7,4 года; у половины людей — меньше чем на 5,7 года»"
        - "«Лучшая MAE на validation — 7,53 года»"
        - "«Модель угадывает возраст»"
      answer: 0
      explain: Итог — по test, который не участвовал в выборе, и лучше вместе с квантилями ошибок, а не одним средним.
  hints:
    - Вспомните важность признаков, размер данных и то, для чего нужен test.
    - "Сильный признак — семейное положение; регуляризация нужна при многих столбцах; test — только для итога."
    - "Ответы: первый вариант во всех четырёх вопросах."
