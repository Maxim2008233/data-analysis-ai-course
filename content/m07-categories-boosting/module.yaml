title: "Категориальные признаки, Ridge и градиентный бустинг"
short: Категории и бустинг
firstLessonIndex: 0
description: >-
  Добавляем в модели всё, что известно о машине: марку, модель, кузов, топливо и коробку передач. Модели нужны
  числа, поэтому учимся кодировать категории: бинарный признак, порядковые коды для деревьев, One-Hot для линейной
  модели, Target Encoding и его утечка. Регуляризация Ridge и Lasso сдерживает коэффициенты редких категорий,
  градиентный бустинг (scikit-learn и LightGBM) последовательно исправляет ошибки деревьев. В конце — итоговая проверка
  на test, разброс метрик по разбиениям и ошибки по отдельным машинам. Мини-проект — новые данные: восстанавливаем
  возраст по ответам анкеты переписи Adult, где почти все признаки категориальные.
