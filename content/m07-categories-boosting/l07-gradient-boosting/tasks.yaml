    def as_category(table):
        out = table.copy()
        for c in cat_cols:
            cats = sorted(X_train[c].unique())
            out[c] = pd.Categorical(out[c].where(out[c].isin(cats)), categories=cats)
        return out

    C_train, C_valid = as_category(X_train), as_category(X_valid)
    native = LGBMRegressor(n_estimators=100, learning_rate=0.1, random_state=42, verbosity=-1, n_jobs=1).fit(C_train, y_train)
    mae_native = mean_absolute_error(y_valid, native.predict(C_valid))
    codes = LGBMRegressor(n_estimators=100, learning_rate=0.1, random_state=42, verbosity=-1, n_jobs=1).fit(Z_train, y_train)
    mae_codes = mean_absolute_error(y_valid, codes.predict(Z_valid))
    n_missing = C_valid['Model'].isna().sum()
    print(round(mae_native), round(mae_codes), n_missing)
  explanation: |
    - С категориями как есть LightGBM ошибается на 1 936 евро, с порядковыми кодами — на 2 101. Он сам упорядочивает модели машин по средней поправке, а не по алфавиту, и находит удачные группы в каждом разбиении.
    - 46 машин validation — моделей, которых в train нет. Они становятся пропусками и идут по ветке, которую LightGBM выучил для пропусков.
    - Категории берём только из train: это тот же «словарь», что у кодировщиков в Pipeline. `pd.Categorical(..., categories=cats)` сам превращает значения не из списка в пропуски; `where(isin(...))` делает это явно.
