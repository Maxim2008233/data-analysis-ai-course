  solution: |
    rows = {}
    for loss in ['squared_error', 'absolute_error']:
        hgb = HistGradientBoostingRegressor(loss=loss, max_iter=300, learning_rate=0.1, early_stopping=False, random_state=42)
        pred = hgb.fit(Z_train, y_train).predict(Z_valid)
        rows[loss] = {'MAE': mean_absolute_error(y_valid, pred),
                      'RMSE': root_mean_squared_error(y_valid, pred),
                      'медиана ошибки': np.median(pred - y_valid)}
    losses = pd.DataFrame(rows).T
    gain = losses.loc['squared_error', 'MAE'] - losses.loc['absolute_error', 'MAE']
    print(losses.round(1))
    print(round(gain, 1))
  explanation: |
    - С `absolute_error` MAE 1 883 против 2 049 — на 166 евро меньше, а RMSE почти та же (4 507 и 4 509). Модель, которая учится под нужную метрику, по этой метрике и лучше.
    - Медиана ошибки у `absolute_error` ≈ 0: такая модель прогнозирует медиану цены похожих машин, а не среднее. Цены с длинным правым хвостом тянут среднее вверх, поэтому квадратичная модель в типичном случае немного завышает (медиана ошибки +92).
    - Деревья для абсолютной ошибки учатся на **знаке** остатка: «прогноз мал» или «прогноз велик». Поэтому дорогие машины с огромными остатками не перетягивают модель на себя.
  hints:
    - "RMSE — `root_mean_squared_error(y_valid, pred)`; медиана ошибки — `np.median(pred - y_valid)`."
    - "Индекс таблицы получится из ключей словаря `rows`: `pd.DataFrame(rows).T`."
    - "`gain = losses.loc['squared_error', 'MAE'] - losses.loc['absolute_error', 'MAE']`."
  tests: |
