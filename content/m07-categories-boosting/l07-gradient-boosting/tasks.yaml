- id: m7-l7-t4
  title: "LightGBM: категории без кодирования"
  difficulty: main
  introduces: [gradient-boosting]
  uses: [ordinal-encoding]
  statement: |
    Напишите функцию `as_category(table)`. Она возвращает копию таблицы, в которой четыре колонки `cat_cols` имеют тип `category` с категориями из **train** — `sorted(X_train[c].unique())`, а значения, которых в train нет, становятся пропусками.

    Обучите `LGBMRegressor(n_estimators=100, learning_rate=0.1, random_state=42, verbosity=-1, n_jobs=1)` на `as_category(X_train)` и получите `mae_native` — MAE на validation. Такую же модель обучите на порядковых кодах `Z_train` — это `mae_codes`. `n_missing` — у скольких машин validation после `as_category` пропуск в `Model`.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.model_selection import train_test_split
    from sklearn.preprocessing import OrdinalEncoder
    from sklearn.compose import ColumnTransformer
    from sklearn.metrics import mean_absolute_error
    from lightgbm import LGBMRegressor
    df = pd.read_csv('cars_processed.csv')
    cat_cols = ['Make', 'Model', 'Style', 'Fuel_type']
