    import pandas as pd
    t = var('losses', pd.DataFrame, 'таблицей DataFrame')
    rt = ref('losses')
    ensure(list(t.index) == ['squared_error', 'absolute_error'], 'Индекс `losses` — `[\'squared_error\', \'absolute_error\']`.')
    ensure(list(t.columns) == ['MAE', 'RMSE', 'медиана ошибки'], 'Колонки `losses` — `[\'MAE\', \'RMSE\', \'медиана ошибки\']`.')
    same_array(t['MAE'].to_numpy(dtype=float), rt['MAE'].to_numpy(dtype=float), 'MAE не совпадают.', rtol=1e-6)
    same_array(t['RMSE'].to_numpy(dtype=float), rt['RMSE'].to_numpy(dtype=float), 'RMSE не совпадают: `root_mean_squared_error(y_valid, pred)`.', rtol=1e-6)
    med = t['медиана ошибки'].to_numpy(dtype=float)
    rmed = rt['медиана ошибки'].to_numpy(dtype=float)
    if np.allclose(med, -rmed, atol=1e-6) and not np.allclose(med, rmed, atol=1e-6):
        fail('Ошибка — это прогноз минус цена: `np.median(pred - y_valid)`, а у вас знак наоборот.')
    same_array(med, rmed, 'Медиана ошибки не совпадает: `np.median(pred - y_valid)`.', atol=1e-6)
    close(var('gain', 'number', 'числом'), ref('gain'), '`gain` — {expected}, а у вас {actual}: MAE squared_error минус MAE absolute_error.', rtol=1e-5)
    close(alt('gain'), alt_ref('gain'), HARDCODE_MSG, rtol=1e-5)
