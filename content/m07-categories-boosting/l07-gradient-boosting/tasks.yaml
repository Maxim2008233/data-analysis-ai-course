- id: m7-l7-t5
  title: Бустинг под метрику MAE
  difficulty: star
  introduces: [gradient-boosting]
  uses: [regression-metrics]
  statement: |
    Мы сравниваем модели по MAE, а бустинг по умолчанию минимизирует квадратичную ошибку. Но бустинг может учиться под другую функцию ошибки: деревья тогда учатся на её антиградиенте. Для абсолютной ошибки это просто знак остатка.

    Обучите два `HistGradientBoostingRegressor(max_iter=300, learning_rate=0.1, early_stopping=False, random_state=42)` — с `loss='squared_error'` и с `loss='absolute_error'`. Соберите `losses` — DataFrame с индексом `['squared_error', 'absolute_error']` и колонками `'MAE'`, `'RMSE'` и `'медиана ошибки'` (медиана разности «прогноз − цена» на validation). `gain` — на сколько евро MAE у `absolute_error` меньше.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.model_selection import train_test_split
    from sklearn.preprocessing import OrdinalEncoder
