  solution: |
    codes = pd.Series(np.nan, index=X_train.index)
    folds = KFold(n_splits=5, shuffle=True, random_state=42)
    for rest_idx, block_idx in folds.split(X_train):
        rest_model = X_train['Model'].iloc[rest_idx]
        rest_price = y_train.iloc[rest_idx]
        g = rest_price.mean()
        stats = rest_price.groupby(rest_model).agg(['sum', 'count'])
        enc = (stats['sum'] + m * g) / (stats['count'] + m)
        codes.iloc[block_idx] = X_train['Model'].iloc[block_idx].map(enc).fillna(g).to_numpy()

    sk_codes = TargetEncoder(target_type='continuous', cv=5, random_state=42, smooth=m).fit_transform(X_train[['Model']], y_train).ravel()
    max_diff = np.abs(codes.to_numpy() - sk_codes).max()
    print(max_diff)
    print(codes[X_train['Model'] == 'Clarus'].round(1))
  explanation: |
    - Расхождение порядка 1e-11 — это погрешность вычислений: TargetEncoder устроен именно так. Внутри он делит train тем же `KFold(5, shuffle=True)` с тем же `random_state`.
    - У единственной Clarus код 9 533,7 — общее среднее остальных строк: в них Clarus нет. Её цена (100 000) в её код не попала.
    - Если считать средние по всему train, код Clarus был бы ≈ 13 880: цена машины проникла бы в её собственный признак, пусть и ослабленная сглаживанием.
    - `.to_numpy()` при записи в `codes.iloc[...]` нужен, чтобы pandas не пытался выравнивать индексы.
  hints:
