    - Перекрёстные коды: на train ≈ 2 626, на validation ≈ 2 519. Разрыва нет, на train коды даже чуть хуже: они посчитаны по четырём пятым train. Модель видит признак таким, каким он будет на новых данных.
    - Validation-коды у обоих способов почти одинаковы: средние по train. Различается только то, что видит модель при обучении, а от этого зависит, насколько она доверится признаку.
