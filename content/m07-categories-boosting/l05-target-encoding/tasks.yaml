    Результат — `codes`, Series с индексом `X_train`. Сравните его с `TargetEncoder(target_type='continuous', cv=5, random_state=42, smooth=m)`: `max_diff` — наибольшее по модулю расхождение.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.model_selection import train_test_split, KFold
