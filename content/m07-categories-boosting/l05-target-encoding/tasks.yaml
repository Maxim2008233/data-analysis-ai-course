    - "Коды блока — `X_train['Model'].iloc[block_idx].map(enc).fillna(g).to_numpy()`."
    - "`TargetEncoder(target_type='continuous', cv=5, random_state=42, smooth=m)`; `max_diff = np.abs(codes.to_numpy() - sk_codes).max()`."
