<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Жизненный цикл модели в scikit-learn: создать объект с настройками, обучить методом fit на обучающих признаках и ответах — модель запоминает найденное в атрибутах с подчёркиванием, затем получить прогнозы методом predict только по признакам новых объектов">
  <defs><marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.6"/></marker></defs>
  <g fill="#3d5bd9" fill-opacity="0.08" stroke="#3d5bd9" stroke-opacity="0.55">
    <rect x="12" y="20" width="212" height="88" rx="10"/><rect x="274" y="20" width="212" height="88" rx="10"/><rect x="536" y="20" width="212" height="88" rx="10"/>
  </g>
  <path d="M226 64 L270 64" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fa)"/>
  <path d="M488 64 L532 64" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fa)"/>
  <g fill="currentColor">
    <text x="118" y="44" text-anchor="middle" font-weight="700">1. Создать</text>
    <text x="118" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3d5bd9">DummyRegressor(</text>
    <text x="118" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3d5bd9">strategy='median')</text>
    <text x="118" y="100" text-anchor="middle" font-size="11" fill-opacity="0.75">данные ещё не нужны</text>
    <text x="380" y="44" text-anchor="middle" font-weight="700">2. Обучить</text>
    <text x="380" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3d5bd9">model.fit(X_train, y_train)</text>
    <text x="380" y="86" text-anchor="middle" font-size="11" fill-opacity="0.75">признаки и ответы обучения</text>
    <text x="380" y="100" text-anchor="middle" font-size="11" fill-opacity="0.75">→ атрибуты с «_»: constant_</text>
    <text x="642" y="44" text-anchor="middle" font-weight="700">3. Прогноз</text>
    <text x="642" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3d5bd9">model.predict(X_valid)</text>
    <text x="642" y="86" text-anchor="middle" font-size="11" fill-opacity="0.75">только признаки — ответов</text>
    <text x="642" y="100" text-anchor="middle" font-size="11" fill-opacity="0.75">модель не видит</text>
  </g>
  <rect x="536" y="128" width="212" height="40" rx="8" fill="#c2410c" fill-opacity="0.1" stroke="#c2410c" stroke-opacity="0.55"/>
  <text x="642" y="153" text-anchor="middle" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="11">массив прогнозов ŷ</text>
  <path d="M642 110 L642 124" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fa)"/>
  <text x="12" y="146" fill="currentColor" font-size="12">Так устроены все модели scikit-learn: LinearRegression, деревья,</text>
  <text x="12" y="164" fill="currentColor" font-size="12">ближайшие соседи. Меняется класс и настройки — fit и predict те же.</text>
  <text x="12" y="186" fill="currentColor" fill-opacity="0.75" font-size="12">Подготовка данных (StandardScaler) — тоже fit, но вместо predict — transform.</text>
</svg>
