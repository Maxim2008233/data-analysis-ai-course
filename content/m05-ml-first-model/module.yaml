label: Модуль 5
title: "Машинное обучение и первая модель в Scikit-learn"
short: Первая модель
firstLessonIndex: 0
description: >-
  Что такое машинное обучение: объект, признаки и ответ, виды задач, модель как семейство функций, функция потерь,
  метод наименьших квадратов и градиентный спуск, обобщающая способность и переобучение, обучающая, валидационная и
  тестовая выборки. Практика в Scikit-learn: X и y, два разделения 60/20/20, модель-ориентир, fit и predict, MAE руками
  и через sklearn, линейная регрессия, StandardScaler без утечки, метрики RMSE, R², MAPE и график «цена — прогноз».
  Мини-проект — первая модель на медицинских данных Diabetes.
