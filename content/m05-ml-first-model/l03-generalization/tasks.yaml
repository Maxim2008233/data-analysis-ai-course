- id: m5-l3-t1
  kind: quiz
  title: Переобучение, недообучение или норма
  difficulty: warmup
  introduces: [overfitting]
  uses: []
  statement: |
    По ошибкам на обучающей и валидационной выборке определите состояние модели. Ориентир — модель «одно число для всех» даёт MSE 1,0.
  quiz:
    - q: "MSE train = 0,02, MSE validation = 0,90."
      options:
        - Переобучение
        - Недообучение
        - Хорошая модель
      answer: 0
      explain: На train почти идеально, на новых данных почти как ориентир — модель выучила шум.
    - q: "MSE train = 0,95, MSE validation = 0,97."
      options:
        - Переобучение
        - Недообучение
        - Хорошая модель
      answer: 1
      explain: Ошибки близки, но почти такие же, как у ориентира, — модель слишком проста.
    - q: "MSE train = 0,10, MSE validation = 0,12."
      options:
        - Переобучение
        - Недообучение
        - Хорошая модель
      answer: 2
      explain: Ошибки маленькие и близкие — модель обобщает.
  hints:
    - Сравните ошибку на train с ошибкой на validation и обе — с ориентиром 1,0.
    - "Большой разрыв — переобучение; обе ошибки большие — недообучение; обе маленькие и близкие — хорошо."
    - "Ответы: переобучение; недообучение; хорошая модель."

- id: m5-l3-t2
  title: Ошибки на обучающих и новых данных
  difficulty: main
  introduces: [overfitting]
  uses: [loss-mse, param-model]
  statement: |
    Для многочленов степеней `degrees = [1, 3, 9]` (подбор — `Polynomial.fit(x_train, y_train, степень)`) получите массивы `mse_train` и `mse_test` (MSE на обучающих и на новых точках, в порядке степеней), `gap` — их разность `mse_test - mse_train` и `most_overfit` — степень с наибольшим разрывом.
  prelude: |
    import numpy as np
    from numpy.polynomial import Polynomial
    rng = np.random.default_rng(0)
    x_train = np.sort(rng.uniform(0, 1, 15))
    y_train = np.sin(2 * np.pi * x_train) + rng.normal(0, 0.3, 15)
    x_test = rng.uniform(x_train.min(), x_train.max(), 300)
    y_test = np.sin(2 * np.pi * x_test) + rng.normal(0, 0.3, 300)
  starter: |
    degrees = [1, 3, 9]
    mse_train, mse_test = [], []
    for degree in degrees:
        model = ...
        mse_train.append(...)
        mse_test.append(...)
    mse_train, mse_test = np.array(mse_train), np.array(mse_test)
    gap = ...
    most_overfit = ...
    print(mse_train.round(3), mse_test.round(3), most_overfit)
  solution: |
    degrees = [1, 3, 9]
    mse_train, mse_test = [], []
    for degree in degrees:
        model = Polynomial.fit(x_train, y_train, degree)
        mse_train.append(((model(x_train) - y_train) ** 2).mean())
        mse_test.append(((model(x_test) - y_test) ** 2).mean())
    mse_train, mse_test = np.array(mse_train), np.array(mse_test)
    gap = mse_test - mse_train
    most_overfit = degrees[int(gap.argmax())]
    print(mse_train.round(3), mse_test.round(3), most_overfit)
  explanation: |
    - Модель обучается только на `x_train`; её проверяют и на тех же точках, и на новых.
    - Ошибка на train падает с ростом степени, а на новых данных у степени 9 снова растёт.
    - Наибольший разрыв — у степени 9: она переобучена. Наименьшая ошибка на новых данных — у степени 3.
  hints:
    - "В цикле: обучите многочлен на train, затем посчитайте MSE на train и на test."
    - "`model = Polynomial.fit(x_train, y_train, degree)`; MSE — `((model(x) - y) ** 2).mean()`."
    - "`gap = mse_test - mse_train`; `most_overfit = degrees[int(gap.argmax())]`."
  tests: |
    import numpy as np
    tr = np.asarray(var('mse_train', None, 'массивом'))
    te = np.asarray(var('mse_test', None, 'массивом'))
    if np.allclose(tr, ref('mse_test')) and np.allclose(te, ref('mse_train')):
        fail('`mse_train` и `mse_test` перепутаны местами.')
    same_array(tr, ref('mse_train'), 'MSE на обучающих точках не совпадает: модель обучается на `x_train`, ошибка — на `x_train`.')
    same_array(te, ref('mse_test'), 'MSE на новых точках не совпадает: та же модель, ошибка на `x_test`, `y_test`.')
    same_array(np.asarray(var('gap', None, 'массивом')), ref('gap'), 'Разрыв — `mse_test - mse_train`.')
    equal(var('most_overfit', 'number', 'числом'), ref('most_overfit'), 'Наибольший разрыв у степени {expected}, а у вас {actual}.')
  wrong:
    - code: |
        degrees = [1, 3, 9]
        mse_train, mse_test = [], []
        for degree in degrees:
            model = Polynomial.fit(x_test, y_test, degree)
            mse_train.append(((model(x_train) - y_train) ** 2).mean())
            mse_test.append(((model(x_test) - y_test) ** 2).mean())
        mse_train, mse_test = np.array(mse_train), np.array(mse_test)
        gap = mse_test - mse_train
        most_overfit = degrees[int(gap.argmax())]
      expect: обучается на `x_train`
    - code: |
        degrees = [1, 3, 9]
        mse_train, mse_test = [], []
        for degree in degrees:
            model = Polynomial.fit(x_train, y_train, degree)
            mse_train.append(((model(x_train) - y_train) ** 2).mean())
            mse_test.append(((model(x_test) - y_test) ** 2).mean())
        mse_train, mse_test = np.array(mse_train), np.array(mse_test)
        gap = mse_test - mse_train
        most_overfit = int(gap.argmax())
      expect: Наибольший разрыв

- id: m5-l3-t3
  title: Степень по валидации, оценка по тесту
  difficulty: main
  introduces: [train-valid-test]
  uses: [loss-mse, param-model]
  statement: |
    Данные уже разделены на три части: `x_train`/`y_train`, `x_valid`/`y_valid`, `x_test`/`y_test`. Для степеней 0–9 обучите многочлен на train и получите `valid_mse` — массив MSE на validation. Выберите `best_degree` с наименьшей валидационной ошибкой и только для него посчитайте `test_mse` — итоговую ошибку на тесте.
  prelude: |
    import numpy as np
    from numpy.polynomial import Polynomial
    rng = np.random.default_rng(5)
    def make(n):
        x = rng.uniform(0, 1, n)
        return x, np.sin(2 * np.pi * x) + rng.normal(0, 0.3, n)
    x_train, y_train = make(20)
    x_valid, y_valid = make(20)
    x_test, y_test = make(200)
  starter: |
    degrees = range(10)
    valid_mse = np.array([... for d in degrees])
    best_degree = ...
    best_model = ...
    test_mse = ...
    print(valid_mse.round(3), best_degree, round(test_mse, 3))
  solution: |
    degrees = range(10)
    valid_mse = np.array([((Polynomial.fit(x_train, y_train, d)(x_valid) - y_valid) ** 2).mean() for d in degrees])
    best_degree = int(valid_mse.argmin())
    best_model = Polynomial.fit(x_train, y_train, best_degree)
    test_mse = ((best_model(x_test) - y_test) ** 2).mean()
    print(valid_mse.round(3), best_degree, round(test_mse, 3))
  explanation: |
    - Каждую модель обучаем **только на train**, сравниваем на validation — так выбираем сложность.
    - Тест открываем один раз — для уже выбранной модели. Его ошибка — честная оценка того, как модель будет работать на новых данных.
    - Ошибка на тесте немного больше лучшей валидационной: мы выбирали «самую удачную» на validation, и её оценка чуть оптимистична.
  hints:
    - "Для степени d: обучить на train, MSE на validation; номер наименьшей ошибки — лучшая степень."
    - "`((Polynomial.fit(x_train, y_train, d)(x_valid) - y_valid) ** 2).mean()` внутри списка; `best_degree = int(valid_mse.argmin())`."
    - "`best_model = Polynomial.fit(x_train, y_train, best_degree)`; `test_mse = ((best_model(x_test) - y_test) ** 2).mean()`."
  tests: |
    import numpy as np
    from numpy.polynomial import Polynomial
    v = var('valid_mse', np.ndarray, 'массивом NumPy')
    ensure(len(v) == 10, 'Нужно 10 значений — по степеням 0–9.')
    same_array(v, ref('valid_mse'), 'Валидационные ошибки не совпадают: обучение на train, MSE на validation.')
    b = var('best_degree', 'number', 'числом')
    if b == int(np.argmin([((Polynomial.fit(ref('x_train'), ref('y_train'), d)(ref('x_test')) - ref('y_test')) ** 2).mean() for d in range(10)])) and b != ref('best_degree'):
        fail('Степень выбрана по тестовой выборке. Выбирать нужно по validation, test — только для итоговой оценки.')
    equal(int(b), int(ref('best_degree')), 'Лучшая по валидации степень — {expected}, а у вас {actual}.')
    close(var('test_mse', 'number', 'числом'), ref('test_mse'), 'Итоговая ошибка на тесте — {expected}, а у вас {actual}.')
  wrong:
    - code: |
        degrees = range(10)
        valid_mse = np.array([((Polynomial.fit(x_train, y_train, d)(x_train) - y_train) ** 2).mean() for d in degrees])
        best_degree = int(valid_mse.argmin())
        best_model = Polynomial.fit(x_train, y_train, best_degree)
        test_mse = ((best_model(x_test) - y_test) ** 2).mean()
      expect: MSE на validation
    - code: |
        degrees = range(10)
        valid_mse = np.array([((Polynomial.fit(x_train, y_train, d)(x_valid) - y_valid) ** 2).mean() for d in degrees])
        best_degree = int(valid_mse.argmin())
        best_model = Polynomial.fit(x_train, y_train, best_degree)
        test_mse = ((best_model(x_valid) - y_valid) ** 2).mean()
      expect: на тесте

- id: m5-l3-t4
  kind: quiz
  title: Зачем три выборки
  difficulty: main
  introduces: [train-valid-test]
  uses: []
  statement: |
    Выберите верное утверждение.
  quiz:
    - q: Зачем нужна валидационная выборка, если есть тестовая?
      options:
        - Чтобы выбирать модель и настройки, не «тратя» тест
        - Чтобы обучать модель на большем числе данных
        - Она не нужна
      answer: 0
      explain: Каждое сравнение на тесте делает его оценку оптимистичнее; выбор делают на validation.
    - q: Аналитик перепробовал 50 моделей и выбрал лучшую по тестовой выборке. Что не так?
      options:
        - Ничего
        - Тестовая оценка лучшей модели оптимистична — тест превратился в валидацию
        - Нужно было перепробовать 100 моделей
      answer: 1
      explain: Из 50 попыток какая-то случайно окажется удачной именно на этих данных.
    - q: Одна и та же машина продаётся двумя почти одинаковыми объявлениями, и они попали в train и в test. К чему это приведёт?
      options:
        - К завышенной оценке качества — модель «проверяется» на почти выученном примере
        - Ни к чему
        - Модель станет точнее на новых данных
      answer: 0
      explain: Это утечка через повторы; поэтому повторы ищут до разделения (урок 2.6).
  hints:
    - Вспомните роли выборок и почему test открывают один раз.
    - "Validation — выбор; много попыток на test — оптимистичная оценка; повторы в разных частях — утечка."
    - "Ответы: выбирать, не тратя тест; оценка оптимистична; завышенная оценка."

- id: m5-l3-t5
