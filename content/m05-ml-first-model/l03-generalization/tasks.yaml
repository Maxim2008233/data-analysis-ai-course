    train_mse, valid_mse = [], []
    for d in degrees:
        model = Polynomial.fit(x_train, y_train, d)
        train_mse.append(...)
        valid_mse.append(...)
    fig, ax = plt.subplots(figsize=(8, 3.5))
    ...
    plt.show()
  solution: |
    degrees = list(range(10))
    train_mse, valid_mse = [], []
    for d in degrees:
        model = Polynomial.fit(x_train, y_train, d)
        train_mse.append(((model(x_train) - y_train) ** 2).mean())
