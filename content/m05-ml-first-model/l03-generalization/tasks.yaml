- id: m5-l3-t6
  title: Больше данных — меньше переобучение
  difficulty: star
  introduces: [overfitting]
  uses: [loss-mse, rng-sample, py-functions]
  statement: |
    Переобучение зависит не только от сложности модели, но и от объёма данных. Функция `make(n, seed)` возвращает `n` обучающих точек. Для `n` из `[15, 60, 240]` обучите многочлен **9-й** степени и получите массивы `train_err` и `test_err` (MSE на обучающих точках и на общей тестовой выборке `x_test`, `y_test` — только в пределах диапазона обучающих x) и `gaps` = `test_err - train_err`. Убедитесь, что разрыв уменьшается.
  prelude: |
    import numpy as np
    from numpy.polynomial import Polynomial
    def make(n, seed):
        rng = np.random.default_rng(seed)
        x = rng.uniform(0, 1, n)
        return x, np.sin(2 * np.pi * x) + rng.normal(0, 0.3, n)
    x_test, y_test = make(500, 100)
  starter: |
    sizes = [15, 60, 240]
    train_err, test_err = [], []
    for n in sizes:
        x, y = make(n, n)
        model = ...
        inside = (x_test >= x.min()) & (x_test <= x.max())
        train_err.append(...)
        test_err.append(...)
    train_err, test_err = np.array(train_err), np.array(test_err)
    gaps = ...
    print(train_err.round(3), test_err.round(3), gaps.round(3))
  solution: |
    sizes = [15, 60, 240]
    train_err, test_err = [], []
    for n in sizes:
        x, y = make(n, n)
        model = Polynomial.fit(x, y, 9)
        inside = (x_test >= x.min()) & (x_test <= x.max())
        train_err.append(((model(x) - y) ** 2).mean())
        test_err.append(((model(x_test[inside]) - y_test[inside]) ** 2).mean())
    train_err, test_err = np.array(train_err), np.array(test_err)
    gaps = test_err - train_err
    print(train_err.round(3), test_err.round(3), gaps.round(3))
  explanation: |
    - Одна и та же модель — многочлен 9-й степени — на 15 точках переобучается (разрыв большой), на 240 — почти нет: шум отдельных точек усредняется.
    - Маска `inside` оставляет тестовые точки внутри диапазона обучающих: за его краями многочлен высокой степени «улетает», и сравнение было бы нечестным.
    - Вывод: чем больше данных, тем более сложную модель можно себе позволить.
  hints:
    - "Для каждого n: данные `make(n, n)`, модель степени 9, ошибки на своих точках и на тесте внутри диапазона."
    - "`model = Polynomial.fit(x, y, 9)`; тест — `x_test[inside]`, `y_test[inside]`."
    - "`gaps = test_err - train_err` — разрыв должен уменьшаться с ростом n."
  tests: |
    import numpy as np
    tr = np.asarray(var('train_err', None, 'массивом'))
    te = np.asarray(var('test_err', None, 'массивом'))
    ensure(len(tr) == 3 and len(te) == 3, 'Нужно по три значения — для n = 15, 60, 240.')
    same_array(tr, ref('train_err'), 'Ошибки на обучающих точках не совпадают: многочлен 9-й степени, MSE на своих точках.')
    same_array(te, ref('test_err'), 'Ошибки на тесте не совпадают: тестовые точки внутри диапазона обучающих (`inside`).')
    g = np.asarray(var('gaps', None, 'массивом'))
    same_array(g, ref('gaps'), 'Разрыв — `test_err - train_err`.')
    ensure(g[0] > g[1] > g[2], 'Разрыв должен уменьшаться с ростом числа точек.')
  wrong:
    - code: |
        sizes = [15, 60, 240]
        train_err, test_err = [], []
        for n in sizes:
            x, y = make(n, n)
            model = Polynomial.fit(x, y, 3)
            inside = (x_test >= x.min()) & (x_test <= x.max())
            train_err.append(((model(x) - y) ** 2).mean())
            test_err.append(((model(x_test[inside]) - y_test[inside]) ** 2).mean())
        train_err, test_err = np.array(train_err), np.array(test_err)
        gaps = test_err - train_err
      expect: 9-й степени
    - code: |
        sizes = [15, 60, 240]
        train_err, test_err = [], []
        for n in sizes:
