<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="map заменяет значения по словарю, а значение без ключа становится пропуском; apply вызывает функцию для каждого значения колонки">
  <defs><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.7"/></marker></defs>
  <text x="20" y="24" font-weight="700" fill="currentColor">map(словарь)</text>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <text x="20" y="60">Petrol</text><text x="20" y="90">Diesel</text><text x="20" y="120">Electric</text>
    <rect x="120" y="44" width="150" height="86" rx="6" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
    <text x="130" y="64" font-size="11.5">'Petrol': 'бензин'</text>
    <text x="130" y="84" font-size="11.5">'Diesel': 'дизель'</text>
    <text x="130" y="104" font-size="11.5" fill-opacity="0.55">(нет Electric)</text>
    <text x="300" y="60">'бензин'</text><text x="300" y="90">'дизель'</text><text x="300" y="120" fill="#c2410c" font-weight="700">NaN</text>
  </g>
  <path d="M84 56 L116 56" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M84 86 L116 86" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M90 116 L116 116" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M272 56 L294 56" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M272 86 L294 86" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M272 116 L294 116" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <text x="20" y="160" fill="currentColor" font-size="12">нет ключа в словаре → пропуск;</text>
  <text x="20" y="178" fill="currentColor" font-size="12">проверяйте <tspan font-family="JetBrains Mono, monospace">isna().sum()</tspan> после замены</text>
  <text x="420" y="24" font-weight="700" fill="currentColor">apply(функция)</text>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <text x="420" y="60">8000.0</text><text x="420" y="90">17727.3</text><text x="420" y="120">NaN</text>
    <rect x="510" y="44" width="120" height="86" rx="6" fill="#c2410c" fill-opacity="0.08" stroke="#c2410c"/>
    <text x="520" y="70" font-size="11.5">km_year_</text>
    <text x="520" y="88" font-size="11.5">category(v)</text>
    <text x="520" y="112" font-size="11" fill-opacity="0.6">для каждого v</text>
    <text x="650" y="60">'Small'</text><text x="650" y="90">'Medium'</text><text x="650" y="120">NaN</text>
  </g>
  <path d="M478 56 L506 56" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M484 86 L506 86" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M452 116 L506 116" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M632 56 L646 56" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M632 86 L646 86" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <path d="M632 116 L646 116" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#m)"/>
  <text x="420" y="160" fill="currentColor" font-size="12">правило с условиями; у функции — отдельная</text>
  <text x="420" y="178" fill="currentColor" font-size="12">ветка для пропуска, границы проверяем отдельно</text>
  <text x="20" y="216" fill="currentColor" fill-opacity="0.75" font-size="12">Простая арифметика (2022 − Year) не требует ни map, ни apply — это обычная операция над колонкой.</text>
</svg>
