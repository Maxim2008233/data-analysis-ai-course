<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Таблица с пропусками превращается в маску isna; сумма маски по колонкам — число пропусков в каждой колонке, any по строкам — неполные строки">
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <!-- исходная таблица -->
    <text x="20" y="24" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="13">df</text>
    <g font-weight="700"><text x="20" y="50">Make</text><text x="105" y="50">Model</text><text x="195" y="50">Engine</text></g>
    <text x="20" y="76">Toyota</text><text x="105" y="76">Prius</text><text x="195" y="76">1800.0</text>
    <text x="20" y="102" fill="#c2410c" font-weight="700">NaN</text><text x="105" y="102">Cayenne</text><text x="195" y="102">3000.0</text>
    <text x="20" y="128">Renault</text><text x="105" y="128">Scenic</text><text x="195" y="128" fill="#c2410c" font-weight="700">NaN</text>
    <text x="20" y="154" fill="#c2410c" font-weight="700">NaN</text><text x="105" y="154">Carens</text><text x="195" y="154" fill="#c2410c" font-weight="700">NaN</text>
    <!-- маска -->
    <text x="330" y="24" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="13">df.isna()</text>
    <g font-weight="700"><text x="330" y="50">Make</text><text x="410" y="50">Model</text><text x="490" y="50">Engine</text></g>
    <g>
      <rect x="402" y="62" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="322" y="62" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="482" y="62" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="322" y="88" width="64" height="20" rx="3" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
      <rect x="402" y="88" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="482" y="88" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="322" y="114" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="402" y="114" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="482" y="114" width="64" height="20" rx="3" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
      <rect x="322" y="140" width="64" height="20" rx="3" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
      <rect x="402" y="140" width="64" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.25"/>
      <rect x="482" y="140" width="64" height="20" rx="3" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9"/>
    </g>
    <g fill-opacity="0.65"><text x="330" y="76">False</text><text x="410" y="76">False</text><text x="490" y="76">False</text>
    <text x="410" y="102">False</text><text x="490" y="102">False</text>
    <text x="330" y="128">False</text><text x="410" y="128">False</text>
    <text x="410" y="154">False</text></g>
    <text x="330" y="102">True</text><text x="490" y="128">True</text><text x="330" y="154">True</text><text x="490" y="154">True</text>
    <!-- суммы по колонкам -->
    <line x1="322" y1="170" x2="546" y2="170" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="346" y="190" font-weight="700">2</text><text x="426" y="190" font-weight="700">0</text><text x="506" y="190" font-weight="700">2</text>
    <!-- any по строкам -->
    <text x="600" y="24" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="13">.any(axis=1)</text>
    <text x="610" y="76" fill-opacity="0.65">False</text><text x="610" y="102">True</text><text x="610" y="128">True</text><text x="610" y="154">True</text>
    <line x1="602" y1="170" x2="660" y2="170" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="626" y="190" font-weight="700">3</text>
  </g>
  <path d="M262 108 L312 108" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M552 108 L594 108" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" fill-opacity="0.6"/></marker></defs>
  <text x="322" y="218" fill="currentColor"><tspan font-family="JetBrains Mono, monospace" font-weight="700">.sum()</tspan> по колонкам → пропусков в каждой колонке (всего 4 ячейки)</text>
  <text x="322" y="240" fill="currentColor"><tspan font-family="JetBrains Mono, monospace" font-weight="700">.any(axis=1).sum()</tspan> → строк хотя бы с одним пропуском: 3</text>
  <text x="20" y="218" fill="currentColor" fill-opacity="0.7">4 пустые ячейки,</text>
  <text x="20" y="240" fill="currentColor" fill-opacity="0.7">но неполных строк — 3</text>
</svg>
