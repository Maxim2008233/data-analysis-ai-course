- id: m2-l12-t1
  title: "Шаг 1. Функция очистки строк"
  difficulty: main
  introduces: []
  uses: [pd-drop-duplicates, pd-dropna, analysis-scope]
  statement: |
    Напишите функцию `clean_rows(table)`, которая возвращает **новую** таблицу:

    1. без точных повторов;
    2. без неполных записей;
    3. только с записями внутри учебной области анализа (пять правил урока 2.7; константы границ уже заданы).

    Исходную таблицу функция менять не должна. Затем `cleaned = clean_rows(raw)`. Проверка запустит функцию и на другой части данных.
  prelude: |
    import pandas as pd
    raw = pd.read_csv('cars.csv')
    MIN_YEAR, MAX_YEAR = 1951, 2021          # границы учебной области — урок 2.7
    MIN_ENGINE, MAX_ENGINE = 200, 5000
    MIN_PRICE, MAX_PRICE = 101, 500_000
    MAX_DISTANCE = 1_000_000
    MIN_DISTANCE_OLDER = 1100
  starter: |
    def clean_rows(table):
        table = table.copy()
        ...
        return table

    cleaned = clean_rows(raw)
    print(len(raw), len(cleaned))
  solution: |
    def clean_rows(table):
        table = table.copy()
        table = table.drop_duplicates()
        table = table.dropna()
        in_scope = (
            table['Year'].between(MIN_YEAR, MAX_YEAR) &
            table['Distance'].between(0, MAX_DISTANCE) &
            table['Engine_capacity(cm3)'].between(MIN_ENGINE, MAX_ENGINE) &
            table['Price(euro)'].between(MIN_PRICE, MAX_PRICE) &
            ~((table['Year'] < MAX_YEAR) & (table['Distance'] < MIN_DISTANCE_OLDER))
        )
        return table.loc[in_scope].copy()

    cleaned = clean_rows(raw)
    print(len(raw), len(cleaned))
  explanation: |
    - `table.copy()` в начале — функция не трогает таблицу, которую ей передали.
    - Каждый шаг — присваивание: `table = table.drop_duplicates()`, `table = table.dropna()`.
    - Маска области анализа строится по **той же** таблице `table`, которую фильтруем, и по константам — без вписанных чисел.
  hints:
    - "Три шага в порядке уроков 2.6–2.7: повторы, неполные записи, маска из пяти правил."
    - "`table = table.drop_duplicates()`, `table = table.dropna()`; маска — как `in_scope` в уроке 2.7, но по `table` и с константами."
    - "`return table.loc[in_scope].copy()`, где `in_scope = table['Year'].between(MIN_YEAR, MAX_YEAR) & ... & ~((table['Year'] < MAX_YEAR) & (table['Distance'] < MIN_DISTANCE_OLDER))`."
  tests: |
    import pandas as pd
    f = var('clean_rows')
    ensure(callable(f), '`clean_rows` должна быть функцией.')
    r = ref('raw')
    ref_f = ref('clean_rows')
    before = r.copy()
    got = f(r)
    ensure(got is not None, 'Функция ничего не вернула — добавьте `return`.')
    ensure(r.equals(before), 'Функция изменила переданную таблицу. Работайте с копией: `table = table.copy()` и присваивания вместо `inplace=True`.')
    exp = ref_f(r)
    if len(got) > len(exp):
        extra = got.loc[~got.index.isin(exp.index)]
        if extra.isna().any(axis=1).any():
            fail('В результате остались неполные записи — добавьте `dropna()`.')
        if extra.duplicated(keep=False).any() or got.duplicated().any():
            fail('В результате остались точные повторы — добавьте `drop_duplicates()`.')
        fail('В результате {0} лишних строк вне учебной области анализа. Проверьте все пять правил.'.format(len(got) - len(exp)))
    same_frame(got, exp, 'Результат `clean_rows(raw)` не совпадает с нужным.')
    part = r.sample(5000, random_state=1)
    same_frame(f(part), ref_f(part), 'На случайной части таблицы функция дала другой результат — не вписывайте числа строк или меток.')
    equal(len(alt('cleaned')), len(alt_ref('cleaned')), HARDCODE_MSG)
