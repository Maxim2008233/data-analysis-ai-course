- id: m2-l12-t2
  title: "Шаг 2. Функция новых признаков"
  difficulty: main
  introduces: []
  uses: [pd-reset-index, pd-rename-drop, pd-new-column]
  statement: |
    Напишите функцию `add_features(table)`, которая получает очищенную таблицу и возвращает новую таблицу, где:

    1. исходные метки строк сохранены в колонку `source_row_id`, а строки перенумерованы с нуля;
    2. `Engine_capacity(cm3)` переименована в `Engine`, `Price(euro)` — в `Price`;
    3. добавлены `Age = REFERENCE_YEAR − Year` и `km_year = Distance / Age`.

    Затем `featured = add_features(clean_rows(raw))`. Функция `clean_rows` из шага 1 уже готова.
  prelude: |
    import pandas as pd
    raw = pd.read_csv('cars.csv')
    REFERENCE_YEAR = 2022
    def clean_rows(table):                     # шаг 1
        table = table.copy().drop_duplicates().dropna()
        in_scope = (table['Year'].between(1951, 2021) & table['Distance'].between(0, 1_000_000) &
                    table['Engine_capacity(cm3)'].between(200, 5000) & table['Price(euro)'].between(101, 500_000) &
                    ~((table['Year'] < 2021) & (table['Distance'] < 1100)))
        return table.loc[in_scope].copy()
  starter: |
    def add_features(table):
        table = table.copy()
        ...
        return table

    featured = add_features(clean_rows(raw))
    featured.head(3)
  solution: |
    def add_features(table):
        table = table.copy()
        table['source_row_id'] = table.index
        table = table.reset_index(drop=True)
        table = table.rename(columns={'Engine_capacity(cm3)': 'Engine', 'Price(euro)': 'Price'})
        table['Age'] = REFERENCE_YEAR - table['Year']
        table['km_year'] = table['Distance'] / table['Age']
        return table

    featured = add_features(clean_rows(raw))
    featured.head(3)
  explanation: |
    - Метки сохраняются **до** `reset_index(drop=True)` — иначе в `source_row_id` попадут новые номера.
    - `rename(columns=...)` и `reset_index` возвращают новые таблицы, поэтому результат присваивается обратно в `table`.
    - `Age` и `km_year` — формулы над колонками с константой опорного года.
  hints:
    - "Порядок как в уроках 2.7–2.8: метки → перенумерация → переименование → новые колонки."
    - "`table['source_row_id'] = table.index`, `table = table.reset_index(drop=True)`, `table = table.rename(columns={...})`."
    - "`table['Age'] = REFERENCE_YEAR - table['Year']`, `table['km_year'] = table['Distance'] / table['Age']`."
  tests: |
    import pandas as pd
    f = var('add_features')
    ensure(callable(f), '`add_features` должна быть функцией.')
    base = ref('clean_rows')(ref('raw'))
    before = base.copy()
    got = f(base)
    ensure(got is not None, 'Функция ничего не вернула — добавьте `return`.')
    ensure(base.equals(before), 'Функция изменила переданную таблицу. Начните с `table = table.copy()`.')
    for col in ['source_row_id', 'Engine', 'Price', 'Age', 'km_year']:
        ensure(col in got.columns, 'В результате нет колонки `{0}`.'.format(col))
    if (got['source_row_id'].to_numpy() == range(len(got))).all():
        fail('В `source_row_id` записаны новые номера 0, 1, 2, … Сохраните метки до `reset_index`.')
    ensure(got.index.equals(pd.RangeIndex(len(got))), 'Строки результата должны быть перенумерованы с нуля: `reset_index(drop=True)`.')
    same_frame(got, ref('add_features')(base), 'Результат `add_features` не совпадает с нужным.')
    part = base.sample(3000, random_state=2)
    same_frame(f(part), ref('add_features')(part), 'На другой части таблицы функция дала другой результат.')
  wrong:
    - code: |
        def add_features(table):
            table = table.copy().reset_index(drop=True)
            table['source_row_id'] = table.index
            table = table.rename(columns={'Engine_capacity(cm3)': 'Engine', 'Price(euro)': 'Price'})
            table['Age'] = REFERENCE_YEAR - table['Year']
            table['km_year'] = table['Distance'] / table['Age']
            return table
        featured = add_features(clean_rows(raw))
      expect: до `reset_index`
    - code: |
        def add_features(table):
            table['source_row_id'] = table.index
            table.reset_index(drop=True, inplace=True)
            table.rename(columns={'Engine_capacity(cm3)': 'Engine', 'Price(euro)': 'Price'}, inplace=True)
            table['Age'] = REFERENCE_YEAR - table['Year']
            table['km_year'] = table['Distance'] / table['Age']
            return table
        featured = add_features(clean_rows(raw))
      expect: изменила переданную таблицу

- id: m2-l12-t3
  title: "Шаг 3. Функция категорий"
  difficulty: main
  introduces: []
  uses: [pd-map, pd-apply, rare-categories]
  statement: |
    Напишите функцию `add_categories(table)`, которая возвращает новую таблицу с тремя дополнениями:

    1. `Transmission` — `'Automatic'`/`'Manual'` по колонке `AutoTransmission`;
    2. `km_year_cat` — категория годового пробега (функция `km_year_category` из урока 2.9 уже готова);
    3. марки с долей **не больше** `RARE_SHARE` заменены на `'Rare'`, а исходная марка сохранена в `Make_original`.

    Доли марок считайте по той таблице, которую получила функция. Затем `categorized = add_categories(featured)`.
  prelude: |
    import numpy as np
    import pandas as pd
    raw = pd.read_csv('cars.csv')
    RARE_SHARE = 0.01
    def km_year_category(value):               # урок 2.9
        if pd.isna(value):
            return np.nan
        if value <= 10_000:
            return 'Small'
        if value <= 30_000:
            return 'Medium'
        return 'Large'
    # шаги 1–2: clean_rows и add_features
    featured = raw.drop_duplicates().dropna()
    featured = featured[featured['Year'].between(1951, 2021) & featured['Distance'].between(0, 1_000_000) &
                        featured['Engine_capacity(cm3)'].between(200, 5000) & featured['Price(euro)'].between(101, 500_000) &
                        ~((featured['Year'] < 2021) & (featured['Distance'] < 1100))].copy()
    featured['source_row_id'] = featured.index
    featured = featured.reset_index(drop=True).rename(columns={'Engine_capacity(cm3)': 'Engine', 'Price(euro)': 'Price'})
    featured['Age'] = 2022 - featured['Year']
    featured['km_year'] = featured['Distance'] / featured['Age']
  starter: |
    def add_categories(table):
        table = table.copy()
        ...
        return table

    categorized = add_categories(featured)
    print(categorized['Make'].nunique(), (categorized['Make'] == 'Rare').sum())
  solution: |
    def add_categories(table):
        table = table.copy()
        table['Transmission'] = table['AutoTransmission'].map({True: 'Automatic', False: 'Manual'})
        table['km_year_cat'] = table['km_year'].apply(km_year_category)
        share = table['Make'].value_counts(normalize=True)
        rare = share[share <= RARE_SHARE].index
        table['Make_original'] = table['Make']
        table.loc[table['Make'].isin(rare), 'Make'] = 'Rare'
        return table

    categorized = add_categories(featured)
    print(categorized['Make'].nunique(), (categorized['Make'] == 'Rare').sum())
  explanation: |
    - `map` со словарём — для перекодировки, `apply` с готовой функцией — для категорий пробега.
    - Доли считаются по переданной таблице `table`: на другой части данных список редких марок будет своим.
    - `Make_original` копируется **до** замены, а замена делается одной операцией через `loc`.
  hints:
    - "Три дополнения из уроков 2.9–2.10. Доли марок — по `table`, а не по внешней таблице."
    - "`table['AutoTransmission'].map({...})`; `table['km_year'].apply(km_year_category)`; доли — `table['Make'].value_counts(normalize=True)`."
    - "`table['Make_original'] = table['Make']`, затем `table.loc[table['Make'].isin(rare), 'Make'] = 'Rare'`."
  tests: |
    import pandas as pd
    f = var('add_categories')
    ensure(callable(f), '`add_categories` должна быть функцией.')
    base = ref('featured')
    before = base.copy()
    got = f(base)
    ensure(got is not None, 'Функция ничего не вернула — добавьте `return`.')
    ensure(base.equals(before), 'Функция изменила переданную таблицу. Начните с `table = table.copy()`.')
    for col in ['Transmission', 'km_year_cat', 'Make_original']:
        ensure(col in got.columns, 'В результате нет колонки `{0}`.'.format(col))
    if (got['Make_original'] == 'Rare').any():
        fail('В `Make_original` есть \'Rare\' — копируйте марку до замены.')
    same_frame(got, ref('add_categories')(base), 'Результат `add_categories` не совпадает с нужным.')
    part = base[base['Year'] >= 2010]
    same_frame(f(part), ref('add_categories')(part), 'Для таблицы машин с 2010 года результат другой. Доли марок нужно считать по переданной таблице `table`.')
  wrong:
    - code: |
        def add_categories(table):
            table = table.copy()
            table['Transmission'] = table['AutoTransmission'].map({True: 'Automatic', False: 'Manual'})
            table['km_year_cat'] = table['km_year'].apply(km_year_category)
            share = featured['Make'].value_counts(normalize=True)
            rare = share[share <= RARE_SHARE].index
            table['Make_original'] = table['Make']
            table.loc[table['Make'].isin(rare), 'Make'] = 'Rare'
            return table
        categorized = add_categories(featured)
      expect: по переданной таблице
    - code: |
        def add_categories(table):
            table = table.copy()
            table['Transmission'] = table['AutoTransmission'].map({True: 'Automatic', False: 'Manual'})
            table['km_year_cat'] = table['km_year'].apply(km_year_category)
            share = table['Make'].value_counts(normalize=True)
            table.loc[table['Make'].isin(share[share <= RARE_SHARE].index), 'Make'] = 'Rare'
            table['Make_original'] = table['Make']
            return table
        categorized = add_categories(featured)
      expect: до замены

- id: m2-l12-t4
  title: "Шаг 4. Сборка, журнал и сохранение"
  difficulty: main
  introduces: []
  uses: [processing-log, pd-to-csv, pd-select-columns]
  statement: |
    Соберите всё вместе в функцию `prepare_cars(raw)`. Она должна:

    1. пройти три этапа с журналом: `'Удаление точных повторов'`, `'Отбор полных записей'`, `'Учебная область анализа'` (для последнего есть готовая функция `select_scope`); в журнал — словари с ключами `'Этап'`, `'До'`, `'После'`, `'Убрано'`;
    2. применить готовые `add_features` и `add_categories`;
    3. оставить колонки `OUTPUT_COLUMNS` в этом порядке и сохранить результат в `cars_processed.csv` без индекса;
    4. вернуть пару: подготовленную таблицу и журнал в виде DataFrame.

    Затем `processed, log_table = prepare_cars(raw)`.
  prelude: |
    import numpy as np
    import pandas as pd
    raw = pd.read_csv('cars.csv')
    OUTPUT_COLUMNS = ['Make', 'Model', 'Year', 'Style', 'Distance', 'Engine', 'Fuel_type',
                      'AutoTransmission', 'Price', 'Age', 'km_year', 'Transmission',
                      'km_year_cat', 'Make_original', 'source_row_id']
    def select_scope(table):                   # учебная область анализа — урок 2.7
        in_scope = (table['Year'].between(1951, 2021) & table['Distance'].between(0, 1_000_000) &
                    table['Engine_capacity(cm3)'].between(200, 5000) & table['Price(euro)'].between(101, 500_000) &
                    ~((table['Year'] < 2021) & (table['Distance'] < 1100)))
        return table.loc[in_scope].copy()
    def add_features(table):                   # шаг 2
        table = table.copy()
        table['source_row_id'] = table.index
        table = table.reset_index(drop=True).rename(columns={'Engine_capacity(cm3)': 'Engine', 'Price(euro)': 'Price'})
        table['Age'] = 2022 - table['Year']
        table['km_year'] = table['Distance'] / table['Age']
        return table
    def add_categories(table):                 # шаг 3
        table = table.copy()
        table['Transmission'] = table['AutoTransmission'].map({True: 'Automatic', False: 'Manual'})
        table['km_year_cat'] = pd.cut(table['km_year'], bins=[-np.inf, 10_000, 30_000, np.inf], labels=['Small', 'Medium', 'Large']).astype(str)
        share = table['Make'].value_counts(normalize=True)
        table['Make_original'] = table['Make']
        table.loc[table['Make'].isin(share[share <= 0.01].index), 'Make'] = 'Rare'
        return table
  starter: |
    def prepare_cars(raw):
        table = raw.copy()
        log = []
        ...
        return processed, pd.DataFrame(log)

    processed, log_table = prepare_cars(raw)
    print(processed.shape)
    log_table
  solution: |
    def prepare_cars(raw):
        table = raw.copy()
        log = []
        steps = [('Удаление точных повторов', lambda t: t.drop_duplicates()),
                 ('Отбор полных записей', lambda t: t.dropna()),
                 ('Учебная область анализа', select_scope)]
        for name, step in steps:
            n_before = len(table)
            table = step(table)
            log.append({'Этап': name, 'До': n_before, 'После': len(table), 'Убрано': n_before - len(table)})
        table = add_categories(add_features(table))
        processed = table[OUTPUT_COLUMNS].copy()
        processed.to_csv('cars_processed.csv', index=False)
        return processed, pd.DataFrame(log)

    processed, log_table = prepare_cars(raw)
    print(processed.shape)
    log_table
  explanation: |
    - Этапы удобно описать списком пар «название — функция» и пройти циклом: запись в журнал одинакова для всех этапов.
    - `lambda t: t.drop_duplicates()` — короткая функция «прямо на месте»; можно написать и три отдельных блока, как в уроке 2.6.
    - Колонки выбираются явным списком `OUTPUT_COLUMNS` — порядок в файле всегда одинаковый; сохранение — с `index=False`.
  alternatives:
    - |
      def prepare_cars(raw):
          table = raw.copy()
          log = []
          n_before = len(table)
          table = table.drop_duplicates()
          log.append({'Этап': 'Удаление точных повторов', 'До': n_before, 'После': len(table), 'Убрано': n_before - len(table)})
          n_before = len(table)
          table = table.dropna()
          log.append({'Этап': 'Отбор полных записей', 'До': n_before, 'После': len(table), 'Убрано': n_before - len(table)})
          n_before = len(table)
          table = select_scope(table)
          log.append({'Этап': 'Учебная область анализа', 'До': n_before, 'После': len(table), 'Убрано': n_before - len(table)})
          processed = add_categories(add_features(table))[OUTPUT_COLUMNS].copy()
          processed.to_csv('cars_processed.csv', index=False)
          return processed, pd.DataFrame(log)

      processed, log_table = prepare_cars(raw)
  hints:
    - "Перед каждым этапом запомните `n_before`, после — добавьте словарь в `log` (урок 2.6). Потом признаки, категории, выбор колонок и сохранение."
    - "Этапы: `table.drop_duplicates()`, `table.dropna()`, `select_scope(table)`; затем `add_categories(add_features(table))`, `[OUTPUT_COLUMNS]`, `to_csv(..., index=False)`."
    - "`processed = add_categories(add_features(table))[OUTPUT_COLUMNS].copy()`, `processed.to_csv('cars_processed.csv', index=False)`."
  tests: |
    import os
    import pandas as pd
    f = var('prepare_cars')
    ensure(callable(f), '`prepare_cars` должна быть функцией.')
    r = ref('raw')
    res = f(r)
    # файл ученика читаем сразу: эталонная функция ниже сохранит файл с тем же именем
