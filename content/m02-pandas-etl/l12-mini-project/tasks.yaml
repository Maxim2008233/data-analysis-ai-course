            in_scope = (table['Year'].between(MIN_YEAR, MAX_YEAR) & table['Distance'].between(0, MAX_DISTANCE) &
                        table['Engine_capacity(cm3)'].between(MIN_ENGINE, MAX_ENGINE) & table['Price(euro)'].between(MIN_PRICE, MAX_PRICE) &
                        ~((table['Year'] < MAX_YEAR) & (table['Distance'] < MIN_DISTANCE_OLDER)))
