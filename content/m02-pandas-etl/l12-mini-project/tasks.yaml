- id: m2-l12-t5
  kind: quiz
  title: "Шаг 5. Отчёт аналитика"
  difficulty: main
  introduces: []
  uses: [analysis-scope, target-features]
  statement: |
    В конце лабораторной работы нужно написать 5–7 предложений: что представляет строка, что является целью, какие проблемы найдены, сколько строк осталось и какие ограничения появились. Выберите корректные формулировки для такого отчёта.
  quiz:
    - q: Какая формулировка о результате обработки корректна?
      options:
        - После обработки осталось 32 067 из 41 007 строк (78 %); больше всего строк убрали правило малого пробега и удаление повторов
        - Из данных удалены все ошибки, остались только верные объявления
        - Обработка не изменила состав выборки
      answer: 0
      explain: Обработка — набор допущений и границ. Она не «удаляет все ошибки» и меняет состав выборки — это нужно назвать.
    - q: Что корректно сказать об удалённых повторах?
      options:
        - Повторы — это доказанные ошибки выгрузки
        - Полностью совпадающие строки считались повторами одного объявления; без номера объявления это допущение
        - Повторы не влияют на анализ
      answer: 1
      explain: Без ID нельзя отличить повторную выгрузку от двух одинаковых машин — это ограничение.
    - q: Какое ограничение учебной области анализа важно указать?
      options:
        - Почти все электромобили исключены правилом объёма двигателя — выводы к ним не относятся
        - Ограничений нет
        - Исключены все машины дороже 10 000 евро
      answer: 0
      explain: Правило «200–5000 см³» убрало электромобили с нулевым объёмом. Граница цены — 500 000 евро, а не 10 000.
    - q: Как корректно описать цену в подготовленных данных?
      options:
        - Цена сделки, по которой машина продана
        - Цена предложения (сколько просит продавец), целевая переменная для будущей модели
        - Средняя цена модели
      answer: 1
      explain: В файле объявления, а не сделки; цена — то, что модель будет оценивать по признакам.
  hints:
    - Вспомните журнал обработки, допущение о повторах, правила области анализа и смысл колонки цены.
    - "Обработка меняет выборку; повторы без ID — допущение; объём 200–5000 исключил электромобили; цена — цена предложения."
    - "Ответы: 32 067 строк (78 %); повторы — допущение; электромобили; цена предложения — цель."
