<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Воронка обработки: 41 007 строк, после удаления повторов 37 384, после отбора полных записей 36 569, после учебной области анализа 32 067">
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <rect x="200" y="20" width="520" height="30" rx="4" fill="currentColor" fill-opacity="0.12"/>
    <text x="210" y="40" font-weight="700">41 007</text>
    <rect x="200" y="66" width="474" height="30" rx="4" fill="#3d5bd9" fill-opacity="0.22"/>
    <text x="210" y="86" font-weight="700">37 384</text><text x="684" y="86" fill="#c2410c">−3 623</text>
    <rect x="200" y="112" width="464" height="30" rx="4" fill="#3d5bd9" fill-opacity="0.32"/>
    <text x="210" y="132" font-weight="700">36 569</text><text x="674" y="132" fill="#c2410c">−815</text>
    <rect x="200" y="158" width="407" height="30" rx="4" fill="#3d5bd9" fill-opacity="0.15" stroke="#3d5bd9" stroke-dasharray="4 3"/>
    <text x="210" y="178" font-weight="700">32 067</text><text x="617" y="178" fill="#c2410c">−4 502</text>
  </g>
  <g fill="currentColor">
    <text x="190" y="40" text-anchor="end">исходная таблица</text>
    <text x="190" y="80" text-anchor="end">drop_duplicates()</text>
    <text x="190" y="95" text-anchor="end" font-size="11.5" fill-opacity="0.65">точные повторы</text>
    <text x="190" y="126" text-anchor="end">dropna()</text>
    <text x="190" y="141" text-anchor="end" font-size="11.5" fill-opacity="0.65">неполные записи</text>
    <text x="190" y="172" text-anchor="end">область анализа</text>
    <text x="190" y="187" text-anchor="end" font-size="11.5" fill-opacity="0.65">урок 2.7</text>
  </g>
  <text x="200" y="208" fill="currentColor" fill-opacity="0.7" font-size="12">Журнал обработки хранит эти числа: этап, строк до, строк после, убрано.</text>
</svg>
