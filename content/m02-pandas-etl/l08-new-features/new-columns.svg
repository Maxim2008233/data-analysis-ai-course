<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Новые колонки считаются сразу для всех строк: Age равно 2022 минус Year, km_year равно Distance, делённому на Age">
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
    <g font-weight="700"><text x="30" y="30">Year</text><text x="160" y="30" fill="#3d5bd9">Age</text><text x="290" y="30">Distance</text><text x="440" y="30" fill="#3d5bd9">km_year</text></g>
    <text x="30" y="60">2011</text><text x="160" y="60" fill="#3d5bd9">11</text><text x="290" y="60">195000.0</text><text x="440" y="60" fill="#3d5bd9">17727.3</text>
    <text x="30" y="86">2014</text><text x="160" y="86" fill="#3d5bd9">8</text><text x="290" y="86">135000.0</text><text x="440" y="86" fill="#3d5bd9">16875.0</text>
    <text x="30" y="112">2012</text><text x="160" y="112" fill="#3d5bd9">10</text><text x="290" y="112">110000.0</text><text x="440" y="112" fill="#3d5bd9">11000.0</text>
    <text x="30" y="138">…</text><text x="160" y="138" fill="#3d5bd9">…</text><text x="290" y="138">…</text><text x="440" y="138" fill="#3d5bd9">…</text>
  </g>
  <rect x="150" y="40" width="70" height="108" rx="4" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
  <rect x="430" y="40" width="96" height="108" rx="4" fill="#3d5bd9" fill-opacity="0.10" stroke="#3d5bd9"/>
  <text x="30" y="180" fill="currentColor"><tspan font-family="JetBrains Mono, monospace" font-weight="700">df['Age'] = 2022 - df['Year']</tspan> — одно выражение для всех строк сразу</text>
  <text x="30" y="202" fill="currentColor"><tspan font-family="JetBrains Mono, monospace" font-weight="700">df['km_year'] = df['Distance'] / df['Age']</tspan> — поэлементно, строка с строкой</text>
  <text x="560" y="72" fill="currentColor" font-size="12">как векторные</text>
  <text x="560" y="90" fill="currentColor" font-size="12">операции NumPy</text>
  <text x="560" y="108" fill="currentColor" font-size="12">(урок 1.4) —</text>
  <text x="560" y="126" fill="currentColor" font-size="12">без цикла</text>
</svg>
