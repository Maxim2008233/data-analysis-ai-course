title: "Практикум-соревнование 1: оценка цены автомобиля"
short: Соревнование 1
description: >-
  Настоящее соревнование по анализу данных внутри курса. Новые объявления о машинах в сыром виде: объём двигателя
  строкой «2.0 Turbo», пробег «192000 km», ошибочные цены и повторы. Модель строится прямо в браузере, прогнозы
  отправляются на сервер, и он считает MAE по скрытым ценам — так устроены соревнования на Kaggle. Результат
  сравнивается с базовым решением из курса, ученики с аккаунтом попадают в таблицу лидеров.
sources:
