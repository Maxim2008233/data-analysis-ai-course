      options:
        - Не обязательно — разница в 22 единицы на 1 856 машинах может быть шумом
        - Да, B точно лучше
        - Нет, A точно лучше
      answer: 0
      explain: "Устойчивость разницы проверяют на нескольких разбиениях своей validation (урок 7.8)."
    - q: В проверочной таблице у 52 машин пропуски в признаках. Что делать?
      options:
