- id: c1-l2-t5
  title: Прогнозы для всех машин
  difficulty: main
  introduces: []
  uses: [log-target]
  statement: |
    Финальная модель `final` уже обучена на всей таблице `clean` (LightGBM на логарифме цены, категории — по словарю `clean`). Подготовьте проверочную таблицу: `test_p = parse(test)`, затем `C_test` — категории по словарю `clean`. Получите прогнозы в исходных единицах и соберите `submission` — DataFrame с колонками `ID` (из проверочной таблицы) и `Predict`.

    Прогноз нужен для **каждой** из 1 856 машин — даже если в её признаках есть пропуски.
  prelude: |
    import numpy as np
    import pandas as pd
    from lightgbm import LGBMRegressor
    train = pd.read_csv('competition_cars_train.csv')
    test = pd.read_csv('competition_cars_test.csv')
    def parse(df):
        out = df.copy()
        engine = out['Engine'].astype(str)
        out['Turbo'] = engine.str.contains('Turbo').astype(int)
        out['Engine'] = engine.str.extract(r'(\d+\.?\d*)')[0].astype(float)
        out['Distance'] = out['Distance'].str.extract(r'(\d+)')[0].astype(float)
        return out
    train_p = parse(train)
    features = [c for c in train_p.columns if c != 'ID']
    clean = train_p.drop_duplicates(subset=features)
    clean = clean[clean['Price'].between(1000, 500000)]
    nums = ['Year', 'Engine', 'Turbo', 'Distance', 'Cylinders']
    cats = ['Make', 'Model', 'Style', 'Fuel', 'Transmission', 'Drive', 'Wheel', 'Color']
    def as_category(table, train_table):
        out = table.copy()
        for c in cats:
            levels = sorted(train_table[c].dropna().unique())
            out[c] = pd.Categorical(out[c].where(out[c].isin(levels)), categories=levels)
        return out
    C_clean = as_category(clean, clean)
    final = LGBMRegressor(n_estimators=300, learning_rate=0.05, random_state=42, verbosity=-1, n_jobs=1)
    final.fit(C_clean[cats + nums], np.log(C_clean['Price']))
  starter: |
    test_p = parse(test)
    C_test = ...
    pred = ...
    submission = pd.DataFrame({'ID': ..., 'Predict': ...})
    print(submission.shape)
    print(submission.head())
  solution: |
    test_p = parse(test)
    C_test = as_category(test_p, clean)
    pred = np.exp(final.predict(C_test[cats + nums]))
    submission = pd.DataFrame({'ID': test_p['ID'], 'Predict': pred})
    print(submission.shape)
    print(submission.head())
  explanation: |
    - В проверочной таблице у 52 машин есть пропуски в числовых признаках. Если сделать `dropna()`, как в исходном ноутбуке курса, эти машины останутся без прогноза, и сервер не примет отправку. LightGBM умеет работать с пропусками сам, а для других моделей их заполняют медианами обучающей части.
    - Категории проверочной таблицы — по словарю `clean`: 171 машина с моделью, которой нет в обучающей части, получает пропуск в `Model`.
    - Прогноз модели — логарифм цены, поэтому в `Predict` идёт `np.exp(...)`. Этот код целиком — готовое решение для формы отправки в уроке С1.3.
  hints:
    - "Категории — `as_category(test_p, clean)`."
    - "Прогноз в исходных единицах — `np.exp(final.predict(C_test[cats + nums]))`."
    - "Не удаляйте строки: `submission = pd.DataFrame({'ID': test_p['ID'], 'Predict': pred})`."
  tests: |
    import numpy as np
    import pandas as pd
    s = var('submission', pd.DataFrame, 'таблицей DataFrame')
    ensure(list(s.columns) == ['ID', 'Predict'], 'Колонки `submission` — `[\'ID\', \'Predict\']`.')
    n = len(ref('test'))
    if len(s) < n:
        fail('Нет прогнозов для {0} машин: строк {1} из {2}. Не удаляйте строки проверочной таблицы — LightGBM работает с пропусками в признаках.'.format(n - len(s), len(s), n))
    ensure(len(s) == n and sorted(s['ID'].tolist()) == sorted(ref('test')['ID'].tolist()), 'В `submission` должны быть все ID проверочной таблицы ровно по одному разу.')
    p = s['Predict'].to_numpy(dtype=float)
    ensure(np.isfinite(p).all(), 'В `Predict` есть пропуски или бесконечности.')
    if p.max() < 20:
        fail('Прогнозы похожи на логарифмы (максимум {0:.1f}). Верните их в исходные единицы: `np.exp(...)`.'.format(p.max()))
    same_array(s.sort_values('ID')['Predict'].to_numpy(dtype=float), ref('submission').sort_values('ID')['Predict'].to_numpy(dtype=float), 'Прогнозы не совпадают с эталоном: категории проверочной таблицы — по словарю `clean`.', rtol=1e-6)
  files: [competition_cars_train.csv, competition_cars_test.csv]
  wrong:
    - code: |
        test_p = parse(test).dropna()
        C_test = as_category(test_p, clean)
        pred = np.exp(final.predict(C_test[cats + nums]))
        submission = pd.DataFrame({'ID': test_p['ID'], 'Predict': pred})
      expect: Нет прогнозов для
    - code: |
        test_p = parse(test)
        C_test = as_category(test_p, clean)
        pred = final.predict(C_test[cats + nums])
        submission = pd.DataFrame({'ID': test_p['ID'], 'Predict': pred})
      expect: похожи на логарифмы

