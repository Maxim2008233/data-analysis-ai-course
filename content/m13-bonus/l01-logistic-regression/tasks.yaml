        mu = dict(zip(features, scaler.mean_))
        sd = dict(zip(features, scaler.scale_))
        car = {'Year': 2010, 'Distance': 150000, 'Engine': 1600}
        rest = lr.intercept_[0] + sum(w[f] * car[f] for f in car)
        price_50 = float(mu['Price'] + sd['Price'] * (-rest) / w['Price'])
        p_check = float(model.predict_proba(pd.DataFrame([{**car, 'Price': price_50}])[features])[0, 1])
      expect: стандартизацию
    - code: |
