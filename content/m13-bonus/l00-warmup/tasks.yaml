    close(ah, ref('acc_by_hand'), 'Доля верных ручного ответа — {expected}, а у вас {actual}.')
    close(var('acc_tree', 'number', 'числом'), ah, 'Ручной ответ должен совпасть с tree.score: у дерева {actual}, вручную {expected}.')
