  solution: |
    tree = DecisionTreeClassifier(max_depth=1, random_state=0).fit(X_train, y_train)
    feature = X_train.columns[tree.tree_.feature[0]]
    threshold = float(tree.tree_.threshold[0])
    left = X_train[feature] <= threshold
    left_share = float(y_train[left].mean())
    right_share = float(y_train[~left].mean())
    pred = (X_valid[feature] > threshold).astype(int)
    acc_by_hand = float((pred == y_valid).mean())
    acc_tree = float(tree.score(X_valid, y_valid))
    print(feature, threshold, round(left_share, 3), round(right_share, 3), round(acc_by_hand, 4), round(acc_tree, 4))
  explanation: |
    - Первый вопрос — о цене. Среди машин не дороже 8794,5 евро автоматов 25 %, среди более дорогих — 81 %. Лист отвечает самым частым классом: слева механика, справа автомат.
    - Ручной ответ совпал с `tree.score`: 77,8 % верных против 54,8 % у ориентира. Правило «дороже медианы» из задания 2 давало 76,1 %: порог дерева подобран по данным лучше медианы.
    - Доли в листьях считают по обучающей части — по ней дерево и выбирало ответы листьев. Как дерево ищет сам порог, разберём в уроке Б.6.
  hints:
    - "Доля автоматов слева — `y_train[left].mean()`, справа — `y_train[~left].mean()`."
    - "Доля верных ручного ответа — `(pred == y_valid).mean()`."
    - "`~left` — отрицание маски: машины, у которых признак больше порога."
  tests: |
    equal(var('feature'), ref('feature'), 'Признак первого вопроса — {expected}, а у вас {actual}.')
    close(var('threshold', 'number', 'числом'), ref('threshold'), 'Порог первого вопроса — {expected}, а у вас {actual}.')
    ls = var('left_share', 'number', 'числом')
    Xv_, yv_ = ref('X_valid'), ref('y_valid')
    lv = Xv_[ref('feature')] <= ref('threshold')
    if abs(ls - float(yv_[lv].mean())) < 1e-9:
        fail('Доли в листьях считают по обучающей части: по ней дерево и выбирало ответы листьев.')
    close(ls, ref('left_share'), 'Доля автоматов слева — {expected}, а у вас {actual}.')
    close(var('right_share', 'number', 'числом'), ref('right_share'), 'Доля автоматов справа — {expected}, а у вас {actual}.')
    ah = var('acc_by_hand', 'number', 'числом')
