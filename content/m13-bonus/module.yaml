title: "Бонус: классификация, PCA, k-means и алгоритмы своими руками"
short: Бонус
description: >-
  Необязательный модуль для тех, кто хочет глубже. Логистическая регрессия: сигмоида, логистическая функция потерь и
  смысл коэффициентов на задаче «автомат или механика». Метрики классификации: матрица ошибок, точность и полнота, ROC
  и AUC, выбор порога. Несбалансированные классы на гибридах среди машин: почему доля верных обманывает, веса классов,
  дублирование и сдвиг порога. Обучение без учителя: метод главных компонент и кластеризация k-средних на машинах.
  «Реализуй сам»: логистическая регрессия, PCA, k-means и дерево решений на NumPy с тем же устройством fit и predict,
  что в scikit-learn. Мини-проект — данные о загрязнении воды из лабораторной: проверяем постановку задачи и честно
  оцениваем, что из этих данных можно предсказать.
