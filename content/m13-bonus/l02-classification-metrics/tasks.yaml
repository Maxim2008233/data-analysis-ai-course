  solution: |
    def roc_points(y_true, p, thresholds):
        t = np.asarray(y_true)
        p = np.asarray(p)
        fpr, tpr = [], []
        for th in thresholds:
            pred = p >= th
            tp = (pred & (t == 1)).sum()
            fp = (pred & (t == 0)).sum()
            fpr.append(fp / (t == 0).sum())
            tpr.append(tp / (t == 1).sum())
        return np.array(fpr), np.array(tpr)

    fpr, tpr = roc_points(y_test, p_test, grid)
    auc_grid = float(np.trapezoid(tpr, fpr))
    auc_exact = float(roc_auc_score(y_test, p_test))
    print(round(auc_grid, 4), round(auc_exact, 4))
  explanation: |
    - FPR делится на число настоящих нулей (FP + TN = все механики), TPR — на число настоящих единиц (TP + FN = все автоматы).
    - Порог 1 почти никого не называет автоматом — точка у (0, 0), порог 0 называет всех — точка (1, 1). Между ними ломаная поднимается вверх и вправо.
    - `np.trapezoid` складывает площади трапеций между соседними точками. По 101 порогу площадь — 0,8794, точная AUC по всем различным оценкам — 0,8795. Сетка в сотые почти не теряет точности, а `roc_curve` берёт все пороги сразу.
  hints:
