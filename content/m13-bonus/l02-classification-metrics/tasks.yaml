    auc_base = roc_auc_score(y_valid, base.predict_proba(Xa_valid[features])[:, 1])
    auc_rich = ...
    better = ...
    print(round(auc_base, 4), round(auc_rich, 4), better)
  solution: |
    rich = make_pipeline(
        make_column_transformer((StandardScaler(), features), (OneHotEncoder(handle_unknown='ignore'), ['Fuel_type', 'Style', 'Make'])),
        LogisticRegression(max_iter=2000))
    rich.fit(Xa_train, y_train)
    auc_base = roc_auc_score(y_valid, base.predict_proba(Xa_valid[features])[:, 1])
    auc_rich = roc_auc_score(y_valid, rich.predict_proba(Xa_valid)[:, 1])
