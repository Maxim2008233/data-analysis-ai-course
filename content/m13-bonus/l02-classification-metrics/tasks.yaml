  solution: |
    def prf(y_true, y_pred):
        t, p = np.asarray(y_true), np.asarray(y_pred)
        tp = ((t == 1) & (p == 1)).sum()
        fp = ((t == 0) & (p == 1)).sum()
        fn = ((t == 1) & (p == 0)).sum()
        precision = tp / (tp + fp) if tp + fp > 0 else 0.0
        recall = tp / (tp + fn) if tp + fn > 0 else 0.0
        f1 = 2 * precision * recall / (precision + recall) if precision + recall > 0 else 0.0
        return float(precision), float(recall), float(f1)

    metrics_05 = prf(y_test, (p_test >= 0.5).astype(int))
    metrics_all = prf(y_test, np.ones(len(y_test), dtype=int))
    print(np.round(metrics_05, 3), np.round(metrics_all, 3))
  explanation: |
    - Точность смотрит на названных автоматом: сколько из них правда автоматы. Полнота смотрит на настоящие автоматы: скольких назвали.
    - Проверки на ноль нужны: модель, которая никого не назвала классом 1, иначе получила бы деление 0 / 0.
    - При пороге 0,5 точность 0,833, полнота 0,735, F1 0,781. Правило «всё — автоматы» даёт полноту 1, но точность 0,455 — это просто доля автоматов — и F1 0,626. По полноте оно идеально, по смыслу бесполезно. F1 это видит, а одна полнота — нет.
  hints:
    - "Точность — `tp / (tp + fp)`, полнота — `tp / (tp + fn)`; при нулевом знаменателе — 0."
    - "F1 — `2 * precision * recall / (precision + recall)`, при нулевой сумме — 0."
    - "Условие в одну строку: `tp / (tp + fp) if tp + fp > 0 else 0.0`."
  tests: |
    import numpy as np
    f = var('prf')
    ensure(callable(f), '`prf` должна быть функцией.')
    got = f(np.array([1, 0, 1, 1, 0]), np.array([1, 1, 0, 1, 0]))
    ensure(isinstance(got, tuple) and len(got) == 3, '`prf` должна вернуть кортеж из трёх чисел.')
    p_, r_, f_ = got
    close(p_, 2 / 3, 'Точность: из трёх названных автоматом верны два — 2/3, а у вас {actual}.')
    close(r_, 2 / 3, 'Полнота: из трёх настоящих автоматов найдены два — 2/3, а у вас {actual}.')
    got = f(np.array([1, 1, 1, 0]), np.array([1, 0, 0, 0]))
    if abs(got[0] - 1 / 3) < 1e-9:
        fail('Точность и полнота перепутаны: точность — доля верных среди названных (1 из 1), полнота — среди настоящих (1 из 3).')
    close(got[0], 1.0, 'Точность для y = [1, 1, 1, 0], pred = [1, 0, 0, 0] — 1, а у вас {actual}.')
    close(got[1], 1 / 3, 'Полнота — 1/3, а у вас {actual}.')
    close(got[2], 0.5, 'F1 = 2·1·(1/3) / (1 + 1/3) = 0.5, а у вас {actual}.')
    z = f(np.array([1, 0]), np.array([0, 0]))
    ensure(all(np.isfinite(v) for v in z), 'Модель никого не назвала классом 1 — точность и F1 должны быть 0, а не nan.')
    same_array(np.asarray(z, dtype=float), [0.0, 0.0, 0.0], 'Если модель никого не назвала классом 1, все три метрики — 0.')
    same_array(np.asarray(var('metrics_05'), dtype=float), np.asarray(ref('metrics_05'), dtype=float), 'Метрики при пороге 0.5 не совпадают с ожидаемыми.')
    same_array(np.asarray(var('metrics_all'), dtype=float), np.asarray(ref('metrics_all'), dtype=float), 'Метрики правила «всё — автоматы» не совпадают с ожидаемыми.')
  files: [cars_processed.csv]
