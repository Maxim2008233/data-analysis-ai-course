    close(bt, ref('best_th'), 'Лучший порог на валидации — {expected}, а у вас {actual}.')
    close(var('f1_test_best', 'number', 'числом'), ref('f1_test_best'), 'F1 на тесте при лучшем пороге — {expected}, а у вас {actual}.')
    close(var('f1_test_05', 'number', 'числом'), ref('f1_test_05'), 'F1 на тесте при пороге 0.5 — {expected}, а у вас {actual}.')
