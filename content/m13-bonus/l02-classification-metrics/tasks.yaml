        fail('FPR и TPR перепутаны: TPR — доля найденных среди класса 1, FPR — доля ложных среди класса 0.')
    same_array(fpr, [0, 0, 0.5, 1], 'FPR для порогов 1, 0.5, 0.38, 0 — [0, 0, 0.5, 1].')
    same_array(tpr, [0, 0.5, 0.5, 1], 'TPR для тех же порогов — [0, 0.5, 0.5, 1].')
    close(var('auc_grid', 'number', 'числом'), ref('auc_grid'), 'Площадь по 101 порогу — {expected}, а у вас {actual}.')
