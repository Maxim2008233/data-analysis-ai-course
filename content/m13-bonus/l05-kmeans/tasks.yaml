        premium = int(profile['price'].idxmax())
        premium_auto = float(profile.loc[premium, 'auto'])
        cheap_auto = float(profile.loc[profile['price'].idxmin(), 'price'])
      expect: в самом дешёвом сегменте
    - code: |
