    sizes = sorted(np.bincount(km.labels_).tolist(), reverse=True)
    profile = cars.assign(cluster=km.labels_).groupby('cluster').agg(
        year=('Year', 'median'), price=('Price', 'median'), distance=('Distance', 'median'), auto=('AutoTransmission', 'mean'))
    premium = int(profile['price'].idxmax())
    premium_auto = ...
    cheap_auto = ...
    print(sizes)
    print(profile.round(2))
    print(premium, round(premium_auto, 3), round(cheap_auto, 3))
  solution: |
    km = KMeans(n_clusters=4, n_init=10, random_state=0).fit(Xs)
    sizes = sorted(np.bincount(km.labels_).tolist(), reverse=True)
    profile = cars.assign(cluster=km.labels_).groupby('cluster').agg(
        year=('Year', 'median'), price=('Price', 'median'), distance=('Distance', 'median'), auto=('AutoTransmission', 'mean'))
    premium = int(profile['price'].idxmax())
    premium_auto = float(profile.loc[premium, 'auto'])
    cheap_auto = float(profile.loc[profile['price'].idxmin(), 'auto'])
    print(sizes)
    print(profile.round(2))
    print(premium, round(premium_auto, 3), round(cheap_auto, 3))
  explanation: |
    - `np.bincount(km.labels_)` считает машины в каждом кластере, `sorted(..., reverse=True)` — по убыванию. Номера кластеров произвольны, поэтому сравнивать надо размеры и профили, а не номера.
    - Профиль — медианы признаков по кластерам. Медиана, а не среднее: у цены и пробега длинные хвосты.
    - В сегменте «новые дорогие» 88 % автоматов, в самом дешёвом — 14 %. Коробку передач кластеризация не видела, но сегменты с ней связаны — как первая главная компонента в уроке Б.4.
  hints:
