- id: b1-l5-t1
  title: Ближайший центр
  difficulty: warmup
  introduces: [k-means]
  uses: [standard-scaler]
  statement: |
    Напишите функцию `assign(X, centers)` без циклов: для каждой строки `X` — номер ближайшего центра по обычному (евклидову) расстоянию. Расстояния до всех центров сразу дают разности `X[:, None, :] - centers[None, :, :]`.

    Для 300 машин `P` (стандартизованные год и логарифм цены) и начальных центров `centers0` получите `labels0` — номера ближайших центров и `sizes0` — список размеров трёх групп.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.preprocessing import StandardScaler
    cars = pd.read_csv('cars_processed.csv')
    cars['logPrice'] = np.log(cars['Price'])
    Xs = StandardScaler().fit_transform(cars[['Year', 'Distance', 'Engine', 'logPrice', 'km_year']].to_numpy(dtype=float))
    rng = np.random.default_rng(1)
    P = Xs[rng.choice(len(Xs), 300, replace=False)][:, [0, 3]]
    centers0 = P[rng.choice(len(P), 3, replace=False)]
  starter: |
    def assign(X, centers):
        d = ((X[:, None, :] - centers[None, :, :]) ** 2).sum(axis=...)
        return d.argmin(axis=...)

    labels0 = assign(P, centers0)
    sizes0 = [int((labels0 == k).sum()) for k in range(3)]
    print(sizes0)
  solution: |
    def assign(X, centers):
        d = ((X[:, None, :] - centers[None, :, :]) ** 2).sum(axis=2)
        return d.argmin(axis=1)

    labels0 = assign(P, centers0)
    sizes0 = [int((labels0 == k).sum()) for k in range(3)]
    print(sizes0)
  explanation: |
    - `X[:, None, :] - centers[None, :, :]` — массив 300 × 3 × 2: разность каждой машины с каждым центром по каждому признаку (broadcasting, урок 1.10).
    - Сумма квадратов по последней оси (`axis=2`) — квадрат расстояния до каждого центра; `argmin(axis=1)` — номер ближайшего. Корень не нужен: он не меняет порядка расстояний.
    - Это первый шаг k-means. Размеры групп после него неравные — центры выбраны случайно. Следующие шаги их поправят.
  hints:
    - "Сумма квадратов — по оси признаков, последней: `axis=2`."
    - "Ближайший центр — минимум по оси центров: `d.argmin(axis=1)`."
    - "Квадратный корень не нужен — он не меняет, какой центр ближе."
  tests: |
    import numpy as np
    f = var('assign')
    ensure(callable(f), '`assign` должна быть функцией.')
    X = np.array([[0.0, 0.0], [1.0, 0.0], [9.0, 9.0], [10.0, 9.5]])
    C = np.array([[10.0, 10.0], [0.0, 0.0]])
    got = np.asarray(f(X, C))
    ensure(got.shape == (4,), 'Нужен один номер центра на каждую строку X — массив длины 4, а у вас форма {0}.'.format(got.shape))
    equal([int(v) for v in got], [1, 1, 0, 0], 'Для точек (0,0), (1,0), (9,9), (10,9.5) и центров (10,10), (0,0) номера — [1, 1, 0, 0], а у вас {actual}.')
    equal(var('sizes0', list, 'списком'), ref('sizes0'), 'Размеры групп после первого назначения — {expected}, а у вас {actual}.')
  files: [cars_processed.csv]
  wrong:
    - code: |
        def assign(X, centers):
            d = ((X[:, None, :] - centers[None, :, :]) ** 2).sum(axis=2)
            return d.argmin(axis=0)
        labels0 = assign(P, centers0)
        sizes0 = [int((labels0 == k).sum()) for k in range(3)]
      expect: один номер центра на каждую строку
    - code: |
        def assign(X, centers):
            d = ((X[:, None, :] - centers[None, :, :]) ** 2).sum(axis=2)
            return d.argmax(axis=1)
        labels0 = assign(P, centers0)
        sizes0 = [int((labels0 == k).sum()) for k in range(3)]
      expect: "[1, 1, 0, 0]"

- id: b1-l5-t2
  title: Пересчёт центров и сходимость
  difficulty: main
  introduces: []
  uses: [k-means]
  statement: |
    1. Напишите функцию `update(X, labels, k)` — массив k центров: центр j — среднее строк `X` с меткой j.
    2. Напишите функцию `run_kmeans(X, centers, max_iter=100)`: повторять «назначить ближайшим (`assign` уже есть) → пересчитать центры», пока центры меняются (`np.allclose`), но не больше `max_iter` раз. Функция возвращает `(centers, labels, steps)`, где `steps` — сколько раз выполнялось назначение.

    Запустите её на `P` от `centers0` и сравните с scikit-learn: `KMeans(n_clusters=3, init=centers0, n_init=1, tol=0)` проходит тот же путь. `tol=0` — останавливаться только тогда, когда назначения перестали меняться, как в вашем цикле. Получите `steps`, `my_inertia` — инерцию своего решения и `sk_inertia` — инерцию решения sklearn.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.preprocessing import StandardScaler
    from sklearn.cluster import KMeans
    cars = pd.read_csv('cars_processed.csv')
    cars['logPrice'] = np.log(cars['Price'])
    Xs = StandardScaler().fit_transform(cars[['Year', 'Distance', 'Engine', 'logPrice', 'km_year']].to_numpy(dtype=float))
    rng = np.random.default_rng(1)
    P = Xs[rng.choice(len(Xs), 300, replace=False)][:, [0, 3]]
    centers0 = P[rng.choice(len(P), 3, replace=False)]

    def assign(X, centers):
        return ((X[:, None, :] - centers[None, :, :]) ** 2).sum(axis=2).argmin(axis=1)
  starter: |
    def update(X, labels, k):
        return np.array([... for j in range(k)])

    def run_kmeans(X, centers, max_iter=100):
        for steps in range(1, max_iter + 1):
            labels = assign(X, centers)
            new = update(X, labels, len(centers))
            if np.allclose(new, centers):
                break
            centers = new
        return centers, labels, steps

    centers, labels, steps = run_kmeans(P, centers0)
    my_inertia = float(((P - centers[labels]) ** 2).sum())
    sk = KMeans(n_clusters=3, init=centers0, n_init=1, tol=0).fit(P)
    sk_inertia = float(sk.inertia_)
    print(steps, round(my_inertia, 2), round(sk_inertia, 2))
  solution: |
    def update(X, labels, k):
        return np.array([X[labels == j].mean(axis=0) for j in range(k)])

    def run_kmeans(X, centers, max_iter=100):
        for steps in range(1, max_iter + 1):
            labels = assign(X, centers)
            new = update(X, labels, len(centers))
            if np.allclose(new, centers):
                break
            centers = new
        return centers, labels, steps

    centers, labels, steps = run_kmeans(P, centers0)
    my_inertia = float(((P - centers[labels]) ** 2).sum())
    sk = KMeans(n_clusters=3, init=centers0, n_init=1, tol=0).fit(P)
    sk_inertia = float(sk.inertia_)
    print(steps, round(my_inertia, 2), round(sk_inertia, 2))
  explanation: |
    - `X[labels == j].mean(axis=0)` — среднее по строкам кластера j для каждого признака. Среднее — точка, для которой сумма квадратов расстояний до своих объектов наименьшая. Поэтому пересчёт центров не увеличивает инерцию.
    - Цикл останавливается, когда центры перестают двигаться. Здесь это 14 назначений, а последние шаги почти ничего не меняют.
    - `centers[labels]` — центр каждой машины, а инерция — сумма квадратов расстояний до них. Своё решение совпало с решением sklearn: от тех же начальных центров алгоритм Ллойда проходит тот же путь.
  hints:
    - "Центр кластера j — `X[labels == j].mean(axis=0)`."
    - "Остальное в заготовке: цикл повторяет назначение и пересчёт, пока центры меняются."
    - "Инерция уже считается в заготовке по `centers[labels]`."
  tests: |
    import numpy as np
    f = var('update')
    ensure(callable(f), '`update` должна быть функцией.')
    X = np.array([[0.0, 0.0], [2.0, 0.0], [10.0, 10.0], [12.0, 14.0]])
    got = np.asarray(f(X, np.array([0, 0, 1, 1]), 2))
    same_array(got, [[1.0, 0.0], [11.0, 12.0]], 'Центры групп {(0,0), (2,0)} и {(10,10), (12,14)} — (1, 0) и (11, 12): среднее по строкам, axis=0.')
    st = var('steps', 'int', 'целым числом')
    equal(int(st), int(ref('steps')), 'Назначений до остановки — {expected}, а у вас {actual}.')
    mi = var('my_inertia', 'number', 'числом')
    close(mi, ref('my_inertia'), 'Инерция своего решения — {expected}, а у вас {actual}.')
    close(mi, var('sk_inertia', 'number', 'числом'), 'Своё решение должно совпасть с KMeans от тех же центров: у sklearn {expected}, у вас {actual}.', rtol=1e-6)
  files: [cars_processed.csv]
