- id: b1-l5-t6
  title: Начальные центры
  difficulty: star
  introduces: []
  uses: [k-means]
  statement: |
    Проверьте, насколько результат k-means зависит от старта. Для `seed` от 0 до 5 обучите `KMeans(n_clusters=4, n_init=1, init='random', random_state=seed)` на `Xs` и соберите инерции в `random_inertias`. Получите:

    - `best`, `worst` — наименьшую и наибольшую из них;
    - `n_stuck` — сколько запусков дали инерцию больше `best` более чем на 1 %;
    - `pp_inertia` — инерцию `KMeans(n_clusters=4, n_init=10, random_state=0)` с инициализацией по умолчанию (k-means++);
    - `pp_gap` — на сколько процентов `pp_inertia` больше `best` (может быть и 0).
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.preprocessing import StandardScaler
    from sklearn.cluster import KMeans
    cars = pd.read_csv('cars_processed.csv')
    cars['logPrice'] = np.log(cars['Price'])
    Xs = StandardScaler().fit_transform(cars[['Year', 'Distance', 'Engine', 'logPrice', 'km_year']].to_numpy(dtype=float))
  starter: |
    random_inertias = [float(KMeans(n_clusters=4, n_init=1, init='random', random_state=s).fit(Xs).inertia_) for s in range(6)]
    best, worst = min(random_inertias), max(random_inertias)
    n_stuck = ...
    pp_inertia = float(KMeans(n_clusters=4, n_init=10, random_state=0).fit(Xs).inertia_)
    pp_gap = ...
    print(round(best), round(worst), n_stuck, round(pp_inertia), round(pp_gap, 3))
  solution: |
    random_inertias = [float(KMeans(n_clusters=4, n_init=1, init='random', random_state=s).fit(Xs).inertia_) for s in range(6)]
    best, worst = min(random_inertias), max(random_inertias)
    n_stuck = sum(v > best * 1.01 for v in random_inertias)
    pp_inertia = float(KMeans(n_clusters=4, n_init=10, random_state=0).fit(Xs).inertia_)
    pp_gap = (pp_inertia - best) / best * 100
    print(round(best), round(worst), n_stuck, round(pp_inertia), round(pp_gap, 3))
  explanation: |
    - Каждый запуск с одного случайного старта доходит до ближайшего локального минимума инерции. Большинство запусков приходят почти в одну точку, но часть застревает — с инерцией на пару процентов хуже. Это другое, худшее разбиение машин.
    - k-means++ выбирает начальные центры подальше друг от друга, а 10 запусков с выбором лучшего почти всегда находят лучшее решение. Здесь его инерция практически совпадает с лучшей из случайных.
    - Поэтому `n_init=1` с `init='random'` годится только для учебных примеров. В работе оставляют значения по умолчанию или увеличивают `n_init`.
  hints:
    - "Застрявшие запуски — `sum(v > best * 1.01 for v in random_inertias)`."
    - "Разница в процентах — `(pp_inertia - best) / best * 100`."
    - "Список инерций и `best`, `worst` уже собраны в заготовке."
  tests: |
    close(var('best', 'number', 'числом'), ref('best'), 'Лучшая инерция — {expected}, а у вас {actual}.')
    close(var('worst', 'number', 'числом'), ref('worst'), 'Худшая инерция — {expected}, а у вас {actual}.')
    ns = var('n_stuck', 'int', 'целым числом')
    equal(int(ns), int(ref('n_stuck')), 'Застрявших запусков — {expected}, а у вас {actual}. Застрявший — инерция больше best · 1.01.')
    close(var('pp_inertia', 'number', 'числом'), ref('pp_inertia'), 'Инерция k-means++ с 10 запусками — {expected}, а у вас {actual}.')
    pg = var('pp_gap', 'number', 'числом')
    if abs(pg - ref('pp_gap') / 100) < 1e-12 and abs(ref('pp_gap')) > 1e-9:
        fail('Разница нужна в процентах: умножьте на 100.')
    close(pg, ref('pp_gap'), 'Разница с лучшим случайным запуском — {expected} %, а у вас {actual}.', atol=1e-6)
