- id: b1-l5-t3
  title: Сегменты рынка
  difficulty: main
  introduces: []
  uses: [k-means, standard-scaler]
  statement: |
    Разбейте все машины на четыре кластера: `KMeans(n_clusters=4, n_init=10, random_state=0)` на стандартизованных признаках `Xs`. Получите:

    - `sizes` — размеры кластеров по убыванию;
    - `profile` — таблицу медиан `Year`, `Price`, `Distance` и доли автоматов `AutoTransmission` по кластерам (`groupby` по меткам);
    - `premium` — номер кластера с наибольшей медианной ценой, `premium_auto` — доля автоматов в нём;
    - `cheap_auto` — доля автоматов в кластере с наименьшей медианной ценой.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.preprocessing import StandardScaler
    from sklearn.cluster import KMeans
    cars = pd.read_csv('cars_processed.csv')
    cars['logPrice'] = np.log(cars['Price'])
    cols = ['Year', 'Distance', 'Engine', 'logPrice', 'km_year']
    Xs = StandardScaler().fit_transform(cars[cols].to_numpy(dtype=float))
