- id: b1-l5-t4
  title: Инерция и локоть
  difficulty: main
  introduces: [cluster-count]
  uses: [k-means]
  statement: |
    1. Напишите функцию `inertia(X, labels, centers)` — сумму квадратов расстояний объектов до центров их кластеров.
    2. Для k от 1 до 8 обучите `KMeans(n_clusters=k, n_init=10, random_state=0)` на `Xs` и соберите `inertias` своей функцией (по `labels_` и `cluster_centers_`).
    3. `drops` — относительное падение инерции при переходе k → k + 1: (I_k − I_{k+1}) / I_k.
    4. `k_elbow` — первое k, после которого падение меньше 15 %.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.preprocessing import StandardScaler
    from sklearn.cluster import KMeans
    cars = pd.read_csv('cars_processed.csv')
    cars['logPrice'] = np.log(cars['Price'])
    Xs = StandardScaler().fit_transform(cars[['Year', 'Distance', 'Engine', 'logPrice', 'km_year']].to_numpy(dtype=float))
  starter: |
    def inertia(X, labels, centers):
        return float(...)

    inertias = []
    for k in range(1, 9):
        km = KMeans(n_clusters=k, n_init=10, random_state=0).fit(Xs)
        inertias.append(inertia(Xs, km.labels_, km.cluster_centers_))
    drops = -np.diff(inertias) / np.array(inertias[:-1])
    k_elbow = ...
    print(np.round(inertias), np.round(drops, 3), k_elbow)
  solution: |
    def inertia(X, labels, centers):
        return float(((X - centers[labels]) ** 2).sum())

    inertias = []
    for k in range(1, 9):
        km = KMeans(n_clusters=k, n_init=10, random_state=0).fit(Xs)
        inertias.append(inertia(Xs, km.labels_, km.cluster_centers_))
    drops = -np.diff(inertias) / np.array(inertias[:-1])
    k_elbow = int(np.argmax(drops < 0.15)) + 1
    print(np.round(inertias), np.round(drops, 3), k_elbow)
  explanation: |
    - `centers[labels]` ставит каждому объекту центр его кластера; сумма квадратов разностей — инерция. Она совпадает с `inertia_` из sklearn.
    - `drops[i]` — падение при переходе от k = i + 1 к k = i + 2. `np.argmax(drops < 0.15)` — первая позиция, где условие выполнено, а `+ 1` переводит её в k.
    - Падения: 27,5 %, 15,3 %, 14,97 %, 12,6 %, 12,2 %, 7,0 %, 6,8 %. Правило «меньше 15 %» даёт k = 3: падение от 3 к 4 кластерам на волосок ниже порога. Правило «меньше 10 %» дало бы 6. Порог — договорённость. На размытом локте k выбирают по смыслу сегментов, а инерцию используют как подсказку.
  hints:
    - "Центр каждого объекта — `centers[labels]`; инерция — `((X - centers[labels]) ** 2).sum()`."
    - "Первое падение меньше 15 % — `np.argmax(drops < 0.15)`; это номер позиции, k на единицу больше."
    - "`k_elbow = int(np.argmax(drops < 0.15)) + 1`."
  tests: |
    import numpy as np
    f = var('inertia')
    ensure(callable(f), '`inertia` должна быть функцией.')
    X = np.array([[0.0, 0.0], [4.0, 0.0], [10.0, 10.0]])
    got = f(X, np.array([0, 0, 1]), np.array([[2.0, 0.0], [10.0, 10.0]]))
    if abs(got - 4.0) < 1e-9 or abs(got - 8.0 / 3) < 1e-9:
        fail('Инерция — сумма квадратов расстояний, без корня и без деления на число объектов. Для точек (0,0), (4,0) с центром (2,0) и точки (10,10) в своём центре — 4 + 4 + 0 = 8.')
    close(got, 8.0, 'Для точек (0,0), (4,0) с центром (2,0) и точки (10,10) с центром в ней инерция — 4 + 4 + 0 = 8, а у вас {actual}.')
    same_array(np.asarray(var('inertias'), dtype=float), np.asarray(ref('inertias'), dtype=float), 'Инерции для k = 1…8 не совпадают с ожидаемыми.')
    same_array(np.asarray(var('drops'), dtype=float), np.asarray(ref('drops'), dtype=float), 'Относительные падения не совпадают с ожидаемыми.')
    ke = var('k_elbow', 'int', 'целым числом')
    if int(ke) == int(ref('k_elbow')) - 1:
        fail('Это номер позиции в drops. k на единицу больше: drops[0] — переход от k = 1 к k = 2.')
    equal(int(ke), int(ref('k_elbow')), 'Первое k, после которого падение меньше 15 %, — {expected}, а у вас {actual}.')
  files: [cars_processed.csv]
  wrong:
    - code: |
        def inertia(X, labels, centers):
            return float(np.sqrt(((X - centers[labels]) ** 2).sum(axis=1)).sum())
        inertias = []
        for k in range(1, 9):
            km = KMeans(n_clusters=k, n_init=10, random_state=0).fit(Xs)
            inertias.append(inertia(Xs, km.labels_, km.cluster_centers_))
        drops = -np.diff(inertias) / np.array(inertias[:-1])
        k_elbow = int(np.argmax(drops < 0.15)) + 1
      expect: без корня
    - code: |
        def inertia(X, labels, centers):
            return float(((X - centers[labels]) ** 2).sum())
        inertias = []
        for k in range(1, 9):
            km = KMeans(n_clusters=k, n_init=10, random_state=0).fit(Xs)
            inertias.append(inertia(Xs, km.labels_, km.cluster_centers_))
        drops = -np.diff(inertias) / np.array(inertias[:-1])
        k_elbow = int(np.argmax(drops < 0.15))
      expect: номер позиции

