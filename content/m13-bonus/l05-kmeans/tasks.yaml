    rr = var('r2_raw', dict, 'словарём')
    rs = var('r2_std', dict, 'словарём')
    for c in ref('cols'):
        close(rr[c], ref('r2_raw')[c], 'R² признака ' + c + ' для разбиения по сырым признакам — {expected}, а у вас {actual}.')
        close(rs[c], ref('r2_std')[c], 'R² признака ' + c + ' для разбиения по стандартизованным — {expected}, а у вас {actual}.')
