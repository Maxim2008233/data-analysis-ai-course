    def explained_by_clusters(values, labels):
        values = np.asarray(values, dtype=float)
        means = pd.Series(values).groupby(labels).transform('mean').to_numpy()
        within = ((values - means) ** 2).sum()
        total = ((values - values.mean()) ** 2).sum()
        return float(1 - within / total)

    lab_raw = KMeans(n_clusters=4, n_init=10, random_state=0).fit(raw).labels_
    lab_std = KMeans(n_clusters=4, n_init=10, random_state=0).fit(Xs).labels_
    r2_raw = {c: explained_by_clusters(cars[c], lab_raw) for c in cols}
    r2_std = {c: explained_by_clusters(cars[c], lab_std) for c in cols}
    raw_main = max(r2_raw, key=r2_raw.get)
    print({c: round(v, 2) for c, v in r2_raw.items()})
    print({c: round(v, 2) for c, v in r2_std.items()}, raw_main)
  explanation: |
    - `groupby(labels).transform('mean')` ставит каждой машине среднее её кластера (урок 3.6). Отклонения от него — разброс внутри кластеров, отклонения от общего среднего — весь разброс.
    - Без стандартизации кластеры объясняют 84 % разброса пробега и от 2 до 24 % у остальных признаков: алгоритм нарезал машины по километрам. Со стандартизацией объяснено от 27 до 60 % у каждого признака — кластеры описывают машину целиком.
    - R² по признакам — простой способ понять, чем различаются кластеры. Это тот же коэффициент детерминации из урока 5.8, где «прогноз» — среднее своего кластера.
  hints:
    - "Весь разброс — отклонения от общего среднего: `((values - values.mean()) ** 2).sum()`."
    - "Для стандартизованного разбиения — те же признаки, но метки `lab_std`."
    - "`r2_std = {c: explained_by_clusters(cars[c], lab_std) for c in cols}`."
  tests: |
