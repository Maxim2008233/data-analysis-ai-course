- id: b1-l6-t4
  title: k-means как класс
  difficulty: main
  introduces: []
  uses: [k-means, estimator-api]
  statement: |
    Напишите класс `MyKMeans(n_clusters, max_iter=300)`:

    - `fit(X, init)` начинает с центров `init` и повторяет «назначить ближайшим — пересчитать центры», пока центры меняются (`np.allclose`), но не больше `max_iter` раз. Запоминает `cluster_centers_`, `labels_` (назначения к итоговым центрам) и `inertia_`. Возвращает `self`;
    - `predict(X)` — номера ближайших центров.

    Сравните с `KMeans(n_clusters=4, init=init, n_init=1, tol=0)` на стандартизованных признаках `Xs`: `inertia_mine`, `inertia_sk` и `same_predict` — доля новых точек `new_points`, для которых номера кластеров совпали.
