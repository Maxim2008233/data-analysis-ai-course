                    err = self.predict_proba(X) - y
                    self.coef_ = self.coef_ - self.lr * X.T @ err
                    self.intercept_ = self.intercept_ - self.lr * err.mean()
                return self
            def predict(self, X):
                return (self.predict_proba(X) >= 0.5).astype(int)
        coef_diff = 1.0
        agree = 0.0
      expect: разделить на число объектов

- id: b1-l6-t3
  title: PCA как класс
  difficulty: main
  introduces: []
  uses: [pca, estimator-api]
  statement: |
    Напишите класс `MyPCA(n_components)`:

    - `fit(X)` запоминает `mean_` — средние столбцов, `components_` — первые `n_components` собственных векторов ковариационной матрицы центрированных данных **строками** (по убыванию собственных чисел) и `explained_variance_ratio_` — их доли разброса. Возвращает `self`;
    - `transform(X)` — координаты в новых осях: `(X - mean_) @ components_.T`.

    Сравните с `PCA(n_components=2)` из scikit-learn на стандартизованных признаках машин `Xs`: `ratio_diff` — наибольшее расхождение долей, `comp_diff` — наибольшее расхождение **модулей** компонент, `z_diff` — наибольшее расхождение модулей координат после `transform`.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.preprocessing import StandardScaler
    from sklearn.decomposition import PCA
    cars = pd.read_csv('cars_processed.csv')
    num = ['Year', 'Distance', 'Engine', 'Price', 'km_year']
    Xs = StandardScaler().fit_transform(cars[num].to_numpy(dtype=float))
  starter: |
    class MyPCA:
        def __init__(self, n_components):
            self.n_components = n_components

        def fit(self, X):
            self.mean_ = X.mean(axis=0)
            vals, vecs = np.linalg.eigh(np.cov(X - self.mean_, rowvar=False))
            order = np.argsort(vals)[::-1][:self.n_components]
            self.components_ = ...
            self.explained_variance_ratio_ = ...
            return self

        def transform(self, X):
            return ...

    mine, sk = MyPCA(2).fit(Xs), PCA(n_components=2).fit(Xs)
    ratio_diff = float(np.abs(mine.explained_variance_ratio_ - sk.explained_variance_ratio_).max())
    comp_diff = float(np.abs(np.abs(mine.components_) - np.abs(sk.components_)).max())
    z_diff = float(np.abs(np.abs(mine.transform(Xs)) - np.abs(sk.transform(Xs))).max())
    print(ratio_diff, comp_diff, z_diff)
  solution: |
    class MyPCA:
        def __init__(self, n_components):
            self.n_components = n_components

        def fit(self, X):
            self.mean_ = X.mean(axis=0)
            vals, vecs = np.linalg.eigh(np.cov(X - self.mean_, rowvar=False))
            order = np.argsort(vals)[::-1][:self.n_components]
            self.components_ = vecs[:, order].T
            self.explained_variance_ratio_ = vals[order] / vals.sum()
            return self

        def transform(self, X):
            return (X - self.mean_) @ self.components_.T

    mine, sk = MyPCA(2).fit(Xs), PCA(n_components=2).fit(Xs)
    ratio_diff = float(np.abs(mine.explained_variance_ratio_ - sk.explained_variance_ratio_).max())
    comp_diff = float(np.abs(np.abs(mine.components_) - np.abs(sk.components_)).max())
    z_diff = float(np.abs(np.abs(mine.transform(Xs)) - np.abs(sk.transform(Xs))).max())
    print(ratio_diff, comp_diff, z_diff)
  explanation: |
    - `vecs[:, order]` выбирает нужные столбцы-векторы, а `.T` делает их строками — как `components_` в scikit-learn.
    - Доли делят на сумму **всех** собственных чисел, а не только оставленных: иначе две компоненты «объясняли» бы 100 %.
    - Все расхождения — на уровне ошибок округления, порядка 10⁻¹³ и меньше. Модули сравниваются, потому что знак собственного вектора произволен.
  hints:
    - "Компоненты строками — `vecs[:, order].T`."
    - "Доли — `vals[order] / vals.sum()`: делим на сумму всех собственных чисел."
    - "Новые координаты — `(X - self.mean_) @ self.components_.T`."
  tests: |
    import numpy as np
    C = var('MyPCA')
    ensure(isinstance(C, type), '`MyPCA` должен быть классом.')
    T = np.array([[1.0, 1.0], [2.0, 2.0], [3.0, 3.0], [4.0, 4.0]])
    m = C(1)
    ensure(m.fit(T) is m, 'fit должен возвращать self.')
    comp = np.asarray(m.components_, dtype=float)
    ensure(comp.shape == (1, 2), 'components_ — компоненты строками: для одной компоненты и двух признаков форма (1, 2), а у вас {0}.'.format(comp.shape))
    same_array(np.abs(comp), [[2 ** -0.5, 2 ** -0.5]], 'Точки на прямой y = x: первая компонента — (1, 1)/√2.')
    ev = np.asarray(m.explained_variance_ratio_, dtype=float)
    close(float(ev[0]), 1.0, 'Весь разброс точек на прямой — вдоль одной оси: доля 1, а у вас {actual}.')
    z = np.asarray(m.transform(np.array([[2.5, 2.5]])), dtype=float)
    close(float(z[0, 0]), 0.0, 'Точка (2.5, 2.5) — среднее; её координата на компоненте — 0, а у вас {actual}. Не забудьте вычесть mean_.', atol=1e-9)
    m2 = C(1).fit(np.array([[0.0, 0.0], [2.0, 0.0], [0.0, 1.0], [2.0, 1.0]]))
    if float(np.asarray(m2.explained_variance_ratio_)[0]) > 0.999:
        fail('Доли делят на сумму всех собственных чисел, а не только оставленных компонент.')
    close(var('ratio_diff', 'number', 'числом'), 0.0, 'Доли должны совпасть с sklearn, а расхождение {actual}.', atol=1e-9)
    close(var('comp_diff', 'number', 'числом'), 0.0, 'Компоненты по модулю должны совпасть с sklearn, а расхождение {actual}.', atol=1e-9)
    close(var('z_diff', 'number', 'числом'), 0.0, 'Координаты по модулю должны совпасть с sklearn, а расхождение {actual}.', atol=1e-7)
  files: [cars_processed.csv]
  wrong:
    - code: |
        class MyPCA:
            def __init__(self, n_components):
                self.n_components = n_components
            def fit(self, X):
                self.mean_ = X.mean(axis=0)
                vals, vecs = np.linalg.eigh(np.cov(X - self.mean_, rowvar=False))
                order = np.argsort(vals)[::-1][:self.n_components]
                self.components_ = vecs[:, order].T
                self.explained_variance_ratio_ = vals[order] / vals[order].sum()
                return self
            def transform(self, X):
                return (X - self.mean_) @ self.components_.T
        ratio_diff = comp_diff = z_diff = 1.0
      expect: сумму всех собственных чисел
    - code: |
        class MyPCA:
            def __init__(self, n_components):
                self.n_components = n_components
            def fit(self, X):
                self.mean_ = X.mean(axis=0)
                vals, vecs = np.linalg.eigh(np.cov(X - self.mean_, rowvar=False))
                order = np.argsort(vals)[::-1][:self.n_components]
                self.components_ = vecs[:, order].T
                self.explained_variance_ratio_ = vals[order] / vals.sum()
