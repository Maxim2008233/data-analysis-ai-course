            def __init__(self, lr=0.5, n_iter=2000):
                self.lr, self.n_iter = lr, n_iter
            def predict_proba(self, X):
                return 1 / (1 + np.exp(-(X @ self.coef_ + self.intercept_)))
            def fit(self, X, y):
                self.coef_ = np.zeros(X.shape[1])
                self.intercept_ = 0.0
                for _ in range(self.n_iter):
                    err = self.predict_proba(X) - y
                    self.coef_ = self.coef_ + self.lr * X.T @ err / len(y)
                    self.intercept_ = self.intercept_ + self.lr * err.mean()
                return self
            def predict(self, X):
                return (self.predict_proba(X) >= 0.5).astype(int)
        coef_diff = 1.0
        agree = 0.0
      expect: Знак шага перепутан
    - code: |
        class LogRegGD:
            def __init__(self, lr=0.5, n_iter=2000):
                self.lr, self.n_iter = lr, n_iter
            def predict_proba(self, X):
                return 1 / (1 + np.exp(-(X @ self.coef_ + self.intercept_)))
            def fit(self, X, y):
                self.coef_ = np.zeros(X.shape[1])
                self.intercept_ = 0.0
