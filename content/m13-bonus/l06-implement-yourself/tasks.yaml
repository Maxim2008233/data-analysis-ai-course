    class MyTree:
        def __init__(self, max_depth=2):
            self.max_depth = max_depth

        def build(self, X, y, depth):
            majority = int(np.mean(y) > 0.5)
            if depth == self.max_depth or len(set(y)) == 1:
                return {'leaf': majority}
            j, t, _ = best_split(X, y)
            if j is None:
                return {'leaf': majority}
            left = X[:, j] <= t
            return {'feature': j, 'threshold': t,
                    'left': self.build(X[left], y[left], depth + 1),
                    'right': self.build(X[~left], y[~left], depth + 1)}

        def fit(self, X, y):
            self.tree_ = self.build(X, y, 0)
            return self

        def predict_one(self, x):
            node = self.tree_
            while 'leaf' not in node:
                node = node['left'] if x[node['feature']] <= node['threshold'] else node['right']
            return node['leaf']

        def predict(self, X):
            return np.array([self.predict_one(x) for x in X])

    mine = MyTree(2).fit(Xs3, ys3)
    sk = DecisionTreeClassifier(max_depth=2, random_state=0).fit(Xs3, ys3)
    agree = float(np.mean(mine.predict(X_test) == sk.predict(X_test)))
    acc_mine = float(np.mean(mine.predict(X_test) == y_test))
    print(mine.tree_)
    print(agree, round(acc_mine, 4))
