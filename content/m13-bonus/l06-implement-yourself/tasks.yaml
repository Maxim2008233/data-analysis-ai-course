    def gini(y):
        if len(y) == 0:
            return 0.0
        p = np.mean(y)
        return float(2 * p * (1 - p))

    def best_split(X, y):
        n = len(y)
        best = (None, None, gini(y))
        for j in range(X.shape[1]):
            order = np.argsort(X[:, j], kind='stable')
            xs, ys = X[order, j], y[order]
            left_n = np.arange(1, n)
            left_pos = np.cumsum(ys)[:-1]
            pl, pr = left_pos / left_n, (ys.sum() - left_pos) / (n - left_n)
            imp = (left_n * 2 * pl * (1 - pl) + (n - left_n) * 2 * pr * (1 - pr)) / n
            imp[xs[1:] == xs[:-1]] = np.inf
            i = int(np.argmin(imp))
            if imp[i] < best[2]:
                best = (j, float((xs[i] + xs[i + 1]) / 2), float(imp[i]))
        return best

    split = best_split(Xs3, ys3)
    tree = DecisionTreeClassifier(max_depth=1, random_state=0).fit(Xs3, ys3)
    sk_feature, sk_threshold = int(tree.tree_.feature[0]), float(tree.tree_.threshold[0])
    print(split, sk_feature, sk_threshold)
  explanation: |
    - После сортировки по признаку порог между позициями i и i + 1 оставляет слева i + 1 объект. Накопленная сумма единиц сразу даёт, сколько из них класса 1, — для всех порогов одной операцией.
    - Взвешенный Джини — `(n_left·G_left + n_right·G_right) / n`: большая часть весит больше. Между равными значениями порог не поставить, поэтому там `np.inf`.
    - Лучший первый вопрос — о цене (признак 2) с порогом 8299,5 евро. Ровно его выбрал и `DecisionTreeClassifier`: перебор порогов в scikit-learn устроен так же.
  hints:
    - "Джини — `2 * p * (1 - p)`."
    - "Взвешенный Джини частей — `(left_n * 2 * pl * (1 - pl) + (n - left_n) * 2 * pr * (1 - pr)) / n`."
    - "Порог — середина: `(xs[i] + xs[i + 1]) / 2`; это уже в заготовке."
