    - Рекурсия: узел строит своих детей тем же методом `build`, увеличив глубину на 1. Остановка — глубина, чистая часть или отсутствие полезного разбиения.
    - `predict_one` спускается от корня: если значение признака не больше порога — налево, иначе направо, пока не встретит лист.
    - Дерево читается как правила. Машины не дороже 8299,5 евро с двигателем больше 2579,5 см³ — автомат, остальные дешёвые — механика. У дорогих оба листа отвечают «автомат»: второе разбиение делает части чище, но ответа не меняет. Доля верных на проверочной части — 0,797.
    - Своё дерево предсказывает в точности как `DecisionTreeClassifier(max_depth=2)` на всех машинах проверочной части: оно задаёт те же вопросы в том же порядке. scikit-learn строит деревья по алгоритму CART, и его основа — перебор порогов из прошлого задания и рекурсия.
