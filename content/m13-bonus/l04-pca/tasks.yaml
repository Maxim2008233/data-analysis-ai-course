    errors, kept = [], []
    for k in range(1, 6):
        p = PCA(n_components=k).fit(Xs)
        back = p.inverse_transform(p.transform(Xs))
        errors.append(float(np.mean((Xs - back) ** 2)))
        kept.append(float(p.explained_variance_ratio_.sum()))
    k_min = next(k for k, e in zip(range(1, 6), errors) if e < 0.05)
    identity_gap = float(np.max(np.abs(np.array(errors) - (1 - np.array(kept)))))
    print(np.round(errors, 3), np.round(kept, 3), k_min, identity_gap)
  explanation: |
    - `transform` переводит машины в координаты k компонент, `inverse_transform` возвращает их в пространство исходных признаков — с потерей того, что было в отброшенных компонентах.
    - Ошибка падает с 0,629 для одной компоненты до 0 для пяти. Меньше 0,05 она впервые при k = 4 — тогда сохранено 97 % разброса.
    - У стандартизованных признаков ошибка восстановления в точности равна потерянной доле разброса: каждый признак имеет разброс 1, и всё, что не попало в оставленные компоненты, становится ошибкой. Поэтому «доля дисперсии» и «качество сжатия» — одно и то же.
