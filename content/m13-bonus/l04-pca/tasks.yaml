  solution: |
    pca = PCA(n_components=1).fit(Xs)
    pc1 = pca.transform(Xs)[:, 0]
    if pca.components_[0, num.index('Price')] < 0:
        pc1 = -pc1
    outlier = cars.iloc[int(np.argmax(pc1))]
    outlier_model, outlier_price = outlier['Model'], float(outlier['Price'])
    outlier_z = float((pc1.max() - pc1.mean()) / pc1.std())
    clean = cars[cars['Price'] <= 200000]
    Xc = StandardScaler().fit_transform(clean[num].to_numpy(dtype=float))
    ratio_without = float(PCA(n_components=1).fit(Xc).explained_variance_ratio_[0])
    print(outlier_model, outlier_price, round(outlier_z, 1), round(ratio_without, 3))
  explanation: |
    - Самая правая машина — Kia Sportage 2018 года за 490 000 евро. Такой цены у этой модели не бывает: почти наверняка лишний ноль в объявлении.
    - Её PC1 выше среднего больше чем на 20 стандартных отклонений. Для данных, похожих на нормальные, это невозможно: такие точки — кандидаты в ошибки, их проверяют вручную.
    - Выбросы тянут на себя и стандартизацию, и саму компоненту. Здесь без машин дороже 200 000 евро доля PC1 почти та же — 37,5 % против 37,1 %: на 32 тысячах машин несколько выбросов картину не ломают. На маленьких данных один такой объект мог бы развернуть компоненту. Поэтому перед PCA данные чистят, а на плоскости компонент ищут странные точки.
  hints:
    - "Отклонение от среднего в стандартных отклонениях — `(pc1.max() - pc1.mean()) / pc1.std()`."
    - "Доля PC1 на очищенных данных — `PCA(n_components=1).fit(Xc).explained_variance_ratio_[0]`."
    - "Строка с наибольшим PC1 — `cars.iloc[int(np.argmax(pc1))]`, она уже в заготовке."
  tests: |
