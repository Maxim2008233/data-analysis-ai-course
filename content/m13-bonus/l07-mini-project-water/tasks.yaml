  solution: |
    aucs_lr, aucs_country = [], []
    for seed in range(30):
        a, b, ya, yb = train_test_split(nit, y, test_size=0.3, random_state=seed, stratify=y)
        m = make_pipeline(StandardScaler(), LogisticRegression(class_weight='balanced', max_iter=1000)).fit(a[cols], ya)
        aucs_lr.append(roc_auc_score(yb, m.predict_proba(b[cols])[:, 1]))
        rate = ya.groupby(a['Country']).mean()
        aucs_country.append(roc_auc_score(yb, b['Country'].map(rate).fillna(ya.mean())))
    aucs_lr, aucs_country = np.array(aucs_lr), np.array(aucs_country)
    lr_min, lr_max = float(aucs_lr.min()), float(aucs_lr.max())
    lr_wins = float(np.mean(aucs_lr > aucs_country))
    print(round(aucs_lr.mean(), 3), round(lr_min, 3), round(lr_max, 3), round(aucs_country.mean(), 3), round(lr_wins, 3))
