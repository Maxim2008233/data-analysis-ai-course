- id: b1-l7-t7
  title: "Шаг 7. Что помогло бы: аммоний той же реки"
  difficulty: star
  introduces: []
  uses: [roc-auc]
  statement: |
    Бактерии превращают аммоний в нитраты через нитриты, поэтому химия самой реки должна подсказывать превышения лучше показателей страны. Аммоний — показатель `CAS_14798-03-9`; в той же реке в тот же год его измеряли не везде.

    1. `amm` — средний аммоний для каждой пары (`id`, `year`): Series с этой парой в индексе и именем `ammonium`.
    2. `d` — строки `nit` со столбцом `y`, к которым присоединён аммоний той же реки и того же года (`join` по `['id', 'year']`), без строк, где аммония нет.
    3. `auc_amm` — ROC AUC самого значения аммония как оценки, без всякой модели.
    4. `top_rows` — сколько строк `d` с аммонием не ниже квантиля 0,9 (10 % самых высоких значений), `top_hits` — сколько среди них превышений нитритов.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.metrics import roc_auc_score
    water = pd.read_csv('water_polution.csv').drop(columns='Unnamed: 0')
    nit = water[water['code'] == 'CAS_14797-65-0'].dropna()
    y = (nit['polution'] > 0.5).astype(int)
  starter: |
    amm = ...                                   # средний аммоний по паре (id, year)
    d = nit.assign(y=y).join(amm, on=['id', 'year']).dropna(subset=['ammonium'])
    auc_amm = float(...)
    top = ...
    top_rows = int(top.sum())
    top_hits = int(...)
    print(len(d), int(d['y'].sum()), round(auc_amm, 3), top_rows, top_hits)
  solution: |
    amm = water[water['code'] == 'CAS_14798-03-9'].groupby(['id', 'year'])['polution'].mean().rename('ammonium')
    d = nit.assign(y=y).join(amm, on=['id', 'year']).dropna(subset=['ammonium'])
    auc_amm = float(roc_auc_score(d['y'], d['ammonium']))
    top = d['ammonium'] >= d['ammonium'].quantile(0.9)
    top_rows = int(top.sum())
    top_hits = int(d.loc[top, 'y'].sum())
    print(len(d), int(d['y'].sum()), round(auc_amm, 3), top_rows, top_hits)
  explanation: |
    - Аммоний той же реки и того же года нашёлся для 403 из 1247 измерений нитритов, превышений среди них 12.
    - Без всякого обучения значение аммония даёт AUC 0,90 — против 0,65–0,67 у признаков страны. В 10 % строк с самым высоким аммонием (41 строка, от 0,30 мг/л) — 10 из 12 превышений.
    - Вывод осторожный: превышений всего 12, и аммоний измерен лишь в трети случаев. Но направление ясно: состояние реки предсказывают по данным о самой реке — её химии, стокам, удобрениям на полях вокруг, — а не по составу мусора в стране.
  hints:
    - "Средний аммоний по паре — `water[water['code'] == 'CAS_14798-03-9'].groupby(['id', 'year'])['polution'].mean().rename('ammonium')`."
    - "AUC значения как оценки — `roc_auc_score(d['y'], d['ammonium'])`."
    - "10 % самых высоких — `d['ammonium'] >= d['ammonium'].quantile(0.9)`; превышения среди них — `d.loc[top, 'y'].sum()`."
  tests: |
    am = var('amm')
    ensure(hasattr(am, 'index') and getattr(am.index, 'nlevels', 1) == 2, "amm — Series с парой (id, year) в индексе: groupby(['id', 'year']).")
    ensure(am.name == 'ammonium', "Назовите Series amm: .rename('ammonium').")
    dd = var('d', 'DataFrame', 'таблицей')
    ensure('ammonium' in dd.columns and 'y' in dd.columns, 'В d нужны столбцы y и ammonium.')
    if len(dd) == len(ref('nit')):
        fail("Строки без аммония уберите: .dropna(subset=['ammonium']). Заполнять их нулём нельзя — аммоний там просто не измеряли.")
    equal(len(dd), len(ref('d')), 'Строк с аммонием — {expected}, а у вас {actual}.')
    close(var('auc_amm', 'number', 'числом'), ref('auc_amm'), 'AUC аммония — {expected}, а у вас {actual}.')
    equal(int(var('top_rows', 'int', 'целым числом')), ref('top_rows'), 'Строк в верхних 10 % по аммонию — {expected}, а у вас {actual}.')
    equal(int(var('top_hits', 'int', 'целым числом')), ref('top_hits'), 'Превышений среди них — {expected}, а у вас {actual}.')
    close(alt('auc_amm'), alt_ref('auc_amm'), HARDCODE_MSG)
