- id: b1-l3-t5
  title: Порог вместо весов
  difficulty: main
  introduces: []
  uses: [rebalancing, precision-recall]
  statement: |
    Сравните два способа на тестовой части:

    - **сдвиг порога**: модель `plain` без весов, порог — с наибольшим F1 на валидации по кривой `precision_recall_curve(y_valid, p_valid)`;
    - **веса классов**: модель `balanced` с порогом 0,5.

    Получите `thr_best` — порог, `f1_thr` — F1 на тесте модели `plain` с этим порогом, `f1_bal` — F1 на тесте модели `balanced`. У `precision_recall_curve` точностей и полнот на одну больше, чем порогов: последнюю точку при поиске отбросьте.
