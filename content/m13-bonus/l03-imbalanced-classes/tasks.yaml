    X_train, X_valid, y_train, y_valid = train_test_split(X_temp, y_temp, test_size=0.25, random_state=42, stratify=y_temp)
    plain = make_pipeline(StandardScaler(), LogisticRegression()).fit(X_train, y_train)
    balanced = make_pipeline(StandardScaler(), LogisticRegression(class_weight='balanced')).fit(X_train, y_train)
    p_valid = plain.predict_proba(X_valid)[:, 1]
  starter: |
    prec, rec, thr = precision_recall_curve(y_valid, p_valid)
    f1 = 2 * prec * rec / np.maximum(prec + rec, 1e-12)
    thr_best = float(thr[int(np.argmax(...))])
    f1_thr = f1_score(y_test, (plain.predict_proba(X_test)[:, 1] >= thr_best).astype(int))
    f1_bal = ...
    print(round(thr_best, 3), round(f1_thr, 3), round(f1_bal, 3))
  solution: |
    prec, rec, thr = precision_recall_curve(y_valid, p_valid)
    f1 = 2 * prec * rec / np.maximum(prec + rec, 1e-12)
    thr_best = float(thr[int(np.argmax(f1[:-1]))])
    f1_thr = f1_score(y_test, (plain.predict_proba(X_test)[:, 1] >= thr_best).astype(int))
    f1_bal = f1_score(y_test, balanced.predict(X_test))
    print(round(thr_best, 3), round(f1_thr, 3), round(f1_bal, 3))
  explanation: |
    - `precision_recall_curve` возвращает точки кривой и пороги к ним; последняя точка (точность 1, полнота 0) порога не имеет, поэтому `f1[:-1]`.
    - Лучший по F1 порог на валидации — 0,127, и на тесте он даёт F1 0,26. Модель с весами при пороге 0,5 стоит в другой точке той же кривой: полнота выше, точность ниже, F1 0,205.
    - Сдвиг порога не требует переобучения и позволяет выбрать любую точку кривой под задачу. Веса классов удобны, когда модель потом используют с порогом 0,5 — например, внутри чужого кода. Решение — какой ценой покупать полноту — остаётся за людьми.
  hints:
    - "Лучший F1 без последней точки — `np.argmax(f1[:-1])`."
    - "F1 модели с весами — `f1_score(y_test, balanced.predict(X_test))`: её порог 0,5 и так внутри `predict`."
    - "`thr_best = float(thr[int(np.argmax(f1[:-1]))])`."
