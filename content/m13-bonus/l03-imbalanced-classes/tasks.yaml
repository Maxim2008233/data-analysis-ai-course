  solution: |
    rich = make_pipeline(
        make_column_transformer((StandardScaler(), features), (OneHotEncoder(handle_unknown='ignore'), ['Make', 'Model'])),
        LogisticRegression(max_iter=3000)).fit(X_train, y_train)
    p_plain = plain.predict_proba(X_valid[features])[:, 1]
    p_rich = rich.predict_proba(X_valid)[:, 1]
    ap_plain, ap_rich = average_precision_score(y_valid, p_plain), average_precision_score(y_valid, p_rich)

    def top100(p):
        best = np.argsort(-p)[:100]
        return int(y_valid.to_numpy()[best].sum())

    top100_plain, top100_rich = top100(p_plain), top100(p_rich)
    print(round(ap_plain, 3), round(ap_rich, 3), top100_plain, top100_rich)
  explanation: |
    - `np.argsort(-p)[:100]` — номера 100 машин с наибольшей вероятностью. Сумма настоящих меток по ним — сколько гибридов попало в верх списка. Это точность среди первых 100, понятная без порогов.
    - Average precision выросла с 0,16 до 0,75. В первой сотне модели на числах 23 гибрида, а у модели с маркой и моделью — 88: многие гибриды — это несколько конкретных моделей, Prius, Auris, Fusion.
    - Ни веса, ни дублирование, ни порог такого не дают: они двигают точку по одной кривой. Признак, который отличает редкий класс, поднимает саму кривую.
