    close(var('f1_thr', 'number', 'числом'), ref('f1_thr'), 'F1 на тесте при сдвинутом пороге — {expected}, а у вас {actual}.')
    close(var('f1_bal', 'number', 'числом'), ref('f1_bal'), 'F1 модели с весами на тесте — {expected}, а у вас {actual}.')
