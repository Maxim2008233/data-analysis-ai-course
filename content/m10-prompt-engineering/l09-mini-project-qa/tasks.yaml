  solution: |
    def build_messages(row, examples):
        msgs = [{'role': 'system', 'content': SYSTEM.format(last=len(row['options']) - 1)}]
        for _, ex in examples.iterrows():
            msgs.append({'role': 'user', 'content': ask(ex)})
            msgs.append({'role': 'assistant', 'content': str(ex['ответ'])})
        msgs.append({'role': 'user', 'content': ask(row)})
        return msgs

    msgs0 = build_messages(test.loc[0], train_examples(test.loc[0], 2))
    roles0 = [m['role'] for m in msgs0]
    system10 = build_messages(test.loc[i10], train_examples(test.loc[i10], 0))[0]['content']
    for m in msgs0:
        print(m['role'], '|', m['content'][:70].replace('\n', ' / '))
    print(system10)
  explanation: |
    - Допустимые номера зависят от вопроса: у десяти вариантов — от 0 до 9, у четырёх — от 0 до 3. Системная инструкция говорит об этом прямо, и модели не нужно гадать, считать ли с нуля.
    - Варианты пронумерованы и в примерах, и в вопросе, а ответы примеров — одна цифра. Формат задан трижды: словами, нумерацией и образцами.
    - Примеры взяты только из обучающих вопросов. Вопросы теста в промпт не попадают — их ответов никто не знает, а для оценки на обучающих вопросах `train_examples` пришлось бы исключать сам вопрос (урок 10.4).
