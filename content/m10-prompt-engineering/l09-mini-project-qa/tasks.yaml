- id: m10-l9-t2
  title: "Шаг 2. Промпт для вопроса"
  difficulty: main
  introduces: []
  uses: [few-shot, system-prompt]
  statement: |
    Напишите функцию `build_messages(row, examples)` — список сообщений для вопроса `row`:

    - системное сообщение `SYSTEM.format(last=...)`, где `last` — наибольший допустимый номер у **этого** вопроса (число вариантов минус один);
    - для каждого примера из таблицы `examples` — вопрос `ask(пример)` с ролью `user` и его ответ строкой с ролью `assistant`;
    - последним — `ask(row)` с ролью `user`.

    `ask(row)` и `train_examples(row, k)` готовы: вторая подбирает `k` примеров из обучающих вопросов — той же категории и с разными ответами (урок 10.4). Получите:

    - `msgs0` — сообщения для вопроса теста номер 0 с примерами `train_examples(test.loc[0], 2)` и `roles0` — их роли;
    - `system10` — системное сообщение для первого вопроса теста с десятью вариантами (`i10` уже найден).
  prelude: |
    import ast
    import json
    import warnings
    import pandas as pd

    def parse_options(s):
        s = s.strip().rstrip(',').strip()
        try:
            value = json.loads(s)
        except json.JSONDecodeError:
            with warnings.catch_warnings():
                warnings.simplefilter('ignore', SyntaxWarning)
                try:
                    value = ast.literal_eval(s)
                except (ValueError, SyntaxError):
                    return None
        return [str(x) for x in value] if isinstance(value, (list, tuple)) else None

    qa = pd.read_csv('qa_train.csv')
    test = pd.read_csv('qa_test.csv')
    qa['options'] = qa['варианты'].apply(parse_options)
    test['options'] = test['варианты'].apply(parse_options)
    TEMPLATE = "Вопрос: {question}\nВарианты ответа:\n{options}\nОтвет:"
    SYSTEM = "Ты решаешь тест. Ответь одной цифрой от 0 до {last} — номером правильного варианта, без пояснений."

    def ask(r):
        return TEMPLATE.format(question=r['вопрос'], options='\n'.join(f'{i}) {o}' for i, o in enumerate(r['options'])))

    answers = qa['ответ'].to_dict()
    by_category = {c: list(g) for c, g in qa.groupby('категория').groups.items()}

    def train_examples(row, k):
        same = by_category.get(row['категория'], []) if row['категория'] != '-' else []
        cands = same + [j for j in qa.index if j not in set(same)]
        chosen, used = [], set()
        for j in cands:
            if len(chosen) < k and answers[j] not in used:
                chosen.append(j)
                used.add(answers[j])
        for j in cands:
            if len(chosen) < k and j not in chosen:
                chosen.append(j)
        return qa.loc[chosen]

    i10 = int(test.index[test['options'].str.len() == 10][0])
