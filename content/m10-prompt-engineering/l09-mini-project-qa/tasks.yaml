  solution: |
    def parse_options(s):
        s = s.strip().rstrip(',').strip()
        try:
            value = json.loads(s)
        except json.JSONDecodeError:
            with warnings.catch_warnings():
                warnings.simplefilter('ignore', SyntaxWarning)
                try:
                    value = ast.literal_eval(s)
                except (ValueError, SyntaxError):
                    return None
        if not isinstance(value, (list, tuple)):
            return None
        return [str(x) for x in value]

    qa['options'] = qa['варианты'].apply(parse_options)
    test['options'] = test['варианты'].apply(parse_options)
    train_bad = int(qa['options'].isna().sum())
    test_bad = int(test['options'].isna().sum())
    bad_ids = test.loc[test['options'].isna(), 'id'].tolist()
    test_n = test['options'].dropna().str.len().value_counts().to_dict()
    print(train_bad, test_bad, bad_ids, test_n)
  explanation: |
    - В обучающих вопросах разбирается всё. В тесте не разбираются три строки: в одной вместо вариантов записан вопрос, в двух — формулы с апострофом внутри кавычек (`'$f'(x)$'`). Ещё три строки разобрались только благодаря отрезанной запятой в конце.
    - Проверка типа нужна, потому что JSON-строка `"текст"` тоже разбирается — но в строку, а не в список. Без проверки длина «вариантов» оказалась бы числом букв.
    - В тесте 725 вопросов с четырьмя вариантами, 45 — с десятью и 13 — с семью. Промпт и проверка ответа должны работать с любым числом вариантов.
