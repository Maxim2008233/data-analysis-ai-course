- id: m10-l9-t3
  title: "Шаг 3. Число примеров под бюджет"
  difficulty: main
  introduces: []
  uses: [few-shot, context-window]
  statement: |
    Каждый пример уходит в каждом из 783 запросов (вопросы с разобранными вариантами — таблица `ok`). Пусть на запросы теста выделено `BUDGET = 80_000` токенов. `build_messages` и `count_tokens` (прикидка из урока 10.3) готовы.

    Получите:

    - `tokens_by_k` — список: сколько токенов уйдёт на все вопросы `ok`, если в каждом промпте `k` примеров, для `k` из `[0, 1, 2, 3]` (примеры — `train_examples(row, k)`);
    - `k_best` — наибольшее `k` из этого списка, при котором расход не больше бюджета;
    - `per_question` — сколько токенов в среднем на один вопрос при `k_best`.
  prelude: |
    import ast
    import json
    import math
    import warnings
    import pandas as pd

    def parse_options(s):
        s = s.strip().rstrip(',').strip()
        try:
            value = json.loads(s)
        except json.JSONDecodeError:
            with warnings.catch_warnings():
                warnings.simplefilter('ignore', SyntaxWarning)
                try:
                    value = ast.literal_eval(s)
                except (ValueError, SyntaxError):
                    return None
        return [str(x) for x in value] if isinstance(value, (list, tuple)) else None

    qa = pd.read_csv('qa_train.csv')
    test = pd.read_csv('qa_test.csv')
    qa['options'] = qa['варианты'].apply(parse_options)
    test['options'] = test['варианты'].apply(parse_options)
    ok = test[test['options'].notna()]
    TEMPLATE = "Вопрос: {question}\nВарианты ответа:\n{options}\nОтвет:"
    SYSTEM = "Ты решаешь тест. Ответь одной цифрой от 0 до {last} — номером правильного варианта, без пояснений."
    BUDGET = 80_000

    def ask(r):
        return TEMPLATE.format(question=r['вопрос'], options='\n'.join(f'{i}) {o}' for i, o in enumerate(r['options'])))

    answers = qa['ответ'].to_dict()
    by_category = {c: list(g) for c, g in qa.groupby('категория').groups.items()}

    def train_examples(row, k):
        same = by_category.get(row['категория'], []) if row['категория'] != '-' else []
        cands = same + [j for j in qa.index if j not in set(same)]
        chosen, used = [], set()
        for j in cands:
            if len(chosen) < k and answers[j] not in used:
                chosen.append(j)
                used.add(answers[j])
        for j in cands:
            if len(chosen) < k and j not in chosen:
                chosen.append(j)
        return qa.loc[chosen]

    def build_messages(row, examples):
        msgs = [{'role': 'system', 'content': SYSTEM.format(last=len(row['options']) - 1)}]
        for _, ex in examples.iterrows():
            msgs.append({'role': 'user', 'content': ask(ex)})
            msgs.append({'role': 'assistant', 'content': str(ex['ответ'])})
        msgs.append({'role': 'user', 'content': ask(row)})
        return msgs

    def count_tokens(messages):
        return math.ceil(sum(len(m['content']) for m in messages) / 5.09)
  starter: |
    tokens_by_k = []
    for k in [0, 1, 2, 3]:
        total = sum(count_tokens(build_messages(row, ...)) for _, row in ok.iterrows())
        tokens_by_k.append(total)
    k_best = ...
    per_question = ...
    print(tokens_by_k, k_best, round(per_question, 1))
  solution: |
    tokens_by_k = []
    for k in [0, 1, 2, 3]:
        total = sum(count_tokens(build_messages(row, train_examples(row, k))) for _, row in ok.iterrows())
        tokens_by_k.append(total)
    k_best = max(k for k, t in zip([0, 1, 2, 3], tokens_by_k) if t <= BUDGET)
    per_question = tokens_by_k[k_best] / len(ok)
    print(tokens_by_k, k_best, round(per_question, 1))
  explanation: |
    - Без примеров весь тест — около 36 тысяч токенов, каждый пример добавляет ещё примерно 20 тысяч. В бюджет 80 тысяч помещаются два примера: около 99 токенов на вопрос.
    - Это только запросы. Ответ одной цифрой — один-два токена, а `max_tokens` стоит поставить маленьким: тогда и разговорчивая модель не потратит лишнего. Повторы при ответе не по формату добавят ещё.
    - Лучше ли два примера, чем ноль, бюджет не скажет. Это проверяют на обучающих вопросах (урок 10.8), и, может быть, окажется, что хватает и одного.
  hints:
    - "Примеры для вопроса — `train_examples(row, k)`."
    - "Подходящие `k` — те, у которых `t <= BUDGET`; наибольшее — `max(...)`."
    - "Среднее на вопрос — `tokens_by_k[k_best] / len(ok)`."
  tests: |
    tk = [int(x) for x in var('tokens_by_k', list, 'списком')]
