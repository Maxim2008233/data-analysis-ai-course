    - Запасной ответ помечен (`True` в третьем элементе): такие вопросы потом можно пересчитать и разобрать. Если их много, чинят промпт.
    - Повтор стоит запроса: на пять вопросов ушло восемь запросов. Ограничение одним повтором держит расход предсказуемым.
  hints:
