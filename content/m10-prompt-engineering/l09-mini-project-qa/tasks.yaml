    - "Пример — два сообщения: `{'role': 'user', 'content': ask(ex)}` и `{'role': 'assistant', 'content': str(ex['ответ'])}`."
    - "`system10` — первое сообщение (`[0]['content']`) для вопроса `test.loc[i10]`."
  tests: |
