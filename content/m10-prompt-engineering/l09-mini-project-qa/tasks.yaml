  difficulty: main
  introduces: []
  uses: [llm-evaluation, structured-output]
  statement: |
    Подведите итоги проекта.
  quiz:
    - q: Почему системная инструкция называет допустимые номера для каждого вопроса отдельно?
      options:
        - У вопросов разное число вариантов — 4, 7 или 10, и допустимый диапазон у них разный
        - Чтобы промпт был длиннее
        - Модель всё равно считает с единицы
      answer: 0
      explain: "В тесте 725 вопросов с четырьмя вариантами, 45 — с десятью и 13 — с семью."
    - q: Сколько примеров поместилось в бюджет 80 тысяч токенов на весь тест?
      options:
        - Два — около 77 тысяч токенов, примерно 99 на вопрос
        - Пять
        - Ни одного
      answer: 0
      explain: "Без примеров — около 36 тысяч, каждый пример добавляет примерно 20 тысяч. Помогают ли примеры, решает проверка на обучающих вопросах."
    - q: Модель ответила «8» на вопрос «Сколько будет √64?» с вариантами 0) 6, 1) 7, 2) 8, 3) 9. Что сделает get_answer?
      options:
        - Отвергнет ответ — номера 8 нет — и переспросит; если и повтор не по формату, поставит запасной ответ и пометит его
        - Примет 8 как номер варианта
        - Возьмёт первое число и вернёт 8
      answer: 0
      explain: "Ответ по существу верный, но не по формату: строгий разбор не угадывает, что модель имела в виду."
    - q: Что даёт починка файла базового решения?
      options:
        - Ожидаемо около 70 % вместо 65,8 % без новых запросов; у трёх вопросов варианты не разбираются, и программа их номер не проверит
        - Ровно 100 % верных ответов
        - Ничего — недопустимые номера и так засчитываются
      answer: 0
      explain: "96 недопустимых прогнозов заменены на «1», которая верна примерно в 36,8 % вопросов. Это оценка, а не измерение."
  hints:
    - Вспомните шаги 2, 3, 4 и 6.
    - "Диапазон — от числа вариантов; бюджет — два примера; «8» — не номер варианта; починка — около 70 %."
    - "Ответы: первый вариант во всех четырёх вопросах."
