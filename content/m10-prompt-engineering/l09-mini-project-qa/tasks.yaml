  prelude: |
    import re
    from langchain_core.language_models import FakeListChatModel

    def parse_answer(text, n):
        m = re.fullmatch(r'\s*(?:ответ\s*:?\s*)?(\d+)\s*\.?\s*', text, flags=re.IGNORECASE)
        if m is None:
            return None
        k = int(m.group(1))
        return k if k < n else None

    FIX = 'Ответь только одной цифрой от 0 до {last}, без пояснений.'
    FALLBACK = 1
    QUESTION = [{'role': 'system', 'content': 'Ты решаешь тест. Ответь одной цифрой от 0 до 3 — номером правильного варианта, без пояснений.'},
                {'role': 'user', 'content': 'Вопрос: Сколько будет √64?\nВарианты ответа:\n0) 6\n1) 7\n2) 8\n3) 9\nОтвет:'}]
    SCENARIOS = [['2'], ['Ответ: 2'], ['√64 = 8, это вариант 2', '2'], ['8', 'Восемь'], ['4', '3.']]
  starter: |
