    sys_text = got[0].get('content', '')
    if 'от 0 до 1' in sys_text:
        fail('Допустимые номера берутся из вопроса `row`, а не из примеров: у вопроса три варианта — «от 0 до 2».')
    if 'от 0 до 3' in sys_text:
        fail('Наибольший номер — число вариантов минус один: у вопроса с тремя вариантами — «от 0 до 2».')
    equal(got[0], {'role': 'system', 'content': 'Ты решаешь тест. Ответь одной цифрой от 0 до 2 — номером правильного варианта, без пояснений.'}, 'Системное сообщение — {expected}, а у вас {actual}.')
    equal(got[1], {'role': 'user', 'content': 'Вопрос: 2 + 2?\nВарианты ответа:\n0) 3\n1) 4\nОтвет:'}, 'Вопрос примера — {expected}, а у вас {actual}.')
    if got[2].get('content') == 1:
        fail('Ответ примера — строка: `str(ex[\'ответ\'])`.')
    equal(got[2], {'role': 'assistant', 'content': '1'}, 'Ответ примера — {expected}, а у вас {actual}.')
    equal(got[3], {'role': 'user', 'content': 'Вопрос: 5 + 5?\nВарианты ответа:\n0) 9\n1) 10\n2) 11\nОтвет:'}, 'Последнее сообщение — {expected}, а у вас {actual}.')
    equal(var('msgs0', list, 'списком'), ref('msgs0'), '`msgs0` — сообщения для вопроса теста 0 с двумя примерами.')
    equal(var('roles0', list, 'списком'), ['system', 'user', 'assistant', 'user', 'assistant', 'user'], 'Роли — {expected}, а у вас {actual}.')
    equal(var('system10', str, 'строкой'), ref('system10'), '`system10` — {expected}, а у вас {actual}.')
