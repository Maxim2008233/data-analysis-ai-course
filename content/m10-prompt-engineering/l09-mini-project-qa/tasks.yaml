  solution: |
    def get_answer(model, messages, n):
        text = model.invoke(messages).content
        answer = parse_answer(text, n)
        if answer is not None:
            return answer, 1, False
        retry = messages + [{'role': 'assistant', 'content': text},
                            {'role': 'user', 'content': FIX.format(last=n - 1)}]
        answer = parse_answer(model.invoke(retry).content, n)
        if answer is not None:
            return answer, 2, False
        return FALLBACK, 2, True

    results = [get_answer(FakeListChatModel(responses=s), QUESTION, 4) for s in SCENARIOS]
    n_fallback = sum(used for _, _, used in results)
    n_requests = sum(r for _, r, _ in results)
    print(results, n_fallback, n_requests)
  explanation: |
