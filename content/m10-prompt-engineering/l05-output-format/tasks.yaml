    import re

    def parse_digit(text, n):
        m = re.fullmatch(r'\s*(\d+)\s*\.?\s*', text)
        if m is None:
            return None
        k = int(m.group(1))
        return k if k < n else None

    def make_fake(answers):
        """Модель-заглушка: отвечает заданными текстами по очереди и запоминает, что ей прислали."""
        def model(messages):
            model.calls.append([dict(m) for m in messages])
            return answers[min(len(model.calls), len(answers)) - 1]
        model.calls = []
        return model

