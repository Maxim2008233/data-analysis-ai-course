  solution: |
    def ask_until_valid(model, messages, n, retries=2):
        history = list(messages)
        requests = 0
        for attempt in range(retries + 1):
            text = model(history)
            requests += 1
            answer = parse_digit(text, n)
            if answer is not None:
                return answer, requests
            history = history + [{'role': 'assistant', 'content': text},
                                 {'role': 'user', 'content': FIX.format(last=n - 1)}]
        return None, requests

    results = [ask_until_valid(make_fake(s), QUESTION, 4) for s in SCENARIOS]
    total_requests = sum(r for _, r in results)
    print(results, total_requests)
  explanation: |
    - `range(retries + 1)` — первый запрос и не больше `retries` повторных. Без ограничения модель, которая упорно отвечает не по формату, тратила бы токены бесконечно.
    - При повторе модель видит свой ответ (роль `assistant`) и просьбу исправить формат. Каждый повтор удлиняет историю на два сообщения — следующий запрос дороже (урок 10.3).
    - В четвёртом сценарии все три попытки не по формату, и функция честно возвращает `None`. Дальше программа решает сама: поставить запасной ответ и пометить вопрос.
    - Число лишних запросов стоит считать: если повторов много, лучше чинить промпт, чем каждый раз переспрашивать.
