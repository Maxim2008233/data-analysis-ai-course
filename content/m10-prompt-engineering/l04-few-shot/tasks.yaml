  statement: |
    Модели склонны повторять ответ, который чаще встречался в примерах. Напишите функцию `pick_balanced(df, i, k)` — как `pick_examples`, но с разными ответами:

    1. Кандидаты — те же, что у `pick_examples`, и в том же порядке: сначала вопросы той же категории, потом остальные, без самого вопроса `i`.
    2. Первый проход: кандидаты берутся по порядку, но только если их ответа (столбец `ответ`) ещё нет среди выбранных. Набралось `k` — стоп.
    3. Если примеров меньше `k`, второй проход добирает невыбранных кандидатов по порядку, уже не глядя на ответы.

    Возвращается список меток в порядке выбора. Получите:

    - `bal12 = pick_balanced(qa, 12, 2)` и `bal12_answers` — ответы этих примеров;
    - `n_repeat_plain` — у скольких вопросов `qa` среди трёх примеров `pick_examples(qa, i, 3)` есть повторяющиеся ответы;
    - `n_repeat_bal` — то же для `pick_balanced(qa, i, 3)`.
  prelude: |
    import pandas as pd
    qa = pd.read_csv('qa_train.csv')

    def candidates(df, i):
        others = df.drop(index=i)
        cat = df.loc[i, 'категория']
        same = list(others.index[others['категория'] == cat]) if cat != '-' else []
        return same + [j for j in others.index if j not in same]

    def pick_examples(df, i, k):
        return candidates(df, i)[:k]
