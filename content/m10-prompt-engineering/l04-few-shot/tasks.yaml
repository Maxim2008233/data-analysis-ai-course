- id: m10-l4-t1
  title: Варианты с номерами
  difficulty: warmup
  introduces: []
  uses: [llm-chat-api]
  statement: |
    Напишите функцию `format_options(options)`: список вариантов превращается в строку, где каждый вариант стоит на своей строке со своим номером с нуля — `0) …`, `1) …` и так далее. Строки соединяются переводом строки `\n`, в конце перевода строки нет.

    Получите `prompt5` — промпт для вопроса номер 5 из `qa` по шаблону `TEMPLATE` (варианты списком — в столбце `options`).
  prelude: |
    import ast
    import json
    import warnings
    import pandas as pd
    qa = pd.read_csv('qa_train.csv')

    def parse_options(s):
        try:
            return json.loads(s)
        except json.JSONDecodeError:
            with warnings.catch_warnings():
                warnings.simplefilter('ignore', SyntaxWarning)
                return ast.literal_eval(s)

    qa['options'] = qa['варианты'].apply(parse_options)
    TEMPLATE = """Вопрос: {question}
    Варианты ответа:
    {options}
    Ответ:"""
  starter: |
    def format_options(options):
        lines = [... for i, o in enumerate(options)]
        return ...

    row = qa.loc[5]
    prompt5 = TEMPLATE.format(question=..., options=...)
    print(prompt5)
  solution: |
    def format_options(options):
        lines = [f'{i}) {o}' for i, o in enumerate(options)]
        return '\n'.join(lines)

    row = qa.loc[5]
    prompt5 = TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
    print(prompt5)
  explanation: |
    - `enumerate` выдаёт пары «номер, вариант», номера с нуля — как в столбце `ответ`. Модели не нужно считать позиции самой.
    - `'\n'.join(lines)` ставит перевод строки между строками, но не после последней.
    - Шаблон заполняется именованными значениями: `question=…`, `options=…`. Одинаковые имена в шаблоне и в `format` — обязательное условие.
  hints:
    - "Строка варианта — f-строка `f'{i}) {o}'`."
    - "Соединить строки — `'\\n'.join(lines)`."
    - "`TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))`."
  tests: |
    f = var('format_options')
    ensure(callable(f), '`format_options` должна быть функцией.')
    got = f(['да', 'нет'])
    ensure(isinstance(got, str), '`format_options` должна вернуть строку.')
    if got == '1) да\n2) нет':
        fail('Номера вариантов считаются с нуля, как в столбце `ответ`: «0) да», «1) нет».')
    if got in ('0) да, 1) нет', '0) да 1) нет'):
        fail('Каждый вариант — с новой строки: соедините строки через `\\n`.')
    if got.endswith('\n'):
        fail('После последнего варианта перевода строки быть не должно.')
    equal(got, '0) да\n1) нет', "format_options(['да', 'нет']) должна дать '0) да\\n1) нет', а получилось {actual}.")
    ten = f([str(k * k) for k in range(10)])
    equal(ten.split('\n')[-1], '9) 81', 'У десяти вариантов последняя строка — {expected}, а у вас {actual}.')
    equal(var('prompt5', str, 'строкой'), ref('prompt5'), '`prompt5` — шаблон, заполненный вопросом 5 и его пронумерованными вариантами.')
  files: [qa_train.csv]
  wrong:
    - code: |
        def format_options(options):
            return '\n'.join(f'{i}) {o}' for i, o in enumerate(options, start=1))
        row = qa.loc[5]
        prompt5 = TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
      expect: считаются с нуля
    - code: |
        def format_options(options):
            return ', '.join(f'{i}) {o}' for i, o in enumerate(options))
        row = qa.loc[5]
        prompt5 = TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
      expect: с новой строки

- id: m10-l4-t2
  title: Шаблон с ответом в JSON
  difficulty: main
  introduces: []
  uses: [llm-chat-api]
  statement: |
    Нужен шаблон `ANSWER_TEMPLATE` с местами `{question}` и `{options}`. `ANSWER_TEMPLATE.format(question=Q, options=O)` должен давать ровно такой текст:

    ```
    Вопрос: Q
    Варианты ответа:
    O
    Ответь только JSON без пояснений: {"answer": номер правильного варианта}
    ```

    Получите `prompt` — промпт для вопроса номер 12 (`format_options` готова).
  prelude: |
    import ast
    import json
    import warnings
    import pandas as pd
    qa = pd.read_csv('qa_train.csv')

    def parse_options(s):
        try:
            return json.loads(s)
        except json.JSONDecodeError:
            with warnings.catch_warnings():
                warnings.simplefilter('ignore', SyntaxWarning)
                return ast.literal_eval(s)

    qa['options'] = qa['варианты'].apply(parse_options)

    def format_options(options):
        return '\n'.join(f'{i}) {o}' for i, o in enumerate(options))
  starter: |
    ANSWER_TEMPLATE = """Вопрос: {question}
    Варианты ответа:
    {options}
    Ответь только JSON без пояснений: ..."""

    row = qa.loc[12]
    prompt = ANSWER_TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
    print(prompt)
  solution: |
    ANSWER_TEMPLATE = """Вопрос: {question}
    Варианты ответа:
    {options}
    Ответь только JSON без пояснений: {{"answer": номер правильного варианта}}"""

    row = qa.loc[12]
    prompt = ANSWER_TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
    print(prompt)
  explanation: |
    - Двойные скобки `{{` и `}}` — единственный способ вписать фигурную скобку в шаблон для `format`. После подстановки в промпте останутся одинарные.
    - Места подстановки `{question}` и `{options}` остаются с одинарными скобками — их `format` и заполняет.
    - Ответ в JSON проще разобрать программой: `json.loads(ответ)['answer']`. Как проверять такие ответы и что делать, если модель всё-таки написала лишнее, — урок 10.5.
  hints:
    - "Одинарные скобки вокруг `\"answer\": …` `format` примет за место подстановки и упадёт."
    - "Чтобы в тексте осталась скобка `{`, в шаблоне пишут `{{`, а для `}` — `}}`."
    - "Последняя строка шаблона — `Ответь только JSON без пояснений: {{\"answer\": номер правильного варианта}}`."
  tests: |
    t = var('ANSWER_TEMPLATE', str, 'строкой')
    try:
        got = t.format(question='Сколько будет 2 + 2?', options='0) 3\n1) 4')
    except (KeyError, ValueError, IndexError):
        fail('`ANSWER_TEMPLATE.format(...)` падает: фигурные скобки JSON в шаблоне нужно удвоить — `{{` и `}}`.')
    want = 'Вопрос: Сколько будет 2 + 2?\nВарианты ответа:\n0) 3\n1) 4\nОтветь только JSON без пояснений: {"answer": номер правильного варианта}'
    if '{{' in got or '}}' in got:
        fail('В готовом промпте скобки должны быть одинарными: в шаблоне их удваивают ровно один раз.')
    equal(got, want, 'Шаблон с вопросом «Сколько будет 2 + 2?» дал другой текст. Ожидалось:\n' + want)
    equal(var('prompt', str, 'строкой'), ref('prompt'), '`prompt` — шаблон, заполненный вопросом 12.')
  files: [qa_train.csv]
  wrong:
    - code: |
        ANSWER_TEMPLATE = """Вопрос: {question}
        Варианты ответа:
        {options}
        Ответь только JSON без пояснений: {"answer": номер правильного варианта}"""
        row = qa.loc[12]
        prompt = ANSWER_TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
      expect: Фигурные скобки
    - code: |
        ANSWER_TEMPLATE = """Вопрос: {question}
        Варианты ответа: {options}
        Ответь только JSON без пояснений: {{"answer": номер правильного варианта}}"""
        row = qa.loc[12]
        prompt = ANSWER_TEMPLATE.format(question=row['вопрос'], options=format_options(row['options']))
      expect: дал другой текст

