- id: m10-l4-t4
  title: Примеры как диалог
  difficulty: main
  introduces: []
  uses: [few-shot, system-prompt]
  statement: |
    Напишите функцию `few_shot_messages(examples, row, system)`. `examples` — таблица решённых вопросов, `row` — вопрос, на который нужен ответ. Функция возвращает список сообщений:

    - первым — системное сообщение `system`;
    - для каждого примера — вопрос по шаблону `TEMPLATE` с ролью `user`, затем его ответ с ролью `assistant`. Ответ — строка с номером: `'2'`, а не число `2`;
    - последним — вопрос `row` по шаблону с ролью `user`.

    Получите `msgs` для вопроса 12 и его примеров `pick_examples(qa, 12, 2)` с системным промптом `SYSTEM`, `roles` — список ролей `msgs`, и `n_tokens` — прикидку токенов всех сообщений вместе: `count_tokens` от склеенного текста всех `content`.
  prelude: |
    import ast
    import json
    import math
    import warnings
    import pandas as pd
    qa = pd.read_csv('qa_train.csv')

    def parse_options(s):
        try:
            return json.loads(s)
        except json.JSONDecodeError:
            with warnings.catch_warnings():
                warnings.simplefilter('ignore', SyntaxWarning)
                return ast.literal_eval(s)

    qa['options'] = qa['варианты'].apply(parse_options)
    TEMPLATE = """Вопрос: {question}
    Варианты ответа:
    {options}
    Ответ:"""
    SYSTEM = 'Ты решаешь тест. Отвечай одной цифрой — номером правильного варианта.'

    def format_options(options):
        return '\n'.join(f'{i}) {o}' for i, o in enumerate(options))

    def ask(r):
        return TEMPLATE.format(question=r['вопрос'], options=format_options(r['options']))

    def pick_examples(df, i, k):
        others = df.drop(index=i)
        cat = df.loc[i, 'категория']
        same = list(others.index[others['категория'] == cat]) if cat != '-' else []
        return (same + [j for j in others.index if j not in same])[:k]

    def count_tokens(text):
        return math.ceil(len(text) / 5.09)
  starter: |
    def few_shot_messages(examples, row, system):
        msgs = [{'role': 'system', 'content': system}]
        for _, ex in examples.iterrows():
            msgs.append({'role': 'user', 'content': ask(ex)})
            msgs.append(...)
        msgs.append(...)
        return msgs

    msgs = few_shot_messages(qa.loc[pick_examples(qa, 12, 2)], qa.loc[12], SYSTEM)
    roles = ...
    n_tokens = ...
    print(roles, n_tokens)
  solution: |
    def few_shot_messages(examples, row, system):
        msgs = [{'role': 'system', 'content': system}]
        for _, ex in examples.iterrows():
            msgs.append({'role': 'user', 'content': ask(ex)})
            msgs.append({'role': 'assistant', 'content': str(ex['ответ'])})
        msgs.append({'role': 'user', 'content': ask(row)})
        return msgs

    msgs = few_shot_messages(qa.loc[pick_examples(qa, 12, 2)], qa.loc[12], SYSTEM)
    roles = [m['role'] for m in msgs]
    n_tokens = count_tokens(''.join(m['content'] for m in msgs))
    print(roles, n_tokens)
  explanation: |
    - Пример — пара сообщений: вопрос пользователя и ответ ассистента. Модель видит «свои» прошлые ответы одной цифрой и отвечает так же.
    - `content` — всегда строка: так сообщение уходит в JSON. Число `2` пришлось бы превращать при отправке, а сравнивать ответы модели удобнее строками.
    - Две пары примеров увеличивают запрос вдвое с лишним: 90 токенов вместо 42 без примеров. Для 786 вопросов теста это ощутимо, поэтому число примеров подбирают проверкой.
  hints:
    - "Ответ примера — `{'role': 'assistant', 'content': str(ex['ответ'])}`."
    - "Последнее сообщение — `{'role': 'user', 'content': ask(row)}`."
    - "`roles = [m['role'] for m in msgs]`; токены — `count_tokens(''.join(m['content'] for m in msgs))`."
  tests: |
    import pandas as pd
    f = var('few_shot_messages')
    ensure(callable(f), '`few_shot_messages` должна быть функцией.')
    ex = pd.DataFrame({'вопрос': ['2 + 2?', '3 + 3?'], 'options': [['3', '4'], ['6', '7']], 'ответ': [1, 0]})
    q = pd.Series({'вопрос': '5 + 5?', 'options': ['10', '11']})
    got = f(ex, q, 'S')
    ensure(isinstance(got, list), '`few_shot_messages` должна вернуть список сообщений.')
    ensure(len(got) == 6, 'Для двух примеров должно получиться 6 сообщений: системное, две пары «вопрос — ответ» и вопрос, а у вас {0}.'.format(len(got)))
    if [m.get('role') for m in got] == ['system', 'user', 'user', 'user', 'user', 'user']:
        fail('Ответы примеров идут с ролью assistant: модель должна принять их за свои прошлые ответы.')
    if any(not isinstance(m.get('content'), str) for m in got):
        fail('`content` каждого сообщения — строка. Ответ примера превратите в строку: `str(ex[\"ответ\"])`.')
    want = [{'role': 'system', 'content': 'S'},
            {'role': 'user', 'content': 'Вопрос: 2 + 2?\nВарианты ответа:\n0) 3\n1) 4\nОтвет:'},
            {'role': 'assistant', 'content': '1'},
            {'role': 'user', 'content': 'Вопрос: 3 + 3?\nВарианты ответа:\n0) 6\n1) 7\nОтвет:'},
            {'role': 'assistant', 'content': '0'},
            {'role': 'user', 'content': 'Вопрос: 5 + 5?\nВарианты ответа:\n0) 10\n1) 11\nОтвет:'}]
    equal(got, want, 'На двух примерах сообщения получились не те: ожидалось {expected}, а получилось {actual}.')
    equal(var('msgs', list, 'списком'), ref('msgs'), '`msgs` — сообщения для вопроса 12 с примерами `pick_examples(qa, 12, 2)`.')
    equal(var('roles', list, 'списком'), ref('roles'), 'Роли — {expected}, а у вас {actual}.')
    equal(int(var('n_tokens', 'number', 'числом')), ref('n_tokens'), 'Токенов во всех сообщениях — {expected}, а у вас {actual}.')
  files: [qa_train.csv]
