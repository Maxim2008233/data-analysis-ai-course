    import pandas as pd
    f = var('pick_balanced')
    ensure(callable(f), '`pick_balanced` должна быть функцией.')
    df = pd.DataFrame({'категория': ['А', 'А', 'А', 'А', 'Б', 'Б'], 'ответ': [2, 2, 2, 0, 1, 3]}, index=[0, 1, 2, 3, 4, 5])
    got = [int(x) for x in f(df, 0, 2)]
    if 0 in got:
        fail('Сам вопрос не должен попадать в свои примеры.')
    if got == [1, 2]:
        fail('У примеров 1 и 2 одинаковый ответ 2. Первый проход берёт кандидата, только если его ответа ещё нет среди выбранных.')
    equal(got, [1, 3], 'Для вопроса 0 категории «А» ожидались примеры {expected}, а получилось {actual}.')
    got3 = [int(x) for x in f(df, 0, 3)]
    equal(got3, [1, 3, 4], 'Разные ответы важнее категории: третьим идёт первый кандидат с новым ответом, ожидалось {expected}, а получилось {actual}.')
    same_answer = pd.DataFrame({'категория': ['А'] * 4, 'ответ': [1, 1, 1, 1]})
    g4 = [int(x) for x in f(same_answer, 0, 3)]
    if len(g4) < 3:
        fail('Если разных ответов не хватает, второй проход добирает кандидатов по порядку: у вопроса с тремя одинаково отвеченными соседями должно быть 3 примера, а у вас {0}.'.format(len(g4)))
    equal(g4, [1, 2, 3], 'Второй проход добирает кандидатов по порядку: ожидалось {expected}, а получилось {actual}.')
    equal([int(x) for x in var('bal12', list, 'списком')], ref('bal12'), '`bal12` — {expected}, а у вас {actual}.')
    equal([int(x) for x in var('bal12_answers', list, 'списком')], [int(x) for x in ref('bal12_answers')], 'Ответы примеров — {expected}, а у вас {actual}.')
    equal(int(var('n_repeat_plain', 'number', 'числом')), ref('n_repeat_plain'), 'Простой выбор даёт повторы у {expected} вопросов, а у вас {actual}.')
    equal(int(var('n_repeat_bal', 'number', 'числом')), ref('n_repeat_bal'), 'Сбалансированный выбор даёт повторы у {expected} вопросов, а у вас {actual}.')
    equal(int(alt('n_repeat_bal')), alt_ref('n_repeat_bal'), HARDCODE_MSG)
