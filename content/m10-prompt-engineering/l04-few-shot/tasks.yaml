    def pick_balanced(df, i, k):
        cands = candidates(df, i)
        chosen, used = [], set()
        for j in cands:                       # первый проход: только новые ответы
            if len(chosen) == k:
                break
            if df.loc[j, 'ответ'] not in used:
                chosen.append(j)
                used.add(df.loc[j, 'ответ'])
        for j in cands:                       # второй проход: добираем по порядку
            if len(chosen) == k:
                break
            if j not in chosen:
                chosen.append(j)
        return chosen

    def has_repeat(df, idx):
        answers = list(df.loc[idx, 'ответ'])
        return len(set(answers)) < len(answers)

    bal12 = pick_balanced(qa, 12, 2)
    bal12_answers = list(qa.loc[bal12, 'ответ'])
    n_repeat_plain = sum(has_repeat(qa, pick_examples(qa, i, 3)) for i in qa.index)
    n_repeat_bal = sum(has_repeat(qa, pick_balanced(qa, i, 3)) for i in qa.index)
    print(bal12, bal12_answers, n_repeat_plain, n_repeat_bal)
  explanation: |
    - Для вопроса 12 простой выбор давал два примера с ответом 2 — тем же, что неверно выбрала модель. Сбалансированный выбор оставляет первый пример, а вместо второго берёт вопрос 23 той же темы с ответом 0.
    - Повторы ответов среди трёх примеров были у 67 вопросов из 87, а стали у 0: разных правильных номеров в данных хватает, и второй проход здесь не понадобился.
    - Разные ответы не гарантируют верного ответа модели. Они лишь убирают подсказку «здесь обычно отвечают 2». Помогло ли это на самом деле, показывает только проверка на размеченных вопросах.
