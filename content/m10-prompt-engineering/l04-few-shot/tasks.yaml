    - сам вопрос `i` в примеры не попадает никогда;
    - сначала идут вопросы той же категории, в порядке таблицы. Категория «-» значит «не указана», похожих по ней не ищут;
    - если таких меньше `k`, список добирают остальными вопросами в порядке таблицы.

    Получите:

    - `ex12 = pick_examples(qa, 12, 2)` и `ex0 = pick_examples(qa, 0, 2)`;
    - `n_same` — у скольких вопросов `qa` оба примера из `pick_examples(qa, i, 2)` той же категории, что и сам вопрос (вопросы с категорией «-» не считаются).
  prelude: |
    import pandas as pd
    qa = pd.read_csv('qa_train.csv')
  starter: |
    def pick_examples(df, i, k):
        others = df.drop(index=i)                          # все вопросы, кроме самого
        cat = df.loc[i, 'категория']
        if cat != '-':
            same = list(others.index[...])
        else:
            same = []
        rest = [j for j in others.index if j not in same]
        return ...

    ex12 = pick_examples(qa, 12, 2)
    ex0 = pick_examples(qa, 0, 2)
    n_same = 0
    for i in qa.index:
        cat = qa.loc[i, 'категория']
        if cat != '-' and all(...):
            n_same += 1
    print(ex12, ex0, n_same)
  solution: |
    def pick_examples(df, i, k):
        others = df.drop(index=i)                          # все вопросы, кроме самого
        cat = df.loc[i, 'категория']
        if cat != '-':
            same = list(others.index[others['категория'] == cat])
        else:
            same = []
        rest = [j for j in others.index if j not in same]
        return (same + rest)[:k]

    ex12 = pick_examples(qa, 12, 2)
    ex0 = pick_examples(qa, 0, 2)
    n_same = 0
    for i in qa.index:
        cat = qa.loc[i, 'категория']
        if cat != '-' and all(qa.loc[j, 'категория'] == cat for j in pick_examples(qa, i, 2)):
            n_same += 1
    print(ex12, ex0, n_same)
  explanation: |
    - `df.drop(index=i)` убирает сам вопрос до всякого выбора — так утечка невозможна при любом `k`.
    - `(same + rest)[:k]` — сначала похожие, потом остальные, и берётся `k` первых. Если похожих хватает, остальные просто не понадобятся.
    - Двумя примерами своей темы обеспечены 57 вопросов из 87. Для вопросов без категории и для редких тем, где всего один-два вопроса, примеры приходят из других тем.
  hints:
    - "Метки вопросов той же категории — `others.index[others['категория'] == cat]`."
    - "Сначала похожие, потом остальные: `(same + rest)[:k]`."
    - "Проверка категорий примеров — `all(qa.loc[j, 'категория'] == cat for j in pick_examples(qa, i, 2))`."
  tests: |
    import pandas as pd
    f = var('pick_examples')
    ensure(callable(f), '`pick_examples` должна быть функцией.')
    df = pd.DataFrame({'категория': ['А', 'Б', 'А', '-', 'А', '-'], 'ответ': [0, 1, 2, 0, 1, 3]}, index=[10, 11, 12, 13, 14, 15])
    got = list(f(df, 12, 2))
    if 12 in got:
        fail('Сам вопрос не должен попадать в свои примеры — иначе в промпте окажется его правильный ответ.')
    equal(got, [10, 14], 'Для вопроса 12 категории «А» примеры — сначала вопросы той же категории: ожидалось {expected}, а получилось {actual}.')
    equal(list(f(df, 12, 4)), [10, 14, 11, 13], 'Если похожих не хватает, список добирают остальными в порядке таблицы: ожидалось {expected}, а получилось {actual}.')
    if list(f(df, 13, 2)) != [10, 11]:
        fail('Категория «-» значит «не указана»: для такого вопроса примеры берутся просто по порядку таблицы. Для вопроса 13 ожидалось [10, 11].')
    equal(list(f(df, 11, 1)), [10], 'У вопроса 11 категории «Б» других вопросов этой категории нет, и примеры идут по порядку таблицы: ожидалось {expected}, а получилось {actual}.')
    equal([int(x) for x in var('ex12', list, 'списком')], ref('ex12'), '`ex12` — {expected}, а у вас {actual}.')
    equal([int(x) for x in var('ex0', list, 'списком')], ref('ex0'), '`ex0` — {expected}, а у вас {actual}.')
    equal(int(var('n_same', 'number', 'числом')), ref('n_same'), 'Двумя примерами своей категории обеспечены {expected} вопросов, а у вас {actual}.')
    equal(int(alt('n_same')), alt_ref('n_same'), HARDCODE_MSG)
