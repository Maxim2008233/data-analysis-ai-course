id: m10
number: 10
label: Модуль 10
title: "Работа с LLM: промпт-инжиниринг"
short: "Промпты и LLM"
firstLessonIndex: 0
description: >-
  Как работать с большой языковой моделью из программы: запрос из сообщений с ролями и параметрами, температура и
  случайность ответа, системный промпт и история диалога, шаблоны и примеры в промпте (few-shot), ответ в заданном
  формате и его разбор, вызов функций, цепочки «шаблон → модель → разбор» и честная оценка LLM-решения на тесте из
  вопросов с вариантами ответа. Настоящему GigaChat нужен ключ авторизации, а ключам не место в коде сайта, поэтому
  в браузере работают учебные версии gigachat и LangChain: они воспроизводят настоящие ответы GigaChat из ноутбука
  курса и дают тестовую модель для проверки цепочек. Свои запросы к GigaChat — по ссылке в Colab.
sources:
  - Workshops/2025/06_PromptEng.ipynb
  - Workshops/basic competitions/Baseline_hw3.ipynb
  - Lec/06_LLM.pptx
