- id: m10-l2-t5
  title: Выбирать случайно или брать лучший
  difficulty: star
  introduces: []
  uses: [sampling-temperature, logits]
  statement: |
    Классификатор отзывов из урока 9.6 выдаёт логиты двух классов, `y` — правильные ответы. Представим, что класс мы не берём по наибольшему логиту, а выбираем случайно с вероятностями `softmax(logits / T)` — так языковая модель выбирает токен. Тогда отзыв `i` угадан с вероятностью `q[i, y[i]]`, а ожидаемая доля верных ответов — среднее этих вероятностей по отзывам.

    Получите:

    - `acc_greedy` — долю верных, если брать класс с наибольшим логитом;
    - `acc_sample` — массив ожидаемых долей верных при случайном выборе для каждой температуры из `temps`;
    - `extra_errors` — на сколько ошибок больше в среднем даёт случайный выбор при T = 1, чем выбор наибольшего логита, на всех отзывах. Число может быть дробным.
  prelude: |
    import numpy as np
    import pandas as pd
    from transformers import AutoTokenizer, AutoModelForSequenceClassification
    name = 'distilbert-base-uncased-finetuned-sst-2-english'
    tokenizer = AutoTokenizer.from_pretrained(name)
    model = AutoModelForSequenceClassification.from_pretrained(name)
    reviews = pd.read_csv('reviews.csv')
    logits = model(**tokenizer(list(reviews['text']), padding=True, truncation=True, return_tensors='np')).logits
    y = reviews['label'].to_numpy()
    temps = [0.1, 0.5, 1, 2, 5]

    def softmax(z):
        e = np.exp(z - z.max(axis=-1, keepdims=True))
        return e / e.sum(axis=-1, keepdims=True)
  starter: |
    acc_greedy = ...

    def expected_acc(T):
        q = softmax(logits / T)
        return ...

    acc_sample = np.array([expected_acc(T) for T in temps])
    extra_errors = ...
    print(round(acc_greedy, 3), acc_sample.round(3), round(extra_errors, 2))
  solution: |
    acc_greedy = (logits.argmax(axis=1) == y).mean()

    def expected_acc(T):
        q = softmax(logits / T)
        return q[np.arange(len(y)), y].mean()

    acc_sample = np.array([expected_acc(T) for T in temps])
    extra_errors = (acc_greedy - expected_acc(1)) * len(y)
    print(round(acc_greedy, 3), acc_sample.round(3), round(extra_errors, 2))
  explanation: |
    - `q[np.arange(len(y)), y]` берёт у каждого отзыва вероятность его правильного класса: строка i, столбец y[i].
    - Если брать наибольший логит, модель верна на 93,2 % отзывов. При T = 0,1 случайный выбор почти не хуже — 92,6 %. С ростом температуры ожидаемая доля верных падает: 90,5 % при T = 1 и 76,2 % при T = 5. Чем выше температура, тем ближе выбор к подбрасыванию монеты.
    - При T = 1 случайный выбор в среднем даёт на 2,4 ошибки больше на 88 отзывах.
    - Ошибается модель на тех же отзывах, где она не уверена: там случайный выбор чаще промахивается. Поэтому для задач с одним правильным ответом температуру ставят низкой.
  hints:
    - "Жадный выбор — `logits.argmax(axis=1)`; доля верных — `(... == y).mean()`."
    - "Вероятность правильного класса каждого отзыва — `q[np.arange(len(y)), y]`."
    - "Ошибок в среднем — доля ошибок × число отзывов: `(acc_greedy - expected_acc(1)) * len(y)`."
  tests: |
    import numpy as np
    close(var('acc_greedy', 'number', 'числом'), ref('acc_greedy'), 'Доля верных при выборе наибольшего логита — {expected}, а у вас {actual}.')
    acc = np.asarray(var('acc_sample'), dtype=float)
    ensure(acc.shape == (len(ref('temps')),), '`acc_sample` — по числу на каждую температуру из `temps`, а у вас форма {0}.'.format(acc.shape))
    if np.allclose(acc, acc[0]):
        fail('`acc_sample` не зависит от температуры: делите логиты на T перед softmax.')
    lg, yy = ref('logits'), ref('y')
    pos = np.array([softmax_ref[:, 1].mean() for softmax_ref in [np.exp(lg / T - (lg / T).max(axis=1, keepdims=True)) / np.exp(lg / T - (lg / T).max(axis=1, keepdims=True)).sum(axis=1, keepdims=True) for T in ref('temps')]])
    if np.allclose(acc, pos):
        fail('Нужна вероятность правильного класса `y[i]` каждого отзыва, а не вероятность класса POSITIVE.')
    same_array(acc, ref('acc_sample'), '`acc_sample` — ожидаемая доля верных при случайном выборе для каждой температуры.')
    ee = var('extra_errors', 'number', 'числом')
    if abs(ee - ref('extra_errors') / len(yy)) < 1e-9:
        fail('`extra_errors` — число ошибок на всех отзывах, а не доля: умножьте разницу долей на число отзывов.')
    close(ee, ref('extra_errors'), 'Лишних ошибок при T = 1 в среднем — {expected}, а у вас {actual}.')
    close(alt('extra_errors'), alt_ref('extra_errors'), HARDCODE_MSG)
