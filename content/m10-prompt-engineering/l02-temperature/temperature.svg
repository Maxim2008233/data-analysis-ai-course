<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Три столбчатые диаграммы: вероятности слов после «линейная» по текстам курса при трёх температурах. При T = 0,3: «модель» 0,925, «регрессия» 0,075, «интерполяция» 0,000; при T = 1: «модель» 0,567, «регрессия» 0,267, «интерполяция» 0,033; при T = 2: «модель» 0,345, «регрессия» 0,237, «интерполяция» 0,084. Низкая температура усиливает самые вероятные слова, высокая выравнивает вероятности, порядок слов не меняется.">
  <text x="12" y="22" fill="currentColor" font-weight="700">Температура меняет вероятности следующего слова. Слово «линейная», тексты курса</text>
  <rect x="10" y="40" width="236" height="216" rx="8" fill="#d9480f" fill-opacity="0.05" stroke="#d9480f" stroke-opacity="0.35"/>
  <text x="20" y="60" fill="currentColor" font-weight="700">T = 0,3 — резче</text>
  <text x="106" y="91" fill="currentColor" text-anchor="end">модель</text>
  <rect x="112" y="79" width="109.1" height="16" rx="2" fill="#d9480f" fill-opacity="0.85"/>
  <text x="225.1" y="91" fill="currentColor" font-size="11">0,925</text>
  <text x="106" y="115" fill="currentColor" text-anchor="end">регрессия</text>
  <rect x="112" y="103" width="8.8" height="16" rx="2" fill="#d9480f" fill-opacity="0.55"/>
  <text x="124.8" y="115" fill="currentColor" font-size="11">0,075</text>
  <text x="106" y="139" fill="currentColor" text-anchor="end">интерполяция</text>
  <text x="116.0" y="139" fill="currentColor" font-size="11">0,000</text>
  <text x="106" y="163" fill="currentColor" text-anchor="end">обучение</text>
  <text x="116.0" y="163" fill="currentColor" font-size="11">0,000</text>
  <text x="106" y="187" fill="currentColor" text-anchor="end">форма</text>
  <text x="116.0" y="187" fill="currentColor" font-size="11">0,000</text>
  <text x="106" y="211" fill="currentColor" text-anchor="end">knn</text>
  <text x="116.0" y="211" fill="currentColor" font-size="11">0,000</text>
  <text x="106" y="235" fill="currentColor" text-anchor="end">4</text>
  <text x="116.0" y="235" fill="currentColor" font-size="11">0,000</text>
  <rect x="260" y="40" width="236" height="216" rx="8" fill="#3d5bd9" fill-opacity="0.05" stroke="#3d5bd9" stroke-opacity="0.35"/>
  <text x="270" y="60" fill="currentColor" font-weight="700">T = 1 — как в модели</text>
  <text x="356" y="91" fill="currentColor" text-anchor="end">модель</text>
  <rect x="362" y="79" width="66.9" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.85"/>
  <text x="432.9" y="91" fill="currentColor" font-size="11">0,567</text>
  <text x="356" y="115" fill="currentColor" text-anchor="end">регрессия</text>
  <rect x="362" y="103" width="31.5" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.55"/>
  <text x="397.5" y="115" fill="currentColor" font-size="11">0,267</text>
  <text x="356" y="139" fill="currentColor" text-anchor="end">интерполяция</text>
  <rect x="362" y="127" width="3.9" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.55"/>
  <text x="369.9" y="139" fill="currentColor" font-size="11">0,033</text>
  <text x="356" y="163" fill="currentColor" text-anchor="end">обучение</text>
  <rect x="362" y="151" width="3.9" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.55"/>
  <text x="369.9" y="163" fill="currentColor" font-size="11">0,033</text>
  <text x="356" y="187" fill="currentColor" text-anchor="end">форма</text>
  <rect x="362" y="175" width="3.9" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.55"/>
  <text x="369.9" y="187" fill="currentColor" font-size="11">0,033</text>
  <text x="356" y="211" fill="currentColor" text-anchor="end">knn</text>
  <rect x="362" y="199" width="3.9" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.55"/>
  <text x="369.9" y="211" fill="currentColor" font-size="11">0,033</text>
  <text x="356" y="235" fill="currentColor" text-anchor="end">4</text>
  <rect x="362" y="223" width="3.9" height="16" rx="2" fill="#3d5bd9" fill-opacity="0.55"/>
  <text x="369.9" y="235" fill="currentColor" font-size="11">0,033</text>
  <rect x="510" y="40" width="236" height="216" rx="8" fill="#2b8a3e" fill-opacity="0.05" stroke="#2b8a3e" stroke-opacity="0.35"/>
  <text x="520" y="60" fill="currentColor" font-weight="700">T = 2 — ровнее</text>
  <text x="606" y="91" fill="currentColor" text-anchor="end">модель</text>
  <rect x="612" y="79" width="40.7" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.85"/>
  <text x="656.7" y="91" fill="currentColor" font-size="11">0,345</text>
  <text x="606" y="115" fill="currentColor" text-anchor="end">регрессия</text>
  <rect x="612" y="103" width="27.9" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.55"/>
  <text x="643.9" y="115" fill="currentColor" font-size="11">0,237</text>
  <text x="606" y="139" fill="currentColor" text-anchor="end">интерполяция</text>
  <rect x="612" y="127" width="9.9" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.55"/>
  <text x="625.9" y="139" fill="currentColor" font-size="11">0,084</text>
  <text x="606" y="163" fill="currentColor" text-anchor="end">обучение</text>
  <rect x="612" y="151" width="9.9" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.55"/>
  <text x="625.9" y="163" fill="currentColor" font-size="11">0,084</text>
  <text x="606" y="187" fill="currentColor" text-anchor="end">форма</text>
  <rect x="612" y="175" width="9.9" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.55"/>
  <text x="625.9" y="187" fill="currentColor" font-size="11">0,084</text>
  <text x="606" y="211" fill="currentColor" text-anchor="end">knn</text>
  <rect x="612" y="199" width="9.9" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.55"/>
  <text x="625.9" y="211" fill="currentColor" font-size="11">0,084</text>
  <text x="606" y="235" fill="currentColor" text-anchor="end">4</text>
  <rect x="612" y="223" width="9.9" height="16" rx="2" fill="#2b8a3e" fill-opacity="0.55"/>
  <text x="625.9" y="235" fill="currentColor" font-size="11">0,084</text>
  <text x="12" y="282" fill="currentColor">T &lt; 1 усиливает самые вероятные слова, T &gt; 1 выравнивает вероятности. Порядок слов не меняется, сумма всегда 1.</text>
</svg>
