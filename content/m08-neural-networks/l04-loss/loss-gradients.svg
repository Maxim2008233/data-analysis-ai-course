<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Две функции потерь и их градиенты. Слева: потери от промаха. MSE — парабола: промах 3 (30 000 евро) даёт потерю 9, а MAE — модуль промаха, потеря 3. Справа: градиент — сила, с которой промах тянет веса. У MSE она растёт пропорционально промаху: 0,2 при промахе 1 000 евро, 0,6 при 3 000 и 6 при 30 000, то есть в 30 раз больше. У MAE она одинакова для любого промаха: 1. Поэтому сеть с MSE сильнее исправляет крупные промахи на дорогих машинах, а сеть с MAE тянется к медиане цены похожих машин.">
