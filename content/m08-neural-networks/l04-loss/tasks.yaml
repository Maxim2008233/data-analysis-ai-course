    print(results.round(0))
  solution: |
    net_log = MLPRegressor(hidden_layer_sizes=(16, 8), batch_size=256, max_iter=30, random_state=42).fit(X_train_s, np.log(y_train))
    net_raw = MLPRegressor(hidden_layer_sizes=(16, 8), batch_size=256, max_iter=30, random_state=42).fit(X_train_s, y_train / unit)
    preds = {'log': np.exp(net_log.predict(X_valid_s)), 'raw': net_raw.predict(X_valid_s) * unit}
    expensive = (y_valid > y_train.quantile(0.9)).to_numpy()
    rows = {}
    for name, pred in preds.items():
        err = np.abs(y_valid.to_numpy() - pred)
        rows[name] = {'MAE': err.mean(), 'median_AE': np.median(err), 'MAE_expensive': err[expensive].mean()}
    results = pd.DataFrame(rows).T
    print(results.round(0))
