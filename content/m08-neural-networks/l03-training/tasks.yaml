    ha = np.asarray(h, dtype=float)
    ensure(np.isfinite(ha).all(), 'В `history` есть бесконечность или NaN: проверьте знак шага — `params[name] - lr * grads[name]`.')
    if ha.min() > 9000:
        fail('MAE получилась около средней цены: прогноз `forward(params, X_valid_s)[2]` — в десятках тысяч евро, умножьте его на `unit`, чтобы MAE была в евро.')
    equal(int(var('steps_done', 'number', 'числом')), int(ref('steps_done')), 'Всего шагов — {expected}, а у вас {actual}: по одному на каждую порцию в каждой эпохе.')

    def run(shuffle):
        r = np.random.default_rng(42)
        p = ref('init')(42)
        n = len(ref('X_train_s'))
        out = []
        for _ in range(ref('n_epochs')):
            order = r.permutation(n) if shuffle else np.arange(n)
            for s in range(0, n, ref('batch_size')):
                idx = order[s:s + ref('batch_size')]
                g = ref('backward')(p, ref('X_train_s')[idx], ref('t_train')[idx])
                for k in p:
                    p[k] = p[k] - ref('lr') * g[k]
            out.append(float(np.abs(ref('y_valid').to_numpy() - ref('forward')(p, ref('X_valid_s'))[2] * ref('unit')).mean()))
        return np.array(out)

