  solution: |
    history = []
    steps_done = 0
    for epoch in range(n_epochs):
        order = rng.permutation(len(X_train_s))
        for start in range(0, len(order), batch_size):
            idx = order[start:start + batch_size]
            grads = backward(params, X_train_s[idx], t_train[idx])
            for name in params:
                params[name] = params[name] - lr * grads[name]
            steps_done += 1
        history.append(mean_absolute_error(y_valid, forward(params, X_valid_s)[2] * unit))
    print([round(v) for v in history], steps_done)
  explanation: |
    - За 10 эпох сделано 760 шагов, по 76 за эпоху. Уже после первой эпохи MAE около 3 150 евро — лучше линейной регрессии (4 270).
    - Дальше кривая колеблется около 3 100–3 150: шаг постоянный, и каждый батч тянет веса в свою сторону. Помогают меньший шаг под конец обучения или оптимизатор Adam, как в MLPRegressor.
    - Это вся «магия» обучения нейросети: перемешать, нарезать на батчи, посчитать градиенты обратным распространением, сдвинуть веса. В больших библиотеках (PyTorch, Keras) градиенты считаются автоматически, но цикл тот же.
