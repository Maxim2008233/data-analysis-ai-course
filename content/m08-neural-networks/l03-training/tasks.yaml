    p = var('params', dict, 'словарём')
    same_array(np.asarray(p['W1'], dtype=float), ref('params')['W1'], 'Веса `W1` после обучения не совпадают с ожидаемыми.', rtol=1e-6)
    close(alt('history')[-1], alt_ref('history')[-1], HARDCODE_MSG, rtol=1e-6)
