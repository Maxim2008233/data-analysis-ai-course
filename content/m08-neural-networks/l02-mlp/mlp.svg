<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Схема многослойной сети 4 → 16 → 8 → 1. Четыре входа — год, пробег, объём двигателя и пробег в год после StandardScaler. Каждый из 16 нейронов первого скрытого слоя получает все четыре входа и применяет ReLU. Каждый из 8 нейронов второго скрытого слоя получает все 16 выходов первого и тоже применяет ReLU. Выходной нейрон складывает 8 выходов с весами без активации и выдаёт цену в десятках тысяч евро; её умножают на 10 000. Параметры: первый слой — матрица весов 4 на 16 и 16 смещений, 80 чисел; второй — 16 на 8 и 8 смещений, 136; выход — 8 весов и смещение, 9. Всего 225 параметров.">
