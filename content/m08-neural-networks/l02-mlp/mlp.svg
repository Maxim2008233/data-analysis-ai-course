  <text x="200" y="266" fill="currentColor" text-anchor="middle"><tspan>W</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> 4×16 + b</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> 16 = </tspan><tspan font-weight="700">80</tspan></text>
  <text x="370" y="266" fill="currentColor" text-anchor="middle"><tspan>W</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> 16×8 + b</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> 8 = </tspan><tspan font-weight="700">136</tspan></text>
  <text x="520" y="266" fill="currentColor" text-anchor="middle"><tspan>W</tspan><tspan dy="3" font-size="9">3</tspan><tspan dy="-3"> 8×1 + b</tspan><tspan dy="3" font-size="9">3</tspan><tspan dy="-3"> 1 = </tspan><tspan font-weight="700">9</tspan></text>
  <text x="12" y="292" fill="currentColor">Всего 80 + 136 + 9 = <tspan font-weight="700">225 параметров</tspan>. Каждый нейрон слоя получает все выходы предыдущего слоя — слой полносвязный.</text>
  <text x="12" y="316" fill="currentColor"><tspan>H</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> = ReLU(X·W</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> + b</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3">)  →  H</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> = ReLU(H</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3">·W</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> + b</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3">)  →  ŷ = H</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3">·W</tspan><tspan dy="3" font-size="9">3</tspan><tspan dy="-3"> + b</tspan><tspan dy="3" font-size="9">3</tspan><tspan dy="-3"></tspan></text>
