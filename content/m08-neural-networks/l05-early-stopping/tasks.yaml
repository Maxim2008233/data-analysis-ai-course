    net = MLPRegressor(hidden_layer_sizes=(16, 8), batch_size=256, max_iter=300, early_stopping=True,
                       n_iter_no_change=5, random_state=42).fit(X_train_s, y_train / unit)
    n_epochs = net.n_iter_
    best_epoch = int(np.argmax(net.validation_scores_)) + 1
    best_r2 = net.best_validation_score_
    n_holdout = round(0.1 * len(X_train_s))
    mae = mean_absolute_error(y_valid, net.predict(X_valid_s) * unit)
    print(n_epochs, best_epoch, round(best_r2, 4), n_holdout, round(mae))
