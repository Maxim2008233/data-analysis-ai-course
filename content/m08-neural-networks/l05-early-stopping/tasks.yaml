  solution: |
    rows = {}
    for alpha in alphas:
        m = MLPRegressor(hidden_layer_sizes=(64, 32), learning_rate_init=0.003, batch_size=32, max_iter=200,
                         n_iter_no_change=200, alpha=alpha, random_state=42).fit(X_small, y_small / unit)
        train_mae = mean_absolute_error(y_small, m.predict(X_small) * unit)
        valid_mae = mean_absolute_error(y_valid, m.predict(X_valid_s) * unit)
        rows[alpha] = {'train': train_mae, 'validation': valid_mae, 'gap': valid_mae - train_mae,
                       'weights_sq': sum((W ** 2).sum() for W in m.coefs_)}
    results = pd.DataFrame(rows).T
    best_alpha = results['validation'].idxmin()
    print(results.round(1))
    print(best_alpha)
  explanation: |
    - С почти нулевым штрафом (0.0001, значение по умолчанию) сеть переобучается: 1 640 евро на train, 3 628 на validation, разрыв почти 2 000. Сумма квадратов весов — 119.
    - С ростом штрафа веса уменьшаются (33 при alpha = 0.1, 7 при alpha = 1), ошибка на train растёт, а разрыв исчезает. Лучший штраф — 1.0: 3 129 евро на validation, почти как у ранней остановки (3 083).
    - При alpha = 3 сеть уже недообучена: и train (3 763), и validation (3 442) хуже. Штраф, как и число эпох, — гиперпараметр, и выбирают его по validation.
