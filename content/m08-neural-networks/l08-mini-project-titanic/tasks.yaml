  kind: quiz
  title: "Шаг 9. Выводы"
  difficulty: main
  introduces: []
  uses: []
  statement: |
    Сформулируйте выводы проекта.
  quiz:
    - q: По кросс-валидации сеть точнее логистической регрессии на 2,1 пункта, а на test — на 1,1 пункта хуже. Что это значит?
      options:
        - Модели почти равны — разница в пару пассажиров тонет в шуме маленьких данных
        - Кросс-валидация ошиблась, нужно выбрать модель по test
        - Сеть переобучилась на test
      answer: 0
      explain: На test 1 пассажир — 0,56 пункта. Выбор сделан по правилам, а по test не перевыбирают.
    - q: Правило «женщины выжили» угадывает 78,9 %. Как это использовать?
      options:
        - Как ориентир — модель должна заметно его обогнать, иначе она не нужна
        - Никак, правила хуже моделей
        - Заменить им все модели
      answer: 0
      explain: Все модели обгоняют правило лишь на 1–3,5 пункта — пол объясняет большую часть ответа.
    - q: Где сеть выиграла у правила на test?
      options:
        - На женщинах — она верно отнесла к погибшим часть женщин третьего класса
        - На мужчинах — угадала всех выживших
        - Одинаково в обеих группах
      answer: 0
      explain: Вклад женщин +2,8 пункта, мужчин −1,1. Разбор по группам показывает, что именно добавила модель.
    - q: Почему сеть на «Титанике» не стала заметно лучше простых моделей?
      options:
        - Данных мало (712 пассажиров) и признаков немного — сложной модели почти нечего найти сверх пола, класса и возраста
        - Нейросети не умеют классифицировать
        - Нужно было больше эпох
      answer: 0
      explain: Так же было с машинами (урок 8.6) — на небольших таблицах сеть сравнивают с сильными простыми моделями и не ждут чуда.
  hints:
