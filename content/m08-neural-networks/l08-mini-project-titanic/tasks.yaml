  solution: |
    table = pd.DataFrame({'cv_acc': {n: f.mean() for n, f in folds.items()},
                          'cv_std': {n: f.std() for n, f in folds.items()}}).sort_values('cv_acc', ascending=False)
    best = table.index[0]
    second = table.index[1]
    wins = int((folds[best] > folds[second]).sum())
    print(table.round(3))
    print(best, '| второй:', second, '| побед по блокам:', wins)
  explanation: |
