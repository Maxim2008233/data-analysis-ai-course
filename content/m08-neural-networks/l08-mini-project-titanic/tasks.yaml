    - "В группе: `(pred_net[mask] == y_test.to_numpy()[mask]).mean()`, то же для `pred_rule`."
    - "`share` — `by_sex['n'] / len(X_test)`; вклад — `share * (net - rule)`."
  tests: |
    import numpy as np
    import pandas as pd
    close(var('test_acc', 'number', 'числом'), ref('test_acc'), 'Accuracy сети на test — {expected}, а у вас {actual}. Обучайте на всех `X_temp`, `y_temp`.', rtol=1e-4)
    close(var('rule_acc', 'number', 'числом'), ref('rule_acc'), 'Accuracy правила на test — {expected}, а у вас {actual}.')
    b = var('by_sex', pd.DataFrame, 'таблицей DataFrame')
    ensure(list(b.index) == ['female', 'male'], 'Индекс `by_sex` — female и male.')
    ensure({'n', 'net', 'rule', 'share', 'contribution'} <= set(b.columns), 'Колонки `by_sex` — n, net, rule, share и contribution.')
    r = ref('by_sex')
    same_array(b['n'].to_numpy(dtype=float), r['n'].to_numpy(dtype=float), 'Число пассажиров в группах не совпадает.')
    same_array(b['net'].to_numpy(dtype=float), r['net'].to_numpy(dtype=float), 'Accuracy сети по группам не совпадает.', rtol=1e-4)
    same_array(b['rule'].to_numpy(dtype=float), r['rule'].to_numpy(dtype=float), 'Accuracy правила по группам не совпадает.')
    same_array(b['share'].to_numpy(dtype=float), r['share'].to_numpy(dtype=float), '`share` — доля группы среди пассажиров test.')
    ct = b['contribution'].to_numpy(dtype=float)
    if np.allclose(ct, (r['net'] - r['rule']).to_numpy(dtype=float), rtol=1e-4):
        fail('Вклад — разница accuracy в группе, умноженная на долю группы.')
    same_array(ct, r['contribution'].to_numpy(dtype=float), '`contribution` — `share * (net - rule)`.', rtol=1e-4)
    ensure(abs(ct.sum() - (ref('test_acc') - ref('rule_acc'))) < 1e-6, 'Сумма вкладов должна совпасть с разницей accuracy «сеть − правило».')
    close(alt('test_acc'), alt_ref('test_acc'), HARDCODE_MSG, rtol=1e-4)
