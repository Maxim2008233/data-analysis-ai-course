  solution: |
    final = Pipeline([('prep', make_prep()),
                      ('model', MLPClassifier(hidden_layer_sizes=(16,), alpha=0.1, max_iter=500, random_state=42))])
    final.fit(X_temp, y_temp)
    pred_net = final.predict(X_test)
    pred_rule = (X_test['Sex'] == 'female').astype(int).to_numpy()
    test_acc = (pred_net == y_test.to_numpy()).mean()
    rule_acc = (pred_rule == y_test.to_numpy()).mean()
    rows = {}
    for sex in ['female', 'male']:
        mask = (X_test['Sex'] == sex).to_numpy()
        rows[sex] = {'n': mask.sum(),
                     'net': (pred_net[mask] == y_test.to_numpy()[mask]).mean(),
                     'rule': (pred_rule[mask] == y_test.to_numpy()[mask]).mean()}
    by_sex = pd.DataFrame(rows).T
    by_sex['share'] = by_sex['n'] / len(X_test)
    by_sex['contribution'] = by_sex['share'] * (by_sex['net'] - by_sex['rule'])
    print(round(test_acc, 4), round(rule_acc, 4))
    print(by_sex.round(3))
