    - Вклады: женщины +2,8 пункта (сеть верно отправила в погибшие часть женщин третьего класса: 82 % верных против 74 % у правила), мужчины −1,1 (сеть пыталась угадать выживших мужчин — мальчиков угадала, а взрослых нет). Сумма — ровно разница 1,7 пункта.
