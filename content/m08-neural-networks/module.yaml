title: "Нейронные сети уровня fit/predict"
short: Нейросети
firstLessonIndex: 0
description: >-
  Нейрон — это линейная модель с функцией активации, из нейронов складываются слои, из слоёв — сеть. Собираем
  нейрон и маленькую сеть на NumPy и видим, как сеть учится: эпохи, мини-батчи, обратное распространение ошибки.
  Затем переходим к MLPRegressor и MLPClassifier из scikit-learn. Три эксперимента на ценах машин: зачем нужна
  активация, что меняет функция потерь, когда остановить обучение. В конце — выбор сети по validation и проверка
  на test с разбором выигрыша по группам, классификация «два полумесяца» и мини-проект «кто выжил на «Титанике»».
