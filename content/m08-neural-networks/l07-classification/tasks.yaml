    import numpy as np
    import pandas as pd
    f = var('boundary_length')
    ensure(callable(f), '`boundary_length` должна быть функцией.')
    t1 = np.array([[0, 0, 1], [0, 1, 1], [0, 0, 0]])
    got = int(f(t1))
    if got == 2 or got == 3:
        fail('Считайте и горизонтальные, и вертикальные пары соседей: для таблицы [[0, 0, 1], [0, 1, 1], [0, 0, 0]] длина 5 (2 по горизонтали и 3 по вертикали).')
    ensure(got == 5, 'Для таблицы [[0, 0, 1], [0, 1, 1], [0, 0, 0]] длина границы — 5 (2 по горизонтали и 3 по вертикали), а у вас {0}.'.format(got))
    ensure(int(f(np.zeros((4, 4), dtype=int))) == 0, 'Если класс везде один, границы нет: длина 0.')
    s = var('summary', pd.DataFrame, 'таблицей DataFrame')
    ensure(list(s.index) == list(ref('models')), 'Индекс `summary` — названия моделей из `models`.')
    ensure({'length', 'train_error', 'valid_error'} <= set(s.columns), 'Колонки `summary` — `length`, `train_error` и `valid_error`.')
    r = ref('summary')
    same_array(s['length'].to_numpy(dtype=float), r['length'].to_numpy(dtype=float), 'Длины границ не совпадают.')
    same_array(s['train_error'].to_numpy(dtype=float), r['train_error'].to_numpy(dtype=float), 'Доли ошибок на train не совпадают.')
    same_array(s['valid_error'].to_numpy(dtype=float), r['valid_error'].to_numpy(dtype=float), 'Доли ошибок на validation не совпадают.')
    equal(str(var('longest')), str(ref('longest')), 'Самая длинная граница — у «{expected}», а у вас «{actual}».')
    same_array(alt('summary')['length'].to_numpy(dtype=float), alt_ref('summary')['length'].to_numpy(dtype=float), HARDCODE_MSG)
