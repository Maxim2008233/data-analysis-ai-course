  solution: |
    def boundary_length(region):
        horizontal = (region[:, 1:] != region[:, :-1]).sum()
        vertical = (region[1:, :] != region[:-1, :]).sum()
        return int(horizontal + vertical)

    rows = {}
    for name, m in models.items():
        region = m.predict(grid).reshape(xx.shape)
        rows[name] = {'length': boundary_length(region),
                      'train_error': 1 - accuracy_score(y_train, m.predict(X_train)),
                      'valid_error': 1 - accuracy_score(y_valid, m.predict(X_valid))}
    summary = pd.DataFrame(rows).T
    longest = summary['length'].idxmax()
    print(summary.round(3))
    print(longest)
  explanation: |
    - Самая длинная граница — у kNN с k = 1: 639 клеток, втрое длиннее прямой логистической регрессии (208). Она огибает каждую зашумлённую точку и рисует «островки». Ошибок на train нет, а на validation 9,5 %.
    - С ростом k граница укорачивается: 343 при k = 15 и 282 при k = 301. Слишком короткая и простая граница не повторяет изгиб полумесяцев.
    - У сети граница длиной 287 — почти как у kNN с k = 301, но ошибок на validation всего 7 % против 17 %. Значит, важна не только длина, но и форма: сеть изгибает границу там, где изгибаются данные, и не тратит её на шум.
