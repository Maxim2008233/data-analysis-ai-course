<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="Вклад ценовых групп в снижение MAE на test при переходе от линейной регрессии к сети. Ширина прямоугольника — доля машин группы в test, высота — снижение MAE внутри группы, площадь — вклад. Дешёвые машины (до 4 600 евро): доля 35,0 %, снижение 2 516 евро, вклад 881 евро. Средние (4 600–9 700): доля 33,1 %, снижение 1 278, вклад 423. Дорогие (дороже 9 700): доля 31,9 %, снижение 880, вклад 281. Сумма вкладов 1 585 евро равна снижению общей MAE с 4 368 до 2 784 евро.">
  <line x1="76" y1="252.0" x2="690" y2="252.0" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="68" y="256.0" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">0</text>
  <line x1="76" y1="215.0" x2="690" y2="215.0" stroke="currentColor" stroke-opacity="0.08"/>
  <text x="68" y="219.0" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">500</text>
  <line x1="76" y1="177.9" x2="690" y2="177.9" stroke="currentColor" stroke-opacity="0.08"/>
  <text x="68" y="181.9" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">1 000</text>
  <line x1="76" y1="140.9" x2="690" y2="140.9" stroke="currentColor" stroke-opacity="0.08"/>
  <text x="68" y="144.9" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">1 500</text>
  <line x1="76" y1="103.9" x2="690" y2="103.9" stroke="currentColor" stroke-opacity="0.08"/>
  <text x="68" y="107.9" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">2 000</text>
  <line x1="76" y1="66.8" x2="690" y2="66.8" stroke="currentColor" stroke-opacity="0.08"/>
  <text x="68" y="70.8" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">2 500</text>
  <text x="16" y="152.0" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="11" transform="rotate(-90 16 152.0)">снижение MAE в группе, €</text>
  <rect x="76.0" y="65.6" width="212.9" height="186.4" fill="#3d5bd9" fill-opacity="0.18" stroke="#3d5bd9" stroke-opacity="0.7"/>
  <text x="182.4" y="39.6" fill="currentColor" text-anchor="middle" font-weight="700">дешёвые</text>
  <text x="182.4" y="54.6" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">до 4 600 €</text>
  <text x="182.4" y="154.8" fill="currentColor" text-anchor="middle" font-size="11">35,0 % × 2 516 €</text>
  <text x="182.4" y="170.8" fill="#3d5bd9" text-anchor="middle" font-weight="700">= 881 €</text>
  <text x="182.4" y="268" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">доля машин 35,0 %</text>
  <rect x="290.9" y="157.3" width="201.2" height="94.7" fill="#c2410c" fill-opacity="0.18" stroke="#c2410c" stroke-opacity="0.7"/>
  <text x="391.5" y="131.3" fill="currentColor" text-anchor="middle" font-weight="700">средние</text>
  <text x="391.5" y="146.3" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">4 600–9 700 €</text>
  <text x="391.5" y="200.7" fill="currentColor" text-anchor="middle" font-size="11">33,1 % × 1 278 €</text>
  <text x="391.5" y="216.7" fill="#c2410c" text-anchor="middle" font-weight="700">= 423 €</text>
  <text x="391.5" y="268" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">доля машин 33,1 %</text>
  <rect x="494.1" y="186.8" width="193.9" height="65.2" fill="#15803d" fill-opacity="0.18" stroke="#15803d" stroke-opacity="0.7"/>
  <text x="591.1" y="160.8" fill="currentColor" text-anchor="middle" font-weight="700">дорогие</text>
  <text x="591.1" y="175.8" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">дороже 9 700 €</text>
  <text x="591.1" y="215.4" fill="currentColor" text-anchor="middle" font-size="11">31,9 % × 880 €</text>
  <text x="591.1" y="231.4" fill="#15803d" text-anchor="middle" font-weight="700">= 281 €</text>
  <text x="591.1" y="268" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">доля машин 31,9 %</text>
  <text x="383.0" y="286" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="11">ширина — доля группы в test (6 414 машин), высота — снижение MAE в группе, площадь — вклад</text>
  <line x1="12" y1="298" x2="748" y2="298" stroke="currentColor" stroke-opacity="0.2"/>
  <text x="12" y="320" fill="currentColor">Сумма вкладов 881 + 423 + 281 = <tspan font-weight="700">1 585 €</tspan> — ровно снижение общей MAE на test: 4 368 (линейная регрессия) − 2 784 (сеть).</text>
</svg>
