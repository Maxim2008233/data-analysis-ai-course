  solution: |
    errors = pd.DataFrame({'knn': np.abs(y_valid - knn.predict(X_valid_s)),
                           'net': np.abs(y_valid - net.predict(X_valid_s) * 10000)})
    bounds = y_train.quantile([0.2, 0.4, 0.6, 0.8]).tolist()
    groups = pd.cut(y_valid, bins=[-np.inf] + bounds + [np.inf], labels=['Q1', 'Q2', 'Q3', 'Q4', 'Q5'])
    by_group = errors.groupby(groups, observed=True).mean()
    share = groups.value_counts().sort_index() / len(errors)
    gap_contrib = share * (by_group['net'] - by_group['knn'])
    net_better = [str(g) for g in gap_contrib.index[gap_contrib < 0]]
    q5_share = gap_contrib['Q5'] / gap_contrib.sum()
    print(gap_contrib.round(1), round(gap_contrib.sum(), 1))
    print(net_better, round(q5_share, 3))
