- id: k1-t13
  title: "13. Граница фильтрации для Toyota"
  difficulty: main
  introduces: []
  uses: [filter-boundary, pd-bool-filter, pd-sort-values]
  statement: |
    Для объявлений **Toyota** проведите границу от **60 000 €** при нулевом пробеге до нуля при **500 000 км**. Получите `review` — записи Toyota выше границы с колонками `source_row_id`, `Model`, `Year`, `Distance`, `Price` по убыванию цены — и `n_review` — их число.
  prelude: |
    import pandas as pd
    df = pd.read_csv('cars_processed.csv')
  starter: |
    toyota = ...
    limit = ...
    review = ...
    n_review = ...
    print(n_review)
    review.head()
  solution: |
    toyota = df[df['Make'] == 'Toyota']
    limit = 60_000 * (1 - toyota['Distance'] / 500_000)
    review = toyota[toyota['Price'] > limit][['source_row_id', 'Model', 'Year', 'Distance', 'Price']].sort_values('Price', ascending=False)
    n_review = len(review)
    print(n_review)
    review.head()
  explanation: |
    - Прямая через (0; 60 000) и (500 000; 0) — `60_000 * (1 - x / 500_000)` (урок 4.8); граница своя у каждой записи.
    - Сверху списка — Land Cruiser Prado 2012 года за 200 000 евро (похоже на ошибку), а дальше — новые Land Cruiser: дорогие, но настоящие. Поэтому список идёт в журнал проверки, а не на удаление.
  hints:
    - "Сначала объявления Toyota, затем граница для каждого из них и маска «цена выше границы»."
    - "`limit = 60_000 * (1 - toyota['Distance'] / 500_000)`; `toyota[toyota['Price'] > limit]`."
    - "Колонки списком и `sort_values('Price', ascending=False)`; `n_review = len(review)`."
  tests: |
    import pandas as pd
    r = var('review', pd.DataFrame, 'таблицей DataFrame')
    cols = ['source_row_id', 'Model', 'Year', 'Distance', 'Price']
    ensure(list(r.columns) == cols, 'Колонки должны быть {0}, а у вас {1}.'.format(cols, list(r.columns)))
    ensure(list(r['Price']) == sorted(r['Price'], reverse=True), 'Строки должны идти по убыванию цены.')
    same_frame(r, ref('review'), 'Список записей выше границы не совпадает: граница 60 000 · (1 − пробег / 500 000), только Toyota.')
    close(var('n_review', 'number', 'числом'), ref('n_review'), 'Записей выше границы {expected}, а у вас {actual}.')
    close(alt('n_review'), alt_ref('n_review'), HARDCODE_MSG)
  files: [cars_processed.csv]
  wrong:
    - code: |
        toyota = df[df['Make'] == 'Toyota']
        limit = 60_000 * (1 - toyota['Distance'] / 600_000)
        review = toyota[toyota['Price'] > limit][['source_row_id', 'Model', 'Year', 'Distance', 'Price']].sort_values('Price', ascending=False)
        n_review = len(review)
      expect: граница 60 000
    - code: |
        toyota = df[df['Make'] == 'Toyota']
        limit = 60_000 * (1 - toyota['Distance'] / 500_000)
        review = toyota[toyota['Price'] > limit][['source_row_id', 'Model', 'Year', 'Distance', 'Price']].sort_values('Price')
        n_review = len(review)
      expect: по убыванию

