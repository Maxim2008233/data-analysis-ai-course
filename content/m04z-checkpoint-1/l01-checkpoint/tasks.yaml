  introduces: []
  uses: [mean-median, count-vs-share, chart-choice]
  statement: |
    Пять вопросов по модулям 1–4.
  quiz:
    - q: "У цен длинный правый хвост: несколько машин стоят сотни тысяч евро. Какая статистика лучше описывает «типичную» цену?"
      options:
        - Среднее
        - Медиана
        - Максимум
      answer: 1
      explain: Медиана устойчива к редким очень большим значениям (урок 1.6).
    - q: "«У какой марки больше всего дизелей» и «у какой марки дизели составляют наибольшую долю» — это…"
      options:
        - один и тот же вопрос
        - "разные вопросы: число и доля внутри марки; ответы могут различаться"
        - вопросы, на которые нельзя ответить по объявлениям
      answer: 1
      explain: Число зависит от размера марки, доля — нет (урок 3.5).
    - q: Какой график для вопроса «как цена связана с пробегом» на 32 тысячах объявлений?
      options:
        - Круговая диаграмма
        - Диаграмма рассеяния с прозрачностью или hexbin
        - Столбцы по маркам
      answer: 1
      explain: Два числовых признака — scatter; при наложении точек — прозрачность или hexbin (урок 4.8).
    - q: "Медиана группы «Pickup» — самая высокая, но в группе 124 объявления. Как подписать вывод?"
      options:
        - Пикапы — самые дорогие машины на рынке
        - У пикапов в выборке самая высокая медиана, но группа мала — оценка ненадёжна
        - Удалить пикапы из данных
      answer: 1
      explain: У малых групп статистики ненадёжны (урок 3.3).
    - q: Что можно утверждать по таблице объявлений?
      options:
        - Какие машины лучше продаются
        - Сколько обычно просят за машины разных сегментов
        - Какова выручка продавцов
      answer: 1
      explain: В данных цены предложения, а не сделки (урок 4.1).
  hints:
    - Вспомните устойчивость медианы, разницу числа и доли, выбор графика и границы выводов.
    - "Хвост — медиана; число ≠ доля; два числа — scatter/hexbin; малая группа — ненадёжно; объявления — не продажи."
    - "Ответы: медиана; разные вопросы; scatter или hexbin; группа мала; сколько обычно просят."
