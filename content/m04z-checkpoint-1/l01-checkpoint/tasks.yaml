- id: k1-t12
  kind: plot
  title: "12. Пробег по типу кузова: боксплоты"
  difficulty: main
  introduces: []
  uses: [conditional-dist, boxplot-rule, sns-basics]
  statement: |
    Нарисуйте боксплоты **пробега** (`Distance`) по типу кузова для пяти самых частых кузовов (`top5`, в порядке частоты), без точек за усами. Добавьте заголовок и подпись оси Y с единицами `км`.
  prelude: |
    import pandas as pd
    import matplotlib.pyplot as plt
    import seaborn as sns
    df = pd.read_csv('cars_processed.csv')
  starter: |
    top5 = ...
    fig, ax = plt.subplots(figsize=(10, 3.5))
    sns.boxplot(...)
    ax.set(title=..., xlabel='Тип кузова', ylabel=...)
    plt.show()
  solution: |
    top5 = df['Style'].value_counts().head(5).index
    fig, ax = plt.subplots(figsize=(10, 3.5))
    sns.boxplot(data=df[df['Style'].isin(top5)], x='Style', y='Distance', order=top5, showfliers=False, ax=ax)
    ax.set(title='Пробег по типу кузова: больше всего у универсалов и седанов', xlabel='Тип кузова', ylabel='Пробег, км')
    plt.show()
  explanation: |
    - Пять самых частых кузовов — `value_counts().head(5).index`; `order=top5` — порядок ящиков (урок 4.7).
    - `showfliers=False` прячет точки за усами (квартили считаются по всем записям, урок 4.6).
    - Условное распределение пробега: у универсалов и седанов медианный пробег больше, у кроссоверов и SUV — меньше (они в среднем новее).
  hints:
    - "Пять кузовов — `value_counts().head(5).index`; боксплоты — `sns.boxplot` с `order=top5`."
    - "`sns.boxplot(data=df[df['Style'].isin(top5)], x='Style', y='Distance', order=top5, showfliers=False, ax=ax)`."
    - "`ax.set(title=..., ylabel='Пробег, км')`."
  tests: |
    import numpy as np
    ax = axes()
    top5 = [str(x) for x in ref('top5')]
    labels = [t.get_text() for t in ax.get_xticklabels()]
    ensure(labels == top5, 'Ящики должны идти в порядке частоты кузовов: {0}, а у вас {1}.'.format(top5, labels))
    boxes = [p for p in ax.patches if type(p).__name__ == 'PathPatch']
    ensure(len(boxes) == 5, 'Должно быть пять ящиков.')
    d = ref('df')
    meds = [d.loc[d['Style'] == s, 'Distance'].median() for s in top5]
    hl = [l.get_ydata()[0] for l in ax.get_lines() if len(l.get_ydata()) == 2 and l.get_ydata()[0] == l.get_ydata()[1]]
    ensure(all(any(np.isclose(m, h) for h in hl) for m in meds), 'Боксплоты должны показывать пробег (`y=\'Distance\'`).')
    fliers = [l for l in ax.get_lines() if l.get_marker() not in (None, 'None', '') and len(l.get_xdata()) > 0]
    ensure(len(fliers) == 0, 'Спрячьте точки за усами: `showfliers=False`.')
    ensure(ax.get_title().strip() != '', 'Добавьте заголовок.')
    ensure('км' in ax.get_ylabel().lower(), 'Подпишите ось Y с единицами: `ylabel=\'Пробег, км\'`.')
