- id: k1-t9
  title: "9. Больше всего автоматов: по числу и по доле"
  difficulty: main
  introduces: []
  uses: [pd-crosstab, count-vs-share, group-size-caution]
  statement: |
    Ответьте на два разных вопроса про тип топлива:

    - `most_auto_count` — у какого топлива **больше всего** объявлений с автоматом (по числу);
    - `most_auto_share` — у какого топлива **самая большая доля** автоматов среди типов топлива **не менее чем с 300** объявлениями.

    Таблицы: `auto_counts` — `crosstab` числа объявлений (топливо × коробка), `auto_share` — доли внутри топлива (`normalize='index'`).
  prelude: |
    import pandas as pd
    df = pd.read_csv('cars_processed.csv')
  starter: |
    auto_counts = ...
    auto_share = ...
    sizes = df['Fuel_type'].value_counts()
    most_auto_count = ...
    most_auto_share = ...
    print(most_auto_count, most_auto_share)
  solution: |
    auto_counts = pd.crosstab(df['Fuel_type'], df['Transmission'])
    auto_share = pd.crosstab(df['Fuel_type'], df['Transmission'], normalize='index')
    sizes = df['Fuel_type'].value_counts()
    most_auto_count = auto_counts['Automatic'].idxmax()
    most_auto_share = auto_share.loc[sizes[sizes >= 300].index, 'Automatic'].idxmax()
    print(most_auto_count, most_auto_share)
  explanation: |
    - Число и доля — разные вопросы (урок 3.5): больше всего автоматов среди дизелей (их просто больше всего), а самая большая **доля** — у подключаемых гибридов.
    - Доля считается внутри топлива (`normalize='index'`), а малые группы (электромобили — 31 объявление) отбрасываются: их доля ненадёжна (урок 3.3).
  hints:
    - "Две таблицы сочетаний: с количествами и с долями по строкам; для доли сначала отберите типы топлива с 300+ объявлениями."
    - "`most_auto_count = auto_counts['Automatic'].idxmax()`."
    - "`most_auto_share = auto_share.loc[sizes[sizes >= 300].index, 'Automatic'].idxmax()`."
  tests: |
    import pandas as pd
    same_frame(var('auto_counts', pd.DataFrame, 'таблицей DataFrame'), ref('auto_counts'), 'Таблица количеств не совпадает: `pd.crosstab(df[\'Fuel_type\'], df[\'Transmission\'])`.', check_like=True)
    sh = var('auto_share', pd.DataFrame, 'таблицей DataFrame')
    ensure(((sh.sum(axis=1) - 1).abs() < 1e-6).all(), 'В `auto_share` сумма строки должна быть 1: `normalize=\'index\'`.')
    equal(var('most_auto_count', str, 'строкой'), ref('most_auto_count'), 'Больше всего автоматов по числу — у {expected}, а у вас {actual}.')
    got = var('most_auto_share', str, 'строкой')
    if got == 'Hybrid' and ref('most_auto_share') != 'Hybrid':
        fail('Проверьте все типы топлива с 300+ объявлениями: доля автоматов у одного из них ещё выше.')
    equal(got, ref('most_auto_share'), 'Самая большая доля автоматов (среди групп с 300+ объявлениями) — у {expected}, а у вас {actual}.')
  files: [cars_processed.csv]
  wrong:
    - code: |
        auto_counts = pd.crosstab(df['Fuel_type'], df['Transmission'])
        auto_share = pd.crosstab(df['Fuel_type'], df['Transmission'], normalize='index')
        sizes = df['Fuel_type'].value_counts()
        most_auto_count = auto_share['Automatic'].idxmax()
        most_auto_share = auto_share.loc[sizes[sizes >= 300].index, 'Automatic'].idxmax()
      expect: по числу
    - code: |
        auto_counts = pd.crosstab(df['Fuel_type'], df['Transmission'])
        auto_share = pd.crosstab(df['Fuel_type'], df['Transmission'], normalize='index')
        sizes = df['Fuel_type'].value_counts()
        most_auto_count = auto_counts['Automatic'].idxmax()
        most_auto_share = auto_counts['Automatic'].idxmax()
      expect: Самая большая доля

- id: k1-t10
  title: "10. Оценка по похожим машинам и её ошибка"
  difficulty: main
  introduces: []
  uses: [group-estimate, metric-mae-mape]
  statement: |
    Оцените цену каждой машины медианой цены машин **той же марки и того же года** (`estimate`, Series той же длины, что `df`) и посчитайте ошибки оценки: `mae` — средняя абсолютная ошибка в евро, `mape` — средняя ошибка в процентах от фактической цены.
  prelude: |
    import pandas as pd
    df = pd.read_csv('cars_processed.csv')
  starter: |
    estimate = ...
    mae = ...
    mape = ...
    print(round(mae), round(mape, 1))
  solution: |
    estimate = df.groupby(['Make', 'Year'])['Price'].transform('median')
    mae = (df['Price'] - estimate).abs().mean()
    mape = ((df['Price'] - estimate).abs() / df['Price']).mean() * 100
    print(round(mae), round(mape, 1))
  explanation: |
    - `transform('median')` возвращает для каждой строки медиану её группы — той же длины, что таблица (урок 3.6).
    - MAE — среднее модуля ошибки, MAPE — среднее относительной ошибки × 100 (урок 3.7).
    - Ошибка около 3 000 евро и 36 % — оценка по марке и году грубая; это мы и увидели на слайде 3 дата-истории (урок 4.12). Помните: на тех же данных это не качество прогноза.
  hints:
    - "Медиана группы для каждой строки — `transform`, а не `median()` с группировкой."
    - "`estimate = df.groupby(['Make', 'Year'])['Price'].transform('median')`."
    - "`mae = (df['Price'] - estimate).abs().mean()`; `mape = ((df['Price'] - estimate).abs() / df['Price']).mean() * 100`."
  tests: |
    import pandas as pd
    e = var('estimate', pd.Series, 'Series')
    ensure(len(e) == len(ref('df')), '`estimate` должна быть той же длины, что таблица: `transform(\'median\')`, а не `median()`.')
    same_frame(e, ref('estimate'), 'Оценки не совпадают: медиана цены той же марки и того же года.')
    close(var('mae', 'number', 'числом'), ref('mae'), 'MAE — {expected}, а у вас {actual}.')
    m = var('mape', 'number', 'числом')
    if m < 1:
        fail('MAPE должна быть в процентах: умножьте на 100.')
    close(m, ref('mape'), 'MAPE — {expected} %, а у вас {actual}.')
    close(alt('mae'), alt_ref('mae'), HARDCODE_MSG)
  files: [cars_processed.csv]
  wrong:
    - code: |
        estimate = df.groupby(['Make', 'Year'])['Price'].transform('mean')
        mae = (df['Price'] - estimate).abs().mean()
        mape = ((df['Price'] - estimate).abs() / df['Price']).mean() * 100
      expect: медиана цены
    - code: |
        estimate = df.groupby(['Make', 'Year'])['Price'].transform('median')
        mae = (df['Price'] - estimate).mean()
        mape = ((df['Price'] - estimate).abs() / df['Price']).mean() * 100
      expect: MAE

