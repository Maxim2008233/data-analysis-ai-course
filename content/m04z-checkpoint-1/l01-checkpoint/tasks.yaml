    same_array(ax.get_lines()[0].get_ydata(), ref('auto_share').values, 'Линия должна показывать доли по годам.')
    want = 'Доля автоматов выросла с {0:.0f}% в 2000 году до {1:.0f}% в 2021 году'.format(ref('a'), ref('b'))
    equal(ax.get_title(), want, 'Заголовок должен быть «{expected}», а у вас «{actual}».')
    ensure(ax.get_xlabel().strip() != '' and ax.get_ylabel().strip() != '', 'Подпишите обе оси.')
