title: "Практикум-соревнование 2: zero-shot классификация картинок"
short: Соревнование 2
description: >-
  Второе соревнование курса — по материалам «Zero-shot классификация изображений». 706 картинок, классов которых
  не знает никто, кроме сервера проверки. Модель CLIP не дообучается: классификатор собирается из подписей, известных
  группы и языка названия класса и честной проверки на открытой половине картинок. Ответы отправляются на сервер,
  и он считает долю верных по скрытым классам. Результат сравнивается с базовым решением из курса, ученики с
  аккаунтом попадают в таблицу лидеров.
sources:
  - "Workshops/basic competitions/baseLine_hw2.ipynb — цель соревнования, базовое решение (названия классов как подписи), формат файла с ответами и проверка точности"
  - "Workshops/basic competitions/ZS CLF comp.zip — 1 412 размеченных картинок исходного соревнования: из них собраны открытая половина и скрытая проверочная часть"
