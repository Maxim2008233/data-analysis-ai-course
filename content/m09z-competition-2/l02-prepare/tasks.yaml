- id: c2-l2-t1
  title: Проверочная таблица и кандидаты
  difficulty: warmup
  introduces: []
  uses: [zero-shot, pd-value-counts]
  statement: |
    `test` — проверочная таблица, `test_emb` — векторы её картинок, `raw` — классы с их группами и языками. Получите:

    - `n_test` — число проверочных картинок;
    - `rows_match` — совпадает ли число строк таблицы и векторов (`True` или `False`);
    - `test_groups` — Series: сколько проверочных картинок в каждой группе;
    - `allowed` — матрицу «проверочные картинки × классы»: совпадают ли у картинки и класса группа и язык;
    - `n_single` — у скольких проверочных картинок кандидат всего один.
  prelude: |
    import numpy as np
    import pandas as pd
    test = pd.read_csv('competition_zs_test.csv')
    test_emb = np.load('competition_zs_test.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant']})
    raw = prompts[prompts['variant'] == 'raw']
  starter: |
    n_test = ...
    rows_match = ...
    test_groups = ...
    allowed = ...
    n_single = ...
    print(n_test, rows_match, n_single)
    print(test_groups)
  solution: |
    n_test = len(test)
    rows_match = len(test) == len(test_emb)
    test_groups = test['group'].value_counts()
    allowed = ((test['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
               (test['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
    n_single = int((allowed.sum(axis=1) == 1).sum())
    print(n_test, rows_match, n_single)
    print(test_groups)
  explanation: |
    - В проверочной части 706 картинок и ровно 706 векторов: строка таблицы и строка векторов с одним номером относятся к одной картинке.
    - Группы те же, что в открытой половине: 302 животных с латинскими названиями, 202 блюда, 182 предмета и несколько маленьких групп.
    - У 16 проверочных картинок кандидат один, как и в открытой половине (урок 9.8). Эти ответы верны без модели — у всех участников.
  hints:
    - "Число строк — `len(test)`; сравнение с `len(test_emb)` даёт `True` или `False`."
    - "Совпадение групп — `test['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]`, так же для языков, условия через `&`."
    - "Один кандидат — `(allowed.sum(axis=1) == 1).sum()`."
  tests: |
    import numpy as np
    import pandas as pd
    equal(int(var('n_test', 'number', 'числом')), int(ref('n_test')), 'Проверочных картинок — {expected}, а у вас {actual}.')
    rm = var('rows_match')
    ensure(isinstance(rm, (bool, np.bool_)), '`rows_match` — `True` или `False`: сравните число строк таблицы и векторов.')
    equal(bool(rm), True, '`rows_match` должно быть {expected}, а у вас {actual}.')
    tg = var('test_groups', pd.Series, 'Series')
    same_array(tg.reindex(ref('test_groups').index).to_numpy(dtype=float), ref('test_groups').to_numpy(dtype=float), '`test_groups` — число проверочных картинок в каждой группе.')
    al = np.asarray(var('allowed'), dtype=bool)
    ensure(al.shape == ref('allowed').shape, '`allowed` — матрица {0}: проверочные картинки × классы.'.format(ref('allowed').shape))
    same_array(al.astype(float), ref('allowed').astype(float), '`allowed` — совпадают ли группа и язык картинки и класса.')
    equal(int(var('n_single', 'number', 'числом')), int(ref('n_single')), 'Картинок с одним кандидатом — {expected}, а у вас {actual}.')
    equal(int(alt('n_test')), int(alt_ref('n_test')), HARDCODE_MSG)
  files: [zs_prompts.npz, competition_zs_test.csv, competition_zs_test.npy]
  wrong:
    - code: |
        n_test = len(test)
        rows_match = len(test) == len(test_emb)
        test_groups = test['group'].value_counts()
        allowed = ((test['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) |
                   (test['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
        n_single = int((allowed.sum(axis=1) == 1).sum())
      expect: совпадают ли группа и язык
    - code: |
        n_test = 706
        rows_match = True
        test_groups = test['group'].value_counts()
        allowed = ((test['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
                   (test['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
        n_single = int((allowed.sum(axis=1) == 1).sum())
      expect: вписан вручную

- id: c2-l2-t2
  title: Базовое решение на открытой половине
  difficulty: main
  introduces: []
  uses: [zero-shot, hf-pipeline, pd-groupby]
  statement: |
    Повторите базовое решение из формы отправки на открытой половине, где классы известны: pipeline `'zero-shot-image-classification'`, кандидаты — все классы `all_classes`. Получите:

    - `pred_public` — список ответов для всех картинок `public` (по порядку);
    - `acc_public` — долю верных;
    - `acc_by_lang` — Series: долю верных для каждого языка `language`.
  prelude: |
    import numpy as np
    import pandas as pd
    from transformers import pipeline
    public = pd.read_csv('zs_public.csv')
    all_classes = sorted(public['class'].unique())
    clip = pipeline('zero-shot-image-classification', model='openai/clip-vit-base-patch32')
  starter: |
    pred_public = [... for image_id in public['ID']]
    correct = np.array(pred_public) == public['class'].to_numpy()
    acc_public = ...
    acc_by_lang = ...
    print(round(acc_public, 3))
    print(acc_by_lang.round(3))
  solution: |
    pred_public = [clip(image_id, candidate_labels=all_classes)[0]['label'] for image_id in public['ID']]
    correct = np.array(pred_public) == public['class'].to_numpy()
    acc_public = correct.mean()
    acc_by_lang = pd.Series(correct).groupby(public['language']).mean()
    print(round(acc_public, 3))
    print(acc_by_lang.round(3))
  explanation: |
    - На открытой половине базовое решение угадывает 59,5 % картинок, на сервере — 60,5 %. Своя проверка предсказывает результат с точностью до пункта.
    - По языкам — та же картина, что в уроке 9.7: английские названия 0,77, латинские 0,40, испанские — ни одного верного ответа. Отсюда ясно, что улучшать: подписи и кандидатов.
    - Pipeline для каждой картинки сравнивает её вектор со всеми 349 подписями. Это тот же расчёт, что `image_emb @ text_emb.T` из урока 9.7, только по одной картинке.
  hints:
    - "Ответ для одной картинки — `clip(image_id, candidate_labels=all_classes)[0]['label']`."
    - "Доля верных — `correct.mean()`."
    - "По языкам — `pd.Series(correct).groupby(public['language']).mean()`."
  tests: |
    import numpy as np
    import pandas as pd
    pp = list(var('pred_public', list, 'списком'))
    equal(len(pp), len(ref('public')), 'Ответ нужен для каждой картинки открытой половины: {expected}, а у вас {actual}.')
    if pp and isinstance(pp[0], (list, dict)):
        fail('В `pred_public` должны быть названия классов: возьмите `[0][\'label\']` из ответа pipeline.')
    equal(pp, list(ref('pred_public')), 'Ответы не совпадают с базовым решением: кандидаты — все классы `all_classes`, ответ — первая метка.')
    close(var('acc_public', 'number', 'числом'), ref('acc_public'), 'Доля верных — {expected}, а у вас {actual}.')
    al = var('acc_by_lang', pd.Series, 'Series')
    same_array(al.reindex(ref('acc_by_lang').index).to_numpy(dtype=float), ref('acc_by_lang').to_numpy(dtype=float), '`acc_by_lang` — доля верных по языкам.')
    close(alt('acc_public'), alt_ref('acc_public'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz, competition_zs_test.csv, competition_zs_test.npy]
  wrong:
    - code: |
        pred_public = [clip(image_id, candidate_labels=all_classes)[-1]['label'] for image_id in public['ID']]
        correct = np.array(pred_public) == public['class'].to_numpy()
        acc_public = correct.mean()
        acc_by_lang = pd.Series(correct).groupby(public['language']).mean()
      expect: первая метка
    - code: |
        pred_public = [clip(image_id, candidate_labels=all_classes)[0]['label'] for image_id in public['ID']]
        correct = np.array(pred_public) == public['class'].to_numpy()
        acc_public = correct.sum()
        acc_by_lang = pd.Series(correct).groupby(public['language']).mean()
      expect: Доля верных

- id: c2-l2-t3
  title: "Подписи: выбор на dev, оценка на своём test"
  difficulty: main
  introduces: []
  uses: [prompt-template, zero-shot]
  statement: |
    Сравните варианты подписей на своей проверке. Кандидаты — классы своей группы и языка (`allowed`). Для каждого варианта из `variants` и для ансамбля `'ens'` (нормированное среднее шаблонов `six`) получите точность на `dev` и на `test` открытой половины:

    - `scores` — DataFrame: строки — варианты, столбцы `dev` и `test`;
    - `chosen` — вариант с наибольшей точностью на `dev`;
    - `estimate` — его точность на `test`: честная оценка того, что ждать от сервера.
  prelude: |
    import numpy as np
    import pandas as pd
    public = pd.read_csv('zs_public.csv')
    X = np.load('zs_public.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    allowed = ((public['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
               (public['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
    dev = (public.groupby('class').cumcount() % 2 == 0).to_numpy()
    test = ~dev
    variants = ['pipeline', 'en', 'photo', 'photo_group', 'bad_photo']
    six = ['photo', 'photo_group', 'closeup', 'bad_photo', 'photo_the', 'drawing']
    def emb(variant):
        return prompt_emb[(prompts['variant'] == variant).to_numpy()]
  starter: |
    def correct_of(E):
        pred = classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)]
        return pred == public['class'].to_numpy()

    configs = {v: emb(v) for v in variants}
    ens = np.mean([emb(v) for v in six], axis=0)
    configs['ens'] = ...
    table = {}
    for name, E in configs.items():
        ok = correct_of(E)
        table[name] = {'dev': ..., 'test': ...}
    scores = pd.DataFrame(table).T
    chosen = ...
    estimate = ...
    print(scores.round(3))
    print(chosen, round(estimate, 3))
  solution: |
    def correct_of(E):
        pred = classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)]
        return pred == public['class'].to_numpy()

    configs = {v: emb(v) for v in variants}
    ens = np.mean([emb(v) for v in six], axis=0)
    configs['ens'] = ens / np.linalg.norm(ens, axis=1, keepdims=True)
    table = {}
    for name, E in configs.items():
        ok = correct_of(E)
        table[name] = {'dev': ok[dev].mean(), 'test': ok[test].mean()}
    scores = pd.DataFrame(table).T
    chosen = scores['dev'].idxmax()
    estimate = scores.loc[chosen, 'test']
    print(scores.round(3))
    print(chosen, round(estimate, 3))
  explanation: |
    - На `dev` лучший — `photo_group` (0,878), его оценка на своём `test` — 0,873. Этого и стоит ждать от сервера, если отправить такое решение.
    - Подписи `pipeline` с кандидатами своей группы дают 0,654 на `dev`: ограничение кандидатов помогает и без перевода, но главный скачок — перевод с шаблоном.
    - На `test` у ансамбля 0,878 — чуть больше, чем у `photo_group`. Но выбирали по `dev`, и переигрывать выбор, подглядев в `test`, нельзя: тогда пропадёт честная оценка.
  hints:
    - "Нормировка ансамбля — `ens / np.linalg.norm(ens, axis=1, keepdims=True)`."
    - "Точность на части — `ok[dev].mean()` и `ok[test].mean()`."
    - "Выбор — `scores['dev'].idxmax()`, оценка — `scores.loc[chosen, 'test']`."
  tests: |
    import pandas as pd
    sc = var('scores', pd.DataFrame, 'таблицей')
    ensure(set(['dev', 'test']) <= set(sc.columns), 'В `scores` нужны столбцы `dev` и `test`.')
    rs = ref('scores')
    same_array(sc.reindex(rs.index)[['dev', 'test']].to_numpy(dtype=float), rs[['dev', 'test']].to_numpy(dtype=float), '`scores` — точность каждого варианта на dev и на test открытой половины (ансамбль нормирован).')
    ch = var('chosen', str, 'строкой')
    if ch != ref('chosen') and ch == rs['test'].idxmax():
        fail('Вариант выбирают по `dev`: точность на test при выборе знать нельзя.')
    equal(ch, ref('chosen'), 'По dev выбирается {expected}, а у вас {actual}.')
    close(var('estimate', 'number', 'числом'), ref('estimate'), 'Оценка выбранного варианта на test — {expected}, а у вас {actual}.')
    close(alt('estimate'), alt_ref('estimate'), HARDCODE_MSG)
  files: [zs_public.csv, zs_public.npy, zs_prompts.npz]
  wrong:
    - code: |
