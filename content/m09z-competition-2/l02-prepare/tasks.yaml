            pred = classes[np.where(allowed, X @ E.T, -np.inf).argmax(axis=1)]
            return pred == public['class'].to_numpy()
        configs = {v: emb(v) for v in variants}
        ens = np.mean([emb(v) for v in six], axis=0)
        configs['ens'] = ens / np.linalg.norm(ens, axis=1, keepdims=True)
        table = {}
        for name, E in configs.items():
            ok = correct_of(E)
            table[name] = {'dev': ok[dev].mean(), 'test': ok[test].mean()}
        scores = pd.DataFrame(table).T
        chosen = scores['test'].idxmax()
        estimate = scores.loc[chosen, 'test']
      expect: выбирают по `dev`
    - code: |
