- id: c2-l2-t5
  title: Ответы для всех картинок соревнования
  difficulty: main
  introduces: []
  uses: [prompt-template, zero-shot]
  statement: |
    Соберите ответы выбранного решения — подписи `photo_group` с кандидатами своей группы и языка — для всех картинок проверочной части. Получите:

    - `submission` — DataFrame с колонками `ID` и `predicted_class`, по строке на каждую картинку `test`;
    - `n_used` — сколько разных классов встречается среди ответов;
    - `top_class` и `top_count` — класс, который модель назвала чаще всех, и сколько раз.
  prelude: |
    import numpy as np
    import pandas as pd
    test = pd.read_csv('competition_zs_test.csv')
    test_emb = np.load('competition_zs_test.npy').astype(np.float32)
    with np.load('zs_prompts.npz') as data:
        prompts = pd.DataFrame({k: [str(x) for x in data[k]] for k in ['class', 'group', 'language', 'variant']})
        prompt_emb = data['emb'].astype(np.float32)
    raw = prompts[prompts['variant'] == 'raw']
    classes = raw['class'].to_numpy()
    E = prompt_emb[(prompts['variant'] == 'photo_group').to_numpy()]
  starter: |
    allowed = ...
    S = np.where(allowed, test_emb @ E.T, -np.inf)
    submission = pd.DataFrame({'ID': ..., 'predicted_class': ...})
    counts = submission['predicted_class'].value_counts()
    n_used = ...
    top_class, top_count = ..., ...
    print(submission.head())
    print(len(submission), n_used, top_class, top_count)
  solution: |
    allowed = ((test['group'].to_numpy()[:, None] == raw['group'].to_numpy()[None, :]) &
               (test['language'].to_numpy()[:, None] == raw['language'].to_numpy()[None, :]))
    S = np.where(allowed, test_emb @ E.T, -np.inf)
    submission = pd.DataFrame({'ID': test['ID'], 'predicted_class': classes[S.argmax(axis=1)]})
    counts = submission['predicted_class'].value_counts()
    n_used = int(counts.size)
    top_class, top_count = counts.index[0], int(counts.iloc[0])
    print(submission.head())
    print(len(submission), n_used, top_class, top_count)
