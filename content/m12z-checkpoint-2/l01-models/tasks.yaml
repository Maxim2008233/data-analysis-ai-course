    - `mae_honest` — MAE на `test`, если средние посчитаны только по `train`;
    - `mae_leaky` — то же, если средние посчитаны по `train` и `test` вместе;
    - `unseen` — доля машин `test`, модели которых нет в `train`.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.model_selection import train_test_split
    cars = pd.read_csv('cars_processed.csv')
    train, test = train_test_split(cars, test_size=0.2, random_state=42)
  starter: |
    def encode(fit_part, apply_to):
        means = fit_part.groupby('Model')['Price'].mean()
        return apply_to['Model'].map(means).fillna(...)

    mae_honest = (test['Price'] - encode(train, test)).abs().mean()
    mae_leaky = ...
    unseen = ...
    print(round(mae_honest), round(mae_leaky), round(unseen, 3))
  solution: |
    def encode(fit_part, apply_to):
        means = fit_part.groupby('Model')['Price'].mean()
        return apply_to['Model'].map(means).fillna(fit_part['Price'].mean())

    mae_honest = (test['Price'] - encode(train, test)).abs().mean()
    mae_leaky = (test['Price'] - encode(pd.concat([train, test]), test)).abs().mean()
    unseen = (~test['Model'].isin(train['Model'])).mean()
    print(round(mae_honest), round(mae_leaky), round(unseen, 3))
  explanation: |
    - `map(means)` подставляет каждой машине среднюю цену её модели, а `fillna` закрывает модели, которых в обучающей части нет. Для них честного среднего просто не существует.
    - Если средние считать по всем данным, в среднее для машины из `test` входит её собственная цена. У моделей, которые встречаются один-два раза, «прогноз» почти совпадает с ответом. Это утечка из урока 7.5.
    - В среднем утечка небольшая: 4093 вместо 4224 евро. У большинства моделей много машин, и одна машина почти не сдвигает среднее. Но у 144 машин теста с редкими моделями (не больше пяти машин во всей таблице) ошибка с утечкой — 1863 евро вместо честных 4834: там «прогноз» почти совпадает с ответом.
    - На новых машинах модель покажет честную ошибку, а не красивую. Поэтому целевое кодирование учат только на обучающей части — внутри конвейера или по блокам кросс-валидации. Неизвестных моделей в тесте всего 0,4 %.
