  solution: |
    cv = KFold(n_splits=5, shuffle=True, random_state=42)

    def cv_mae(model):
        scores = cross_val_score(model, X_train, y_train, cv=cv, scoring='neg_mean_absolute_error')
        return float(-scores.mean())

    cv_lr = cv_mae(LinearRegression())
    cv_rf = cv_mae(RandomForestRegressor(n_estimators=50, max_depth=5, random_state=42))
    better = 'линейная' if cv_lr < cv_rf else 'лес'
    print(round(cv_lr, 1), round(cv_rf, 1), better)
  explanation: |
