    def softmax(z):
        z = z - z.max(axis=1, keepdims=True)
        e = np.exp(z)
        return e / e.sum(axis=1, keepdims=True)

    probs = softmax(logits)
    pred = probs.argmax(axis=1)
    acc_by_lang = reviews.assign(ok=pred == reviews['label'].to_numpy()).groupby('lang')['ok'].mean().to_dict()
    sure_wrong = int(((probs.max(axis=1) > 0.9) & (pred != reviews['label'].to_numpy())).sum())
    print(acc_by_lang, sure_wrong)
  explanation: |
    - Softmax превращает логиты строки в вероятности: экспонента каждого, делённая на сумму экспонент **этой строки** — `keepdims=True` оставляет сумму столбцом. Вычитание максимума не меняет ответ, но спасает `exp` от переполнения на больших логитах.
    - На 80 английских отзывах модель верна в 95 % случаев, на 8 русских — в 75 %. Её учили на английских текстах о фильмах, а русские слова токенизатор режет на бессмысленные куски (урок 9.5).
    - Опаснее всего уверенные ошибки: модель ошиблась, а вероятность выше 0,9. Таких 4, и три из них — на английских отзывах не о фильмах, например «The service could not have been better». Высокая вероятность — не гарантия правоты, особенно на данных не того вида, на которых модель учили.
  hints:
    - "Сумма по строке столбцом — `e.sum(axis=1, keepdims=True)`; вероятности — `e / ...`."
    - "Доли по языкам — `reviews.assign(ok=pred == reviews['label'].to_numpy()).groupby('lang')['ok'].mean().to_dict()`."
    - "Уверенные ошибки — `(probs.max(axis=1) > 0.9) & (pred != reviews['label'].to_numpy())`, затем `.sum()`."
  tests: |
    import numpy as np
    f = var('softmax')
    ensure(callable(f), '`softmax` должна быть функцией.')
    got = np.asarray(f(np.array([[0.0, 0.0], [1.0, 3.0]])))
    if abs(got.sum() - 1) < 1e-9:
        fail('Вероятности нормированы по всей матрице. Делите на сумму каждой строки: e.sum(axis=1, keepdims=True).')
    same_array(got, [[0.5, 0.5], [1 / (1 + np.exp(2)), 1 / (1 + np.exp(-2))]], 'Для логитов [0, 0] и [1, 3] вероятности — [0.5, 0.5] и [0.119, 0.881].')
    big = np.asarray(f(np.array([[1000.0, 999.0]])))
    ensure(np.isfinite(big).all(), 'Получилось nan: exp(1000) переполнился. Вычтите из каждой строки её максимум.')
    by = var('acc_by_lang', dict, 'словарём')
    exp = ref('acc_by_lang')
    equal(sorted(by), sorted(exp), 'Языки отзывов — {expected}, а у вас {actual}.')
    for k in exp:
        close(by[k], exp[k], 'Доля верных для языка ' + k + ' — {expected}, а у вас {actual}.')
    sw = var('sure_wrong', 'int', 'целым числом')
    equal(int(sw), int(ref('sure_wrong')), 'Уверенных ошибок — {expected}, а у вас {actual}. Нужны отзывы, где модель ошиблась и при этом уверена больше чем на 0.9.')
