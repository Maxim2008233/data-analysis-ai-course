- id: k2-t10
  kind: quiz
  title: "10. Вопросы на понимание"
  difficulty: main
  introduces: []
  uses: [overfitting, data-leakage, model-comparison]
  statement: |
    Проверьте, как вы понимаете выбор и проверку моделей.
  quiz:
    - q: Дерево глубины 15 ошибается на обучающей части почти на 0, а на валидации — сильнее дерева глубины 3. Что произошло?
      options:
        - Переобучение — глубокое дерево запомнило обучающие примеры
        - Недообучение — дереву не хватило глубины
        - Утечка — в валидацию попали обучающие примеры
      answer: 0
      explain: Ошибка на обучающей части падает с глубиной всегда; о качестве на новых данных говорит только валидация.
    - q: Где есть утечка данных? Выберите все.
      options:
        - StandardScaler обучили на всех данных до разбиения
        - Модель машины закодировали средней ценой по всей таблице, включая тест
        - Гиперпараметр k выбрали по ошибке на тестовой части
        - Средние для заполнения пропусков посчитали по обучающей части внутри конвейера
      answer: [0, 1, 2]
      explain: Во всех трёх первых случаях проверочные данные влияли на модель или на выбор. Расчёт внутри конвейера по обучающей части — правильный способ.
    - q: Лес по кросс-валидации ошибается на 48,2, линейная регрессия — на 45,0. Что разумно сделать?
      options:
        - Выбрать линейную модель — она не хуже и проще
        - Выбрать лес — сложная модель всегда лучше
        - Взять ту, что лучше на тестовой части, проверив обе
      answer: 0
      explain: Модель выбирают по валидации или кросс-валидации; тестовую часть открывают один раз для выбранной модели. Если качество близко, предпочитают простую.
    - q: Почему kNN нужна стандартизация признаков, а линейной регрессии на качество прогноза она не влияет?
      options:
        - kNN считает расстояния, и признак с большим разбросом подавляет остальные; регрессия подстраивает коэффициенты под масштаб сама
        - Стандартизация всегда улучшает любую модель
        - Линейной регрессии стандартизация запрещена
      answer: 0
      explain: Для линейной регрессии стандартизация меняет коэффициенты, но не прогнозы. Для kNN она меняет самих соседей.
  hints:
    - "Вспомните уроки 5.3–5.7, 6.2 и 6.7."
    - "Ошибка на обучающей части почти 0 — запоминание; утечка — когда проверочные данные влияют на модель; из близких по качеству выбирают простую."
    - "Ответы: 1 — переобучение; 2 — первые три; 3 — линейная; 4 — расстояния у kNN."
