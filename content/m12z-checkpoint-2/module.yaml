title: "Контрольная точка 2: модели, нейросети, языковые модели и агенты"
short: Контрольная 2
description: >-
  Два блока задач средней сложности по модулям 5–11 без новых понятий. Первый блок — машинное обучение и нейросети:
  разбиение и ориентир, метрики регрессии, масштаб признаков, подбор гиперпараметра по валидации, переобучение
  дерева, кросс-валидация, кодирование категорий без утечки, нейросеть-классификатор и логиты языковой модели.
  Второй блок — языковые модели и агенты: сообщения и окно контекста, формат ответа, few-shot, температура, поиск по
  курсу, RAG с честным «не знаю», шаг агента, инструменты LangChain и ограничители. Результаты сохраняются в
  прогрессе, как у обычных заданий.
sources:
