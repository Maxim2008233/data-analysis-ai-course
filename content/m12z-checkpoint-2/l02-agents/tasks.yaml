    - `action` с известным инструментом — вызвать `tools[имя](аргумент)` и добавить `str(результат)` в наблюдения;
    - неизвестный инструмент — добавить `'Ошибка: нет инструмента {имя}'`;
    - `error` — добавить `'Ошибка формата: {описание}'` и продолжить;
    - шаги кончились без ответа — вернуть `'Не удалось ответить за отведённые шаги'` и наблюдения.

