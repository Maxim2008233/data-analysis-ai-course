    - Ошибки — неизвестный инструмент, сломанный формат, запрещённое выражение — становятся наблюдениями, а не падением программы. Модель видит их и может исправиться на следующем шаге.
    - `replies[:max_steps]` — предохранитель: агент, который никак не дойдёт до ответа, не будет крутиться бесконечно и тратить деньги на запросы. Во втором сценарии ответ «270 минут» стоял пятым шагом, и агент остановился раньше.
