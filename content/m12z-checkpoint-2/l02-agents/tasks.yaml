- id: k2-t11
  title: "1. Диалог в окне контекста"
  difficulty: main
  introduces: []
  uses: [llm-chat-api, system-prompt, context-window]
  statement: |
    Напишите функцию `build_messages(system, history, question, budget)` — список сообщений для запроса к модели, который помещается в `budget` токенов. Токены считает готовая функция `count_tokens(messages)`.

    - Первое сообщение — системное `{'role': 'system', 'content': system}`, последнее — вопрос `{'role': 'user', 'content': question}`. Они нужны всегда.
    - Между ними — пары «вопрос `user` → ответ `assistant`» из `history`, **самые свежие**, в исходном порядке. Пары берутся целиком.
    - Пары добавляют от последней к первой, пока запрос помещается. Если пара не помещается, более старые уже не берут: история должна быть сплошной.

    Получите `messages` для бюджета 50 токенов и `n_pairs` — сколько пар истории в него вошло.
  prelude: |
    import math

    def count_tokens(messages):
        return math.ceil(sum(len(m['content']) for m in messages) / 5.09)

    system = 'Ты — помощник по курсу анализа данных. Отвечай кратко.'
    history = [('Что такое медиана?', 'Значение посередине упорядоченного ряда.'),
               ('А мода?', 'Самое частое значение.'),
               ('Чем MAE отличается от RMSE?', 'RMSE сильнее штрафует большие ошибки.'),
               ('Что такое переобучение?', 'Модель запомнила обучающие данные и плохо работает на новых.')]
    question = 'Как с ним бороться?'
  starter: |
    def build_messages(system, history, question, budget):
        first = [{'role': 'system', 'content': system}]
        last = [{'role': 'user', 'content': question}]
        kept = []
        for user, assistant in reversed(history):
            pair = [{'role': 'user', 'content': user}, {'role': 'assistant', 'content': assistant}]
            if ...:
                break
            kept = pair + kept
        return first + kept + last

    messages = build_messages(system, history, question, 50)
    n_pairs = ...
    print(n_pairs, count_tokens(messages))
  solution: |
    def build_messages(system, history, question, budget):
        first = [{'role': 'system', 'content': system}]
        last = [{'role': 'user', 'content': question}]
        kept = []
        for user, assistant in reversed(history):
            pair = [{'role': 'user', 'content': user}, {'role': 'assistant', 'content': assistant}]
            if count_tokens(first + pair + kept + last) > budget:
                break
            kept = pair + kept
        return first + kept + last

    messages = build_messages(system, history, question, 50)
    n_pairs = (len(messages) - 2) // 2
    print(n_pairs, count_tokens(messages))
  explanation: |
    - Модель помнит разговор только потому, что программа каждый раз отправляет ей историю (урок 10.3). Окно ограничено, поэтому старые пары приходится отбрасывать.
    - `reversed(history)` идёт от свежих пар к старым, а `kept = pair + kept` сохраняет исходный порядок. Пара целиком — потому что ответ без вопроса или вопрос без ответа сбивают модель.
    - `break`, а не пропуск: если взять более старую короткую пару через голову длинной, в истории будет дыра — модель увидит ответ на вопрос, которого «не было».
    - В 50 токенов вошли три пары из четырёх: самая старая про медиану не поместилась. Местоимение «с ним» в вопросе модель поймёт, только если пара про переобучение осталась в истории.
  hints:
    - "Пара не помещается, если `count_tokens(first + pair + kept + last) > budget`."
    - "Новая пара встаёт перед уже взятыми: `kept = pair + kept`."
    - "Пар в ответе — `(len(messages) - 2) // 2`: без системного сообщения и вопроса."
  tests: |
    f = var('build_messages')
    ensure(callable(f), '`build_messages` должна быть функцией.')
    sysm, hist, q = ref('system'), ref('history'), ref('question')
    count = ref('count_tokens')
    r = f(sysm, hist, q, 50)
    ensure(isinstance(r, list) and len(r) >= 2, 'Нужен список сообщений: системное, история, вопрос.')
    ensure(r[0] == {'role': 'system', 'content': sysm} and r[-1] == {'role': 'user', 'content': q}, 'Первое сообщение — системное, последнее — вопрос пользователя.')
    if len(r) > 2 and r[1]['content'] == hist[0][0]:
        fail('Взяты самые старые пары. Отбрасывают самые старые, а оставляют самые свежие: идите по истории с конца.')
    ensure(count(r) <= 50, 'Запрос не помещается в 50 токенов: считайте токены вместе с системным сообщением и вопросом.')
    roles = [m['role'] for m in r]
    ensure(roles[1:-1] == ['user', 'assistant'] * ((len(r) - 2) // 2), 'Пары из истории берут целиком: вопрос user и ответ assistant.')
    equal([m['content'] for m in r[1:-1]], [hist[1][0], hist[1][1], hist[2][0], hist[2][1], hist[3][0], hist[3][1]], 'В 50 токенов входят три свежие пары. Ожидалось {expected}, а у вас {actual}.')
    r40 = f(sysm, hist, q, 40)
    if any(m['content'] == hist[1][0] for m in r40):
        fail('История должна быть сплошной: если пара не помещается, более старые уже не добавляют. При 40 токенах — только последняя пара.')
    equal([m['content'] for m in r40[1:-1]], [hist[3][0], hist[3][1]], 'При 40 токенах — только последняя пара. Ожидалось {expected}, а у вас {actual}.')
    equal(len(f(sysm, hist, q, 10)), 2, 'Если не помещается ни одна пара — остаются системное сообщение и вопрос.')
    equal(int(var('n_pairs', 'int', 'целым числом')), 3, 'Пар в бюджете 50 токенов — 3, а у вас {actual}.')
  wrong:
    - code: |
        def build_messages(system, history, question, budget):
            first = [{'role': 'system', 'content': system}]
            last = [{'role': 'user', 'content': question}]
            kept = []
            for user, assistant in history:
                pair = [{'role': 'user', 'content': user}, {'role': 'assistant', 'content': assistant}]
                if count_tokens(first + kept + pair + last) > budget:
                    break
                kept = kept + pair
            return first + kept + last
        messages = build_messages(system, history, question, 50)
        n_pairs = (len(messages) - 2) // 2
      expect: самые старые
    - code: |
        def build_messages(system, history, question, budget):
            first = [{'role': 'system', 'content': system}]
            last = [{'role': 'user', 'content': question}]
            kept = []
            for user, assistant in reversed(history):
                pair = [{'role': 'user', 'content': user}, {'role': 'assistant', 'content': assistant}]
                if count_tokens(first + pair + kept + last) > budget:
                    continue
                kept = pair + kept
            return first + kept + last
        messages = build_messages(system, history, question, 50)
        n_pairs = (len(messages) - 2) // 2
      expect: сплошной

- id: k2-t12
  title: "2. Ответ модели в JSON"
  difficulty: main
  introduces: []
  uses: [structured-output]
  statement: |
    Модель просили ответить на тестовый вопрос в формате `{"answer": номер варианта 0–3, "confidence": уверенность от 0 до 1}`. Ответы `replies` пришли разные: в ограждении ` ```json `, с текстом вокруг, с ошибками.

    Напишите функцию `parse_answer(reply)`:

    1. найти фрагмент от первой `{` до последней `}` (`re.search(r'\{.*\}', reply, re.S)`); нет фрагмента — `None`;
    2. разобрать его `json.loads`; сломанный JSON — `None`;
    3. проверить: `answer` — целое число 0–3 (не строка и не `True`/`False`), `confidence` — число от 0 до 1. Не прошло — `None`;
    4. вернуть словарь `{'answer': int, 'confidence': float}`.

    Получите `parsed` для всех ответов и `valid_share` — долю ответов, которые удалось принять.
  prelude: |
    import json
    import re
    fence = '`' * 3
    replies = ['{"answer": 2, "confidence": 0.9}',
               fence + 'json\n{"answer": 0, "confidence": 0.55}\n' + fence,
               'Думаю, верный вариант второй: {"answer": 1, "confidence": 0.7}',
               '{"answer": "2", "confidence": 0.8}',
               '{"answer": 5, "confidence": 0.6}',
               '{"answer": 3, "confidence": 1.4}',
               'Ответ: 3',
               '{"answer": 3, "confidence": 0.65']
  starter: |
    def parse_answer(reply):
        m = re.search(r'\{.*\}', reply, re.S)
        if m is None:
            return None
        try:
            data = json.loads(m.group())
        except ValueError:
            return None
        if not isinstance(data, dict):
            return None
        a, c = data.get('answer'), data.get('confidence')
        ok_answer = ...
        ok_conf = ...
        return {'answer': a, 'confidence': float(c)} if ok_answer and ok_conf else None

    parsed = [parse_answer(r) for r in replies]
    valid_share = ...
    print(parsed, valid_share)
  solution: |
    def parse_answer(reply):
        m = re.search(r'\{.*\}', reply, re.S)
        if m is None:
            return None
        try:
            data = json.loads(m.group())
        except ValueError:
            return None
        if not isinstance(data, dict):
            return None
        a, c = data.get('answer'), data.get('confidence')
        ok_answer = type(a) is int and 0 <= a <= 3
        ok_conf = type(c) in (int, float) and 0 <= c <= 1
        return {'answer': a, 'confidence': float(c)} if ok_answer and ok_conf else None

    parsed = [parse_answer(r) for r in replies]
    valid_share = sum(p is not None for p in parsed) / len(parsed)
    print(parsed, valid_share)
  explanation: |
    - Модели часто окружают JSON пояснениями или ограждением ` ```json `. Поиск фрагмента от первой `{` до последней `}` переживает и то, и другое (урок 10.5).
    - `json.JSONDecodeError` — подкласс `ValueError`, поэтому `except ValueError` ловит сломанный JSON, и функция возвращает `None`, а не падает.
    - `type(a) is int` строже `isinstance`: `True` в Python — тоже `int`, а `"2"` — строка. Ответ, который не прошёл проверку, лучше не принимать, чем принять неверно: его можно переспросить.
    - Приняты 3 ответа из 8. Строка вместо числа, вариант 5, уверенность 1,4, ответ без JSON и обрезанный JSON — всё это бывает у настоящих моделей. Поэтому формат проверяют программой, а не доверяют ему.
  hints:
    - "Номер варианта — `type(a) is int and 0 <= a <= 3`: строгая проверка не пропустит `True` и `\"2\"`."
    - "Уверенность — `type(c) in (int, float) and 0 <= c <= 1`."
    - "Доля принятых — `sum(p is not None for p in parsed) / len(parsed)`."
  tests: |
    f = var('parse_answer')
    ensure(callable(f), '`parse_answer` должна быть функцией.')
    got = f('Ответ: {"answer": 3, "confidence": 1} — уверен.')
    if got is None:
        fail('Модель часто окружает JSON текстом или ограждением: найдите фрагмент от первой «{» до последней «}» и разберите его.')
    equal(got, {'answer': 3, 'confidence': 1.0}, 'Ожидалось {expected}, а у вас {actual}.')
    if f('{"answer": true, "confidence": 0.5}') is not None:
        fail('True — не номер варианта: в Python True — тоже int. Проверяйте строго: type(a) is int.')
    equal(f('{"answer": "1", "confidence": 0.5}'), None, 'Номер варианта строкой «1» не принимаем: нужен int. А у вас {actual}.')
    equal(f('{"answer": 1, "confidence": -0.1}'), None, 'Уверенность меньше 0 не принимаем, а у вас {actual}.')
    equal(f('{"answer": 1, "confidence": 0.5'), None, 'Сломанный JSON — None, а у вас {actual}.')
    equal(f('ответа нет'), None, 'Без JSON — None, а у вас {actual}.')
    equal(var('parsed', list, 'списком'), ref('parsed'), 'Разобранные ответы — {expected}, а у вас {actual}.')
    close(var('valid_share', 'number', 'числом'), ref('valid_share'), 'Доля принятых ответов — {expected}, а у вас {actual}.')
  wrong:
    - code: |
        def parse_answer(reply):
            try:
                data = json.loads(reply)
            except ValueError:
                return None
            if not isinstance(data, dict):
                return None
            a, c = data.get('answer'), data.get('confidence')
            ok = type(a) is int and 0 <= a <= 3 and type(c) in (int, float) and 0 <= c <= 1
            return {'answer': a, 'confidence': float(c)} if ok else None
        parsed = [parse_answer(r) for r in replies]
        valid_share = sum(p is not None for p in parsed) / len(parsed)
      expect: от первой «{» до последней «}»
    - code: |
        def parse_answer(reply):
            m = re.search(r'\{.*\}', reply, re.S)
            if m is None:
                return None
            try:
                data = json.loads(m.group())
            except ValueError:
                return None
            a, c = data.get('answer'), data.get('confidence')
            ok = isinstance(a, int) and 0 <= a <= 3 and isinstance(c, (int, float)) and 0 <= c <= 1
            return {'answer': a, 'confidence': float(c)} if ok else None
        parsed = [parse_answer(r) for r in replies]
        valid_share = sum(p is not None for p in parsed) / len(parsed)
      expect: True — не номер варианта

- id: k2-t13
  title: "3. Сколько примеров влезет в few-shot"
  difficulty: main
  introduces: []
  uses: [few-shot, context-window]
  statement: |
    Промпт few-shot — инструкция `INSTRUCTION`, затем первые `k` примеров из `examples`, затем вопрос. Каждый пример и вопрос записываются так:

    ```
    Вопрос: …
    Ответ: …
    (пустая строка)
    ```

    В конце промпта — `'Вопрос: {question}\nОтвет:'`: продолжить должна модель.

    1. Напишите функцию `few_shot_prompt(k)` — промпт с первыми `k` примерами.
    2. Напишите функцию `max_examples(window, max_tokens)` — наибольшее `k` от 0 до `len(examples)`, при котором токены промпта плюс `max_tokens` (место под ответ) не больше окна `window`. Токены считает `count_tokens(text)`.

    Получите `k_max` для окна 120 токенов и ответа до 40 токенов и `prompt` — промпт с этим числом примеров.
  prelude: |
    import math

    def count_tokens(text):
        return math.ceil(len(text) / 5.09)

    INSTRUCTION = 'Ответь на вопрос по курсу одним предложением.\n\n'
    examples = [('Что такое медиана?', 'Значение посередине упорядоченного ряда.'),
                ('Зачем нужна валидационная выборка?', 'Чтобы выбирать модель и гиперпараметры, не трогая тест.'),
                ('Что такое переобучение?', 'Модель запомнила обучающие данные и плохо работает на новых.'),
                ('Что делает StandardScaler?', 'Приводит каждый признак к среднему 0 и отклонению 1.'),
                ('Что такое токенизатор?', 'Программа, которая режет текст на токены и переводит их в номера.'),
                ('Что такое RAG?', 'Ответ модели по найденным документам со ссылками на них.')]
    question = 'Что такое кросс-валидация?'
  starter: |
    def few_shot_prompt(k):
        shots = ''.join(f'Вопрос: {q}\nОтвет: {a}\n\n' for q, a in examples[:k])
        return INSTRUCTION + shots + f'Вопрос: {question}\nОтвет:'

    def max_examples(window, max_tokens):
        best = 0
        for k in range(len(examples) + 1):
            if ...:
                best = k
        return best

    k_max = max_examples(120, 40)
    prompt = few_shot_prompt(k_max)
    print(k_max, count_tokens(prompt))
  solution: |
    def few_shot_prompt(k):
        shots = ''.join(f'Вопрос: {q}\nОтвет: {a}\n\n' for q, a in examples[:k])
        return INSTRUCTION + shots + f'Вопрос: {question}\nОтвет:'

    def max_examples(window, max_tokens):
        best = 0
        for k in range(len(examples) + 1):
            if count_tokens(few_shot_prompt(k)) + max_tokens <= window:
                best = k
        return best

    k_max = max_examples(120, 40)
    prompt = few_shot_prompt(k_max)
    print(k_max, count_tokens(prompt))
  explanation: |
    - Окно контекста — запрос и ответ вместе (урок 10.3). Если не оставить место под ответ, модель оборвёт его на полуслове.
    - Промпт с каждым примером только растёт, поэтому подходящие `k` идут подряд от 0, и последнее подошедшее — наибольшее.
    - В окно 120 токенов с ответом до 40 помещаются 3 примера; без запаса под ответ поместились бы 5. Каждый пример — это 15–20 токенов, которые не достаются ни вопросу, ни ответу. Поэтому примеры выбирают короткие и самые похожие на вопрос (урок 10.4).
  hints:
    - "Подходит, если `count_tokens(few_shot_prompt(k)) + max_tokens <= window`."
    - "`best` запоминает последнее подошедшее `k` — оно и наибольшее."
    - "`k_max = max_examples(120, 40)`, затем `prompt = few_shot_prompt(k_max)` — это уже в заготовке."
  tests: |
    fp = var('few_shot_prompt')
    mx = var('max_examples')
    ensure(callable(fp) and callable(mx), '`few_shot_prompt` и `max_examples` должны быть функциями.')
    rfp, rmx = ref('few_shot_prompt'), ref('max_examples')
    equal(fp(0), rfp(0), 'Промпт без примеров — инструкция и вопрос. Ожидалось {expected}, а у вас {actual}.')
    equal(fp(2), rfp(2), 'Формат примера — «Вопрос: …», «Ответ: …» и пустая строка. Ожидалось {expected}, а у вас {actual}.')
    got = mx(120, 40)
    if got == rmx(120, 0):
        fail('Окно — запрос и ответ вместе: оставьте место под ответ, прибавьте max_tokens к токенам промпта.')
    for w, m in [(120, 40), (60, 10), (40, 20), (1000, 100)]:
        equal(mx(w, m), rmx(w, m), 'Окно ' + str(w) + ', ответ ' + str(m) + ': наибольшее число примеров — {expected}, а у вас {actual}.')
    equal(int(var('k_max', 'int', 'целым числом')), int(ref('k_max')), 'Наибольшее число примеров — {expected}, а у вас {actual}.')
    equal(var('prompt', str, 'строкой'), ref('prompt'), 'Промпт с этим числом примеров не совпадает с ожидаемым.')
  wrong:
    - code: |
        def few_shot_prompt(k):
            shots = ''.join(f'Вопрос: {q}\nОтвет: {a}\n\n' for q, a in examples[:k])
            return INSTRUCTION + shots + f'Вопрос: {question}\nОтвет:'
        def max_examples(window, max_tokens):
            best = 0
            for k in range(len(examples) + 1):
                if count_tokens(few_shot_prompt(k)) <= window:
                    best = k
            return best
        k_max = max_examples(120, 40)
        prompt = few_shot_prompt(k_max)
      expect: место под ответ
    - code: |
        def few_shot_prompt(k):
            shots = ''.join(f'Вопрос: {q} Ответ: {a}\n' for q, a in examples[:k])
            return INSTRUCTION + shots + f'Вопрос: {question}\nОтвет:'
        def max_examples(window, max_tokens):
            best = 0
            for k in range(len(examples) + 1):
                if count_tokens(few_shot_prompt(k)) + max_tokens <= window:
                    best = k
            return best
        k_max = max_examples(120, 40)
        prompt = few_shot_prompt(k_max)
      expect: Формат примера

- id: k2-t14
  title: "4. Температура"
  difficulty: main
  introduces: []
  uses: [sampling-temperature]
  statement: |
    Модель оценила вероятности следующего слова `p` для пяти кандидатов `tokens`. Температура `T` меняет распределение так: каждую вероятность возводят в степень `1/T` и снова нормируют, чтобы сумма была 1 (урок 10.2).

    1. Напишите функцию `temper(p, T)`.
    2. `top` — словарь «температура → вероятность самого вероятного слова» для `T` = 0.3, 1.0 и 2.0.
    3. `n_over_10` — сколько слов при `T = 2` имеют вероятность больше 0.1.
  prelude: |
    import numpy as np
    tokens = ['модель', 'сеть', 'данные', 'кошка', 'банан']
    p = np.array([0.5, 0.25, 0.15, 0.07, 0.03])
  starter: |
    def temper(p, T):
        q = np.asarray(p, dtype=float) ** ...
        return ...

    top = {T: float(temper(p, T).max()) for T in (0.3, 1.0, 2.0)}
    n_over_10 = ...
    print(top, n_over_10)
  solution: |
    def temper(p, T):
        q = np.asarray(p, dtype=float) ** (1 / T)
        return q / q.sum()

    top = {T: float(temper(p, T).max()) for T in (0.3, 1.0, 2.0)}
    n_over_10 = int((temper(p, 2.0) > 0.1).sum())
    print(top, n_over_10)
  explanation: |
