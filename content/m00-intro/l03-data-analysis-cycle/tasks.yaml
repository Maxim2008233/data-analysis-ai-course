- id: m0-l3-t1
  kind: quiz
  title: Этапы CRISP-DM по порядку
  difficulty: warmup
  introduces: [crisp-dm]
  uses: []
  statement: |
    Проверьте порядок этапов и их содержание.
  quiz:
    - q: Какой этап первый?
      options:
        - Понимание данных
        - Понимание бизнеса
        - Подготовка данных
      answer: 1
      explain: Сначала — цели и вопрос, потом данные.
    - q: К какому этапу относится «удалить повторы и обработать пропуски»?
      options:
        - Понимание данных
        - Подготовка данных
        - Оценка
      answer: 1
      explain: Очистка и преобразования — подготовка данных.
    - q: Что делают на этапе «оценка»?
      options:
        - Проверяют, достигнута ли бизнес-цель, и решают, что дальше
        - Собирают исходные данные
        - Пишут код приложения
      answer: 0
      explain: Оценка — взгляд на результат с точки зрения бизнес-целей.
  hints:
    - Вспомните цикл на схеме урока — он начинается с вопроса заказчика.
    - "Порядок: бизнес → данные → подготовка → моделирование → оценка → внедрение."
    - "Первый — понимание бизнеса; очистка — подготовка; оценка — проверка бизнес-цели."

- id: m0-l3-t2
  kind: quiz
  title: Сдвиг данных или сдвиг понятия?
  difficulty: main
  introduces: [data-shift]
  uses: [crisp-dm]
  statement: |
    Определите причину падения качества модели.
  quiz:
    - q: Модель оценки цен обучили на объявлениях из одного города, а запустили в другом, где машины старше. Это…
      options:
        - data shift — данные отличаются от обучающих
        - concept shift — изменилось поведение
        - ошибка в коде
      answer: 0
      explain: Изменился состав данных — другие машины, другой рынок.
    - q: После резкого роста цен на новые машины покупатели стали ценить подержанные выше, чем раньше. Модель, обученная до этого, ошибается. Это…
      options:
        - data shift
        - concept shift
      answer: 1
      explain: Изменилась сама зависимость цены от характеристик — сдвиг понятия.
    - q: Что делают, чтобы модель не «устаревала» незаметно? Выберите все.
      options:
        - Отслеживают качество на свежих данных (мониторинг)
        - Периодически переобучают модель
        - Никогда не меняют обученную модель
      answer: [0, 1]
      explain: Мониторинг и переобучение — часть этапа внедрения.
  hints:
    - Различайте «пришли другие данные» и «изменилась сама зависимость».
    - "Data shift — другой состав данных; concept shift — другое поведение/зависимость."
    - "Другой город — data shift; новые предпочтения покупателей — concept shift; мониторинг и переобучение."

- id: m0-l3-t3
  kind: predict
  title: Ошибка «модели» на новых данных
  difficulty: main
  introduces: []
  uses: [data-shift]
  statement: |
    «Модель» всегда предсказывает 7000 €. Предскажите вывод кода.
  quiz:
    - q: Что напечатает код?
      code: |
        model_price = 7000
        new_prices = [8000, 9000, 10000]
        errors = [abs(p - model_price) for p in new_prices]
        print(sum(errors) / len(errors))
      options:
        - "2000.0"
        - "9000.0"
        - "3000.0"
      answer: 0
      explain: "Ошибки 1000, 2000, 3000; среднее 6000 / 3 = 2000."
    - q: Как изменится ошибка, если все новые цены вырастут ещё на 1000 €?
      options:
        - Не изменится
        - Вырастет на 1000 €
        - Уменьшится
      answer: 1
      explain: «Модель» не изменилась, а каждая цена отдалилась от 7000 ещё на 1000 — так проявляется сдвиг данных.
  hints:
    - Посчитайте модуль разности для каждой цены, затем среднее.
    - "|8000 − 7000| = 1000, |9000 − 7000| = 2000, |10000 − 7000| = 3000."
    - "Среднее ошибок 2000; при росте цен на 1000 каждая ошибка вырастет на 1000."
