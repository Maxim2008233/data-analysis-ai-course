- id: m0-l2-t1
  kind: quiz
  title: Слабый или сильный?
  difficulty: warmup
  introduces: [weak-strong-ai]
  uses: [ai-definition]
  statement: |
    Отнесите системы к типам ИИ.
  quiz:
    - q: Какие из систем существуют сегодня? Выберите все.
      options:
        - Нейросеть, которая распознаёт номера автомобилей
        - Языковая модель, которая пишет тексты и отвечает на вопросы
        - Система, которая осознаёт себя и решает любые задачи лучше человека
        - Программа, которая играет в го сильнее чемпиона мира
      answer: [0, 1, 3]
      explain: Всё, кроме третьего пункта, — существующий слабый ИИ. Самосознающая универсальная система — гипотетический сильный ИИ (ASI).
    - q: Какие свойства нужны сильному ИИ? Выберите все.
      options:
        - Планирование и действия в условиях неопределённости
        - Представление знаний о мире и обучение
        - Высокая скорость на одной узкой задаче
        - Общение на естественном языке
      answer: [0, 1, 3]
      explain: Скорость на узкой задаче — как раз свойство слабого ИИ.
  hints:
    - Сильный ИИ должен решать любые задачи, слабый — отдельные.
    - "Существующие системы — узкие: распознавание, генерация текста, игры."
    - "Существуют: распознавание номеров, языковая модель, программа для го. Свойства сильного ИИ — всё, кроме «скорости на одной задаче»."

- id: m0-l2-t2
  kind: quiz
  title: Подходы и методы
  difficulty: main
  introduces: [ai-approaches]
  uses: [weak-strong-ai]
  statement: |
    Определите подход и метод.
  quiz:
    - q: Банк задаёт правила «если доход меньше X и есть просрочки — отказать». Это…
      options:
        - машинное обучение
        - экспертная система (нисходящий подход)
        - нейросеть
      answer: 1
      explain: Правила сформулировал человек — это экспертная система.
    - q: Модель по тысячам прошлых заявок сама нашла, кто чаще не возвращает кредит. Это…
      options:
        - машинное обучение
        - логический вывод на Prolog
        - символьные вычисления
      answer: 0
      explain: Правило найдено по данным с известными ответами — это машинное обучение.
    - q: Что из этого относится к восходящему подходу?
      options:
        - Онтология «кот — сидит на — окне»
        - Искусственные нейронные сети
        - Набор правил «если — то»
      answer: 1
      explain: Восходящий подход моделирует нейроны; онтологии и правила — нисходящий.
  hints:
    - Кто сформулировал правило — человек или алгоритм по данным?
    - "Правила человека — нисходящий подход (экспертные системы, логика, знания); подбор по данным — машинное обучение; нейроны — восходящий."
    - "Экспертная система; машинное обучение; нейронные сети."

- id: m0-l2-t3
  kind: predict
  title: Что решит экспертная система
  difficulty: main
  introduces: []
  uses: [ai-approaches]
  statement: |
    Предскажите вывод программы из теории урока (правила `needs_check` без изменений).
  quiz:
    - q: Что напечатает код?
      code: |
        def needs_check(car):
            if car['distance'] < 1000 and car['year'] < 2020:
                return 'малый пробег у не новой машины'
            if car['price'] > 1_000_000:
                return 'подозрительно высокая цена'
            return None

        print(needs_check({'year': 2021, 'distance': 500, 'price': 25000}))
      options:
        - "малый пробег у не новой машины"
        - "подозрительно высокая цена"
        - "None"
      answer: 2
      explain: Пробег мал, но год 2021 не меньше 2020; цена обычная — ни одно правило не сработало.
    - q: "А для машины `{'year': 2005, 'distance': 300, 'price': 2_000_000}`?"
      options:
        - "малый пробег у не новой машины"
        - "подозрительно высокая цена"
        - Оба сообщения
      answer: 0
      explain: Срабатывает первое подходящее правило — функция сразу возвращает результат и дальше не проверяет.
  hints:
    - Проверьте условия правил по очереди; `return` сразу завершает функцию.
    - "Первое правило требует сразу двух условий: пробег < 1000 и год < 2020."
    - "Для 2021 года не сработает ничего (None); для 2005 года сработает первое правило."

- id: m0-l2-t4
  kind: quiz
  title: Уровни ИИ и «не начинайте с ИИ»
  difficulty: main
  introduces: []
  uses: [ai-approaches, weak-strong-ai]
  statement: |
    Определите подходящий уровень решения задачи.
  quiz:
    - q: В каких задачах разумно сразу начинать с ИИ? Выберите все.
      options:
        - Распознавание номеров машин в любую погоду и под любым углом
        - Уценка товара по регламенту «3 месяца — скидка 10 %, 4 месяца — 20 %»
        - Распознавание документов разных форм и почерков
        - Расчёт процентов по вкладу по формуле банка
      answer: [0, 2]
      explain: Там, где много разнородных случаев, нужен ИИ. Регламент и формулу точнее выполнит обычный алгоритм.
    - q: Банк решает, одобрить ли кредит, по доходу, наличию машины и детей. Есть тысячи прошлых заявок с решениями экспертов. Какой уровень подходит?
      options:
        - Экспертные правила без данных
        - Классическое машинное обучение на признаках, которые сформулировал человек
        - Foundation model
      answer: 1
      explain: "Признаки понятны и сформулированы человеком, данных — тысячи: это классическое машинное обучение."
    - q: Почему для распознавания рукописных цифр нужно глубокое обучение?
      options:
        - Потому что у глубоких сетей много параметров
        - Потому что признаки «это единица» человек не может чётко сформулировать — сеть находит их сама
        - Потому что цифр всего десять
      answer: 1
      explain: Много параметров — следствие; причина — слишком много вариантов написания, признаки не формализуются.
  hints:
    - Сравните задачи по числу разнородных случаев и наличию точного правила.
    - "Правила/формула → алгоритм; понятные признаки и тысячи записей → классическое ML; признаки не сформулировать → глубокое обучение."
    - "Номера и документы; классическое ML; признаки не формализуются."
