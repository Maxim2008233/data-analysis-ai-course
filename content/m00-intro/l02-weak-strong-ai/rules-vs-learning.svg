<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Программирование: человек пишет правила, программа применяет их к данным. Машинное обучение: по данным и правильным ответам алгоритм сам находит правило">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="26" font-weight="700" fill="currentColor">Классическое программирование (экспертная система)</text>
  <rect x="20" y="40" width="130" height="44" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="34" y="60" fill="currentColor">данные</text><text x="34" y="76" fill="currentColor" fill-opacity="0.6" font-size="11">год, пробег…</text>
  <rect x="20" y="96" width="130" height="44" rx="6" fill="#c2611b" fill-opacity="0.12" stroke="#c2611b"/>
  <text x="34" y="116" fill="currentColor">правила</text><text x="34" y="132" fill="currentColor" fill-opacity="0.6" font-size="11">пишет человек</text>
  <path d="M152 62 L220 85 M152 118 L220 95" stroke="currentColor" stroke-opacity="0.6" fill="none"/>
  <rect x="222" y="70" width="110" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="240" y="95" fill="currentColor">программа</text>
  <path d="M334 90 L376 90" stroke="currentColor" marker-end="url(#ra)"/>
  <text x="384" y="95" fill="currentColor" font-weight="700">ответы</text>

  <text x="20" y="168" font-weight="700" fill="currentColor">Машинное обучение</text>
  <rect x="20" y="180" width="130" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
  <text x="30" y="205" fill="currentColor" font-size="12">данные + ответы</text>
  <path d="M152 200 L218 200" stroke="currentColor" marker-end="url(#ra)"/>
  <rect x="222" y="180" width="110" height="40" rx="6" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9"/>
  <text x="236" y="205" fill="currentColor">обучение</text>
  <path d="M334 200 L376 200" stroke="currentColor" marker-end="url(#ra)"/>
  <text x="384" y="196" fill="currentColor" font-weight="700">правило y = f(x)</text>
  <text x="384" y="214" fill="currentColor" fill-opacity="0.65" font-size="12">найдено по примерам</text>
  <text x="520" y="70" fill="currentColor" fill-opacity="0.8" font-size="12">Правила понятны, но их</text>
  <text x="520" y="88" fill="currentColor" fill-opacity="0.8" font-size="12">трудно придумать для</text>
  <text x="520" y="106" fill="currentColor" fill-opacity="0.8" font-size="12">сложных задач.</text>
  <text x="520" y="178" fill="currentColor" fill-opacity="0.8" font-size="12">Нужны данные с ответами;</text>
  <text x="520" y="196" fill="currentColor" fill-opacity="0.8" font-size="12">правило работает в пределах</text>
  <text x="520" y="214" fill="currentColor" fill-opacity="0.8" font-size="12">того, что было в данных.</text>
</svg>
