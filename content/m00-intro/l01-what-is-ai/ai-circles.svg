<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Inter, Arial, sans-serif" font-size="13" role="img" aria-label="Вложенные области: искусственный интеллект включает машинное обучение, машинное обучение включает нейронные сети, внутри — глубокое обучение и большие языковые модели">
  <ellipse cx="250" cy="130" rx="230" ry="118" fill="#3d5bd9" fill-opacity="0.07" stroke="#3d5bd9" stroke-opacity="0.6"/>
  <ellipse cx="290" cy="140" rx="170" ry="90" fill="#3d5bd9" fill-opacity="0.09" stroke="#3d5bd9" stroke-opacity="0.7"/>
  <ellipse cx="325" cy="150" rx="112" ry="62" fill="#c2611b" fill-opacity="0.1" stroke="#c2611b" stroke-opacity="0.8"/>
  <ellipse cx="350" cy="160" rx="58" ry="32" fill="#c2611b" fill-opacity="0.18" stroke="#c2611b"/>
  <text x="44" y="70" fill="currentColor" font-weight="700">Искусственный интеллект</text>
  <text x="44" y="88" fill="currentColor" fill-opacity="0.7" font-size="12">правила, логика, знания, поиск…</text>
  <text x="140" y="104" fill="currentColor" font-weight="700">Машинное обучение</text>
  <text x="140" y="120" fill="currentColor" fill-opacity="0.7" font-size="12">деревья, линейные модели…</text>
  <text x="244" y="140" fill="currentColor" font-weight="700">Нейронные сети</text>
  <text x="316" y="158" fill="currentColor" font-size="12" font-weight="700">глубокие</text>
  <text x="312" y="174" fill="currentColor" font-size="12">сети, LLM</text>
  <g font-size="12.5" fill="currentColor">
    <text x="500" y="56" font-weight="700">Каждая область — часть внешней:</text>
    <text x="500" y="82">• экспертная система — ИИ,</text>
    <text x="512" y="100">но не машинное обучение;</text>
    <text x="500" y="126">• линейная регрессия — машинное</text>
    <text x="512" y="144">обучение, но не нейросеть;</text>
    <text x="500" y="170">• ChatGPT, GigaChat — глубокие</text>
    <text x="512" y="188">нейросети (языковые модели).</text>
  </g>
</svg>
