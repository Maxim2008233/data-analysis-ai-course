- id: m0-l1-t1
  kind: quiz
  title: Лента времени ИИ
  difficulty: warmup
  introduces: [ai-history]
  uses: []
  statement: |
    Проверьте, как вы запомнили основные этапы развития ИИ.
  quiz:
    - q: Что произошло раньше всего?
      options:
        - Deep Blue обыграл Каспарова
        - Модель искусственного нейрона Маккаллока и Питтса
        - Дартмутский семинар
        - Персептрон Розенблатта
      answer: 1
      explain: "1943 — модель нейрона; 1956 — Дартмут; 1958 — персептрон; 1997 — Deep Blue."
    - q: Какое событие относится к 2017 году?
      options:
        - Победа AlphaGo
        - Появление архитектуры «Трансформер»
        - Выход ChatGPT
        - AlexNet
      answer: 1
      explain: "2016 — AlphaGo, 2017 — трансформер, 2012 — AlexNet, 2022 — ChatGPT."
    - q: Что характерно для эпохи экспертных систем (1970–80-е)?
      options:
        - Модели обучаются на миллионах фотографий
        - Решения по правилам «если — то», записанным экспертами
        - Чат-боты для всех желающих
      answer: 1
      explain: Экспертные системы (MYCIN, XCON) работали по правилам, сформулированным людьми.
  hints:
    - Вспомните порядок «нейрон — Дартмут — персептрон — зимы — экспертные системы — глубокие сети — трансформеры».
    - "Ключевые годы: 1943, 1956, 1958, 1986, 1997, 2012, 2016, 2017, 2022."
    - "Раньше всех — модель нейрона (1943); трансформер — 2017; экспертные системы — правила «если — то»."

- id: m0-l1-t2
  kind: quiz
  title: ИИ, машинное обучение, нейросети
  difficulty: main
  introduces: [ai-definition]
  uses: []
  statement: |
    Разберитесь, как соотносятся понятия.
  quiz:
    - q: Какие утверждения верны? Выберите все.
      options:
        - Любая нейросеть — это машинное обучение
        - Любое машинное обучение — это нейросеть
        - Экспертная система на правилах — это ИИ, но не машинное обучение
        - Машинное обучение — часть искусственного интеллекта
      answer: [0, 2, 3]
      explain: Области вложены — ИИ ⊃ машинное обучение ⊃ нейросети. Линейная регрессия — машинное обучение, но не нейросеть.
    - q: Что проверяет тест Тьюринга?
      options:
        - Есть ли у машины сознание
        - Можно ли отличить машину от человека по переписке
        - Скорость вычислений
      answer: 1
      explain: Тест поведенческий; о понимании и сознании он не говорит.
    - q: Какой тест предлагали как альтернативу тесту Тьюринга?
      options:
        - Кофе-тест — сварить кофе в незнакомом доме
        - Тест на скорость печати
        - Тест на знание таблицы умножения
      answer: 0
      explain: "Альтернативы проверяют действия в реальном мире: кофе-тест, робот-студент, тест на трудоустройство."
  hints:
    - Представьте вложенные круги из урока.
    - "ИИ — самый большой круг, внутри машинное обучение, внутри него нейросети."
    - "Верны: нейросеть ⊂ ML, экспертная система — ИИ без обучения, ML ⊂ ИИ. Тест Тьюринга — про отличимость в переписке."

- id: m0-l1-t3
  kind: predict
  title: Что напечатает программа
  difficulty: main
  introduces: []
  uses: [ai-history]
  statement: |
    Предскажите результат, не запуская код (Python: `sorted` сортирует пары по первому элементу — году).
  quiz:
    - q: Что будет напечатано?
      code: |
        events = [(2012, 'AlexNet'), (1997, 'Deep Blue'), (2016, 'AlphaGo')]
        first = sorted(events)[0]
        print(first[1], 2022 - first[0])
      options:
        - "AlexNet 10"
        - "Deep Blue 25"
        - "AlphaGo 6"
      answer: 1
      explain: После сортировки по году первым идёт (1997, 'Deep Blue'); 2022 − 1997 = 25.
    - q: Во сколько раз GPT-3 (175 млрд параметров) больше GPT-2 (1,5 млрд)?
      code: |
        print(round(175e9 / 1.5e9))
      options:
        - "117"
        - "11"
        - "1167"
      answer: 0
      explain: 175 / 1.5 ≈ 116.7, после округления — 117.
  hints:
    - "`sorted` упорядочивает кортежи по первому элементу; индекс `[0]` — первый кортеж."
    - "Самый ранний год — 1997; `first[1]` — название, `first[0]` — год."
    - "Deep Blue 25; 175 / 1.5 ≈ 117."

- id: m0-l1-t4
  kind: quiz
  title: ИИ — стохастическая система
  difficulty: main
  introduces: []
  uses: [ai-definition]
  statement: |
    Вопросы о сильной стороне и главном минусе ИИ.
  quiz:
    - q: Почему ИИ называют стохастической системой?
      options:
        - Он работает только со статистикой
        - В его ответах есть случайность, ошибки неизбежны и возникают непредсказуемо
        - Он всегда выдаёт один и тот же ответ
      answer: 1
      explain: Стохастический — содержащий случайность. Формула вроде y = x² наоборот детерминирована и объяснима.
    - q: Какие недостатки ИИ обсуждались? Выберите все.
      options:
        - Ошибку иногда замечают не сразу
        - Результат может отличаться от запуска к запуску
        - Не понимает задачи, поставленные словами
        - Не может объяснить, почему ошибся
      answer: [0, 1, 3]
      explain: Понимание задач, поставленных словами, — наоборот, сильная сторона ИИ.
    - q: Система пропуска «до эпохи ИИ» узнавала людей с точностью около 50 %. Сколько ошибок она сделает в среднем на 300 проходов?
      options:
        - "50"
        - "150"
        - "300"
      answer: 1
      explain: 300 · 0,5 = 150 — как охранник с монеткой, поэтому такая точность бесполезна.
  hints:
    - Стохастичность — это про случайность и непредсказуемые ошибки.
    - "Сильная сторона ИИ — задачу можно поставить словами; минусы — непредсказуемые и необъяснимые ошибки."
    - "Случайность в ответах; верны пункты 1, 2 и 4; 300 · 0,5 = 150."
