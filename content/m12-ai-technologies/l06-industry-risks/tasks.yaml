- id: m12-l6-t5
  title: Выровнять пропуски
  difficulty: star
  introduces: []
  uses: [ai-risks, binary-classification]
  statement: |
    Модель урока пропускает людей с доходом выше 50 тысяч среди женщин чаще, чем среди мужчин. Посмотрим, что будет, если выровнять пропуски своим порогом для каждой группы.

    Напишите функцию `threshold_for_fnr(proba, y_true, target)` — порог, при котором доля пропусков среди настоящих 1 примерно равна `target`. Это квантиль уровня `target` вероятностей у настоящих 1 (`np.quantile`): ниже порога окажется доля `target` из них.

    Для групп `Female` и `Male` (вероятности модели — `proba`, ответы — `y_te`, группы — `sex`) получите при `target = 0.3`:

    - `thresholds` — словарь «группа → порог»;
    - `fpr_after` — словарь «группа → доля ложных срабатываний при своём пороге». Срабатывание — `proba >= порог`.
  prelude: |
    import numpy as np
    import pandas as pd
    from sklearn.compose import make_column_transformer
    from sklearn.preprocessing import OneHotEncoder, StandardScaler
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import make_pipeline
    from sklearn.model_selection import train_test_split
    adult = pd.read_csv('adult.csv')
    y = (adult['salary'] == '>50K').astype(int).to_numpy()
    num = ['age', 'education-num', 'hours-per-week', 'capital-gain', 'capital-loss']
    cat = ['workclass', 'marital-status', 'occupation', 'relationship', 'race', 'sex']
    X_tr, X_te, y_tr, y_te = train_test_split(adult[num + cat], y, test_size=0.3, random_state=0, stratify=y)
    model = make_pipeline(make_column_transformer((StandardScaler(), num), (OneHotEncoder(handle_unknown='ignore'), cat)),
                          LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)
    proba = model.predict_proba(X_te)[:, 1]
    sex = X_te['sex'].to_numpy()
  starter: |
    def threshold_for_fnr(proba, y_true, target):
        return np.quantile(..., target)

    thresholds, fpr_after = {}, {}
    for g in ['Female', 'Male']:
        m = sex == g
        thresholds[g] = threshold_for_fnr(proba[m], y_te[m], 0.3)
        selected = proba[m] >= thresholds[g]
        fpr_after[g] = ...
    print(thresholds, fpr_after)
  solution: |
    def threshold_for_fnr(proba, y_true, target):
        return np.quantile(np.asarray(proba)[np.asarray(y_true) == 1], target)

    thresholds, fpr_after = {}, {}
    for g in ['Female', 'Male']:
        m = sex == g
        thresholds[g] = threshold_for_fnr(proba[m], y_te[m], 0.3)
        selected = proba[m] >= thresholds[g]
        fpr_after[g] = (selected & (y_te[m] == 0)).sum() / (y_te[m] == 0).sum()
    print(thresholds, fpr_after)
  explanation: |
    - Пропуск — настоящая 1 с вероятностью ниже порога. Чтобы пропусков была доля `target`, порог ставят на квантиль уровня `target` среди вероятностей настоящих 1. Остальные строки на порог не влияют.
    - Доли пропусков сравнялись — около 30 % в обеих группах. Но пороги вышли разными: 0,28 для женщин и 0,40 для мужчин. А ложные срабатывания разошлись: 5 % у женщин и 15 % у мужчин. Выровняли одну ошибку — раздвинули другую. Все доли ошибок сразу обычно выровнять нельзя, если доход выше 50 тысяч в группах встречается с разной частотой.
    - Разные пороги для мужчин и женщин — это разное обращение с людьми по полу. Для решений вроде кредитов во многих странах это запрещено. Какой компромисс допустим, решают люди и закон, а не модель. Задача аналитика — честно посчитать, чем оборачивается каждый вариант.
  hints:
    - "Вероятности настоящих 1 — `proba[y_true == 1]`; порог — их квантиль уровня `target`."
    - "Ложные срабатывания группы — `(selected & (y_te[m] == 0)).sum() / (y_te[m] == 0).sum()`."
    - "Функция целиком: `np.quantile(np.asarray(proba)[np.asarray(y_true) == 1], target)`."
  tests: |
    import numpy as np
    f = var('threshold_for_fnr')
    ensure(callable(f), '`threshold_for_fnr` должна быть функцией.')
    pr = np.array([0.1, 0.2, 0.3, 0.4, 0.9, 0.8])
    yy = np.array([1, 1, 1, 1, 0, 0])
    got = float(f(pr, yy, 0.5))
    if abs(got - 0.35) < 1e-9:
        fail('Квантиль посчитан по всем вероятностям. Пропуски бывают только у настоящих 1 — квантиль считают по их вероятностям.')
    close(got, 0.25, 'Вероятности настоящих 1 — 0.1, 0.2, 0.3, 0.4; их медиана — 0.25, а у вас {actual}.')
    got = float(f(pr, yy, 0.25))
    if abs(got - 0.325) < 1e-9:
        fail('Взят квантиль уровня 1 − target. Ниже порога должна оказаться доля target настоящих 1 — это квантиль уровня target.')
    close(got, 0.175, 'Квантиль уровня 0.25 вероятностей 0.1, 0.2, 0.3, 0.4 — 0.175, а у вас {actual}.')
    th = var('thresholds', dict, 'словарём')
