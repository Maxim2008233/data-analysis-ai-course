- id: m12-l6-t4
  title: Обезличивание сообщений
  difficulty: main
  introduces: []
  uses: [ai-risks, named-entities]
  statement: |
    Напишите функцию `anonymize(text, names)`, которая заменяет в тексте:

    - адреса почты — на `[ПОЧТА]`. Точка в конце предложения — не часть адреса;
    - телефоны — на `[ТЕЛЕФОН]`: `+7` или `8`, затем 10 цифр, а между группами цифр могут стоять пробелы, скобки и дефисы (`+7 000 111-22-33`, `8 (000) 765-43-21`, `+70001112233`);
    - имена из списка `names`, в том числе с окончанием до трёх русских букв («Ивану»), — на `[ИМЯ]`.

    Замены — в этом порядке. Обезличьте сообщения в поддержку `messages` (данные выдуманы: телефонного кода 000 нет) — `masked`. Посчитайте `counts` — `Counter` меток во всех обезличенных сообщениях.
  prelude: |
    import re
    from collections import Counter
    messages = ['Здравствуйте! Я Анна Петрова, телефон +7 000 111-22-33, почта anna.petrova@example.ru.',
                'Заказ 48213 не пришёл. Перезвоните Ивану Смирнову: 8 (000) 765-43-21.',
                'Мой номер +70001234567, напишите на ivan_s@example.com или позвоните.',
                'Спасибо, Анне всё понравилось! Оценка 5 из 5.',
                'Сумма возврата 1290 рублей, счёт отправьте на petrova.a@example.org.']
    names = ['Анна', 'Петрова', 'Иван', 'Смирнов']
  starter: |
    EMAIL = ...
    PHONE = r'(?:\+7|\b8)[\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}'

    def anonymize(text, names):
        text = re.sub(EMAIL, '[ПОЧТА]', text)
        text = re.sub(PHONE, '[ТЕЛЕФОН]', text)
        if names:
            text = re.sub(..., '[ИМЯ]', text)
        return text

    masked = [anonymize(m, names) for m in messages]
    counts = Counter(tag for m in masked for tag in re.findall(r'\[[А-Я]+\]', m))
    print(*masked, sep='\n')
    print(counts)
  solution: |
    EMAIL = r'[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
    PHONE = r'(?:\+7|\b8)[\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}'

    def anonymize(text, names):
        text = re.sub(EMAIL, '[ПОЧТА]', text)
        text = re.sub(PHONE, '[ТЕЛЕФОН]', text)
        if names:
            text = re.sub(r'\b(?:' + '|'.join(map(re.escape, names)) + r')[а-яё]{0,3}\b', '[ИМЯ]', text)
        return text

    masked = [anonymize(m, names) for m in messages]
    counts = Counter(tag for m in masked for tag in re.findall(r'\[[А-Я]+\]', m))
    print(*masked, sep='\n')
    print(counts)
  explanation: |
    - Почта: `[\w.+-]+@` — имя ящика, затем домен из частей через точку `[\w-]+(?:\.[\w-]+)+`. Внутри частей точки нет, поэтому точка в конце предложения в адрес не попадает. Шаблон `[\w.-]+` после `@` съел бы и её.
    - Телефон: `+7` или `8` в начале слова, затем группы цифр 3–3–2–2, а между ними — любые пробелы, скобки и дефисы. Номер заказа 48213 и сумма 1290 под шаблон не подходят.
    - Имена — одним шаблоном через `|`, с местом под окончание, как в уроке 12.4. Найдено 4 имени, 3 телефона и 3 адреса.
    - «Анне» в четвёртом сообщении осталось: у «Анны» при склонении меняется последняя буква. Правила обезличивания всегда что-то пропускают. Их дополняют моделями выделения сущностей и словарями форм слов, а результат проверяют выборочно вручную.
  hints:
