            crossings = np.sum(positive)
            return float(crossings / 2 / (len(x) / rate))
        f_tone = zero_cross_freq(tone, rate)
        f_mix = zero_cross_freq(mix, rate)
      expect: около 50

- id: m12-l0-t6
  kind: quiz
  title: Честная проверка модели
  difficulty: main
  introduces: []
  uses: [train-valid-test, data-leakage, baseline-model]
  statement: |
    Вспомните, как проверяют модели, — это понадобится в уроках о классификации текстов и о рисках ИИ.
  quiz:
    - q: Модель верно отвечает на 99 % обучающих примеров. Что это говорит о новых данных?
      options:
        - Почти ничего — модель могла запомнить ответы; нужна проверочная часть
        - На новых данных тоже будет около 99 %
        - На новых данных будет не меньше 90 %
      answer: 0
      explain: Качество на обучающей части завышено переобучением. О новых данных говорит только часть, которую модель не видела.
    - q: Валидационная и тестовая части — для чего каждая?
      options:
        - На валидационной выбирают модель и гиперпараметры, тестовую открывают один раз в конце
        - Это одно и то же, просто разные названия
        - На тестовой подбирают гиперпараметры, а валидационную открывают в конце
      answer: 0
      explain: Если выбирать модель по тестовой части, она перестаёт быть честной оценкой — выбор подстроился под неё.
    - q: Где есть утечка данных? Выберите все.
      options:
        - StandardScaler обучили на всех данных, а потом разбили их на обучение и проверку
        - Чтобы предсказать, вернёт ли покупатель товар, взяли признак «сумма возврата»
        - Пропуски заполнили средним, посчитанным только по обучающей части
        - Фотографии одного человека попали и в обучение, и в проверку
      answer: [0, 1, 3]
      explain: "Масштабирование по всем данным подсматривает в проверку, «сумма возврата» известна только после ответа, похожие фото одного человека модель узнаёт. Заполнение средним по обучающей части — правильный способ."
    - q: Уходят 8 % клиентов. Модель предсказания ухода верна в 91 % случаев. Что сделать сначала?
      options:
        - Сравнить с ориентиром «никто не уйдёт» — он верен в 92 % случаев
        - Признать модель хорошей — 91 % это много
        - Добавить в модель побольше признаков
      answer: 0
      explain: Ориентир «всегда самый частый класс» здесь лучше модели. 91 % без сравнения с ориентиром ничего не значит.
  hints:
    - "Обучающую часть модель видела, проверочную — нет: только по ней видно качество на новых данных."
    - "Утечка — всё, что модель не сможет знать при настоящем применении: ответ, свойства проверочных данных, почти копии объектов."
    - "Ответы: 1 — почти ничего; 2 — валидация для выбора, тест в конце; 3 — масштабирование, сумма возврата и фото одного человека; 4 — сравнить с ориентиром."
