    def plural(k, one, few, many):
        if k % 10 == 1 and k % 100 != 11:
            return one
        if ...:
            return few
        return many

    def normalize(text):
        text = re.sub(r'(\d+) ?%', lambda m: say_number(int(m.group(1))) + ' ' + plural(int(m.group(1)), 'процент', 'процента', 'процентов'), text)
        text = re.sub(..., text)
        return text

    spoken = [normalize(p) for p in phrases]
    print(spoken)
  solution: |
    def plural(k, one, few, many):
        if k % 10 == 1 and k % 100 != 11:
            return one
        if 2 <= k % 10 <= 4 and not 12 <= k % 100 <= 14:
            return few
        return many

    def normalize(text):
        text = re.sub(r'(\d+) ?%', lambda m: say_number(int(m.group(1))) + ' ' + plural(int(m.group(1)), 'процент', 'процента', 'процентов'), text)
        text = re.sub(r'(\d+) ?Гц', lambda m: say_number(int(m.group(1))) + ' ' + plural(int(m.group(1)), 'герц', 'герца', 'герц'), text)
        return text

    spoken = [normalize(p) for p in phrases]
    print(spoken)
  explanation: |
    - `k % 10` — последняя цифра, `k % 100` — две последние. Числа от 11 до 14 — исключение: «одиннадцать процентов», хотя последняя цифра 1.
    - `re.sub` с функцией вызывает её для каждого совпадения. `m.group(1)` — число из скобок шаблона, ` ?` разрешает пробел перед знаком, но не требует его.
    - Такие правила — первый этап синтеза. Дальше начинаются трудности: после предлогов нужен другой падеж («от 20 Гц» — «от двадцати герц»), а годы читают порядковыми числами («в 2026 году» — «в две тысячи двадцать шестом году»). Настоящие нормализаторы учитывают и это, а иногда поручают подготовку текста языковой модели.
  hints:
    - "Вторая ветка: `2 <= k % 10 <= 4 and not 12 <= k % 100 <= 14`."
    - "Для герц — тот же шаблон с `Гц` вместо `%`: `r'(\\d+) ?Гц'`."
    - "Формы для герц — `plural(…, 'герц', 'герца', 'герц')`."
  tests: |
    f = var('plural')
    ensure(callable(f), '`plural` должна быть функцией.')
    forms = ('процент', 'процента', 'процентов')
    if f(11, *forms) == 'процент' or f(12, *forms) == 'процента':
        fail('11 — «одиннадцать процентов», 12 — «двенадцать процентов»: числа от 11 до 14 — исключение. Проверяйте две последние цифры, `k % 100`.')
    for k, w in [(1, 'процент'), (2, 'процента'), (4, 'процента'), (5, 'процентов'), (11, 'процентов'), (12, 'процентов'), (14, 'процентов'),
                 (20, 'процентов'), (21, 'процент'), (22, 'процента'), (25, 'процентов'), (101, 'процент'), (111, 'процентов'), (112, 'процентов'), (0, 'процентов')]:
        equal(f(k, *forms), w, f'После числа {k} — «{w}», а у вас {{actual}}.')
    g = var('normalize')
    ensure(callable(g), '`normalize` должна быть функцией.')
    equal(g('Угадал 74 % разделов, ориентир — 11 %.'), 'Угадал семьдесят четыре процента разделов, ориентир — одиннадцать процентов.', 'Ожидалось {expected}, а у вас {actual}.')
    equal(g('Было 3%, стало 21 %.'), 'Было три процента, стало двадцать один процент.', 'Пробела перед % может и не быть. Ожидалось {expected}, а у вас {actual}.')
    equal(g('Тон 22 Гц и 440 Гц.'), 'Тон двадцать два герца и четыреста сорок герц.', 'Ожидалось {expected}, а у вас {actual}.')
    equal(g('Без чисел.'), 'Без чисел.', 'Текст без чисел не меняется, а у вас {actual}.')
    equal(var('spoken', list, 'списком'), ref('spoken'), 'Подготовленные фразы — {expected}, а у вас {actual}.')
