    def say_big(k):
        if k < 1000:
            return say_number(k)
        th, rest = divmod(k, 1000)
        words = say_number(th).split()
        if words[-1] == 'один':
            words[-1] = 'одна'
        elif words[-1] == 'два':
            words[-1] = 'две'
        if th == 1:
            words = []
        words.append(plural(th, 'тысяча', 'тысячи', 'тысяч'))
        if rest:
            words.append(say_number(rest))
        return ' '.join(words)

    years = [say_big(y) for y in YEARS]
    print(years)
  explanation: |
    - `divmod(k, 1000)` делит число на тысячи и остаток. Тысячи читаются тем же `say_number` — это число от 1 до 999.
    - Слово «тысяча» женского рода, поэтому последнее слово «один» становится «одна», «два» — «две». «Одиннадцать» и «двенадцать» — отдельные слова, их правило не трогает.
    - Форма «тысяча / тысячи / тысяч» — тот же `plural`, что для процентов: «двадцать одна тысяча», «две тысячи», «одиннадцать тысяч».
    - 2026 — «две тысячи двадцать шесть». Это количественное число. В тексте «в 2026 году» год читают порядковым числом в нужном падеже: «в две тысячи двадцать шестом году». Для этого нормализатору нужны и грамматика, и контекст.
