  solution: |
    def lm_logprob(words, uni, bi, V):
        return sum(math.log((bi[(u, v)] + 1) / (uni[u] + V)) for u, v in zip(words, words[1:]))

    def rescore(hyps, weight=1.0):
        return max(hyps, key=lambda h: h[1] + weight * lm_logprob(h[0].split(), uni, bi, V))[0]

    best_acoustic = [max(hyps, key=lambda h: h[1])[0] for hyps in utterances]
    best_rescored = [rescore(hyps) for hyps in utterances]
    wer_acoustic = total_wer(references, best_acoustic)
    wer_rescored = total_wer(references, best_rescored)
    print(best_rescored, wer_acoustic, wer_rescored)
  explanation: |
    - `zip(words, words[1:])` — соседние пары слов. `+1` в числителе и `+ V` в знаменателе — сглаживание: незнакомая пара получает маленькую, но не нулевую вероятность, и `log` не падает на нуле.
    - `max(hyps, key=…)` выбирает гипотезу с наибольшей суммой оценок, `[0]` берёт её текст. При `weight=0` решает одна акустика.
    - Одна акустика ошиблась в четырёх фразах из пяти: «вес», «бусинг», «модуль», «установка». WER 0,2 — 4 ошибки на 20 слов. Языковая модель исправила все четыре: она знает по текстам курса «случайный лес», «градиентный бустинг», «языковую модель» и «раннюю остановку». WER стал 0.
    - В пятой фразе человек сказал «случайный вес нейрона». Языковая модель тянет к «лесу», но акустика здесь уверена (−8 против −11,5) и побеждает. Именно поэтому оценки складывают, а не доверяют одной языковой модели.
  hints:
    - "Слагаемое для пары — `math.log((bi[(u, v)] + 1) / (uni[u] + V))`."
    - "Оценка гипотезы `h` — `h[1] + weight * lm_logprob(h[0].split(), uni, bi, V)`."
    - "`wer_rescored` — `total_wer(references, best_rescored)`."
  tests: |
    import math
    from collections import Counter
    f = var('lm_logprob')
    ensure(callable(f), '`lm_logprob` должна быть функцией.')
    u = Counter({'a': 2, 'b': 1})
    b = Counter({('a', 'b'): 1})
    close(f(['a', 'b'], u, b, 3), math.log(2 / 5), 'Для пары (a, b): (1 + 1) / (2 + 3), логарифм — {expected}, а у вас {actual}.')
    close(f(['b', 'a'], u, b, 3), math.log(1 / 4), 'Для незнакомой пары (b, a): (0 + 1) / (1 + 3), логарифм — {expected}, а у вас {actual}.')
    close(f(['a'], u, b, 3), 0.0, 'У фразы из одного слова нет пар — сумма 0, а у вас {actual}.')
    close(f(['a', 'b', 'a'], u, b, 3), math.log(2 / 5) + math.log(1 / 4), 'Логарифм фразы — сумма по всем соседним парам: {expected}, а у вас {actual}.')
    g = var('rescore')
    ensure(callable(g), '`rescore` должна быть функцией.')
    hy = [('случайный вес', -1.0), ('случайный лес', -1.5)]
    equal(g(hy, 0.0), 'случайный вес', 'При weight=0 решает одна акустика — «случайный вес», а у вас {actual}.')
    equal(g(hy), 'случайный лес', 'С языковой моделью «случайный лес» правдоподобнее, а у вас {actual}.')
    equal(g([('случайный вес', -1.0), ('случайный лес', -5.0)]), 'случайный вес', 'Если акустика уверена (−1 против −5), языковая модель не должна её перебить, а у вас {actual}.')
    equal(var('best_acoustic', list, 'списком'), ref('best_acoustic'), 'Лучшие по акустике гипотезы — {expected}, а у вас {actual}.')
    equal(var('best_rescored', list, 'списком'), ref('best_rescored'), 'После пересчёта — {expected}, а у вас {actual}.')
    close(var('wer_acoustic', 'number', 'числом'), ref('wer_acoustic'), 'WER по одной акустике — {expected}, а у вас {actual}.')
    close(var('wer_rescored', 'number', 'числом'), ref('wer_rescored'), 'WER после пересчёта — {expected}, а у вас {actual}.')
