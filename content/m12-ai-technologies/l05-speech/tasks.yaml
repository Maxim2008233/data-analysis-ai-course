  title: Числа словами в нужной форме
  difficulty: main
  introduces: [speech-synthesis]
  uses: [named-entities]
  statement: |
    Напишите функцию `plural(k, one, few, many)` — форму слова после числа `k`: «один процент», «два процента», «пять процентов». Правило русского языка:

    - последняя цифра 1, а две последние — не 11: форма `one`;
    - последняя цифра 2, 3 или 4, а две последние — не 12, 13, 14: форма `few`;
    - иначе — `many`.

    Затем напишите функцию `normalize(text)`. Она заменяет каждое «число %» (пробела перед знаком может и не быть) на число словами и слово «процент» в нужной форме. Каждое «число Гц» — на число словами и слово «герц» (герц, герца, герц). Числа — от 0 до 999, функция `say_number` из урока уже есть. Получите `spoken` — подготовленные к синтезу фразы `phrases`.
  prelude: |
    import re
    ONES = ['ноль', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять', 'десять',
            'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать',
            'семнадцать', 'восемнадцать', 'девятнадцать']
    TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто']
    HUNDREDS = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот']

    def say_number(k):
        """Число от 0 до 999 словами."""
        if k == 0:
            return 'ноль'
        h, rest = divmod(k, 100)
        parts = [HUNDREDS[h]] if h else []
        if rest >= 20:
            parts.append(TENS[rest // 10])
            if rest % 10:
                parts.append(ONES[rest % 10])
        elif rest:
            parts.append(ONES[rest])
        return ' '.join(parts)

    phrases = ['Классификатор угадал 74 % разделов, ориентир — 11 %.',
               'Нота ля — 440 Гц, октавой выше — 880 Гц.',
               'Скидка 21 % действует до пятницы.',
               'Ошибок стало 3%, а было 12 %.',
               'Частота 22 Гц почти не слышна.']
