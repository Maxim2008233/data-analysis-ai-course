  statement: |
    Одно число — доля верных — не говорит, какие классы модель путает. Напишите функцию `confusion(y_true, y_pred, n_classes)` без циклов: матрица `n_classes × n_classes` из целых чисел, где в строке `i`, столбце `j` — сколько текстов класса `i` модель отнесла к классу `j` (подсказка — `np.add.at`).

    Для проверочных разделов (`y_true`, `y_pred` уже посчитаны) получите:

    - `cm` — матрицу ошибок для 11 модулей;
    - `per_module` — долю верных для каждого модуля: диагональ, делённая на сумму строки (массив из 11 чисел);
    - `worst` — номер модуля с наименьшей долей верных;
    - `top_pair` — самую частую ошибку: кортеж (настоящий модуль, предсказанный) с наибольшим числом вне диагонали. Если таких клеток несколько, нужна первая при обходе матрицы по строкам — так её и находит `np.argmax`.
  prelude: |
    import json
    import numpy as np
    from sklearn.feature_extraction.text import TfidfVectorizer
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import make_pipeline
    with open('course_docs.json', encoding='utf-8') as fh:
        docs = json.load(fh)
    texts = np.array([d['section'] + '. ' + d['text'] for d in docs], dtype=object)
    modules = np.array([d['module'] for d in docs])
    key = lambda g: tuple(int(p) for p in g.split('.'))
    test_lessons = set(sorted({d['lesson'] for d in docs}, key=key)[::4])
    is_test = np.array([d['lesson'] in test_lessons for d in docs])
    model = make_pipeline(TfidfVectorizer(), LogisticRegression(max_iter=1000)).fit(list(texts[~is_test]), modules[~is_test])
    y_true = modules[is_test]
    y_pred = model.predict(list(texts[is_test]))
  starter: |
    def confusion(y_true, y_pred, n_classes):
        cm = np.zeros((n_classes, n_classes), dtype=int)
        np.add.at(cm, (..., ...), 1)
        return cm

    cm = confusion(y_true, y_pred, 11)
    per_module = np.diag(cm) / cm.sum(axis=1)
    worst = int(np.argmin(per_module))
    off = cm.copy()
    np.fill_diagonal(off, 0)
    r, c = np.unravel_index(..., off.shape)
    top_pair = (int(r), int(c))
    print(cm)
    print(np.round(per_module, 2), worst, top_pair)
  solution: |
    def confusion(y_true, y_pred, n_classes):
        cm = np.zeros((n_classes, n_classes), dtype=int)
        np.add.at(cm, (np.asarray(y_true), np.asarray(y_pred)), 1)
        return cm

    cm = confusion(y_true, y_pred, 11)
    per_module = np.diag(cm) / cm.sum(axis=1)
    worst = int(np.argmin(per_module))
    off = cm.copy()
    np.fill_diagonal(off, 0)
    r, c = np.unravel_index(np.argmax(off), off.shape)
    top_pair = (int(r), int(c))
    print(cm)
    print(np.round(per_module, 2), worst, top_pair)
  explanation: |
    - `np.add.at(cm, (строки, столбцы), 1)` прибавляет 1 в клетку (настоящий, предсказанный) для каждой пары. В отличие от `cm[строки, столбцы] += 1`, повторяющиеся пары он не теряет: обычное присваивание засчитало бы одну и ту же клетку лишь однажды.
    - Хуже всех узнаётся модуль 0 «Знакомство» — 6 разделов из 14. Его разделы об истории ИИ, устройстве тренажёра и основах Python похожи на многое понемногу: ошибки разбросаны по пяти модулям. Лучше всех — модуль 8 о нейросетях, 8 из 8: у него свой словарь.
    - Самых частых ошибок две, по 5 разделов: модуль 1 (NumPy) принят за модуль 4 (визуализация), а модуль 9 (языковые модели) — за модуль 10 (промпты). `np.argmax` возвращает первую — (1, 4).
    - Четыре ошибки из первой пары — разделы урока 1.7 о квантилях и частотах по интервалам: о том же гистограммы и боксплоты модуля 4. Четыре из второй — урок 9.1 о генерации текста, близкий к модулю 10. Матрица ошибок показывает, где темы правда пересекаются, а где модели нужны другие признаки или больше примеров.
  hints:
    - "Индексы для `np.add.at` — `(np.asarray(y_true), np.asarray(y_pred))`."
    - "Самая частая ошибка — `np.argmax(off)` по матрице без диагонали; `np.unravel_index(номер, off.shape)` превращает номер клетки в (строка, столбец)."
    - "Доля верных модуля — `np.diag(cm) / cm.sum(axis=1)`."
  tests: |
    import numpy as np
    f = var('confusion')
    ensure(callable(f), '`confusion` должна быть функцией.')
    no_loops('Матрицу ошибок соберите без циклов: np.add.at прибавляет 1 сразу во все нужные клетки.')
    got = np.asarray(f([0, 0, 1, 1, 1, 2], [0, 1, 1, 1, 2, 2], 3))
    if got[1, 1] == 1:
        fail('Повторяющиеся пары (1, 1) засчитаны один раз: `cm[i, j] += 1` теряет повторы, нужен np.add.at.')
    if np.array_equal(got, np.array([[1, 0, 0], [1, 2, 0], [0, 1, 1]])):
        fail('Строки и столбцы перепутаны: строка — настоящий класс, столбец — предсказанный.')
    same_array(got, np.array([[1, 1, 0], [0, 2, 1], [0, 0, 1]]), 'Для y_true = [0, 0, 1, 1, 1, 2] и y_pred = [0, 1, 1, 1, 2, 2] матрица — [[1, 1, 0], [0, 2, 1], [0, 0, 1]].')
    same_array(np.asarray(var('cm')), ref('cm'), 'Матрица ошибок для модулей не совпадает с ожидаемой.')
    same_array(np.asarray(var('per_module'), dtype=float), ref('per_module'), 'Доли верных по модулям не совпадают с ожидаемыми.')
    equal(int(var('worst', 'number', 'числом')), int(ref('worst')), 'Хуже всех узнаётся модуль {expected}, а у вас {actual}.')
    equal(var('top_pair', tuple, 'кортежем'), ref('top_pair'), 'Самая частая ошибка — {expected}, а у вас {actual}.')
