    ensure(callable(f), '`correct` должна быть функцией.')
    v = {'кот': 10, 'код': 50, 'кит': 5, 'скат': 3, 'дом': 5, 'дым': 5}
    equal(f('кот', v), 'кот', 'Слово из словаря остаётся как есть, даже если рядом есть более частое: «кот» → «кот», а у вас {actual}.')
    if f('скот', v) == 'код':
