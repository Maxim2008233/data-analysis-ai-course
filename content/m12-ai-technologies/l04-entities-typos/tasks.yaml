- id: m12-l4-t1
  title: Не та раскладка
  difficulty: warmup
  introduces: []
  uses: [py-dicts]
  statement: |
    Самая частая «опечатка» в поиске — забыли переключить раскладку и набрали `ghbdtn` вместо «привет». Строка `EN` — клавиши английской раскладки, `RU` — русские буквы на тех же клавишах, по порядку.

    Напишите функцию `to_russian(text)`: каждый символ из `EN` заменить символом `RU` с той же позиции. Заглавные латинские буквы становятся заглавными русскими (`G` → `П`). Остальные символы — пробелы, цифры, знаки, которых нет в `EN`, — не меняются. Получите `fixed` — исправленные запросы `queries`.
  prelude: |
    EN = "`qwertyuiop[]asdfghjkl;'zxcvbnm,."
    RU = "ёйцукенгшщзхъфывапролджэячсмитьбю"
    queries = ['ghbdtn', 'vfibyyjt j,extybt', 'Vjcrdf', 'ytqhjctnm', 'lj,hsq ltym']
  starter: |
    table = dict(zip(EN, RU))
    for e, r in zip(EN, RU):
        if e.isalpha():
            table[...] = ...

    def to_russian(text):
        return ''.join(... for ch in text)

    fixed = [to_russian(q) for q in queries]
    print(fixed)
  solution: |
    table = dict(zip(EN, RU))
    for e, r in zip(EN, RU):
        if e.isalpha():
            table[e.upper()] = r.upper()

    def to_russian(text):
        return ''.join(table.get(ch, ch) for ch in text)

    fixed = [to_russian(q) for q in queries]
    print(fixed)
  explanation: |
    - `dict(zip(EN, RU))` — пары «клавиша → русская буква на той же клавише». На русской раскладке на клавишах `,` `.` `;` `[` стоят буквы б, ю, ж, х, поэтому знаки из `EN` тоже заменяются: `lj,hsq` — это «добрый».
    - Заглавная буква — та же клавиша с Shift. Пары `e.upper() → r.upper()` добавляем только для букв: у `[` заглавной формы нет.
    - `table.get(ch, ch)` возвращает пару символа, а если её нет — сам символ. Поэтому пробелы и цифры остаются.
    - Поисковики исправляют раскладку так же, но осторожно. Слепая замена портит настоящие английские слова: `GigaChat` станет «ПшпфСрфе». Поэтому сначала проверяют, есть ли исправленное слово в словаре, — как в исправителе опечаток из урока.
  hints:
    - "Таблица замены — словарь `dict(zip(EN, RU))`: клавиша → русская буква на той же клавише."
    - "Заглавные — та же клавиша с Shift: для букв добавьте пары `table[e.upper()] = r.upper()`."
    - "Замена символа — `table.get(ch, ch)`: символ без пары остаётся. Строку собирает `''.join(...)`."
  tests: |
    f = var('to_russian')
    ensure(callable(f), '`to_russian` должна быть функцией.')
    equal(f('ghbdtn'), 'привет', '«ghbdtn» должно стать «привет», а у вас {actual}.')
    got = f('Ghbdtn vbh 2026')
    if isinstance(got, str) and got.startswith('G'):
        fail('Заглавная «G» осталась латинской. Заглавная буква — та же клавиша с Shift: «G» → «П».')
    equal(got, 'Привет мир 2026', '«Ghbdtn vbh 2026» должно стать {expected}, а у вас {actual}. Пробелы и цифры не меняются.')
    got = f('lj,hsq ltym')
    if got == 'до,рый день':
        fail('Запятая осталась запятой, а на русской раскладке на этой клавише буква «б». Заменяйте все символы из EN, не только буквы.')
    equal(got, 'добрый день', '«lj,hsq ltym» должно стать {expected}, а у вас {actual}.')
    equal(f('!?'), '!?', 'Символы, которых нет в EN, остаются как есть, а у вас {actual}.')
    equal(var('fixed', list, 'списком'), ref('fixed'), 'Исправленные запросы — {expected}, а у вас {actual}.')
  wrong:
    - code: |
        table = dict(zip(EN, RU))
        def to_russian(text):
            return ''.join(table.get(ch, ch) for ch in text)
        fixed = [to_russian(q) for q in queries]
      expect: Заглавная «G» осталась латинской
    - code: |
        table = {e: r for e, r in zip(EN, RU) if e.isalpha()}
        table.update({e.upper(): r.upper() for e, r in zip(EN, RU) if e.isalpha()})
        def to_russian(text):
            return ''.join(table.get(ch, ch) for ch in text)
        fixed = [to_russian(q) for q in queries]
      expect: Запятая осталась запятой

- id: m12-l4-t2
  title: Ссылки на уроки
  difficulty: main
  introduces: [named-entities]
  uses: []
  statement: |
    Ссылка на урок — сущность по шаблону. Напишите функцию `lesson_refs(text)`: список номеров уроков (строки вида `'11.2'`), на которые ссылается текст, по порядку.

    - Номер — ссылка, только если перед ним слово «урок» в любой форме и с любой буквы: «Урок 2.1», «в уроке 11.2».
    - После номера может идти список: «уроки 1.3, 1.5 и 1.7» — три ссылки, «уроках 2.3 и 2.5» — две.
    - Числа без слова «урок» — не ссылки: «версия 3.14».

    Для разделов курса `texts` получите `n_refs` — сколько всего ссылок, и `top_lesson` — номер урока, на который ссылаются чаще всех.
  prelude: |
    import json
    import re
    from collections import Counter
    with open('course_docs.json', encoding='utf-8') as fh:
        docs = json.load(fh)
    texts = [d['section'] + '. ' + d['text'] for d in docs]
  starter: |
    LIST = ...      # шаблон: «урок» в любой форме, номер, а дальше, может быть, ещё номера через запятую или «и»

    def lesson_refs(text):
        found = []
        for m in re.finditer(LIST, text):
            found += re.findall(r'\d+\.\d+', m.group())
        return found

    refs = Counter(r for t in texts for r in lesson_refs(t))
    n_refs = sum(refs.values())
    top_lesson = refs.most_common(1)[0][0]
    print(lesson_refs('См. урок 5.4 и уроки 1.3, 1.5 и 1.7.'), n_refs, top_lesson)
  solution: |
    LIST = r'\b[Уу]рок\w*\s+\d+\.\d+(?:(?:,\s*|\s+и\s+)\d+\.\d+)*'

    def lesson_refs(text):
        found = []
        for m in re.finditer(LIST, text):
            found += re.findall(r'\d+\.\d+', m.group())
        return found

    refs = Counter(r for t in texts for r in lesson_refs(t))
    n_refs = sum(refs.values())
    top_lesson = refs.most_common(1)[0][0]
    print(lesson_refs('См. урок 5.4 и уроки 1.3, 1.5 и 1.7.'), n_refs, top_lesson)
  explanation: |
    - `\b[Уу]рок\w*` — слово «урок» с большой или маленькой буквы и с любым окончанием, `\s+\d+\.\d+` — пробел и первый номер.
    - `(?:(?:,\s*|\s+и\s+)\d+\.\d+)*` — продолжение списка: запятая или «и», затем ещё номер, сколько угодно раз. Группа `(?:…)` только объединяет части шаблона и в ответ не попадает.
    - Шаблон находит кусок «уроки 1.3, 1.5 и 1.7» целиком, а номера из него достаёт второй, простой шаблон `\d+\.\d+`. Два простых шаблона читать легче, чем один сложный.
    - В курсе 292 ссылки на уроки, на одну больше, чем в примере урока: список «уроках 2.3 и 2.5» дал вторую ссылку. Чаще всех упоминается урок 1.5 о масках: маски нужны почти в каждом модуле.
  hints:
    - 'Начало шаблона — `\b[Уу]рок\w*\s+\d+\.\d+`: слово «урок» в любой форме и первый номер.'
    - 'Продолжение списка — `(?:(?:,\s*|\s+и\s+)\d+\.\d+)*`: запятая или «и», затем номер, сколько угодно раз.'
    - 'Шаблон целиком — `r''\b[Уу]рок\w*\s+\d+\.\d+(?:(?:,\s*|\s+и\s+)\d+\.\d+)*''`.'
  tests: |
    f = var('lesson_refs')
    ensure(callable(f), '`lesson_refs` должна быть функцией.')
    got = f('См. урок 5.4 и уроки 1.3, 1.5 и 1.7. В уроке 11.2 — поиск. Версия 3.14 — не урок.')
    ensure(isinstance(got, list), '`lesson_refs` должна вернуть список номеров-строк.')
    if '3.14' in got:
        fail('«3.14» — номер версии, а не урока. Номер считается ссылкой, только если перед ним слово «урок» в какой-нибудь форме.')
    if got == ['5.4', '1.3', '11.2']:
        fail('Нашлись только первые номера после слова «урок». В «уроки 1.3, 1.5 и 1.7» три ссылки: после номера может идти «, номер» или « и номер».')
    equal(got, ['5.4', '1.3', '1.5', '1.7', '11.2'], 'Для фразы со ссылками ожидалось {expected}, а у вас {actual}.')
    equal(f('Урок 2.1 и урок 2.2.'), ['2.1', '2.2'], 'В начале предложения «Урок» пишется с большой буквы — такие ссылки тоже нужны. Ожидалось {expected}, а у вас {actual}.')
    equal(f('Без ссылок.'), [], 'В тексте без ссылок — пустой список, а у вас {actual}.')
    equal(int(var('n_refs', 'number', 'числом')), int(ref('n_refs')), 'Ссылок в курсе — {expected}, а у вас {actual}.')
    equal(var('top_lesson', str, 'строкой'), ref('top_lesson'), 'Чаще всех упоминается урок {expected}, а у вас {actual}.')
  files: [course_docs.json]
  wrong:
    - code: |
        LIST = r'\b[Уу]рок\w*\s+\d+\.\d+'
        def lesson_refs(text):
            found = []
            for m in re.finditer(LIST, text):
                found += re.findall(r'\d+\.\d+', m.group())
            return found
        refs = Counter(r for t in texts for r in lesson_refs(t))
        n_refs = sum(refs.values())
        top_lesson = refs.most_common(1)[0][0]
      expect: Нашлись только первые номера
    - code: |
        def lesson_refs(text):
            return re.findall(r'\d+\.\d+', text)
        refs = Counter(r for t in texts for r in lesson_refs(t))
        n_refs = sum(refs.values())
        top_lesson = refs.most_common(1)[0][0]
      expect: номер версии

- id: m12-l4-t3
  title: Компании в текстах курса
  difficulty: main
  introduces: []
  uses: [named-entities]
  statement: |
    Напишите функцию `find_names(text, names)` — поиск названий по словарю. Она возвращает список пар `(позиция, название)` по порядку в тексте:

    - название ищется как слово: «Meta» внутри «Metan» и «GigaChat» внутри «authGigaChat» не считаются;
    - после названия может стоять русское окончание до трёх букв: «Яндекса», «Сбером»;
    - «Сбербанк» — уже другое слово, не «Сбер».

    Получите `mentions` — `Counter`: сколько раз каждое название из `NAMES` упоминается в разделах курса.
  prelude: |
    import json
    import re
    from collections import Counter
    with open('course_docs.json', encoding='utf-8') as fh:
        docs = json.load(fh)
    texts = [d['section'] + '. ' + d['text'] for d in docs]
    NAMES = ['Яндекс', 'Сбер', 'VK', 'GigaChat', 'SaluteSpeech', 'Hugging Face', 'OpenAI', 'Microsoft', 'Meta',
             'Google', 'LangChain', 'Colab', 'IBM']
  starter: |
    def find_names(text, names):
        found = []
        for name in names:
            pattern = ...
            for m in re.finditer(pattern, text):
                found.append((m.start(), name))
        return sorted(found)

    mentions = Counter(name for t in texts for _, name in find_names(t, NAMES))
    print(mentions.most_common())
  solution: |
    def find_names(text, names):
        found = []
        for name in names:
            pattern = r'\b' + re.escape(name) + r'[а-яё]{0,3}\b'
            for m in re.finditer(pattern, text):
                found.append((m.start(), name))
        return sorted(found)

    mentions = Counter(name for t in texts for _, name in find_names(t, NAMES))
    print(mentions.most_common())
  explanation: |
    - `\b` перед названием не даёт найти его внутри слова: в «authGigaChat» перед «G» стоит буква, границы нет.
    - `[а-яё]{0,3}\b` — до трёх русских букв окончания, а потом конец слова. Поэтому «Яндекса» найдётся, а «Metan» и «Сбербанк» — нет: после «Meta» идёт латинская «n», после «Сбер» — четыре буквы «банк».
    - `re.escape` экранирует особые символы названия: в «Hugging Face» это пробел, а в названиях вроде «Яндекс.Диск» — точка, которая иначе значила бы «любой символ».
    - Чаще всех в курсе упоминается GigaChat — 30 раз, затем Colab и LangChain. «Meta» не упоминается ни разу, а поиск подстроки нашёл бы её один раз — в «Metan».
  hints:
    - '`\b` — граница слова: перед названием не должно быть буквы, иначе найдётся «authGigaChat».'
    - 'Место под окончание — `[а-яё]{0,3}`: до трёх русских букв, а после них снова `\b`.'
    - 'Шаблон целиком — `r''\b'' + re.escape(name) + r''[а-яё]{0,3}\b''`.'
  tests: |
    f = var('find_names')
    ensure(callable(f), '`find_names` должна быть функцией.')
    s = 'Яндекс и Сбер. CatBoost от Яндекса, ключ Сбера лежит в authGigaChat.txt, а отвечает GigaChat. Metan — не Meta. Сбербанк тоже банк.'
    got = f(s, ['Яндекс', 'Сбер', 'GigaChat', 'Meta'])
    ensure(isinstance(got, list), '`find_names` должна вернуть список пар (позиция, название).')
    got = [tuple(x) for x in got]
    starts = [p for p, _ in got]
    if 59 in starts or 94 in starts:
        fail('Название нашлось внутри другого слова — в «authGigaChat.txt» или «Metan». Ищите слово целиком: `\\b` перед названием и после окончания.')
    if 111 in starts:
        fail('«Сбербанк» — не «Сбер» с окончанием: окончание — не больше трёх русских букв.')
    if (27, 'Яндекс') not in got or (41, 'Сбер') not in got:
        fail('Не нашлись формы с окончанием — «Яндекса», «Сбера». После названия разрешите до трёх русских букв: `[а-яё]{0,3}`.')
    equal(got, [(0, 'Яндекс'), (9, 'Сбер'), (27, 'Яндекс'), (41, 'Сбер'), (84, 'GigaChat'), (105, 'Meta')], 'Для тестовой фразы ожидалось {expected}, а у вас {actual}. Пары (позиция, название) — по порядку в тексте.')
    equal(f('Здесь нет названий.', ['Яндекс']), [], 'В тексте без названий — пустой список, а у вас {actual}.')
    equal(var('mentions'), ref('mentions'), 'Упоминания в курсе — {expected}, а у вас {actual}.')
  files: [course_docs.json]
  wrong:
    - code: |
        def find_names(text, names):
            found = []
            for name in names:
                for m in re.finditer(re.escape(name), text):
                    found.append((m.start(), name))
            return sorted(found)
        mentions = Counter(name for t in texts for _, name in find_names(t, NAMES))
      expect: внутри другого слова
    - code: |
        def find_names(text, names):
            found = []
            for name in names:
                for m in re.finditer(r'\b' + re.escape(name) + r'\b', text):
                    found.append((m.start(), name))
            return sorted(found)
        mentions = Counter(name for t in texts for _, name in find_names(t, NAMES))
      expect: формы с окончанием

- id: m12-l4-t4
  title: Расстояние Левенштейна
  difficulty: main
  introduces: [edit-distance]
  uses: []
  statement: |
    Напишите функцию `levenshtein(a, b)` — минимальное число вставок, удалений и замен букв, чтобы превратить строку `a` в строку `b`. Считайте таблицей по строкам: хватит двух списков — прошлой строки и текущей.

    Затем найдите `near_model` — шесть слов словаря `vocab`, ближайших к слову «модель»: список пар `(расстояние, слово)` по возрастанию, при равном расстоянии — по алфавиту.
  prelude: |
    import json
    import re
    from collections import Counter
    with open('course_docs.json', encoding='utf-8') as fh:
        docs = json.load(fh)
    texts = [d['section'] + '. ' + d['text'] for d in docs]
    words = Counter(w for t in texts for w in re.findall(r'[а-яё]+', t.lower()))
    vocab = {w: c for w, c in words.items() if c >= 2}
  starter: |
    def levenshtein(a, b):
        prev = list(range(len(b) + 1))
        for i in range(1, len(a) + 1):
            cur = [i] + [0] * len(b)
            for j in range(1, len(b) + 1):
                cur[j] = min(...)
            prev = cur
        return prev[-1]

    near_model = sorted((levenshtein('модель', w), w) for w in vocab)[:6]
    print(levenshtein('кот', 'скат'), near_model)
  solution: |
    def levenshtein(a, b):
        prev = list(range(len(b) + 1))
        for i in range(1, len(a) + 1):
            cur = [i] + [0] * len(b)
            for j in range(1, len(b) + 1):
                cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] != b[j - 1]))
            prev = cur
        return prev[-1]

    near_model = sorted((levenshtein('модель', w), w) for w in vocab)[:6]
    print(levenshtein('кот', 'скат'), near_model)
  explanation: |
    - `prev` — прошлая строка таблицы, `cur` — текущая. В начале `prev` — расстояния от пустой строки до первых `j` букв `b`: 0, 1, 2, …
    - `cur[0] = i`: из первых `i` букв `a` в пустую строку — `i` удалений.
    - Клетка — минимум из трёх путей: `prev[j] + 1` — удалить букву `a`, `cur[j - 1] + 1` — вставить букву `b`, `prev[j - 1] + (a[i - 1] != b[j - 1])` — заменить букву, а если буквы совпали, пройти бесплатно.
    - Ближе всего к «модели» — её же формы: «модели» и «моделью» на расстоянии 1, «моделей» и «моделях» на расстоянии 2. Но на расстоянии 1 оказался и «модуль» — совсем другое слово. Поэтому опечатку «модль» исправитель может превратить и в то, и в другое — выбирает частота.
  hints:
    - "Клетка — минимум из трёх путей: удалить, вставить, заменить."
    - "Удалить — `prev[j] + 1`, вставить — `cur[j - 1] + 1`, заменить — `prev[j - 1] + (a[i - 1] != b[j - 1])`."
    - "Целиком: `cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] != b[j - 1]))`."
  tests: |
    f = var('levenshtein')
    ensure(callable(f), '`levenshtein` должна быть функцией.')
    if f('', 'abc') == 0:
        fail('Из пустой строки в «abc» — три вставки, а у вас 0. Первая строка таблицы — 0, 1, 2, …, len(b), а каждая следующая начинается с номера строки i.')
    if f('кот', 'скат') == 4:
        fail('Буквы сравниваются по позициям, а так нельзя: «скат» — это «кот» со вставкой «с» и одной заменой, всего 2. Нужна таблица, где каждая клетка — минимум из трёх соседних.')
    for a, b, d in [('кот', 'скат', 2), ('', 'abc', 3), ('abc', '', 3), ('abc', 'abc', 0), ('kitten', 'sitting', 3), ('модль', 'модель', 1), ('мдоель', 'модель', 2), ('ab', 'ba', 2)]:
