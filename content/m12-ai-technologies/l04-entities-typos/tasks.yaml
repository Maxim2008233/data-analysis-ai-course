    equal(f('скот', v), 'кот', '«скот»: на расстоянии 1 «кот» (10 раз) и «скат» (3 раза) — нужен «кот», а у вас {actual}.')
    equal(f('ко', v), 'код', '«ко»: на расстоянии 1 «кот» и «код» — побеждает более частый «код», а у вас {actual}.')
    equal(f('дим', v), 'дом', '«дим»: «дом» и «дым» на расстоянии 1 и одинаково часты — берём первое по алфавиту, «дом», а у вас {actual}.')
