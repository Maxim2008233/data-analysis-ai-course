- id: m12-l4-t6
  title: Перестановка — одна ошибка
  difficulty: star
  introduces: []
  uses: [edit-distance]
  statement: |
    Две соседние буквы, переставленные местами («мдоель»), — частая опечатка, а Левенштейн считает её двумя заменами. Вариант Дамерау — Левенштейна считает её одним шагом.

    Напишите функцию `osa(a, b)`: та же таблица, что у Левенштейна, плюс ещё один путь в клетку `d[i][j]`. Если две последние буквы переставлены — `a[i-1] == b[j-2]` и `a[i-2] == b[j-1]`, — в клетку можно прийти из `d[i-2][j-2]` за один шаг.

    Затем сравните исправители на 30 опечатках-перестановках `swaps` — пары «опечатка, правильное слово». `acc_lev` — доля верных исправлений с расстоянием `levenshtein`, `acc_osa` — с `osa`. Функция `correct(word, vocab, dist)` уже есть и принимает функцию расстояния третьим аргументом.
