  solution: |
    def osa(a, b):
        d = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
        for i in range(len(a) + 1):
            d[i][0] = i
        for j in range(len(b) + 1):
            d[0][j] = j
        for i in range(1, len(a) + 1):
            for j in range(1, len(b) + 1):
                d[i][j] = min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] != b[j - 1]))
                if i > 1 and j > 1 and a[i - 1] == b[j - 2] and a[i - 2] == b[j - 1]:
                    d[i][j] = min(d[i][j], d[i - 2][j - 2] + 1)
        return d[-1][-1]

    acc_lev = np.mean([correct(t, vocab, levenshtein) == w for t, w in swaps])
    acc_osa = np.mean([correct(t, vocab, osa) == w for t, w in swaps])
    print(osa('мдоель', 'модель'), acc_lev, acc_osa)
  explanation: |
    - Новый путь — перестановка: если `a[i - 1] == b[j - 2]` и `a[i - 2] == b[j - 1]`, две последние буквы поменялись местами, и `d[i - 2][j - 2] + 1` — цена такого исправления.
    - Условие `i > 1 and j > 1` обязательно. Без него при `i = 1` индекс `a[i - 2]` равен `a[-1]` — Python возьмёт последнюю букву слова, и таблица испортится.
    - Это вариант «оптимального выравнивания» (optimal string alignment): каждый кусок строки правят не больше одного раза. Полный Дамерау — Левенштейн устроен чуть сложнее, но для опечаток разница почти не видна.
    - С Левенштейном исправлено 76,7 % перестановок, с перестановкой за один шаг — все 30. Правильное слово теперь на расстоянии 1 и обгоняет слова на расстоянии 2, даже более частые.
