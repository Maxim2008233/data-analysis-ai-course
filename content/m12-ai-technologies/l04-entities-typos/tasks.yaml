  title: Исправитель опечаток
  difficulty: main
  introduces: []
  uses: [edit-distance]
  statement: |
    Напишите функцию `correct(word, vocab, max_d=2)`. `vocab` — словарь «слово → частота».

    - Если слово есть в словаре, вернуть его.
    - Иначе вернуть слово словаря на расстоянии Левенштейна не больше `max_d`: ближайшее, среди равных — самое частое, а при равной частоте — первое по алфавиту.
    - Если такого слова нет, вернуть `word` как есть.

    Функция `levenshtein` уже есть. Проверьте исправитель на 16 опечатках `pairs` — пары «опечатка, правильное слово»:

    - `fixed` — исправления в порядке `pairs`;
    - `accuracy` — доля верных исправлений;
    - `missed` — опечатки, исправленные неверно, по порядку.
  prelude: |
    import json
    import re
    from collections import Counter
    with open('course_docs.json', encoding='utf-8') as fh:
        docs = json.load(fh)
    texts = [d['section'] + '. ' + d['text'] for d in docs]
    words = Counter(w for t in texts for w in re.findall(r'[а-яё]+', t.lower()))
    vocab = {w: c for w, c in words.items() if c >= 2}

    def levenshtein(a, b):
        prev = list(range(len(b) + 1))
        for i in range(1, len(a) + 1):
            cur = [i] + [0] * len(b)
            for j in range(1, len(b) + 1):
                cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] != b[j - 1]))
            prev = cur
        return prev[-1]

    pairs = [('модль', 'модель'), ('класификация', 'классификация'), ('регресия', 'регрессия'), ('градиетный', 'градиентный'),
             ('признкаи', 'признаки'), ('паралельно', 'параллельно'), ('выборкаа', 'выборка'), ('переобучени', 'переобучение'),
             ('утечька', 'утечка'), ('нейросетб', 'нейросеть'), ('дифузия', 'диффузия'), ('точьность', 'точность'),
             ('матрца', 'матрица'), ('обучющая', 'обучающая'), ('кластеризаця', 'кластеризация'), ('ансамбль', 'ансамбль')]
  starter: |
    def correct(word, vocab, max_d=2):
        ...

    fixed = [correct(t, vocab) for t, _ in pairs]
    accuracy = ...
    missed = ...
    print(fixed, accuracy, missed)
  solution: |
    def correct(word, vocab, max_d=2):
        if word in vocab:
            return word
        best = None
        for v, c in vocab.items():
            if abs(len(v) - len(word)) > max_d:
                continue
            d = levenshtein(word, v)
            if d <= max_d and (best is None or (d, -c, v) < best):
                best = (d, -c, v)
        return best[2] if best else word

    fixed = [correct(t, vocab) for t, _ in pairs]
    accuracy = sum(f == g for f, (_, g) in zip(fixed, pairs)) / len(pairs)
    missed = [t for f, (t, g) in zip(fixed, pairs) if f != g]
    print(fixed, accuracy, missed)
  explanation: |
    - Кандидат — кортеж `(d, -c, v)`. Кортежи сравниваются по порядку: сначала расстояние, потом частота с минусом — частое слово «меньше», — потом само слово. Поэтому наименьший кортеж — ближайшее, затем самое частое, затем первое по алфавиту.
    - `abs(len(v) - len(word)) > max_d` — быстрый отсев. Если длины отличаются больше чем на `max_d`, расстояние точно больше: одних вставок или удалений нужно столько.
    - Верно исправлено 12 опечаток из 16, доля 0,75. «Нейросетб» стала «нейросети»: обе формы на расстоянии 1, и победила более частая.
    - Остальные три промаха — правильных слов нет в словаре. «Диффузия» не встречается в модулях 0–10, а «обучающая» и «кластеризация» — по одному разу, словарь же собран из слов, встретившихся хотя бы дважды. Словарь побольше исправил бы их, но в нём чаще попадались бы опечатки самих текстов.
  hints:
    - "Сначала — `if word in vocab: return word`."
    - "Кандидат — кортеж `(d, -c, v)`: `min` по таким кортежам выберет ближайшее слово, затем самое частое, затем первое по алфавиту."
    - "Если ни одного слова на расстоянии `<= max_d` нет, верните `word`. Доля верных — `sum(f == g for f, (_, g) in zip(fixed, pairs)) / len(pairs)`."
  tests: |
