    def merge_split(words, known):
        out, i = [], 0
        while i < len(words):
            if i + 1 < len(words) and words[i] + words[i + 1] in known and (words[i] not in known or words[i + 1] not in known):
                out.append(words[i] + words[i + 1])
                i += 2
            else:
                out.append(words[i])
                i += 1
        return out

    fixed = [' '.join(merge_split(to_words(t), known)) for t in lexed]
    wer_fixed, recall_fixed = total_wer(said, fixed), recall_at_3(fixed)
    still_wrong = [s for s, f in zip(said, fixed) if levenshtein(to_words(s), to_words(f)) > 0]
    print(round(wer_fixed, 3), round(recall_fixed, 3), still_wrong)
