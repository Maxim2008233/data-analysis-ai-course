    def confidence(S):
        Z = 100 * S
        Z = Z - Z.max(axis=1, keepdims=True)
        P = np.exp(Z)
        P = P / P.sum(axis=1, keepdims=True)
        return P.max(axis=1)

    conf = confidence(S)
    ok_ths = [th for th in ths if correct[conf >= th].mean() >= 0.9]
    best_th = float(min(ok_ths))
    coverage = float((conf >= best_th).mean())
    print(best_th, round(coverage, 3), round(float(correct[conf >= best_th].mean()), 3))
  explanation: |
    - `Z.max(axis=1, keepdims=True)` — максимум каждой строки столбцом, чтобы вычитание шло построчно. Softmax от этого не меняется, а `exp` больше не видит чисел вроде 1000.
    - Без порога помощник отвечает на всё и прав в 79,9 % случаев. С порогом 0,55 он отвечает на 77,2 % картинок, зато прав в 90,5 % ответов. На оставшиеся 22,8 % он переспрашивает — и среди них ошибок было бы больше половины.
    - Чем выше порог, тем точнее ответы и тем реже помощник решается ответить: при 0,9 — 98,3 % верных, но только на половину картинок. Где остановиться, решает цена ошибки (урок 12.6): неверный ответ про еду безобиден, а про ядовитый гриб — нет.
  hints:
    - "Максимум каждой строки столбцом — `Z.max(axis=1, keepdims=True)`."
    - "Подходящие пороги уже в `ok_ths`; нужен наименьший — `min(ok_ths)`."
    - "Доля отвеченных — `(conf >= best_th).mean()`."
  tests: |
