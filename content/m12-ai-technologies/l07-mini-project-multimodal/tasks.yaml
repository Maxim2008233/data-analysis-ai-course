    with open('assistant_questions.json', encoding='utf-8') as fh:
        questions = json.load(fh)['questions']
    test = [q for q in questions if q['part'] == 'test' and q['about_course']]
    said = [q['question'] for q in test]
    heard = ['зачем нужна валидационная выборка', 'почему нельзя хранить ключ авторизации в коте', 'как заполнить пропуски в таблице',
             'зачем стандарт изировать признаки', 'что показывает коэффициент дети нации', 'что такое эм бединг слова',
             'чем фью шот отличается от зиро шот', 'зачем нужна логарифмическая шкала на графике', 'что делает функция активации в нейроне',
             'что такое токен изатор', 'как сгруппировать таблицу и посчитать средней', 'что такое случайный вес',
             'как читать бокс плот', 'как работает обратное распространение ошибки', 'чем эр эм эс и отличается от мае']

    def to_words(text):
        return re.findall(r'[a-zа-яё0-9]+', text.lower())

    def levenshtein(a, b):
        prev = list(range(len(b) + 1))
        for i in range(1, len(a) + 1):
            cur = [i] + [0] * len(b)
            for j in range(1, len(b) + 1):
                cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] != b[j - 1]))
            prev = cur
        return prev[-1]

    texts = [d['lesson_title'] + '. ' + d['section'] + '. ' + d['text'] for d in docs]
    lessons = [d['lesson'] for d in docs]
    vectorizer = TfidfVectorizer(analyzer='char_wb', ngram_range=(3, 5))
    X = vectorizer.fit_transform(texts)

    def top_lessons(query, k=3):
        scores = (X @ vectorizer.transform([query]).T).toarray().ravel()
        return [lessons[i] for i in np.argsort(-scores)[:k]]

    def total_wer(refs, hyps):
        errors = sum(levenshtein(to_words(r), to_words(h)) for r, h in zip(refs, hyps))
        return errors / sum(len(to_words(r)) for r in refs)

    def recall_at_3(queries):
        return float(np.mean([any(l in q['lessons'] for l in top_lessons(query, 3)) for query, q in zip(queries, test)]))

    LEXICON = {'фью шот': 'few-shot', 'зиро шот': 'zero-shot', 'ван шот': 'one-shot', 'эм эс и': 'MSE', 'эр эм эс и': 'RMSE',
               'мае': 'MAE', 'эм бединг': 'эмбеддинг', 'гига чат': 'GigaChat', 'лэнг чейн': 'LangChain', 'нам пай': 'NumPy',
