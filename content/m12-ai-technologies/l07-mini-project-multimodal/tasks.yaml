    def apply_lexicon(text, lexicon):
        for spoken in sorted(lexicon, key=...):
            text = re.sub(..., lexicon[spoken], text)
        return text

    lexed = [apply_lexicon(h, LEXICON) for h in heard]
    wer_lex, recall_lex = total_wer(said, lexed), recall_at_3(lexed)
    print(round(wer_lex, 3), round(recall_lex, 3))
  solution: |
    def apply_lexicon(text, lexicon):
        for spoken in sorted(lexicon, key=len, reverse=True):
            text = re.sub(r'\b' + re.escape(spoken) + r'\b', lexicon[spoken], text)
        return text

    lexed = [apply_lexicon(h, LEXICON) for h in heard]
    wer_lex, recall_lex = total_wer(said, lexed), recall_at_3(lexed)
    print(round(wer_lex, 3), round(recall_lex, 3))
  explanation: |
    - `sorted(lexicon, key=len, reverse=True)` — звучания от длинных к коротким. В словаре «эм эс и» стоит раньше «эр эм эс и», и без сортировки «чем эр эм эс и» стало бы «чем эр MSE».
    - `\b` с обеих сторон — звучание как целые слова, `re.escape` — на случай особых символов в звучании.
    - WER упал вдвое — с 0,306 до 0,153, а поиск снова находит урок для вопроса о few-shot: 14 из 15, как по сказанному.
    - Настоящие сервисы распознавания принимают такие подсказки сами — список слов и фраз, которые надо узнавать. Тогда термины распознаются сразу верно, а не чинятся после. Словарь собирают из справочника курса: каждый новый термин — ещё одна строка.
  hints:
    - "Длинные раньше коротких — `sorted(lexicon, key=len, reverse=True)`."
    - "Шаблон звучания — `r'\\b' + re.escape(spoken) + r'\\b'`."
    - "Замена — `re.sub(шаблон, lexicon[spoken], text)`."
  tests: |
    f = var('apply_lexicon')
    ensure(callable(f), '`apply_lexicon` должна быть функцией.')
    lex = {'эм эс и': 'MSE', 'эр эм эс и': 'RMSE', 'мае': 'MAE'}
    got = f('чем эр эм эс и отличается от мае', lex)
    if 'эр MSE' in got:
        fail('«эм эс и» заменилось внутри «эр эм эс и». Заменяйте длинные звучания раньше коротких: sorted(lexicon, key=len, reverse=True).')
    equal(got, 'чем RMSE отличается от MAE', 'Ожидалось {expected}, а у вас {actual}.')
    got = f('понимаем мае', {'мае': 'MAE'})
    if 'MAEм' in got:
        fail('«мае» заменилось внутри слова «понимаем». Ищите звучание как целые слова: \\b с обеих сторон.')
    equal(got, 'понимаем MAE', 'Ожидалось {expected}, а у вас {actual}.')
    equal(f('без терминов', lex), 'без терминов', 'Текст без звучаний из словаря не меняется, а у вас {actual}.')
    equal(var('lexed', list, 'списком'), ref('lexed'), 'Вопросы после словаря терминов — {expected}, а у вас {actual}.')
    close(var('wer_lex', 'number', 'числом'), ref('wer_lex'), 'WER после словаря — {expected}, а у вас {actual}.')
    close(var('recall_lex', 'number', 'числом'), ref('recall_lex'), 'Доля найденных уроков после словаря — {expected}, а у вас {actual}.')
