    def total_wer(refs, hyps):
        errors = sum(levenshtein(to_words(r), to_words(h)) for r, h in zip(refs, hyps))
        return errors / sum(len(to_words(r)) for r in refs)

    def recall_at_3(queries):
        hits = [any(l in q['lessons'] for l in top_lessons(query, 3)) for query, q in zip(queries, test)]
        return float(np.mean(hits))

    wer_heard = total_wer(said, heard)
    recall_said, recall_heard = recall_at_3(said), recall_at_3(heard)
    print(round(wer_heard, 3), round(recall_said, 3), round(recall_heard, 3))
