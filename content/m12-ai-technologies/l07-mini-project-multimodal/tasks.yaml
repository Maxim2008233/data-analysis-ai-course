    def zero_shot(image_emb, text_emb, classes):
        S = image_emb @ text_emb.T
        return np.asarray(classes)[S.argmax(axis=1)]

    is_photo = prompt_variant == 'photo'
    pred = zero_shot(image_emb, prompt_emb[is_photo], prompt_class[is_photo])
    correct = pred == images['class'].to_numpy()
