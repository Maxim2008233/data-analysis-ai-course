    - WER набора — сумма ошибок, делённая на сумму слов, а не среднее WER фраз (урок 12.5). Иначе короткая фраза с одной ошибкой весила бы столько же, сколько длинная.
    - Распознаватель ошибся почти в каждом третьем слове: WER 0,306, 22 ошибки на 72 слова.
    - Поиск при этом пострадал меньше: урок нашёлся для 14 вопросов из 15 по сказанному и для 13 по распознанному. Символьные n-граммы (урок 11.2) находят и «бокс плот», и «токен изатор» — куски слов те же. Потерялся только вопрос про few-shot: от «фью шот» и «зиро шот» не осталось ни одной общей буквы с латинским термином.
    - Вопрос про коэффициент детерминации не находится даже в точной формулировке. В уроке 5.8 говорят «R²», а слова «детерминации» в текстах курса нет — поиск по буквам синонимов не знает.
