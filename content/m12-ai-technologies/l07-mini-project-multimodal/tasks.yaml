- id: m12-l7-t2
  title: "Шаг 2. Словарь терминов"
  difficulty: main
  introduces: []
  uses: [speech-recognition-models, named-entities]
  statement: |
    Латинских терминов курса распознаватель не знает и записывает их по звучанию. Словарь `LEXICON` сопоставляет звучание с термином: `'фью шот': 'few-shot'`. Это тот же лексикон, что у распознавателя (урок 12.5), только применённый после распознавания.

    Напишите функцию `apply_lexicon(text, lexicon)`: каждое звучание из словаря заменить термином.

    - Звучание ищется как целые слова: `\b` по краям. Иначе «мае» найдётся внутри «понимаем».
    - Длинные звучания заменяются раньше коротких. Иначе «эм эс и» (MSE) испортит «эр эм эс и» (RMSE).

    Получите `lexed` — распознанные вопросы после замены, а также `wer_lex` и `recall_lex`. Функции `total_wer` и `recall_at_3` из шага 1 уже есть.
  prelude: |
    import json
    import re
    import numpy as np
    from sklearn.feature_extraction.text import TfidfVectorizer
    with open('course_docs.json', encoding='utf-8') as fh:
