- id: m12-l1-t1
  title: Из цвета в яркость
  difficulty: warmup
  introduces: [digital-image]
  uses: [broadcasting]
  statement: |
    Напишите функцию `to_gray(img)`: яркость картинки `uint8` в долях от 0 до 1.

    - Цветная картинка (три оси: высота × ширина × 3) → взвешенная сумма каналов `0.299·R + 0.587·G + 0.114·B`, делённая на 255.
    - Картинка, которая уже чёрно-белая (две оси), → просто делится на 255.

    Без циклов по пикселям. Получите `stop_gray` — яркость знака `stop` и `dark_share` — долю пикселей знака темнее 0,5.
  prelude: |
    import numpy as np
    with np.load('zs_thumbs.npz') as data:
        ids = [str(x) for x in data['ids']]
        images = data['images']
    stop = images[ids.index('778.jpg')]
  starter: |
    def to_gray(img):
        if img.ndim == 2:
            return img / 255
        return ... / 255

    stop_gray = to_gray(stop)
    dark_share = float((stop_gray < 0.5).mean())
    print(stop_gray.shape, stop_gray.min().round(3), stop_gray.max().round(3), round(dark_share, 3))
  solution: |
    def to_gray(img):
        if img.ndim == 2:
            return img / 255
        return img @ np.array([0.299, 0.587, 0.114]) / 255

    stop_gray = to_gray(stop)
    dark_share = float((stop_gray < 0.5).mean())
    print(stop_gray.shape, stop_gray.min().round(3), stop_gray.max().round(3), round(dark_share, 3))
  explanation: |
    - `img @ веса` умножает три канала каждого пикселя на веса и складывает — для всех пикселей сразу: (64, 64, 3) @ (3,) → (64, 64).
    - Деление на 255 переводит яркость в доли от 0 до 1. Заодно `uint8` становится `float`, и дальше можно считать без переполнения.
    - Тёмных пикселей — около трети: красное поле знака в яркости тёмное (около 0,28), хотя в цвете оно яркое. Поэтому для поиска красного знака яркости мало — нужен цвет.
  hints:
    - "Число осей массива — `img.ndim`."
    - "Взвешенная сумма — `img @ np.array([0.299, 0.587, 0.114])`."
    - "Не забудьте разделить на 255 и в этой ветке."
  tests: |
    import numpy as np
    f = var('to_gray')
    ensure(callable(f), '`to_gray` должна быть функцией.')
    px = np.array([[[255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 255]]], dtype=np.uint8)
    got = np.asarray(f(px), dtype=float)
    ensure(got.shape == (1, 4), 'Для картинки 1 × 4 × 3 яркость — массив 1 × 4, а у вас форма {0}.'.format(got.shape))
    if np.allclose(got, 1 / 3, atol=0.01) or np.allclose(got[0, :3], got[0, 0]):
        fail('Каналы нужно складывать с весами 0.299, 0.587, 0.114, а не поровну: чистый зелёный ярче чистого синего.')
    same_array(got, np.array([[0.299, 0.587, 0.114, 1.0]]), 'Чистые красный, зелёный, синий и белый пиксели — яркость 0.299, 0.587, 0.114 и 1.')
    g2 = np.asarray(f(np.array([[0, 51], [255, 102]], dtype=np.uint8)), dtype=float)
    same_array(g2, np.array([[0, 0.2], [1.0, 0.4]]), 'Чёрно-белая картинка (две оси) просто делится на 255.')
    same_array(np.asarray(var('stop_gray'), dtype=float), ref('stop_gray'), 'Яркость знака не совпадает с ожидаемой.')
    close(var('dark_share', 'number', 'числом'), ref('dark_share'), 'Доля пикселей темнее 0.5 — {expected}, а у вас {actual}.')
  files: [zs_thumbs.npz]
  wrong:
    - code: |
        def to_gray(img):
            if img.ndim == 2:
                return img / 255
            return img.mean(axis=2) / 255
        stop_gray = to_gray(stop)
        dark_share = float((stop_gray < 0.5).mean())
      expect: с весами
    - code: |
        def to_gray(img):
            return img @ np.array([0.299, 0.587, 0.114]) / 255
        stop_gray = to_gray(stop)
        dark_share = float((stop_gray < 0.5).mean())
      expect: ValueError

- id: m12-l1-t2
  title: Правило «много красного» на всех картинках
  difficulty: main
  introduces: []
  uses: [bool-mask, digital-image]
  statement: |
    Попробуем найти знаки «Стоп» без обучения — правилом цвета. Напишите функцию `red_pixels(img)`: сколько в картинке пикселей, где красный канал больше 150, а зелёный и синий меньше 100. Каналы переведите в `int` до сравнения.

    Пройдите по всем 54 миниатюрам `images` (их имена — в `ids`, классы — в словаре `classes`) и получите:

    - `found` — список имён картинок, где красных пикселей не меньше 300, — «детектор сработал»;
    - `precision` — доля настоящих знаков (класс `'stop_sign'`) среди `found`;
    - `recall` — доля найденных среди всех знаков «Стоп» в миниатюрах.
  prelude: |
    import csv
    import numpy as np
    with np.load('zs_thumbs.npz') as data:
        ids = [str(x) for x in data['ids']]
        images = data['images']
    with open('zs_public.csv', encoding='utf-8') as fh:
        classes = {row['ID']: row['class'] for row in csv.DictReader(fh)}
  starter: |
    def red_pixels(img):
        r, g, b = (img[:, :, k].astype(int) for k in range(3))
        return int(...)

    found = [name for name, img in zip(ids, images) if ...]
    stops = [name for name in ids if classes[name] == 'stop_sign']
    precision = sum(classes[name] == 'stop_sign' for name in found) / len(found)
    recall = ...
    print(found)
    print([classes[n] for n in found])
    print(round(precision, 3), round(recall, 3))
  solution: |
    def red_pixels(img):
        r, g, b = (img[:, :, k].astype(int) for k in range(3))
        return int(((r > 150) & (g < 100) & (b < 100)).sum())

    found = [name for name, img in zip(ids, images) if red_pixels(img) >= 300]
    stops = [name for name in ids if classes[name] == 'stop_sign']
    precision = sum(classes[name] == 'stop_sign' for name in found) / len(found)
    recall = sum(name in found for name in stops) / len(stops)
    print(found)
    print([classes[n] for n in found])
    print(round(precision, 3), round(recall, 3))
  explanation: |
    - Маска из трёх условий через `&`, сумма маски — число красных пикселей.
    - Правило сработало на восьми картинках: оба знака «Стоп», рамен, суши, пицца, тирамису, пума и фламенко. Полнота 100 % — оба знака найдены. Точность — 25 %: три срабатывания из четырёх ложные.
    - Правило ищет красный цвет, а не знак. Можно усложнять его — добавить форму восьмиугольника, белые буквы, — но каждое новое правило ломается на новой картинке. Поэтому детекторы учат на размеченных примерах (урок 12.2), а точность и полноту меряют, как здесь.
  hints:
    - "Число красных — `((r > 150) & (g < 100) & (b < 100)).sum()`."
    - "Срабатывание — `red_pixels(img) >= 300`."
    - "Полнота — доля знаков из `stops`, которые попали в `found`."
  tests: |
    import numpy as np
    f = var('red_pixels')
    ensure(callable(f), '`red_pixels` должна быть функцией.')
    im = np.zeros((2, 3, 3), dtype=np.uint8)
    im[0, 0] = [200, 50, 50]
    im[0, 1] = [200, 120, 50]
    im[1, 2] = [255, 0, 99]
    im[1, 1] = [150, 0, 0]
    im[1, 0] = [200, 50, 150]
    equal(f(im), 2, 'В тестовой картинке два красных пикселя (R > 150, G < 100, B < 100), а у вас {actual}.')
    big = np.full((2, 2, 3), [250, 90, 90], dtype=np.uint8)
    equal(f(big), 4, 'Сравнение каналов: для пикселей (250, 90, 90) все четыре красные.')
    fd = var('found', list, 'списком')
    equal(fd, ref('found'), 'Картинки, где сработало правило, — {expected}, а у вас {actual}.')
    close(var('precision', 'number', 'числом'), ref('precision'), 'Точность — {expected}, а у вас {actual}.')
    close(var('recall', 'number', 'числом'), ref('recall'), 'Полнота — {expected}, а у вас {actual}.')
  files: [zs_thumbs.npz, zs_public.csv]
  wrong:
    - code: |
        def red_pixels(img):
            r, g, b = (img[:, :, k].astype(int) for k in range(3))
            return int(((r > 150) & (g < 100)).sum())
        found = [name for name, img in zip(ids, images) if red_pixels(img) >= 300]
        stops = [name for name in ids if classes[name] == 'stop_sign']
        precision = sum(classes[name] == 'stop_sign' for name in found) / len(found)
        recall = sum(name in found for name in stops) / len(stops)
      expect: два красных пикселя
    - code: |
        def red_pixels(img):
            r, g, b = (img[:, :, k].astype(int) for k in range(3))
            return int(((r > 150) & (g < 100) & (b < 100)).sum())
        found = [name for name, img in zip(ids, images) if red_pixels(img) >= 300]
        stops = [name for name in ids if classes[name] == 'stop_sign']
        precision = sum(classes[name] == 'stop_sign' for name in found) / len(found)
        recall = len(stops) / len(found)
      expect: Полнота

- id: m12-l1-t3
  title: Свёртка без циклов
  difficulty: main
  introduces: [image-convolution]
  uses: [axis, vectorization]
  statement: |
    Цикл по всем пикселям в Python медленный. Напишите свёртку без циклов — функцию `convolve(img, kernel)`:

    1. `np.lib.stride_tricks.sliding_window_view(img, kernel.shape)` даёт все окна размера ядра сразу — массив формы (h − k + 1, w − k + 1, k, k);
    2. умножьте окна на ядро и сложите по двум последним осям.

    Результат — та же свёртка, что в уроке: окно прикладывается без переворота ядра, а размер уменьшается на k − 1. Получите `blurred` — размытую ядром 5 × 5 из одинаковых весов яркость муравья `ant_gray`.
  prelude: |
    import numpy as np
    with np.load('zs_thumbs.npz') as data:
        ids = [str(x) for x in data['ids']]
        images = data['images']
    ant_gray = images[ids.index('1310.jpg')] @ np.array([0.299, 0.587, 0.114]) / 255
  starter: |
    def convolve(img, kernel):
        windows = np.lib.stride_tricks.sliding_window_view(img, kernel.shape)
        return ...

    blurred = convolve(ant_gray, np.ones((5, 5)) / 25)
    print(ant_gray.shape, '→', blurred.shape)
  solution: |
    def convolve(img, kernel):
        windows = np.lib.stride_tricks.sliding_window_view(img, kernel.shape)
        return (windows * kernel).sum(axis=(2, 3))

    blurred = convolve(ant_gray, np.ones((5, 5)) / 25)
    print(ant_gray.shape, '→', blurred.shape)
  explanation: |
    - `sliding_window_view` не копирует данные, а показывает их как массив окон: элемент `[i, j]` — окно, левый верхний угол которого в пикселе (i, j).
    - `windows * kernel` умножает каждое окно на ядро (broadcasting по первым двум осям), а `.sum(axis=(2, 3))` складывает внутри окна. Получается то же, что двойной цикл из урока, но в десятки раз быстрее.
    - Строго говоря, это корреляция: в математической свёртке ядро сначала переворачивают. В нейросетях и обработке картинок это различие обычно опускают, и для симметричных ядер (размытие) результат один и тот же.
  hints:
    - "Умножение всех окон на ядро — `windows * kernel`."
    - "Сумма внутри окна — `.sum(axis=(2, 3))`."
    - "Проверьте себя: `convolve(np.arange(16.).reshape(4, 4), np.ones((2, 2)))[0, 0]` — это 0 + 1 + 4 + 5 = 10."
  tests: |
    import numpy as np
    from scipy.signal import correlate2d
    f = var('convolve')
    ensure(callable(f), '`convolve` должна быть функцией.')
    no_loops('Свёртку нужно сделать без циклов: окна — sliding_window_view, сумма — по осям 2 и 3.')
    rng = np.random.default_rng(5)
    a = rng.normal(size=(7, 9))
    k = np.array([[1.0, 2.0], [0.0, -1.0]])
    got = np.asarray(f(a, k))
    ensure(got.shape == (6, 8), 'Для картинки 7 × 9 и ядра 2 × 2 результат — 6 × 8, а у вас {0}.'.format(got.shape))
    if np.allclose(got, correlate2d(a, k[::-1, ::-1], mode='valid')) and not np.allclose(got, correlate2d(a, k, mode='valid')):
        fail('Ядро перевёрнуто: окно прикладывается к ядру как есть, без переворота.')
    same_array(got, correlate2d(a, k, mode='valid'), 'Свёртка случайной картинки 7 × 9 ядром 2 × 2 не совпадает с ожидаемой.')
    k3 = rng.normal(size=(3, 3))
    same_array(np.asarray(f(a, k3)), correlate2d(a, k3, mode='valid'), 'Свёртка ядром 3 × 3 не совпадает с ожидаемой.')
    same_array(np.asarray(var('blurred')), ref('blurred'), 'Размытая яркость муравья не совпадает с ожидаемой.')
  files: [zs_thumbs.npz]
  wrong:
    - code: |
        def convolve(img, kernel):
            windows = np.lib.stride_tricks.sliding_window_view(img, kernel.shape)
            return (windows * kernel[::-1, ::-1]).sum(axis=(2, 3))
        blurred = convolve(ant_gray, np.ones((5, 5)) / 25)
      expect: Ядро перевёрнуто
    - code: |
        def convolve(img, kernel):
            k = kernel.shape[0]
            out = np.zeros((img.shape[0] - k + 1, img.shape[1] - k + 1))
            for i in range(out.shape[0]):
                for j in range(out.shape[1]):
                    out[i, j] = (img[i:i + k, j:j + k] * kernel).sum()
            return out
        blurred = convolve(ant_gray, np.ones((5, 5)) / 25)
      expect: без циклов

- id: m12-l1-t4
  title: Сила границ
  difficulty: main
  introduces: []
  uses: [image-convolution, digital-image]
  statement: |
    Напишите функцию `edge_strength(gray)`: сила границы в каждой точке — `sqrt(gx² + gy²)`, где `gx` — свёртка с ядром Собеля `sobel_x`, а `gy` — с транспонированным ядром `sobel_x.T`. Свёртка `convolve` уже есть.

    Получите для муравья:

    - `edges` — силу границ его яркости `ant_gray`;
    - `edge_share` — долю точек, где сила больше 0,5;
    - `blur_ratio` — во сколько раз падает средняя сила границ, если перед этим размыть картинку ядром 3 × 3 из одинаковых весов (средняя сила для размытой / средняя для исходной).
  prelude: |
    import numpy as np
    with np.load('zs_thumbs.npz') as data:
        ids = [str(x) for x in data['ids']]
        images = data['images']
    ant_gray = images[ids.index('1310.jpg')] @ np.array([0.299, 0.587, 0.114]) / 255
    sobel_x = np.array([[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]])

    def convolve(img, kernel):
        windows = np.lib.stride_tricks.sliding_window_view(img, kernel.shape)
        return (windows * kernel).sum(axis=(2, 3))
  starter: |
    def edge_strength(gray):
        gx = convolve(gray, sobel_x)
        gy = ...
        return ...

    edges = edge_strength(ant_gray)
    edge_share = float((edges > 0.5).mean())
    blurred = convolve(ant_gray, np.ones((3, 3)) / 9)
    blur_ratio = ...
    print(edges.shape, round(edge_share, 3), round(blur_ratio, 3))
  solution: |
    def edge_strength(gray):
        gx = convolve(gray, sobel_x)
        gy = convolve(gray, sobel_x.T)
        return np.sqrt(gx ** 2 + gy ** 2)

    edges = edge_strength(ant_gray)
    edge_share = float((edges > 0.5).mean())
    blurred = convolve(ant_gray, np.ones((3, 3)) / 9)
    blur_ratio = float(edge_strength(blurred).mean() / edges.mean())
    print(edges.shape, round(edge_share, 3), round(blur_ratio, 3))
  explanation: |
    - `sobel_x` откликается на перепады слева направо (вертикальные границы), `sobel_x.T` — сверху вниз (горизонтальные). Корень из суммы квадратов объединяет оба направления, как длина вектора.
    - Сильных границ — около четверти точек: на миниатюре 64 × 64 контур муравья и лапки занимают немало места, а светлый фон почти весь чёрный.
    - После размытия средняя сила границ падает: перепады яркости растягиваются на несколько пикселей и становятся пологими. Поэтому размывают только против шума — мелкие детали при этом теряются.
  hints:
    - "Вертикальная составляющая — `convolve(gray, sobel_x.T)`."
    - "Сила — `np.sqrt(gx ** 2 + gy ** 2)`."
    - "Отношение средних — `edge_strength(blurred).mean() / edges.mean()`."
  tests: |
    import numpy as np
    f = var('edge_strength')
    ensure(callable(f), '`edge_strength` должна быть функцией.')
    step = np.zeros((5, 6))
    step[:, 3:] = 1.0
    got = np.asarray(f(step))
    ensure(got.shape == (3, 4), 'Для картинки 5 × 6 сила границ — 3 × 4, а у вас {0}.'.format(got.shape))
    same_array(got, np.array([[0, 4, 4, 0]] * 3, dtype=float), 'Для ступеньки яркости 0 → 1 между столбцами 2 и 3 сила — 4 у двух столбцов возле границы и 0 вдали.')
    down = np.asarray(f(1 - step))
    same_array(down, np.array([[0, 4, 4, 0]] * 3, dtype=float), 'Для ступеньки 1 → 0 (яркость падает) сила тоже 4: сила не зависит от направления перепада — нужен корень из суммы квадратов.')
    horiz = step.T.copy()
    same_array(np.asarray(f(horiz)), np.array([[0, 0, 0], [4, 4, 4], [4, 4, 4], [0, 0, 0]], dtype=float), 'Горизонтальная граница тоже должна находиться: нужна и вторая свёртка — с sobel_x.T.')
    same_array(np.asarray(var('edges')), ref('edges'), 'Сила границ муравья не совпадает с ожидаемой.')
    close(var('edge_share', 'number', 'числом'), ref('edge_share'), 'Доля сильных границ — {expected}, а у вас {actual}.')
    close(var('blur_ratio', 'number', 'числом'), ref('blur_ratio'), 'Отношение средней силы после размытия к исходной — {expected}, а у вас {actual}.')
  files: [zs_thumbs.npz]
  wrong:
    - code: |
        def edge_strength(gray):
            return np.abs(convolve(gray, sobel_x))
        edges = edge_strength(ant_gray)
        edge_share = float((edges > 0.5).mean())
        blurred = convolve(ant_gray, np.ones((3, 3)) / 9)
        blur_ratio = float(edge_strength(blurred).mean() / edges.mean())
      expect: Горизонтальная граница
    - code: |
        def edge_strength(gray):
            gx = convolve(gray, sobel_x)
            gy = convolve(gray, sobel_x.T)
            return gx + gy
        edges = edge_strength(ant_gray)
        edge_share = float((edges > 0.5).mean())
        blurred = convolve(ant_gray, np.ones((3, 3)) / 9)
        blur_ratio = float(edge_strength(blurred).mean() / edges.mean())
      expect: ступеньки

- id: m12-l1-t5
  title: Пулинг — картинка вдвое меньше
  difficulty: star
  introduces: []
  uses: [image-convolution, axis]
  statement: |
    В свёрточных сетях после слоёв свёртки картинку уменьшают **пулингом**: каждый блок `size × size` заменяют одним числом — максимумом (max pooling). Карта признаков становится меньше, а сильные отклики сохраняются.

    Напишите функцию `max_pool(img, size=2)` без циклов: обрежьте картинку до размеров, кратных `size`, сделайте `reshape` в (h / size, size, w / size, size) и возьмите максимум по осям 1 и 3. Для цветной картинки (три оси) пулинг делается в каждом канале отдельно: форма (h, w, 3) → (h / size, w / size, 3).

