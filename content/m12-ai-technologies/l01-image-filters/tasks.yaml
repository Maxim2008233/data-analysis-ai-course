  tests: |
    import numpy as np
    f = var('max_pool')
    ensure(callable(f), '`max_pool` должна быть функцией.')
    a = np.arange(16).reshape(4, 4)
    same_array(np.asarray(f(a)), np.array([[5, 7], [13, 15]]), 'max_pool для массива 4 × 4 (0…15) — [[5, 7], [13, 15]].')
    odd = np.arange(35).reshape(5, 7)
    got = np.asarray(f(odd))
    ensure(got.shape == (2, 3), 'Картинка 5 × 7 обрезается до 4 × 6, после пулинга — 2 × 3, а у вас {0}.'.format(got.shape))
    same_array(got, np.array([[8, 10, 12], [22, 24, 26]]), 'Пулинг картинки 5 × 7: лишние строка и столбец отбрасываются.')
    color = np.arange(48).reshape(4, 4, 3)
    cg = np.asarray(f(color))
    ensure(cg.shape == (2, 2, 3), 'Цветная картинка 4 × 4 × 3 → 2 × 2 × 3, а у вас {0}.'.format(cg.shape))
    same_array(np.asarray(f(a, 4)), np.array([[15]]), 'С size=4 картинка 4 × 4 становится одним числом — максимумом.')
    same_array(np.asarray(var('pooled_edges')), ref('pooled_edges'), 'Пулинг силы границ не совпадает с ожидаемым.')
    close(float(var('kept')), float(ref('kept')), 'Доля сохранённых сильных откликов — {expected}, а у вас {actual}.')
