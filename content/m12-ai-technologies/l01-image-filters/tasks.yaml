  solution: |
    def max_pool(img, size=2):
        h, w = img.shape[0] // size * size, img.shape[1] // size * size
        img = img[:h, :w]
        if img.ndim == 3:
            return img.reshape(h // size, size, w // size, size, img.shape[2]).max(axis=(1, 3))
        return img.reshape(h // size, size, w // size, size).max(axis=(1, 3))

    pooled_edges = max_pool(edges, 2)
    kept = (pooled_edges > 0.5).sum() * 4 / (edges > 0.5).sum()
    print(edges.shape, '→', pooled_edges.shape, '| сохранилось сильных откликов (с поправкой на площадь):', round(float(kept), 2))
  explanation: |
    - `reshape(h/2, 2, w/2, 2)` раскладывает картинку на блоки 2 × 2: оси 1 и 3 — строка и столбец внутри блока. Максимум по ним — одно число на блок.
    - Обрезка до кратного размера нужна, потому что `reshape` не умеет делить 63 строки на блоки по 2: лишняя строка отбрасывается.
    - После пулинга сильных откликов больше, чем «ровно четверть»: блок с одной сильной точкой целиком становится сильным. Поэтому `kept` больше 1. Пулинг огрубляет положение, зато сохраняет главное — «где-то здесь граница». Сети становятся устойчивее к небольшим сдвигам объекта.
