description: >-
  Обзор технологий искусственного интеллекта из национальной стратегии — с практикой на тех же инструментах, что в
  курсе. Компьютерное зрение: картинка как массив чисел, фильтры-свёртки, обнаружение объектов рамками и IoU,
  сегментация масками, генерация картинок из шума. Обработка языка: задачи и трудности русского языка, классификатор
  текстов на разделах уроков, именованные сущности, исправление опечаток. Речь: спектр и спектрограмма записи из
  ноутбука курса, акустическая и языковая модели распознавания, подготовка текста для синтеза. Применения ИИ в
  российских компаниях, цена ошибок и риски. Мини-проект — мультимодальный помощник: голос, картинка и текст.
