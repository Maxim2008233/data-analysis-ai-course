<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Inter, Arial, sans-serif" font-size="12" role="img" aria-label="IoU двух рамок. Настоящая рамка A от (20, 10) до (60, 50) — площадь 1600, найденная рамка B от (30, 20) до (80, 60) — площадь 2000. Пересечение — прямоугольник от (30, 20) до (60, 50), площадь 900. Объединение — 1600 + 2000 − 900 = 2700. IoU = 900 / 2700 ≈ 0,33 — меньше порога 0,5, такая рамка не засчитывается.">
  <defs>
    <pattern id="iou-h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
  </defs>
  <text x="12" y="22" fill="currentColor" font-weight="700">IoU — пересечение, делённое на объединение</text>
  <text x="40" y="52" fill="currentColor" font-size="11"><tspan fill="#3d5bd9" font-weight="700">A</tspan> — настоящая рамка (20, 10)–(60, 50)</text>
  <rect x="40" y="60" width="120" height="120" fill="#3d5bd9" fill-opacity="0.12" stroke="#3d5bd9" stroke-width="2"/>
  <rect x="70" y="90" width="150" height="120" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="2"/>
  <rect x="70" y="90" width="90" height="90" fill="url(#iou-h)"/>
  <text x="115" y="140" fill="currentColor" font-size="13" text-anchor="middle" font-weight="700">∩</text>
  <text x="70" y="228" fill="currentColor" font-size="11"><tspan fill="#c2410c" font-weight="700">B</tspan> — найденная рамка (30, 20)–(80, 60)</text>
  <text x="290" y="84" fill="currentColor"><tspan font-weight="700">Площадь A</tspan> = 40 × 40 = 1600</text>
  <text x="290" y="108" fill="currentColor"><tspan font-weight="700">Площадь B</tspan> = 50 × 40 = 2000</text>
  <text x="290" y="132" fill="currentColor"><tspan font-weight="700">Пересечение</tspan> (штриховка) — от (30, 20) до (60, 50): 30 × 30 = 900</text>
  <text x="290" y="156" fill="currentColor"><tspan font-weight="700">Объединение</tspan> = 1600 + 2000 − 900 = 2700</text>
  <text x="290" y="186" fill="currentColor" font-size="13"><tspan font-weight="700">IoU</tspan> = 900 / 2700 ≈ 0,33</text>
  <text x="290" y="210" fill="currentColor" font-size="11" opacity="0.8">Меньше порога 0,5: такая рамка не засчитывается как найденный объект.</text>
  <text x="290" y="228" fill="currentColor" font-size="11" opacity="0.8">Пересечение рамок — от max левых и верхних краёв до min правых и нижних.</text>
</svg>
