  solution: |
    def remove_small(mask, min_area):
        labels, n = ndimage.label(mask)
        areas = np.bincount(labels.ravel())             # areas[k] — пикселей в пятне k (areas[0] — фон)
        big = [k for k in range(1, n + 1) if areas[k] >= min_area]
        return np.isin(labels, big)

    def mask_iou(pred, true):
        union = (pred | true).sum()
        if union == 0:
            return 1.0
        return float((pred & true).sum() / union)

    iou_before = mask_iou(red, true_mask)
    iou_after = mask_iou(remove_small(red, 100), true_mask)
    print(round(iou_before, 4), round(iou_after, 4))
  explanation: |
