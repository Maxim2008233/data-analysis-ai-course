- id: m12-l2-t1
  title: IoU двух рамок
  difficulty: warmup
  introduces: [object-detection]
  uses: []
  statement: |
    Напишите функцию `box_iou(a, b)` для рамок `(x1, y1, x2, y2)`: площадь пересечения, делённая на площадь объединения. Если рамки не пересекаются или только касаются краями, IoU равен 0. Результат — `float`.

    Получите `iou_scheme` — IoU рамок со схемы урока: (20, 10, 60, 50) и (30, 20, 80, 60), и `iou_shift` — IoU настоящей рамки первого объекта `true_box` и той же рамки, сдвинутой на 5 пикселей вправо и на 5 вниз.
  prelude: |
    true_box = (12, 10, 40, 34)
  starter: |
    def box_iou(a, b):
        ix = max(0, min(a[2], b[2]) - max(a[0], b[0]))
        iy = ...
        inter = ix * iy
        area_a = (a[2] - a[0]) * (a[3] - a[1])
        area_b = (b[2] - b[0]) * (b[3] - b[1])
        return float(...)

    iou_scheme = box_iou((20, 10, 60, 50), (30, 20, 80, 60))
    shifted = (true_box[0] + 5, true_box[1] + 5, true_box[2] + 5, true_box[3] + 5)
    iou_shift = box_iou(true_box, shifted)
    print(round(iou_scheme, 3), round(iou_shift, 3))
  solution: |
    def box_iou(a, b):
        ix = max(0, min(a[2], b[2]) - max(a[0], b[0]))
        iy = max(0, min(a[3], b[3]) - max(a[1], b[1]))
        inter = ix * iy
        area_a = (a[2] - a[0]) * (a[3] - a[1])
        area_b = (b[2] - b[0]) * (b[3] - b[1])
        return float(inter / (area_a + area_b - inter))

    iou_scheme = box_iou((20, 10, 60, 50), (30, 20, 80, 60))
    shifted = (true_box[0] + 5, true_box[1] + 5, true_box[2] + 5, true_box[3] + 5)
    iou_shift = box_iou(true_box, shifted)
    print(round(iou_scheme, 3), round(iou_shift, 3))
  explanation: |
    - Пересечение двух рамок — тоже рамка: левый край — больший из левых, правый — меньший из правых. Если «правый» оказался левее «левого», рамки не пересекаются, и `max(0, …)` даёт ширину 0.
    - В объединении пересечение вычитается: иначе его площадь посчиталась бы дважды.
    - Сдвиг всего на 5 пикселей у рамки 28 × 24 даёт IoU 0,48 — уже ниже порога 0,5, и объект считался бы ненайденным. Рамки мелких объектов очень чувствительны к сдвигу, поэтому качество на маленьких объектах оценивают отдельно.
  hints:
    - "Высота пересечения — `max(0, min(a[3], b[3]) - max(a[1], b[1]))`."
    - "Объединение — `area_a + area_b - inter`."
    - "Проверьте себя на схеме урока: должно получиться 1/3."
  tests: |
    f = var('box_iou')
    ensure(callable(f), '`box_iou` должна быть функцией.')
    close(f((0, 0, 10, 10), (0, 0, 10, 10)), 1.0, 'Одинаковые рамки — IoU 1, а у вас {actual}.')
    got = f((0, 0, 10, 10), (5, 0, 15, 10))
    if abs(got - 0.5) < 1e-9:
        fail('Пересечение вычитается из суммы площадей: объединение (0, 0, 10, 10) и (5, 0, 15, 10) — 150, IoU = 50/150.')
    close(got, 1 / 3, 'Для рамок (0, 0, 10, 10) и (5, 0, 15, 10) IoU = 50/150, а у вас {actual}.')
    equal(f((0, 0, 10, 10), (20, 20, 30, 30)), 0.0, 'Непересекающиеся рамки — IoU 0.')
    equal(f((0, 0, 10, 10), (10, 0, 20, 10)), 0.0, 'Рамки, касающиеся краем, не пересекаются — IoU 0.')
    equal(f((0, 0, 10, 10), (20, 0, 30, 10)), 0.0, 'Рамки, разнесённые по горизонтали, — IoU 0, даже если по вертикали они на одном уровне.')
    ensure(isinstance(got, float), '`box_iou` должна вернуть float.')
    close(var('iou_scheme', 'number', 'числом'), 1 / 3, 'IoU рамок со схемы — 1/3, а у вас {actual}.')
    close(var('iou_shift', 'number', 'числом'), ref('iou_shift'), 'IoU сдвинутой рамки — {expected}, а у вас {actual}.')
  files: []
  wrong:
    - code: |
        def box_iou(a, b):
            ix = max(0, min(a[2], b[2]) - max(a[0], b[0]))
            iy = max(0, min(a[3], b[3]) - max(a[1], b[1]))
            inter = ix * iy
            area_a = (a[2] - a[0]) * (a[3] - a[1])
            area_b = (b[2] - b[0]) * (b[3] - b[1])
            return float(inter / (area_a + area_b))
        iou_scheme = box_iou((20, 10, 60, 50), (30, 20, 80, 60))
        iou_shift = box_iou(true_box, (17, 15, 45, 39))
      expect: Одинаковые рамки
    - code: |
        def box_iou(a, b):
            ix = min(a[2], b[2]) - max(a[0], b[0])
            iy = min(a[3], b[3]) - max(a[1], b[1])
            inter = ix * iy
            area_a = (a[2] - a[0]) * (a[3] - a[1])
            area_b = (b[2] - b[0]) * (b[3] - b[1])
            return float(inter / (area_a + area_b - inter))
        iou_scheme = box_iou((20, 10, 60, 50), (30, 20, 80, 60))
        iou_shift = box_iou(true_box, (17, 15, 45, 39))
      expect: Непересекающиеся рамки

- id: m12-l2-t2
  title: Верные находки, ложные тревоги и пропуски
  difficulty: main
  introduces: []
  uses: [object-detection]
  statement: |
    Напишите функцию `match_counts(dets, truths, thr=0.5)`: `dets` — найденные рамки `(рамка, уверенность)`, `truths` — настоящие рамки. Функция возвращает кортеж `(tp, fp, fn)`:

    - найденные рамки перебираются от самой уверенной к наименее уверенной;
    - рамка — верная находка (`tp`), если её IoU с ещё не «пойманной» настоящей рамкой не меньше `thr`. Берётся та настоящая рамка, с которой IoU наибольший, и она считается пойманной;
    - иначе рамка — ложная тревога (`fp`);
    - `fn` — настоящие рамки, которые никто не поймал.

    Функция `box_iou` уже есть. Получите `counts` для ответа детектора `detections` с порогом уверенности 0,5 (рамки с меньшей уверенностью не учитываются) и `counts_strict` — то же при пороге IoU 0,8.
  prelude: |
    def box_iou(a, b):
        ix = max(0, min(a[2], b[2]) - max(a[0], b[0]))
        iy = max(0, min(a[3], b[3]) - max(a[1], b[1]))
        inter = ix * iy
        return inter / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter)

    true_boxes = [(12, 10, 40, 34), (70, 45, 110, 70)]
    detections = [((14, 12, 41, 36), 0.94), ((12, 9, 39, 33), 0.81), ((72, 47, 108, 71), 0.88),
                  ((74, 14, 84, 23), 0.55), ((40, 60, 52, 72), 0.20)]
  starter: |
    def match_counts(dets, truths, thr=0.5):
        caught = set()
        tp = fp = 0
        for box, score in sorted(dets, key=lambda d: -d[1]):
            options = [(box_iou(box, t), i) for i, t in enumerate(truths) if i not in caught]
            best_iou, best_i = max(options, default=(0, None))
            if ...:
                caught.add(best_i)
                tp += 1
            else:
                fp += 1
        return tp, fp, ...

    confident = [d for d in detections if d[1] >= 0.5]
    counts = match_counts(confident, true_boxes)
    counts_strict = match_counts(confident, true_boxes, thr=0.8)
    print(counts, counts_strict)
  solution: |
    def match_counts(dets, truths, thr=0.5):
        caught = set()
        tp = fp = 0
        for box, score in sorted(dets, key=lambda d: -d[1]):
            options = [(box_iou(box, t), i) for i, t in enumerate(truths) if i not in caught]
            best_iou, best_i = max(options, default=(0, None))
            if best_iou >= thr:
                caught.add(best_i)
                tp += 1
            else:
                fp += 1
        return tp, fp, len(truths) - len(caught)

    confident = [d for d in detections if d[1] >= 0.5]
    counts = match_counts(confident, true_boxes)
    counts_strict = match_counts(confident, true_boxes, thr=0.8)
    print(counts, counts_strict)
  explanation: |
    - Перебор от самой уверенной рамки решает, кому достанется объект при повторах: его «ловит» уверенная рамка, а остальные становятся ложными тревогами.
    - `max(options, default=(0, None))` — лучший IoU среди ещё не пойманных объектов. Если все пойманы, список пуст, и `default` даёт 0 — ложная тревога.
    - При пороге IoU 0,5: 2 находки, 2 ложные тревоги (повтор и тёмное пятно), 0 пропусков. При строгом пороге 0,8 не дотягивают и самая уверенная рамка (IoU 0,76), и рамка второго объекта (0,799). Первый объект «ловит» менее уверенная, но более точная рамка (0,89). Итог — 1 находка, 3 ложные тревоги и 1 пропуск: строгий порог проверяет, насколько точно рамки повторяют контур объекта.
  hints:
    - "Находка — `best_iou >= thr`."
    - "Пропуски — настоящие рамки, которых нет в `caught`: `len(truths) - len(caught)`."
    - "Порог уверенности применён заранее — в `confident`."
  tests: |
    f = var('match_counts')
    ensure(callable(f), '`match_counts` должна быть функцией.')
    truths = [(0, 0, 10, 10), (20, 20, 30, 30)]
    equal(f([((0, 0, 10, 10), 0.9)], truths), (1, 0, 1), 'Одна точная рамка из двух объектов: (tp, fp, fn) = {expected}, а у вас {actual}.')
    dup = [((1, 1, 11, 11), 0.7), ((0, 0, 10, 10), 0.9)]
    got = f(dup, truths)
    if got[0] == 2:
        fail('Один объект «поймали» две рамки: каждая настоящая рамка засчитывается только один раз — повтор становится ложной тревогой.')
    equal(got, (1, 1, 1), 'Две рамки на один объект: (tp, fp, fn) = {expected}, а у вас {actual}.')
    equal(f([((50, 50, 60, 60), 0.9)], truths), (0, 1, 2), 'Рамка мимо объектов — ложная тревога, оба объекта пропущены.')
    equal(f([], truths), (0, 0, 2), 'Без рамок — оба объекта пропущены.')
    equal(f([((0, 0, 10, 14), 0.9)], truths, thr=0.8), (0, 1, 2), 'С порогом IoU 0.8 рамка с IoU 0.71 не засчитывается.')
    equal(var('counts', tuple, 'кортежем'), ref('counts'), 'Итог для ответа детектора — {expected}, а у вас {actual}.')
    equal(var('counts_strict', tuple, 'кортежем'), ref('counts_strict'), 'Итог при пороге IoU 0.8 — {expected}, а у вас {actual}.')
  files: []
  wrong:
    - code: |
        def match_counts(dets, truths, thr=0.5):
            tp = fp = 0
            for box, score in dets:
                if max(box_iou(box, t) for t in truths) >= thr:
                    tp += 1
                else:
                    fp += 1
            return tp, fp, max(len(truths) - tp, 0)
        confident = [d for d in detections if d[1] >= 0.5]
        counts = match_counts(confident, true_boxes)
        counts_strict = match_counts(confident, true_boxes, thr=0.8)
      expect: только один раз
    - code: |
        def match_counts(dets, truths, thr=0.5):
            caught = set()
            tp = fp = 0
            for box, score in sorted(dets, key=lambda d: -d[1]):
                options = [(box_iou(box, t), i) for i, t in enumerate(truths) if i not in caught]
                best_iou, best_i = max(options, default=(0, None))
                if best_iou >= thr:
                    caught.add(best_i)
                    tp += 1
                else:
                    fp += 1
            return tp, fp, 0
        confident = [d for d in detections if d[1] >= 0.5]
        counts = match_counts(confident, true_boxes)
        counts_strict = match_counts(confident, true_boxes, thr=0.8)
      expect: Одна точная рамка

- id: m12-l2-t3
  title: Подавление повторов внутри класса
  difficulty: main
  introduces: []
  uses: [object-detection]
  statement: |
    Детектор находит объекты разных классов, и рамки разных классов могут законно пересекаться: велосипедист — это рамка «человек» поверх рамки «велосипед». Повторы убирают только **внутри класса**. Напишите функцию `nms_by_class(dets, thr=0.5)`: `dets` — список `(рамка, уверенность, класс)`. Функция возвращает оставленные рамки в порядке убывания уверенности: рамка остаётся, если её IoU с каждой уже оставленной рамкой **того же класса** меньше `thr`.

    Получите `kept` для ответа детектора `street`.
  prelude: |
    def box_iou(a, b):
        ix = max(0, min(a[2], b[2]) - max(a[0], b[0]))
        iy = max(0, min(a[3], b[3]) - max(a[1], b[1]))
        inter = ix * iy
        return inter / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter)

    street = [((40, 30, 72, 88), 0.92, 'человек'), ((36, 45, 80, 92), 0.88, 'велосипед'),
              ((42, 32, 74, 86), 0.71, 'человек'), ((120, 30, 140, 60), 0.66, 'человек'),
              ((37, 46, 79, 90), 0.40, 'велосипед')]
  starter: |
    def nms_by_class(dets, thr=0.5):
        kept = []
        for box, score, cls in sorted(dets, key=lambda d: -d[1]):
            same = [k for k in kept if ...]
            if all(box_iou(box, k[0]) < thr for k in same):
                kept.append((box, score, cls))
        return kept

    kept = nms_by_class(street)
    for k in kept:
        print(k)
  solution: |
    def nms_by_class(dets, thr=0.5):
        kept = []
        for box, score, cls in sorted(dets, key=lambda d: -d[1]):
            same = [k for k in kept if k[2] == cls]
            if all(box_iou(box, k[0]) < thr for k in same):
                kept.append((box, score, cls))
        return kept

    kept = nms_by_class(street)
    for k in kept:
        print(k)
  explanation: |
    - Рамки перебираются от самой уверенной, и каждая сравнивается только с уже оставленными рамками своего класса: `k[2] == cls`.
    - Человек и велосипед пересекаются сильно, но оба остались — это разные объекты. Повтор человека (0,71) и повтор велосипеда (0,40) убраны. Второй человек справа не пересекается с первым и остался.
    - Общее подавление без учёта класса убрало бы велосипед: его рамка пересекается с более уверенной рамкой человека с IoU 0,54. Велосипедист превратился бы в «просто человека».
  hints:
    - "Рамки того же класса — `[k for k in kept if k[2] == cls]`."
    - "`all([])` — `True`: первая рамка класса всегда остаётся."
    - "Порядок результата — по убыванию уверенности: он получится сам, если перебирать отсортированный список."
  tests: |
    f = var('nms_by_class')
    ensure(callable(f), '`nms_by_class` должна быть функцией.')
    dets = [((0, 0, 10, 10), 0.6, 'a'), ((0, 0, 10, 10), 0.9, 'b'), ((1, 1, 11, 11), 0.8, 'a')]
    got = f(dets)
    if len(got) == 1:
        fail('Рамки разных классов подавлять нельзя: «a» и «b» на одном месте — разные объекты.')
    equal(got, [((0, 0, 10, 10), 0.9, 'b'), ((1, 1, 11, 11), 0.8, 'a')], 'Ожидалось {expected}, а у вас {actual}: внутри класса «a» остаётся более уверенная рамка, порядок — по убыванию уверенности.')
    far = [((0, 0, 10, 10), 0.5, 'a'), ((50, 50, 60, 60), 0.7, 'a')]
    equal(f(far), [((50, 50, 60, 60), 0.7, 'a'), ((0, 0, 10, 10), 0.5, 'a')], 'Далёкие рамки одного класса обе остаются, по убыванию уверенности.')
    equal(f([]), [], 'Пустой список — пустой результат.')
    equal(var('kept', list, 'списком'), ref('kept'), 'Оставленные рамки — {expected}, а у вас {actual}.')
  files: []
  wrong:
    - code: |
        def nms_by_class(dets, thr=0.5):
            kept = []
            for box, score, cls in sorted(dets, key=lambda d: -d[1]):
                if all(box_iou(box, k[0]) < thr for k in kept):
                    kept.append((box, score, cls))
            return kept
        kept = nms_by_class(street)
      expect: разных классов
    - code: |
        def nms_by_class(dets, thr=0.5):
            kept = []
            for box, score, cls in dets:
                same = [k for k in kept if k[2] == cls]
                if all(box_iou(box, k[0]) < thr for k in same):
                    kept.append((box, score, cls))
            return kept
        kept = nms_by_class(street)
      expect: более уверенная

- id: m12-l2-t4
  title: Убрать мелкие пятна из маски
  difficulty: main
  introduces: [image-segmentation]
  uses: [bool-mask]
  statement: |
    Маска «много красного» содержит мелкие пятна, которые не объекты. Напишите функцию `remove_small(mask, min_area)`: номера связных пятен даёт `ndimage.label(mask)`, площадь пятна — число его пикселей; пятна меньше `min_area` из маски убираются. Функция возвращает новую логическую маску.

    Напишите и `mask_iou(pred, true)`: пересечение, делённое на объединение; если обе маски пустые, IoU равен 1. Получите `iou_before` и `iou_after` — IoU маски `red` с настоящей `true_mask` до и после удаления пятен меньше 100 пикселей.
