- id: m12-l2-t5
  title: Почему диффузия идёт маленькими шагами
  difficulty: star
  introduces: [image-generation]
  uses: [digital-image]
  statement: |
    Зашумлённая картинка шага `t` — `x_t = sqrt(1 − t)·x0 + sqrt(t)·eps`. Если сеть предсказала шум `eps_hat`, картинку восстанавливают так: `x0_hat = (x_t − sqrt(t)·eps_hat) / sqrt(1 − t)`.

    1. Напишите функции `add_noise(x0, t, eps)` и `restore(xt, t, eps_hat)` по этим формулам.
    2. Пусть сеть ошибается в шуме на небольшую величину: `eps_hat = eps + err`, где `err` — случайная ошибка с разбросом 0,1 (уже есть). Для `t` из списка `ts` получите `restore_rmse` — список среднеквадратичных отклонений `x0_hat` от `x0` (корень из среднего квадрата разности).

    Посмотрите, как растёт ошибка восстановления при больших `t`.
  prelude: |
    import numpy as np
    with np.load('zs_thumbs.npz') as data:
        stop = data['images'][[str(x) for x in data['ids']].index('778.jpg')]
    x0 = stop / 127.5 - 1
    rng = np.random.default_rng(0)
    eps = rng.normal(size=x0.shape)
    err = rng.normal(scale=0.1, size=x0.shape)        # ошибка сети в предсказании шума
    ts = [0.1, 0.5, 0.9, 0.99]
  starter: |
    def add_noise(x0, t, eps):
        return ...

    def restore(xt, t, eps_hat):
        return ...

    restore_rmse = []
    for t in ts:
        xt = add_noise(x0, t, eps)
        x0_hat = restore(xt, t, eps + err)
        restore_rmse.append(float(np.sqrt(((x0_hat - x0) ** 2).mean())))
    print([round(v, 3) for v in restore_rmse])
  solution: |
    def add_noise(x0, t, eps):
        return np.sqrt(1 - t) * x0 + np.sqrt(t) * eps

    def restore(xt, t, eps_hat):
        return (xt - np.sqrt(t) * eps_hat) / np.sqrt(1 - t)

    restore_rmse = []
    for t in ts:
        xt = add_noise(x0, t, eps)
        x0_hat = restore(xt, t, eps + err)
        restore_rmse.append(float(np.sqrt(((x0_hat - x0) ** 2).mean())))
    print([round(v, 3) for v in restore_rmse])
  explanation: |
    - Подставим: `x0_hat − x0 = −sqrt(t) / sqrt(1 − t) · err`. Ошибка в шуме умножается на `sqrt(t / (1 − t))`: при t = 0,1 — на 0,33, при t = 0,9 — уже на 3, при t = 0,99 — на 10.
    - Поэтому сразу из почти чистого шума картинку не восстановить: крошечная ошибка сети превращается в огромную ошибку картинки. Диффузионная модель делает много маленьких шагов: на каждом убирает немного шума и снова спрашивает сеть, уже по более чистой картинке.
    - Если сеть угадала шум точно (`err = 0`), `restore` возвращает исходную картинку при любом t < 1 — как в уроке.
  hints:
    - "Зашумление — `np.sqrt(1 - t) * x0 + np.sqrt(t) * eps`."
    - "Восстановление — `(xt - np.sqrt(t) * eps_hat) / np.sqrt(1 - t)`."
    - "Ожидаемая ошибка — примерно `0.1 · sqrt(t / (1 − t))`: проверьте себя для t = 0,9."
  tests: |
    import numpy as np
    an = var('add_noise')
    rs = var('restore')
    ensure(callable(an) and callable(rs), '`add_noise` и `restore` должны быть функциями.')
    x = np.array([1.0, -1.0, 0.5])
    e = np.array([0.0, 2.0, -1.0])
    same_array(np.asarray(an(x, 0.0, e)), x, 'При t = 0 зашумлённая картинка — сама картинка.')
    same_array(np.asarray(an(x, 1.0, e)), e, 'При t = 1 — чистый шум.')
    same_array(np.asarray(an(x, 0.36, e)), 0.8 * x + 0.6 * e, 'При t = 0.36: sqrt(0.64)·x0 + sqrt(0.36)·eps.')
    same_array(np.asarray(rs(an(x, 0.36, e), 0.36, e)), x, 'Если шум угадан точно, restore должна вернуть исходную картинку.')
    rr = var('restore_rmse', list, 'списком')
    equal(len(rr), 4, 'Нужно по одному отклонению на каждое t из ts.')
    for t, got, want in zip([0.1, 0.5, 0.9, 0.99], rr, ref('restore_rmse')):
        close(got, want, 'Ошибка восстановления при t = {0} — {{expected}}, а у вас {{actual}}.'.format(t))
    ensure(rr[-1] > 5 * rr[1], 'Ошибка при t = 0.99 должна быть во много раз больше, чем при t = 0.5.')
