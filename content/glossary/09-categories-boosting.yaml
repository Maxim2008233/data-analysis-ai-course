# Справочник: категориальные признаки, регуляризация и градиентный бустинг (модуль 7).
- id: categorical-encoding
  term: Кодирование категорий
  category: Признаки
  aliases: [categorical encoding, кодирование признаков, текстовые признаки, номинальный признак, порядковый признак]
  summary: "Перевод текстовых значений (марка, кузов, топливо) в числа, понятные модели. Номинальные категории не имеют порядка (марки), порядковые — имеют (размер: S < M < L). Способ выбирают под модель: бинарный 0/1, порядковые коды, One-Hot, Target Encoding. Кодировщик учится только на обучающей части."
- id: binary-encoding
  term: Бинарный признак
  category: Признаки
  aliases: [бинарное кодирование, индикатор, 0/1, True/False, dummy]
  summary: "Признак с двумя значениями, записанный одним столбцом 0/1. Коэффициент линейной модели при нём — разница прогнозов двух групп при остальных равных признаках."
  syntax: |
    X['AutoTransmission'] = X['AutoTransmission'].map({True: 1, False: 0})
- id: ordinal-encoding
  term: Порядковое кодирование (OrdinalEncoder)
  category: Признаки
  aliases: [OrdinalEncoder, целочисленное кодирование, label encoding, коды категорий, handle_unknown, unknown_value]
  summary: "Каждой категории присваивается целый номер; словарь строится по обучающей части. Неизвестные категории — заранее выбранный код (`unknown_value=-1`). Порядок номеров случаен, поэтому способ хорош для деревьев (они разбивают по порогам) и плох для линейной модели (она умножает номер на коэффициент)."
  syntax: |
    OrdinalEncoder(handle_unknown='use_encoded_value', unknown_value=-1)
- id: column-transformer
  term: ColumnTransformer
  category: Scikit-learn
  aliases: [ColumnTransformer, remainder, passthrough, get_feature_names_out, подготовка по колонкам]
  summary: "Применяет разные преобразования к разным колонкам таблицы и склеивает результат: кодировщик — к текстовым, StandardScaler — к числовым. `remainder='passthrough'` пропускает остальные колонки без изменений. Обычно стоит первым шагом Pipeline."
  syntax: |
    ColumnTransformer([('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols),
                       ('num', StandardScaler(), num_cols)])
- id: infrequent-categories
  term: Редкие категории в кодировщике
  category: Признаки
  aliases: [min_frequency, max_categories, infrequent, объединение редких категорий]
  summary: "Категории, доля которых в обучающей части меньше `min_frequency`, кодировщик объединяет в одну группу «редкие». Признак становится компактнее и устойчивее, но слишком высокий порог сливает непохожие категории."
  syntax: |
    OrdinalEncoder(handle_unknown='use_encoded_value', unknown_value=-1, min_frequency=0.001)
- id: feature-selection
  term: Отбор признаков
  category: Машинное обучение
  aliases: [сокращение набора признаков, feature selection, удаление признаков]
  summary: "Удаление признаков, которые почти не помогают модели: по важности, по Lasso или перебором. Решение принимают по validation или кросс-валидации с заранее заданным допуском; меньше признаков — проще и быстрее модель, но точность может немного снизиться."
- id: one-hot-encoding
  term: One-Hot Encoding
  category: Признаки
  aliases: [OHE, OneHotEncoder, get_dummies, индикаторы, dummy-переменные, разреженная матрица, sparse]
  summary: "Для каждой категории — отдельный столбец 0/1. Линейная модель получает свой коэффициент для каждой категории. Число столбцов растёт до числа категорий (725 моделей — 725 столбцов), поэтому результат хранят разреженной матрицей. `handle_unknown='ignore'`: неизвестная категория получает все нули."
  syntax: |
    OneHotEncoder(handle_unknown='ignore')
    pd.get_dummies(df, columns=['Make'], dtype=int)
- id: target-encoding
  term: Target Encoding
  category: Признаки
  aliases: [TargetEncoder, mean encoding, кодирование средним ответом, сглаживание, smoothing]
  summary: "Категория заменяется средним значением ответа в этой категории (сглаженным к общему среднему для редких). Средние считают только по обучающей части, а для её строк — по другим блокам (кросс-фиттинг), чтобы цена машины не попадала в её же признак. Средние по всем данным — утечка."
  syntax: |
    TargetEncoder(target_type='continuous', cv=5, random_state=42)
- id: regularization
  term: Регуляризация
  category: Машинное обучение
  aliases: [штраф, penalty, alpha, λ, сжатие коэффициентов]
  summary: "Добавка к функции потерь, которая наказывает модель за большие коэффициенты. Делает модель устойчивее к шуму и к признакам с малым числом наблюдений (редким категориям). Сила штрафа (α) — гиперпараметр; признаки перед регуляризацией масштабируют, иначе штраф зависит от единиц измерения."
- id: ridge
  term: Ridge (L2-регуляризация)
  category: Модели
  aliases: [Ridge, гребневая регрессия, регрессия Тихонова, L2]
  summary: "Линейная регрессия со штрафом α·Σwⱼ²: минимизирует сумму квадратов ошибок плюс сумму квадратов коэффициентов. Сжимает коэффициенты к нулю, но не обнуляет их; свободный член не штрафуется. При α = 0 — обычная линейная регрессия."
  syntax: |
    Ridge(alpha=1.0)
- id: lasso
  term: Lasso (L1-регуляризация)
  category: Модели
  aliases: [Lasso, L1, ElasticNet, эластичная сеть]
  summary: "Линейная регрессия со штрафом α·Σ|wⱼ|. В отличие от Ridge обнуляет часть коэффициентов — отбирает признаки. ElasticNet сочетает оба штрафа."
  syntax: |
    Lasso(alpha=0.001, max_iter=5000)
- id: gradient-boosting
  term: Градиентный бустинг
  category: Модели
  aliases: [boosting, бустинг, GradientBoostingRegressor, HistGradientBoostingRegressor, остатки]
  summary: "Ансамбль, в котором деревья строятся последовательно: каждое новое дерево предсказывает остатки (ошибки) суммы предыдущих, его прогноз добавляется с множителем learning_rate. Обычно самая точная модель для табличных данных; гиперпараметры — число деревьев, шаг, глубина."
  syntax: |
    GradientBoostingRegressor(n_estimators=200, max_depth=3, learning_rate=0.1, random_state=42)
- id: lightgbm
  term: LightGBM, XGBoost, CatBoost
  category: Модели
  aliases: [LightGBM, LGBMRegressor, XGBoost, CatBoost, библиотеки бустинга]
  summary: "Быстрые библиотеки градиентного бустинга. LightGBM и CatBoost умеют работать с категориальными признаками напрямую (тип category в pandas), CatBoost особенно хорош с категориями. В браузере курса доступны LightGBM и XGBoost; интерфейс — привычные fit и predict."
  syntax: |
    LGBMRegressor(random_state=42, verbosity=-1, n_jobs=1)
- id: learning-rate
  term: Скорость обучения бустинга
  category: Модели
  aliases: [learning_rate, shrinkage, n_estimators, шаг бустинга]
  summary: "Множитель, с которым прогноз каждого нового дерева добавляется к сумме. Малый шаг (0,05) требует больше деревьев, но обычно даёт более точную и устойчивую модель; большой — быстрее, но легче переобучается."
- id: metric-variability
  term: Разброс метрики по разбиениям
  category: Машинное обучение
  aliases: [устойчивость сравнения, повторные разбиения, парное сравнение]
  summary: "Одна и та же модель даёт разную MAE на разных проверочных частях. Сравнивая две модели, их проверяют на одних и тех же многих разбиениях и считают, как часто и на сколько одна лучше другой, — так видно, устойчиво ли преимущество."
- id: error-distribution
  term: Распределение ошибок
  category: Метрики
  aliases: [боксплот ошибок, остатки, Q–Q-график, абсолютные ошибки по записям]
  summary: "Ошибки отдельных объектов: их боксплот показывает типичную ошибку (медиану) и разброс, а Q–Q-график остатков — похожи ли они на нормальное распределение и насколько тяжёлые хвосты. Две модели с близкой MAE могут ошибаться очень по-разному."
