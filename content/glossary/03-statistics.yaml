- id: observation
  term: Наблюдение (объект, запись)
  category: Статистика
  aliases: [строка, запись, объект, наблюдение]
  summary: Одна единица, которую мы изучаем. В нашей таблице — одно объявление о продаже автомобиля; в таблице это одна строка. До расчётов важно уточнить, что именно является наблюдением (объявление, автомобиль или сделка).
- id: feature
  term: Признак (столбец, переменная)
  category: Статистика
  aliases: [столбец, переменная, характеристика, feature]
  summary: Характеристика наблюдения — год, пробег, цена. В таблице это столбец. Значения признака для всех строк — вектор признака. Признаки бывают числовыми (пробег) и категориальными (марка).
- id: statistic
  term: Статистика (число по данным)
  category: Статистика
  aliases: [описательная статистика]
  summary: Число, вычисленное по множеству наблюдений, — среднее, медиана, доля, стандартное отклонение. Всегда указывайте, по каким и скольким записям оно посчитано.
- id: iqr
  term: IQR (межквартильный размах)
  category: Статистика
  aliases: [межквартильный размах, Q1, Q3, квартили]
  summary: "IQR = Q3 − Q1 — ширина интервала, в который попадает центральная половина значений. Устойчив к выбросам, в отличие от размаха `max − min`. Правило «1.5 IQR» помечает значения ниже Q1 − 1.5·IQR и выше Q3 + 1.5·IQR как кандидатов на проверку."
- id: outlier
  term: Выброс (крайнее значение)
  category: Статистика
  aliases: [аномалия, крайнее значение]
  summary: Значение, сильно отличающееся от остальных. Это может быть ошибка записи, а может быть редкий реальный объект — сначала проверяют, потом решают, что делать. Удалять молча нельзя.
- id: distribution
  term: Распределение
  category: Статистика
  aliases: [распределение значений]
  summary: Как часто встречаются разные значения признака. Описывается частотами по интервалам, квантилями, средним и разбросом; изображается гистограммой.
- id: group-comparison
  term: Сравнение групп
  category: Статистика
  aliases: [группы, сравнение, причинность]
  summary: Разделение записей на группы (например, по году выпуска) и сравнение их статистик. Сначала размер групп, затем медианы и квантили. Разница групп показывает связь в данных, но не доказывает причину — группы могут отличаться и по другим признакам.
- id: sampling-variability
  term: Выборочная изменчивость
  category: Статистика
  aliases: [выборка, случайная выборка, изменчивость]
  summary: Статистика, посчитанная по случайно выбранной части записей, меняется от выборки к выборке. Чем больше выборка, тем обычно стабильнее оценка, но систематические ошибки источника это не исправляет.
