# Справочник: нейронные сети уровня fit/predict (модуль 8).
- id: artificial-neuron
  term: Искусственный нейрон
  category: Нейронные сети
  aliases: [нейрон, перцептрон, персептрон, взвешенная сумма, смещение, bias, матричное умножение, "@"]
  summary: "Модель Маккаллока и Питтса (1943): нейрон складывает входы с весами, прибавляет смещение и применяет функцию активации: a = f(x·w + b). Для всей таблицы сразу — матричное умножение `X @ w`: каждая строка X умножается на вектор весов. С тождественной активацией нейрон совпадает с линейной регрессией."
  syntax: |
    z = X @ w + b              # взвешенная сумма для каждой строки
    a = np.maximum(z, 0)       # активация ReLU
- id: activation-function
  term: Функция активации
  category: Нейронные сети
  aliases: [ReLU, сигмоида, sigmoid, tanh, гиперболический тангенс, ступенчатая функция, Хевисайд, identity, нелинейность]
  summary: "Нелинейная функция, которую нейрон применяет к взвешенной сумме. ReLU = max(0, z) — «выключает» нейрон при отрицательной сумме; сигмоида 1 / (1 + e^−z) — значения от 0 до 1 (вероятность); tanh — от −1 до 1; ступенька — 0 или 1 (её производная почти везде 0, поэтому градиентом её не обучить). Без нелинейной активации многослойная сеть сводится к одной линейной модели."
  syntax: |
    MLPRegressor(activation='relu')      # 'identity', 'logistic', 'tanh', 'relu'
- id: mlp
  term: Многослойный персептрон (MLP)
  category: Нейронные сети
  aliases: [MLPRegressor, MLPClassifier, полносвязная сеть, fully connected, нейронная сеть, нейросеть, Dense]
  summary: "Сеть из полносвязных слоёв: каждый нейрон слоя получает все выходы предыдущего. Прямой проход: H₁ = f(X @ W₁ + b₁), H₂ = f(H₁ @ W₂ + b₂), …, выход — без активации (регрессия) или с сигмоидой (классификация). В scikit-learn — `MLPRegressor` и `MLPClassifier`; признаки нужно масштабировать."
  syntax: |
    net = MLPRegressor(hidden_layer_sizes=(16, 8), activation='relu',
                       batch_size=256, max_iter=30, random_state=42)
    net.fit(X_train_s, y_train / 10000)
- id: hidden-layer
  term: Скрытый слой
  category: Нейронные сети
  aliases: [hidden_layer_sizes, ширина слоя, глубина сети, coefs_, intercepts_, число параметров]
  summary: "Слой между входом и выходом. `hidden_layer_sizes=(16, 8)` — два скрытых слоя по 16 и 8 нейронов. Веса слоя — матрица «входы × нейроны» (`net.coefs_`), смещения — по одному на нейрон (`net.intercepts_`). У сети 4 → 16 → 8 → 1: 4·16 + 16 + 16·8 + 8 + 8·1 + 1 = 225 параметров."
- id: backpropagation
  term: Обратное распространение ошибки
  category: Нейронные сети
  aliases: [backpropagation, backprop, правило цепочки, chain rule, градиент сети]
  summary: "Способ посчитать градиенты потерь по всем весам сети. Сначала прямой проход до прогноза и потерь, затем от выхода к входу: ошибка выхода → градиент весов последнего слоя → «ошибка» предыдущего слоя (умножением на транспонированные веса и производную активации) → его градиенты… После этого градиентный спуск обновляет все веса."
- id: epoch-batch
  term: Эпоха и мини-батч
  category: Нейронные сети
  aliases: [epoch, batch, batch_size, max_iter, partial_fit, ConvergenceWarning, adam, learning_rate_init]
  summary: "Мини-батч — порция строк для одного шага градиентного спуска; эпоха — один проход по всему train (при 19 239 строках и `batch_size=256` — 76 шагов). `max_iter` в MLP — наибольшее число эпох, `partial_fit` — одна эпоха. Предупреждение ConvergenceWarning: эпохи закончились, а потери ещё падали. `solver='adam'` — градиентный спуск с подстройкой шага, `learning_rate_init` — начальный шаг."
- id: loss-choice
  term: Выбор функции потерь
  category: Нейронные сети
  aliases: [MSE или MAE, функция потерь сети, лосс, absolute error, squared error]
  summary: "Функция потерь решает, какие ошибки сеть исправляет в первую очередь. Градиент MSE пропорционален ошибке: промах на 30 000 тянет веса в 30 раз сильнее, чем промах на 1 000, — сеть старается для дорогих машин. Градиент MAE — только знак ошибки: сеть тянется к медиане цены похожих машин. `MLPRegressor` умеет только MSE (и пуассоновскую потерю), MAE — в своей сети на NumPy."
- id: early-stopping
  term: Ранняя остановка
  category: Нейронные сети
  aliases: [early stopping, patience, restore best weights, n_iter_no_change, validation_fraction]
  summary: "После каждой эпохи считают ошибку на validation; если она не улучшилась `patience` эпох подряд, обучение останавливают и возвращают веса лучшей эпохи. Это защита от переобучения: на train ошибка падает всё время, а на validation начинает расти. В scikit-learn — `early_stopping=True`, `validation_fraction=0.1`, `n_iter_no_change=10`."
  syntax: |
    MLPRegressor(early_stopping=True, validation_fraction=0.1, n_iter_no_change=20)
- id: error-contribution
  term: Вклад группы в изменение ошибки
  category: Машинное обучение
  aliases: [вклад группы, разложение MAE, декомпозиция ошибки]
  summary: "Общая MAE — среднее по всем записям, поэтому её изменение раскладывается по группам: вклад группы = доля группы × изменение MAE внутри группы, сумма вкладов — изменение общей MAE. Помогает понять, на каких объектах модель выиграла."
- id: binary-classification
  term: Бинарная классификация
  category: Машинное обучение
  aliases: [классификация, классы 0 и 1, predict_proba, порог, threshold, MLPClassifier]
  summary: "Задача, где ответ — один из двух классов. Модель выдаёт вероятность класса 1: у логистической регрессии и сети — через сигмоиду на выходе (`predict_proba`). Класс — по порогу: вероятность ≥ 0,5 → 1 (`predict`). Функция потерь — log loss (бинарная кросс-энтропия)."
  syntax: |
    clf = MLPClassifier(hidden_layer_sizes=(16, 8), random_state=42).fit(X_train, y_train)
    proba = clf.predict_proba(X_valid)[:, 1]   # вероятность класса 1
    pred = clf.predict(X_valid)                # класс по порогу 0,5
- id: accuracy
  term: Доля верных ответов (accuracy)
  category: Машинное обучение
  aliases: [accuracy, точность классификации, accuracy_score, доля ошибок]
  summary: "Доля объектов, для которых предсказанный класс совпал с настоящим: `(pred == y).mean()` или `accuracy_score(y, pred)`. Доля ошибок = 1 − accuracy. Наглядна, когда классы примерно равны по размеру; при редком классе обманчива."
- id: decision-boundary
  term: Граница решений
  category: Машинное обучение
  aliases: [decision boundary, разделяющая граница, разделяющая поверхность]
  summary: "Место на плоскости признаков, где модель меняет ответ. Её рисуют, предсказывая класс для сетки точек. У логистической регрессии и сети без нелинейной активации граница — прямая; у сети с ReLU — ломаная кривая; у дерева — ступеньки вдоль осей; у kNN с маленьким k — извилистая, подстроенная под отдельные точки."
