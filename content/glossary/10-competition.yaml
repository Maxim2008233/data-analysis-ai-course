# Справочник: практикум-соревнование 1 «Оценка цены автомобиля».
- id: pd-str-extract
  term: Строковые методы pandas (.str)
  category: Pandas
  aliases: [str.extract, str.contains, str.replace, регулярное выражение, regex, число из строки]
  summary: "Методы `.str` применяют строковую операцию ко всей колонке сразу. `str.contains('Turbo')` — есть ли подстрока (True/False). `str.extract(r'(\\d+\\.?\\d*)')` достаёт первую часть строки, подходящую под шаблон в скобках: `\\d+` — одна или больше цифр, `\\.?` — необязательная точка. Результат — таблица, первая колонка `[0]`; затем `.astype(float)`. Пропуски остаются пропусками."
  syntax: |
    df['Turbo'] = df['Engine'].astype(str).str.contains('Turbo').astype(int)
    df['Engine'] = df['Engine'].astype(str).str.extract(r'(\d+\.?\d*)')[0].astype(float)
    df['Distance'] = df['Distance'].str.extract(r'(\d+)')[0].astype(float)   # '192000 km' → 192000.0
  lessons: [c1-l2]
- id: hidden-test
  term: Скрытая проверочная часть
  category: Машинное обучение
  aliases: [hidden test, private test, скрытые ответы, проверка на сервере]
  summary: "Объекты, для которых участник видит признаки, но не ответы. Ответы хранятся только на сервере: участник отправляет прогнозы, сервер считает метрику. Так устроены соревнования (Kaggle): модель оценивают на данных, которых при обучении не было, а подсмотреть ответы нельзя."
  lessons: [c1-l1, c1-l3]
- id: submission-file
  term: Файл прогнозов (submission)
  category: Машинное обучение
  aliases: [submission, submit.csv, сабмит, отправка прогнозов]
  summary: "Таблица «ID объекта → прогноз», которую отправляют на проверку. Строка нужна для каждого объекта проверочной части, без пропусков и повторов. Типичная ошибка — `dropna()` на проверочной таблице: машины с пропусками в признаках исчезают и остаются без прогноза. Пропуски в признаках заполняют, строки не удаляют."
  syntax: |
    submission = pd.DataFrame({'ID': test['ID'], 'Predict': model.predict(X_test)})
  lessons: [c1-l2, c1-l3]
- id: leaderboard
  term: Таблица лидеров
  category: Машинное обучение
  aliases: [leaderboard, лидерборд, рейтинг участников, переобучение на таблице лидеров]
  summary: "Рейтинг участников по метрике на скрытой части. Каждая отправка — это проверка на test, поэтому выбирать модель «по таблице лидеров» — тот же выбор по test: результат становится оптимистичнее, чем будет на новых данных. Идеи проверяют на своей validation, а отправляют законченные решения; лимит отправок защищает от подгонки."
  lessons: [c1-l1, c1-l3]
