# Справочник: сравнение моделей и итоговая проверка (модуль 6).
- id: pipeline
  term: Pipeline (конвейер)
  category: Scikit-learn
  aliases: [pipeline, make_pipeline, named_steps, конвейер, последовательность шагов]
  summary: "Объект scikit-learn, который хранит шаги подготовки и модель как одно целое. `fit` по очереди обучает каждый шаг на обучающих данных и передаёт результат дальше; `predict` применяет те же преобразования к новым строкам и вызывает модель. Нельзя забыть `transform` для новых данных, а в кросс-валидации подготовка заново учится на каждом блоке — без утечки."
  syntax: |
    pipe = Pipeline([('scale', StandardScaler()), ('model', LinearRegression())])
    pipe.fit(X_train, y_train)
    pipe.predict(X_valid)
    pipe.named_steps['scale'].mean_
- id: knn
  term: Метод k ближайших соседей (kNN)
  category: Модели
  aliases: [kNN, k-NN, KNeighborsRegressor, ближайшие соседи, n_neighbors, kneighbors]
  summary: "Для нового объекта находит k ближайших обучающих объектов по признакам и выдаёт среднее их ответов (для классификации — самый частый класс). Обучение — запоминание таблицы, вся работа — при прогнозе. Чувствителен к масштабу признаков; k = 1 запоминает шум, слишком большое k сглаживает различия."
  syntax: |
    KNeighborsRegressor(n_neighbors=10)
    distances, positions = model.kneighbors(x_scaled)
- id: euclidean-distance
  term: Евклидово расстояние
  category: Модели
  aliases: [расстояние, метрика расстояния, близость объектов]
  summary: "Расстояние между точками a и b в пространстве признаков: √Σ(aⱼ − bⱼ)². Признаки с большими числами (пробег в километрах) вносят в него основной вклад, поэтому перед kNN признаки стандартизируют."
  syntax: |
    np.sqrt(((a - b) ** 2).sum())
- id: hyperparameter
  term: Гиперпараметр
  category: Машинное обучение
  aliases: [hyperparameter, настройка модели, параметр модели]
  summary: "Настройка, которую задаёт человек до обучения: число соседей, глубина дерева, число деревьев. Параметры (коэффициенты, пороги) модель находит сама при `fit`. Гиперпараметры выбирают по validation или кросс-валидации; выбор по test делает итоговую оценку слишком оптимистичной."
- id: validation-curve
  term: Кривая ошибки от гиперпараметра
  category: Машинное обучение
  aliases: [validation curve, кривая валидации, подбор гиперпараметра]
  summary: "График ошибки на train и на validation для разных значений гиперпараметра. Слева (простая модель) обе ошибки велики — недообучение; справа (сложная) ошибка train мала, а validation растёт — переобучение. Лучшее значение — минимум ошибки на validation."
- id: decision-tree
  term: Дерево решений
  category: Модели
  aliases: [DecisionTreeRegressor, DecisionTreeClassifier, дерево, CART, ID3, plot_tree, export_text, лист, узел]
  summary: "Модель из последовательных вопросов о признаках («Year ≤ 2012.5?»). Объект спускается от корня к листу; лист регрессионного дерева выдаёт среднее значение ответа обучающих объектов в нём, классификационного — самый частый класс. Прогноз — ступенчатая функция; масштабирование признаков не нужно."
  syntax: |
    tree = DecisionTreeRegressor(max_depth=3, random_state=42).fit(X_train, y_train)
    print(export_text(tree, feature_names=list(X_train.columns)))
- id: tree-split
  term: Разбиение в дереве
  category: Модели
  aliases: [split, порог, threshold, критерий разбиения, squared_error, индекс Джини, Gini]
  summary: "В каждом узле перебираются признаки и пороги; для регрессии выбирают разбиение с наименьшей суммой квадратов отклонений ответов от средних двух частей (наибольшим уменьшением дисперсии), для классификации — с наибольшим уменьшением энтропии или индекса Джини. Алгоритм жадный: выбранное разбиение не пересматривается."
- id: entropy
  term: Энтропия и прирост информации
  category: Модели
  aliases: [entropy, information gain, прирост информации, нечистота узла]
  summary: "Энтропия узла с долями классов pₖ: H = −Σ pₖ log₂ pₖ; 0 — все объекты одного класса, 1 — два класса поровну. Прирост информации — энтропия родителя минус взвешенная энтропия частей; алгоритм ID3 выбирает разбиение с максимальным приростом."
  example: |
    p = counts / counts.sum()
    H = -(p * np.log2(p)).sum()
- id: max-depth
  term: Глубина дерева и размер листа
  category: Модели
  aliases: [max_depth, min_samples_leaf, get_depth, get_n_leaves, сложность дерева]
  summary: "`max_depth` — наибольшее число вопросов от корня до листа, `min_samples_leaf` — наименьшее число объектов в листе. Без ограничений дерево делит данные до отдельных объектов и запоминает шум (переобучение); слишком мелкое дерево не успевает уловить зависимость (недообучение)."
- id: feature-importance
  term: Важность признаков
  category: Модели
  aliases: [feature_importances_, важность, вклад признака]
  summary: "Для дерева и леса — доля общего уменьшения ошибки, которую дали разбиения по признаку; в сумме 1. Помогает понять, на что опирается модель, но не доказывает причинную связь: у похожих (связанных) признаков важность делится, а признак с большим числом значений легче попадает в разбиения."
  syntax: |
    pd.Series(model.feature_importances_, index=X.columns).sort_values(ascending=False)
- id: bootstrap
  term: Бутстрэп-выборка
  category: Машинное обучение
  aliases: [bootstrap, выбор с повторениями, выборка с возвращением]
  summary: "Случайная выборка того же размера, что исходная, с повторениями: одни строки попадают несколько раз, другие — ни разу. В среднем в неё входит около 63 % разных строк (1 − 1/e)."
  syntax: |
    rows = rng.integers(0, n, size=n)
- id: bagging
  term: Бэггинг
  category: Машинное обучение
  aliases: [bagging, bootstrap aggregating, усреднение моделей]
  summary: "Ансамбль: на каждой бутстрэп-выборке учат свою модель (обычно дерево), прогнозы усредняют (для классов — голосование). Ошибки моделей, обученных на разных выборках, частично компенсируют друг друга, и разброс прогноза уменьшается."
- id: ensemble
  term: Ансамбль моделей
  category: Машинное обучение
  aliases: [ensemble, голосование, стэкинг, бустинг, слабая модель, сильная модель]
  summary: "Комбинация нескольких моделей, которая работает лучше каждой по отдельности. Модели должны ошибаться по-разному. Способы: усреднение и голосование, бэггинг и случайный лес (модели независимы), бустинг (каждая следующая модель исправляет ошибки предыдущих, модуль 7), стэкинг (ответы моделей объединяет ещё одна модель)."
- id: random-forest
  term: Случайный лес
  category: Модели
  aliases: [RandomForestRegressor, RandomForestClassifier, random forest, n_estimators, max_features]
  summary: "Бэггинг деревьев решений: каждое дерево обучается на своей бутстрэп-выборке, при разбиениях может рассматривать случайную часть признаков (`max_features`). Прогноз — среднее деревьев. Обычно точнее одного дерева и устойчивее к переобучению; медленнее, а объяснить прогноз одним правилом нельзя."
  syntax: |
    RandomForestRegressor(n_estimators=60, max_depth=10, random_state=42, n_jobs=1)
- id: model-selection
  term: Выбор модели
  category: Машинное обучение
  aliases: [сравнение моделей, кандидаты, model selection, итоговая проверка]
  summary: "Кандидатов сравнивают на одних признаках, одном разбиении и одной метрике; выбирают по validation или кросс-валидации. Тестовую часть используют один раз — для итоговой оценки выбранной модели. Небольшие различия метрик могут быть случайными: их проверяют на других разбиениях."
- id: cross-validation
  term: Кросс-валидация
  category: Машинное обучение
  aliases: [cross-validation, CV, KFold, блочная проверка, k блоков, fold]
  summary: "Обучающая часть делится на k блоков; k раз модель учится на k − 1 блоках и проверяется на оставшемся. Среднее k ошибок оценивает качество надёжнее одного разбиения, разброс показывает его устойчивость. Тестовая часть в кросс-валидации не участвует."
  syntax: |
    cv = KFold(n_splits=3, shuffle=True, random_state=42)
    for fit_idx, check_idx in cv.split(X_train): ...
- id: cross-validate
  term: cross_validate и cross_val_score
  category: Scikit-learn
  aliases: [cross_validate, cross_val_score, scoring, neg_mean_absolute_error, test_score]
  summary: "Функции, которые проводят кросс-валидацию: на каждом блоке обучают новую копию модели и считают метрику. В scikit-learn «больше — лучше», поэтому ошибки возвращаются со знаком минус: MAE = −`test_score`. Ключ `test_score` — проверочный блок внутри CV, а не внешний test."
  syntax: |
    res = cross_validate(pipe, X_train, y_train, cv=cv, scoring='neg_mean_absolute_error', return_train_score=True)
    fold_mae = -res['test_score']
