# Справочник: технологии ИИ — компьютерное зрение, обработка языка, речь, применения (модуль 12).
- id: digital-image
  term: Цифровое изображение
  category: Технологии ИИ
  aliases: [пиксель, RGB, канал цвета, uint8, яркость, оттенки серого, grayscale, разрешение, H × W × 3]
  summary: "Картинка в компьютере — таблица пикселей. У чёрно-белой картинки на пиксель одно число — яркость, у цветной три: красный, зелёный и синий каналы (RGB). Обычно это целые от 0 до 255 (тип uint8), и массив имеет форму высота × ширина × 3. Яркость цветного пикселя считают взвешенной суммой каналов: глаз чувствительнее всего к зелёному, поэтому у него наибольший вес — 0,299·R + 0,587·G + 0,114·B."
  syntax: |
    img.shape                # (64, 64, 3)
    gray = img @ np.array([0.299, 0.587, 0.114])
    plt.imshow(img)
- id: image-convolution
  term: Свёртка (фильтр изображения)
  category: Технологии ИИ
  aliases: [convolution, свёртка, ядро, kernel, фильтр, размытие, blur, оператор Собеля, Sobel, границы, свёрточная сеть, CNN]
  summary: "Ядро — маленькая матрица весов, например 3 × 3. Его прикладывают к каждому окну картинки и записывают сумму произведений весов на пиксели — получается новая картинка. Ядро из одинаковых весов размывает, ядро Собеля (−1, 0, 1 по строкам с весами 1, 2, 1) реагирует на резкую смену яркости — выделяет границы. Свёрточная нейросеть (CNN) состоит из слоёв таких фильтров, но веса ядер не задают вручную, а подбирают обучением."
  syntax: |
    for i in range(h - 2):
        for j in range(w - 2):
            out[i, j] = (gray[i:i + 3, j:j + 3] * kernel).sum()
- id: object-detection
  term: Обнаружение объектов
  category: Технологии ИИ
  aliases: [object detection, детектор, рамка, bounding box, ограничивающий прямоугольник, YOLO, порог уверенности, NMS, подавление немаксимумов, precision, recall, точность, полнота]
  summary: "Задача найти на картинке все объекты нужных классов и обвести каждый рамкой: класс, координаты (x1, y1, x2, y2) и уверенность. Рамку считают найденной, если она совпадает с настоящей с IoU ≥ 0,5. Качество детектора описывают точностью (precision — доля верных среди найденных рамок) и полнотой (recall — доля найденных среди настоящих объектов); порог уверенности меняет одну за счёт другой. Повторные рамки одного объекта убирают подавлением немаксимумов (NMS)."
- id: iou
  term: IoU (пересечение над объединением)
  category: Технологии ИИ
  aliases: [IoU, intersection over union, коэффициент Жаккара, Jaccard, совпадение рамок, совпадение масок]
  summary: "Мера совпадения двух областей: площадь пересечения, делённая на площадь объединения. 1 — области совпадают, 0 — не пересекаются. Для рамок пересечение — прямоугольник с границами max(x1), max(y1), min(x2), min(y2), если он не пустой. Для масок — число пикселей, где обе маски истинны, делённое на число пикселей, где истинна хотя бы одна. Это тот же коэффициент Жаккара, что у множеств кусочков слова в уроке 11.2."
  syntax: |
    inter = max(0, min(ax2, bx2) - max(ax1, bx1)) * max(0, min(ay2, by2) - max(ay1, by1))
    iou = inter / (area_a + area_b - inter)
- id: image-segmentation
  term: Сегментация изображений
  category: Технологии ИИ
  aliases: [segmentation, маска, семантическая сегментация, экземплярная сегментация, instance segmentation, pixel accuracy]
  summary: "Разметка каждого пикселя: какому классу он принадлежит (семантическая сегментация) или какому объекту (экземплярная). Результат — маска размером с картинку. Долю верных пикселей использовать опасно: если объект занимает 5 % картинки, маска «везде фон» верна на 95 %. Поэтому сравнивают IoU масок класса."
- id: image-generation
  term: Генерация изображений
  category: Технологии ИИ
  aliases: [диффузионная модель, diffusion, Kandinsky, Stable Diffusion, шум, denoising, генерация по тексту, дипфейк, deepfake]
  summary: "Современные генераторы картинок по тексту — диффузионные модели. При обучении к картинке добавляют шум, и сеть учится предсказывать, какой шум добавлен. При генерации начинают с чистого шума и много раз вычитают предсказанный шум, следуя тексту-подсказке, — из шума проступает картинка. Так работает и Kandinsky от Сбера. Той же техникой делают реалистичные подделки (дипфейки), поэтому сгенерированное стоит помечать."
- id: nlp-tasks
  term: Обработка естественного языка (NLP)
  category: Технологии ИИ
  aliases: [NLP, natural language processing, анализ текста, синтез текста, машинный перевод, тональность, токсичность, перенос стиля, неоднозначность, флективность, морфология, синтаксис, семантика]
  summary: "Область ИИ, которая анализирует и синтезирует тексты на языках людей — в отличие от формальных языков программ. Анализ: классификация (тема, тональность, токсичность), выделение именованных сущностей, исправление ошибок. Синтез: машинный перевод, ответы ассистентов, генерация, перенос стиля (например, из токсичного текста в вежливый). Трудности: неоднозначность («ключ» — от замка, гаечный и родник), много форм одного слова в русском языке и свободный порядок слов."
- id: text-classification
  term: Классификация текстов
  category: Технологии ИИ
  aliases: [text classification, классификатор текстов, тема текста, LogisticRegression, логистическая регрессия, матрица ошибок, confusion matrix, разбиение по группам, GroupShuffleSplit]
  summary: "Отнести текст к одному из классов: тема, тональность, спам, токсичность. Классический рецепт: TF-IDF слов или символьных n-грамм и логистическая регрессия; современный — эмбеддинги языковой модели или сама LLM. Тексты одного источника похожи, поэтому разбиение на обучение и проверку делают по источникам целиком. Матрица ошибок показывает, какие классы модель путает."
  syntax: |
    clf = make_pipeline(TfidfVectorizer(analyzer='char_wb', ngram_range=(3, 5)), LogisticRegression(max_iter=1000))
    clf.fit(train_texts, train_labels).score(test_texts, test_labels)
- id: named-entities
  term: Именованные сущности (NER)
  category: Технологии ИИ
  aliases: [NER, named entity recognition, сущность, персона, организация, место, дата, словарь сущностей, регулярное выражение]
  summary: "Найти в тексте упоминания людей, организаций, мест, дат, денежных сумм и других «именованных» объектов и отметить их тип. Даты и числа с единицами хорошо находят регулярные выражения; названия из известного списка — поиск по словарю с границами слов; новые имена и неоднозначные случаи («Яндекс» — компания, «яндекс» в адресе почты) решают модели, обученные на размеченных текстах. Качество меряют точностью и полнотой найденных фрагментов."
- id: edit-distance
  term: Расстояние Левенштейна
  category: Технологии ИИ
  aliases: [edit distance, Levenshtein, редакционное расстояние, исправление опечаток, spell checking, спеллчекер, динамическое программирование]
  summary: "Наименьшее число односимвольных правок — вставок, удалений и замен, — которое превращает одну строку в другую: «кросс» → «крос» — 1, «модель» → «модели» — 1. Считается таблицей: d[i][j] — расстояние между первыми i буквами одного слова и первыми j буквами другого. Простой исправитель опечаток ищет в словаре слова на расстоянии 1–2 и выбирает самое частое из ближайших."
  syntax: |
    d[i][j] = min(d[i-1][j] + 1,                      # удалить
                  d[i][j-1] + 1,                      # вставить
                  d[i-1][j-1] + (a[i-1] != b[j-1]))   # заменить или оставить
- id: spectrogram
  term: Спектр и спектрограмма
  category: Технологии ИИ
  aliases: [спектр, преобразование Фурье, FFT, БПФ, частота, герц, гармоника, спектрограмма, STFT, окно Ханна, кадр]
  summary: "Любой кусок звука можно разложить на синусоиды разных частот; преобразование Фурье (быстрое — FFT) показывает, сколько каждой частоты в звуке: пики спектра — частоты, из которых звук состоит. Спектрограмма — спектры коротких кадров (20–30 мс) подряд: по горизонтали время, по вертикали частота, яркость — сила частоты. На ней видны паузы, гласные с их гармониками и шумные согласные — с этого начинается распознавание речи."
  syntax: |
    spectrum = np.abs(np.fft.rfft(frame * np.hanning(len(frame))))
    freqs = np.fft.rfftfreq(len(frame), d=1 / rate)
- id: speech-recognition-models
  term: Распознавание речи (ASR)
  category: Технологии ИИ
  aliases: [ASR, automatic speech recognition, акустическая модель, лексикон, словарь произношений, языковая модель, фонема, ключевые слова, keyword spotting, Whisper]
  summary: "Перевод речи в текст. Классическая схема: речь режут на короткие промежутки, для каждого считают характеристики звука; акустическая модель оценивает, какие звуки (фонемы) произнесены; словарь (лексикон) собирает из фонем слова; языковая модель выбирает из похожих по звучанию вариантов правдоподобную фразу. Современные модели (например, Whisper) обучают всё это одной сетью. Проще всего распознавать фиксированный набор команд и ключевые слова, труднее всего — произвольную речь."
- id: speech-synthesis
  term: Синтез речи (TTS)
  category: Технологии ИИ
  aliases: [TTS, text-to-speech, озвучивание, нормализация текста, голос, интонация, цифровой аватар, SaluteSpeech, SpeechKit]
  summary: "Перевод текста в речь. Сначала текст готовят: числа, даты, сокращения и знаки записывают словами, расставляют ударения и паузы. Затем выбирают голос (мужской, женский, персонаж) и интонацию (нейтральная, радостная, деловая) и генерируют звук. В тексте нет интонации и эмоций, а букв меньше, чем звуков, — синтезатору приходится это достраивать; поэтому синтезированную речь всё ещё можно отличить от живой и её трудно слушать долго."
- id: ai-applications
  term: Технологии ИИ (национальная стратегия)
  category: Технологии ИИ
  aliases: [технологии ИИ, компьютерное зрение, обработка языка, распознавание речи, поддержка принятия решений, перспективные методы, Альянс в сфере ИИ, ai-russia]
  summary: "Национальная стратегия развития ИИ в России до 2030 года называет технологиями ИИ компьютерное зрение, обработку естественного языка, распознавание и синтез речи, интеллектуальную поддержку принятия решений и перспективные методы ИИ. Примеры применений: беспилотные автомобили и голосовые помощники, рекомендательные системы, прогноз пожеланий клиентов, обработка сейсмических данных, контроль внимания операторов, планирование уборки урожая. Технологию выбирают по данным: картинки и видео, тексты, звук или таблицы."
- id: ai-risks
  term: Риски и ответственность ИИ
  category: Технологии ИИ
  aliases: [цена ошибки, ложная тревога, пропуск, порог по стоимости, предвзятость, bias, персональные данные, приватность, дипфейк, маркировка сгенерированного]
  summary: "У ошибок модели разная цена: пропустить человека без каски на опасном участке дороже, чем поднять ложную тревогу. Поэтому порог выбирают по суммарной стоимости ошибок, а не по доле верных. Модель может ошибаться чаще для одной группы (предвзятость) — ошибки проверяют по группам. Лица и голос — персональные данные: их собирают только с согласия и защищают. Сгенерированные картинки, голос и видео помечают, чтобы их не приняли за настоящие."
