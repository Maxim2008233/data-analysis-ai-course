- id: ai
  term: Искусственный интеллект (ИИ)
  category: "ИИ: общие понятия"
  aliases: [AI, artificial intelligence]
  summary: "Комплекс технологических решений, позволяющий имитировать когнитивные функции человека и получать при выполнении конкретных задач результаты, сопоставимые как минимум с результатами интеллектуальной деятельности человека (определение из Национальной стратегии развития ИИ в России до 2030 года)."
- id: turing-test
  term: Тест Тьюринга (игра в имитацию)
  category: "ИИ: общие понятия"
  aliases: [Тьюринг, imitation game]
  summary: "Предложен Аланом Тьюрингом в 1950 году: судья переписывается с человеком и машиной, не видя их. Если судья не может надёжно отличить машину от человека, считается, что машина прошла тест. Тест проверяет поведение, а не «понимание»."
- id: ai-winter
  term: «Зима» искусственного интеллекта
  category: "ИИ: общие понятия"
  aliases: [зима ИИ, AI winter]
  summary: "Период разочарования и сокращения финансирования. Первая зима (1970-е) — после провала машинного перевода и критики персептронов (Минский и Пейперт, 1969); вторая (конец 1980-х) — после спада интереса к экспертным системам и коллапса рынка LISP-машин."
- id: expert-system
  term: Экспертная система
  category: "ИИ: общие понятия"
  aliases: [правила если-то, MYCIN, XCON]
  summary: "Программа, которая принимает решения по набору правил вида «если [условие], то [вывод]», записанных экспертами. Примеры 1970–80-х: MYCIN (диагностика заболеваний крови), XCON (конфигурация компьютеров). Недостатки: правила быстро усложняются и плохо учитывают неопределённость."
- id: neural-network
  term: Нейронная сеть
  category: "ИИ: общие понятия"
  aliases: [нейросеть, персептрон, глубокое обучение]
  summary: "Модель, составленная из простых вычислительных элементов — искусственных нейронов (Маккаллок и Питтс, 1943). Персептрон Розенблатта — 1958 год; обучение многослойных сетей методом обратного распространения ошибки — 1986. Подробно — в модуле 8."
- id: weak-ai
  term: Слабый и сильный ИИ
  category: "ИИ: общие понятия"
  aliases: [узкий ИИ, общий ИИ, AGI, ANI, ASI]
  summary: "Слабый (узкий, ANI) ИИ решает одну или несколько задач и не понимает смысла своих действий. Сильный (общий, AGI) — гипотетическая система с мышлением, способная решать любые задачи; ASI — превосходящая человека. Все современные системы — слабый ИИ."
- id: chinese-room
  term: Китайская комната
  category: "ИИ: общие понятия"
  aliases: [Сёрл, мысленный эксперимент]
  summary: "Мысленный эксперимент Джона Сёрла (1980): человек, не знающий китайского, отвечает на записки по-китайски, пользуясь подробной инструкцией. Снаружи кажется, что он понимает язык, хотя он лишь следует правилам. Аргумент: правильное поведение не доказывает понимания."
- id: symbolic-ai
  term: Символьный (нисходящий) подход
  category: "ИИ: общие понятия"
  aliases: [символьные вычисления, логический подход, LISP, Prolog, база знаний]
  summary: "Имитация мышления через операции с символами, правилами и знаниями: символьные вычисления (LISP), логический вывод (Prolog), экспертные системы, онтологии и графы знаний. Противопоставляется восходящему подходу — моделированию нейронов."
- id: machine-learning
  term: Машинное обучение
  category: "ИИ: общие понятия"
  aliases: [ML, обучение по данным, y = f(x)]
  summary: "Область, которая даёт компьютерам способность обучаться без явного программирования правил (А. Сэмюэл, 1959). Вместо правил мы даём примеры входов x и ответов y, а алгоритм подбирает функцию y = f(x). Подробно — в модуле 5."
- id: crisp-dm
  term: CRISP-DM
  category: "ИИ: общие понятия"
  aliases: [жизненный цикл, проект анализа данных]
  summary: "Стандартный процесс проекта анализа данных: понимание бизнеса → понимание данных → подготовка данных → моделирование → оценка → внедрение. Этапы повторяются: на каждом шаге можно вернуться к предыдущему."
- id: data-shift
  term: Data shift и concept shift
  category: "ИИ: общие понятия"
  aliases: [сдвиг данных, дрейф данных, concept drift]
  summary: "Качество модели снижается со временем. Data shift — данные пользователей отличаются от обучающих (модель перевода училась на книгах, а переводит посты из соцсетей). Concept shift — изменилось само поведение (например, во время пандемии)."
