# Справочник: визуализация, BI и Data Story (модуль 4).
- id: viz-goals
  term: Две цели визуализации
  category: Визуализация
  aliases: [зачем графики, исследовать данные, представить результаты, гипотеза]
  summary: "Графики нужны, чтобы **исследовать** данные (увидеть форму распределения, различия групп, ошибки) и чтобы **представить** вывод заказчику. Перед графиком формулируют вопрос, показатель и то, зачем ответ нужен; выводы ограничивают тем, что описывают данные."
- id: chart-choice
  term: Выбор типа графика
  category: Визуализация
  aliases: [какой график выбрать, тип диаграммы]
  summary: "Сколько записей в категориях — отсортированные столбцы; распределение одного числа — гистограмма, боксплот, ECDF; число по категориям — боксплоты по группам; два числа — scatter или hexbin; значение по упорядоченному признаку — линия; доли одного целого — столбцы, кольцо, Парето; иерархия — treemap; доли в таблице сочетаний — тепловая карта."
- id: mpl-figure-axes
  term: Figure и Axes
  category: Визуализация
  aliases: [plt.subplots, fig ax, оси, рисунок, matplotlib, pyplot, plt]
  summary: "В Matplotlib `Figure` — весь рисунок, `Axes` — одна область с графиком (со своими осями X и Y, заголовком, подписями). `fig, ax = plt.subplots()` создаёт оба; дальше рисуют и настраивают методами `ax`. Короткий стиль `plt.plot(...)` рисует на «текущих» осях."
  syntax: |
    fig, ax = plt.subplots(figsize=(ширина, высота))
    ax.set(title='…', xlabel='…', ylabel='…')
    ax.grid(alpha=0.3)
    fig.tight_layout()
  example: |
    fig, ax = plt.subplots(figsize=(10, 3))
    ax.plot(prices.index, prices.values, 'o-')
    ax.set(title='Средняя цена по году выпуска', xlabel='Год выпуска', ylabel='Цена, евро')
- id: ax-plot-scatter
  term: ax.plot и ax.scatter
  category: Визуализация
  aliases: [линия, точки, plot, scatter, маркер, alpha, s]
  summary: "`ax.plot(x, y, 'o-')` соединяет точки линией (формат: маркер `o`, линия `-`); `ax.scatter(x, y, s=8, alpha=0.2, color='gray')` рисует отдельные точки: `s` — площадь маркера, `alpha` — прозрачность от 0 до 1."
  example: |
    ax.scatter(cars['Year'], cars['Price'], s=8, alpha=0.15, color='gray')
    ax.plot(stats.index, stats['mean'], 'o-', linewidth=1.5)
- id: mpl-ticks
  term: Деления осей
  category: Визуализация
  aliases: [set_xticks, tick_params, подписи делений, поворот подписей, rotation]
  summary: "`ax.set_xticks(range(2000, 2022, 2))` задаёт положения делений, `ax.tick_params(axis='x', rotation=45)` поворачивает подписи, `minor=True` — мелкие деления без подписей. `ax.set_xlim(0, 100)` / `ax.set_ylim(...)` — границы осей."
  example: |
    ax.set_xticks(range(start, end + 1, 2))
    ax.tick_params(axis='x', rotation=45)
- id: mpl-legend
  term: Легенда
  category: Визуализация
  aliases: [legend, label, подпись ряда]
  summary: "У каждого слоя графика задают `label='…'`, затем `ax.legend()` собирает подписи в легенду. Слой без `label` в легенду не попадает. Положение — `loc='upper left'`, без рамки — `frameon=False`."
  example: |
    ax.scatter(x, y, label='Отдельные автомобили')
    ax.plot(xm, ym, label='Средняя цена')
    ax.legend()
- id: mpl-barh
  term: bar и barh (столбцы)
  category: Визуализация
  aliases: [столбчатая диаграмма, горизонтальные столбцы, bar chart, barh]
  summary: "`ax.bar(названия, значения)` — вертикальные столбцы, `ax.barh(названия, значения)` — горизонтальные (удобны для длинных названий). `barh` рисует первую категорию снизу, поэтому для «самый большой сверху» значения сортируют по возрастанию (`sort_values()`) или переворачивают ось `ax.invert_yaxis()`."
  example: |
    top = df['Make'].value_counts().head(10).sort_values()
    bars = ax.barh(top.index, top.values, color='#3973a5')
- id: bar-label
  term: bar_label (подписи столбцов)
  category: Визуализация
  aliases: [подписи значений, подписи над столбцами, проценты на столбцах]
  summary: "`ax.bar_label(bars)` пишет значение у каждого столбца; `labels=[...]` — свои подписи (например, «3 403 (10,6%)»), `fmt='%.1f%%'` — формат числа, `padding=4` — отступ. Чтобы подписи поместились, увеличивают границу оси: `ax.set_xlim(0, max * 1.3)`."
  example: |
    ax.bar_label(bars, labels=[f'{n:,} ({100 * n / total:.1f}%)' for n in top], padding=4)
- id: mpl-colors
  term: Цвета в Matplotlib
  category: Визуализация
  aliases: [color, цвет, tab10, палитра, lightgray, акцент]
  summary: "Цвет задают именем (`'lightgray'`, `'tab:blue'`, `'tab:orange'`), кодом `'#3973a5'` или списком — по цвету на каждый столбец. `plt.cm.tab10.colors` — 10 хорошо различимых цветов для категорий. Акцент — один яркий цвет на сером фоне."
  example: |
    colors = ['tab:orange' if name == 'Toyota' else 'lightgray' for name in top.index]
- id: plt-subplots-grid
  term: Сетка графиков (subplots)
  category: Визуализация
  aliases: [plt.subplots, axes, несколько графиков, suptitle, tight_layout, sharex, sharey]
  summary: "`fig, axes = plt.subplots(строк, колонок)` возвращает массив осей: `axes[i, j]` (или `axes[k]` при одной строке), `axes.flat` — все подряд. `fig.suptitle('…')` — общий заголовок, `fig.tight_layout()` — убрать наложения подписей, `sharex=True`, `sharey=True` — общие шкалы."
  example: |
    fig, axes = plt.subplots(2, 2, figsize=(12, 8))
    for ax, col in zip(axes.flat, ['Price', 'Year', 'km_year', 'Distance']):
        ax.hist(df[col], bins=30)
        ax.set_title(col)
    fig.tight_layout()
- id: twinx
  term: twinx (вторая ось Y)
  category: Визуализация
  aliases: [вторая ось, две шкалы, накопленная доля]
  summary: "`ax2 = ax.twinx()` — новые оси с общей осью X и своей шкалой Y справа. Так на диаграмме Парето столбцы показывают число записей, а линия на второй оси — накопленную долю в процентах."
  example: |
    ax2 = ax.twinx()
    ax2.plot(ranked.index, 100 * ranked.cumsum() / len(df), 'o-', color='tab:red')
    ax2.set_ylim(0, 100)
- id: pie-donut
  term: Круговая и кольцевая диаграмма
  category: Визуализация
  aliases: [pie, donut, кольцо, круговая диаграмма, autopct]
  summary: "`ax.pie(values, labels=..., autopct='%1.1f%%')` — круг из долей; `wedgeprops={'width': 0.4}` превращает его в кольцо. Подходит для 3–6 частей одного целого; углы сравнивать труднее, чем длины столбцов."
  example: |
    ax.pie(parts.values, labels=parts.index, autopct='%1.1f%%', wedgeprops={'width': 0.4, 'edgecolor': 'white'})
- id: pareto
  term: Диаграмма Парето
  category: Визуализация
  aliases: [парето, накопленная доля, cumsum]
  summary: "Категории по убыванию столбцами и линия накопленной доли (`cumsum()` / итог × 100) на второй оси. Показывает, сколько категорий покрывают, например, 80 % записей."
  example: |
    ranked = df['Make'].value_counts()
    cum_share = 100 * ranked.cumsum() / ranked.sum()
- id: plt-hist
  term: Гистограмма (hist)
  category: Визуализация
  aliases: [hist, гистограмма, bins, интервалы, histplot]
  summary: "`ax.hist(x, bins=40, range=(0, 50_000))` делит диапазон на равные интервалы и рисует число записей в каждом. Ширина интервала = (max − min) / bins. `bins` может быть и списком границ, например `np.geomspace(...)` для логарифмической шкалы. Подсчёт без рисования — `np.histogram`."
  example: |
    counts, edges, patches = ax.hist(df['Price'], bins=40, range=(0, 50_000))
- id: log-scale
  term: Логарифмическая шкала
  category: Визуализация
  aliases: [log, логарифм, set_xscale, set_yscale, logy, geomspace]
  summary: "На логарифмической оси равные отрезки — равные **отношения**: от 100 до 1 000 столько же, сколько от 1 000 до 10 000. `ax.set_xscale('log')`, `ax.set_yscale('log')`, в pandas — `logy=True`; интервалы гистограммы — `np.geomspace(min, max, n)`. Только для положительных значений."
  example: |
    ax.hist(price, bins=np.geomspace(price.min(), price.max(), 40))
    ax.set_xscale('log')
- id: seaborn
  term: Seaborn
  category: Визуализация
  aliases: [sns, histplot, seaborn histplot, статистические графики]
  summary: "Библиотека статистических графиков поверх Matplotlib: `import seaborn as sns`. Функции принимают таблицу и имена колонок: `sns.histplot(data=df, x='Year', hue='Transmission', bins=20, ax=ax)`, `kde=True` добавляет сглаженную кривую, `stat='probability'` — доли вместо числа записей."
  example: |
    sns.histplot(data=df, x='km_year', bins=50, kde=True, stat='probability', ax=ax)
- id: boxplot
  term: Боксплот (ящик с усами)
  category: Визуализация
  aliases: [boxplot, box plot, ящик с усами, усы, whis, showfliers]
  summary: "Ящик — от Q1 до Q3, линия внутри — медиана, усы — до самых дальних значений в пределах [Q1 − 1,5·IQR; Q3 + 1,5·IQR] (`whis=1.5`), точки снаружи — кандидаты на проверку. `sns.boxplot(data=df, x='Style', y='Price', order=[...], showfliers=False)` — по группам; `showfliers=False` прячет точки, но квартили считаются по всем записям."
  example: |
    sns.boxplot(data=df, x='Transmission', y='Price', ax=ax)
- id: violin-kde
  term: Violin и KDE
  category: Визуализация
  aliases: [violinplot, kdeplot, плотность, сглаженная гистограмма]
  summary: "KDE (`sns.kdeplot`) — сглаженная оценка плотности, «гладкая гистограмма»; violin (`sns.violinplot`, `inner='quartile'`) — боксплот вместе с формой плотности, на нём видны два пика, которые боксплот спрячет. `cut=0` не продлевает кривую за пределы данных."
  example: |
    sns.violinplot(data=df, y='Year', inner='quartile', cut=0, ax=ax)
- id: ecdf
  term: ECDF (накопленная доля)
  category: Визуализация
  aliases: [ecdfplot, CDF, функция распределения, накопленная доля]
  summary: "Эмпирическая функция распределения: для каждого x — доля записей со значением **не больше** x. `sns.ecdfplot(data=df, x='Year')`; то же число без графика — `(df['Year'] <= 2010).mean()`. Доля «больше x» = 1 − ECDF(x)."
  example: |
    sns.ecdfplot(data=df, x='Year', ax=ax)
- id: normal-distribution
  term: Нормальное и логнормальное распределение
  category: Статистика
  aliases: [нормальное распределение, колокол, логнормальное, 68-95-99.7, сигма, Q-Q]
  summary: "Нормальное — симметричный «колокол»: около 68 % значений лежат в пределах среднее ± σ, 95 % — ± 2σ, 99,7 % — ± 3σ. Цены близки к **логнормальному**: нормален логарифм цены. Сравнить с нормальным можно гистограммой с кривой плотности или Q–Q-графиком (`scipy.stats.probplot`)."
  example: |
    log_price = np.log10(df['Price'])
    within_1 = ((log_price - log_price.mean()).abs() <= log_price.std()).mean()
- id: conditional-distribution
  term: Условное распределение
  category: Статистика
  aliases: [распределение по группам, распределение внутри группы, hue multiple stack]
  summary: "Распределение признака при условии, что запись принадлежит группе: цены внутри каждого типа кузова, пробег отдельно для автоматов и механики. Показывают боксплотами по группам, гистограммами с `hue=` (`multiple='stack'` — столбики групп друг над другом) или панелями."
  example: |
    sns.histplot(data=df, x='Distance', hue='Transmission', multiple='stack', bins=20, ax=ax)
- id: sns-catplot
  term: catplot (панели по группам)
  category: Визуализация
  aliases: [catplot, FacetGrid, col, col_wrap, панели, фасеты]
  summary: "`sns.catplot(data=..., x=..., y=..., col='Make', kind='box', col_wrap=3, height=3)` строит отдельную панель для каждого значения `col` с общей шкалой Y. Возвращает объект FacetGrid; его оси — `g.axes.flat`, общий заголовок — `g.figure.suptitle(...)`."
  example: |
    g = sns.catplot(data=df_top, x='km_year_cat', y='Price', col='Make', kind='box', col_wrap=3, order=['Small', 'Medium', 'Large'])
- id: sns-heatmap
  term: heatmap (тепловая карта)
  category: Визуализация
  aliases: [тепловая карта, heatmap, annot, cmap]
  summary: "`sns.heatmap(table, annot=True, fmt='.0%', cmap='Blues')` закрашивает ячейки таблицы по величине и подписывает значения (`fmt` — формат: `'.0%'` — проценты, `'d'` — целые). Подходит для долей из `crosstab(..., normalize='index')` и матриц корреляций."
  example: |
    sns.heatmap(pd.crosstab(df['Make'], df['Fuel_type'], normalize='index'), annot=True, fmt='.0%', cmap='Blues')
- id: scatter-plot
  term: Диаграмма рассеяния (scatter)
  category: Визуализация
  aliases: [scatter, точечная диаграмма, облако точек, наложение точек]
  summary: "Каждая запись — точка с координатами (x, y) по двум числовым признакам. При тысячах точек они накладываются: помогают `s` (размер) поменьше, `alpha` (прозрачность) 0,05–0,3, логарифмическая шкала или hexbin."
  example: |
    ax.scatter(df['Distance'], df['Price'], s=4, alpha=0.15)
- id: hexbin
  term: hexbin
  category: Визуализация
  aliases: [шестиугольники, плотность точек, gridsize, colorbar]
  summary: "`ax.hexbin(x, y, gridsize=45, bins='log', mincnt=1)` делит плоскость на шестиугольные ячейки и закрашивает их по числу записей; `bins='log'` — логарифмическая шкала цвета, `mincnt=1` — не рисовать пустые ячейки. Шкала цвета — `fig.colorbar(hb, ax=ax, label='…')`."
  example: |
    hb = ax.hexbin(df['Distance'], df['Price'], gridsize=45, bins='log', mincnt=1)
    fig.colorbar(hb, ax=ax, label='Число записей в ячейке')
- id: filter-boundary
  term: Граница фильтрации
  category: Статистика
  aliases: [граница, линия фильтра, подозрительные записи, журнал проверки]
  summary: "Линия на графике двух признаков, за которой записи считаются подозрительными. Прямая через (0; a) и (b; 0): `limit = a * (1 - x / b)`; маска `y > limit`. Записи за границей сначала просматривают и заносят в журнал, а решение об удалении принимают отдельно."
  example: |
    limit = 130_000 * (1 - df['Distance'] / 600_000)
    review = df[df['Price'] > limit]
- id: hue
  term: hue (цвет по категории)
  category: Визуализация
  aliases: [hue, цвет по группе, scatterplot, palette]
  summary: "Параметр функций seaborn: `hue='Transmission'` раскрашивает точки, столбцы или ящики по значениям колонки и добавляет легенду; `palette=` — набор цветов. Цветом удобно показывать 2–6 категорий."
  example: |
    sns.scatterplot(data=df, x='Distance', y='Price', hue='Transmission', s=8, alpha=0.4, ax=ax)
- id: shared-axes
  term: Общие шкалы панелей
  category: Визуализация
  aliases: [sharex, sharey, общая ось, LogNorm, одинаковая шкала цвета]
  summary: "Чтобы сравнивать панели глазами, у них должны совпадать шкалы: `plt.subplots(..., sharex=True, sharey=True)`; для hexbin — общая нормировка цвета `LogNorm(vmin=1, vmax=…)`, применённая ко всем панелям (`hb.set_norm(norm)`). Размер группы пишут в заголовке панели."
  example: |
    fig, axes = plt.subplots(1, 2, sharex=True, sharey=True)
- id: plotly
  term: Plotly (plotly.express)
  category: Визуализация
  aliases: [plotly, px, интерактивный график, px.scatter, px.box, px.histogram, fig.show]
  summary: "Библиотека интерактивных графиков: `import plotly.express as px`, `fig = px.scatter(df, x=..., y=..., color=..., title=..., labels={...})`, `fig.show()`. На графике можно навести курсор, приблизить область, скрыть ряд щелчком по легенде. Размер — `fig.update_layout(height=500)`."
  example: |
    fig = px.box(df, x='Fuel_type', y='Price', color='Transmission', labels={'Price': 'Цена, евро'})
    fig.show()
- id: hover-data
  term: hover_data (подсказки при наведении)
  category: Визуализация
  aliases: [подсказка, всплывающая подсказка, tooltip, hover]
  summary: "Колонки из `hover_data=[...]` появляются в подсказке при наведении на точку. Номер исходной строки (`source_row_id`) в подсказке позволяет от точки на графике вернуться к записи в таблице: `df[df['source_row_id'] == 123]`."
  example: |
    px.scatter(df, x='Year', y='Price', hover_data=['source_row_id', 'Model', 'Distance'])
- id: treemap
  term: Treemap
  category: Визуализация
  aliases: [treemap, дерево, иерархия, марка модель, path]
  summary: "Прямоугольники, вложенные по иерархии (`path=['Make', 'Model']`): площадь — значение `values` (например, число записей), цвет — `color` (например, средняя цена). Удобен для обзора состава каталога; таблицу готовят группировкой с `reset_index()`."
  example: |
    px.treemap(stats, path=['Make', 'Model'], values='count', color='avg_price', color_continuous_scale='RdYlBu_r')
- id: segment-filter
  term: Фильтр сегмента
  category: Визуализация
  aliases: [фильтры, сегмент, виджеты, ipywidgets, выпадающий список]
  summary: "Набор условий, который отбирает часть данных для графика или панели: словарь «колонка → значение», где None означает «все». В Jupyter к фильтру подключают выпадающие списки `ipywidgets.Dropdown` и перерисовывают график при выборе; в тренажёре меняют словарь и запускают код заново."
  example: |
    filters = {'Make': 'Toyota', 'Transmission': None}
- id: bi-dashboard
  term: BI-панель (дашборд)
  category: Визуализация
  aliases: [дашборд, dashboard, BI, KPI, панель показателей]
  summary: "Экран с несколькими связанными показателями и графиками одного сегмента: ключевые числа (KPI) сверху, графики ниже. Хорошая панель отвечает на заранее заданные вопросы, подписывает сегмент в заголовке и сохраняется в HTML (`fig.write_html(...)`), чтобы обновлять её при пополнении данных."
- id: make-subplots
  term: make_subplots и graph_objects
  category: Визуализация
  aliases: [make_subplots, go.Indicator, go.Bar, go.Histogram, go.Box, add_trace, graph_objects]
  summary: "`from plotly.subplots import make_subplots`, `import plotly.graph_objects as go`. `make_subplots(rows, cols, specs=...)` — сетка областей (тип `'indicator'` для чисел, `'xy'` для графиков); `fig.add_trace(go.Bar(...), row=2, col=1)` добавляет график в ячейку; `go.Indicator(mode='number', value=..., title={'text': ...})` — крупное число."
  example: |
    fig = make_subplots(rows=1, cols=2, specs=[[{'type': 'indicator'}, {'type': 'xy'}]])
    fig.add_trace(go.Indicator(mode='number', value=len(df), title={'text': 'Записей'}), row=1, col=1)
    fig.add_trace(go.Histogram(x=df['Price'], nbinsx=50), row=1, col=2)
- id: data-story
  term: Дата-история (Data Story)
  category: Визуализация
  aliases: [data story, сторителлинг, слайды, история данных, презентация]
  summary: "Последовательный рассказ из нескольких графиков: вопрос аудитории → наблюдение на графике → интерпретация → предлагаемое действие и следующий шаг. Каждый «слайд» отвечает на один вопрос; в конце называют границы выводов."
- id: takeaway-title
  term: Заголовок-вывод
  category: Визуализация
  aliases: [заголовок, вывод в заголовке, action title]
  summary: "Заголовок, который формулирует вывод слайда («Цены различаются между марками и внутри них»), а не описывает тип графика («Боксплот цен»). Числа в заголовке вычисляют из данных f-строкой."
  example: |
    ax.set_title(f'Топ-5 марок охватывают {share:.1f}% записей')
