# Справочник: бонус — логистическая регрессия, метрики классификации, несбалансированные классы, PCA, k-means, свои реализации.
- id: logistic-regression
  term: Логистическая регрессия
  category: Классификация
  aliases: [LogisticRegression, логрегрессия, logistic regression, сигмоида, sigmoid, шансы, odds, логарифм шансов, log-odds, логит]
  summary: "Модель классификации: считает линейную комбинацию признаков z = w·x + b и превращает её сигмоидой в вероятность класса 1: p = 1 / (1 + e^−z). При z = 0 вероятность 0,5. Коэффициент показывает, на сколько растёт логарифм шансов p / (1 − p), когда признак увеличивается на единицу; exp(коэффициента) — во сколько раз растут сами шансы. Признаки перед ней стандартизуют, чтобы коэффициенты были сравнимы, а регуляризация работала одинаково для всех."
  syntax: |
    model = make_pipeline(StandardScaler(), LogisticRegression())
    model.fit(X_train, y_train)
    p = model.predict_proba(X_test)[:, 1]      # вероятность класса 1
    pred = (p >= 0.5).astype(int)               # то же, что model.predict
- id: log-loss
  term: Логистическая функция потерь (log loss)
  category: Классификация
  aliases: [log loss, логистическая потеря, бинарная кросс-энтропия, binary cross-entropy, кросс-энтропия, log_loss]
  summary: "Функция потерь для вероятностей: за объект класса 1 штраф −log p, за объект класса 0 — −log(1 − p), итог — среднее. Правильный уверенный ответ стоит почти 0, неуверенный (p = 0,5) — log 2 ≈ 0,69, а уверенная ошибка — очень дорого: при p → 0 для класса 1 штраф растёт без предела. Логистическую регрессию и нейросети-классификаторы обучают, уменьшая log loss."
  syntax: |
    p = np.clip(p, 1e-15, 1 - 1e-15)
    loss = -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))
    log_loss(y, p)                               # то же из sklearn.metrics
- id: confusion-matrix
  term: Матрица ошибок
  category: Классификация
  aliases: [confusion matrix, confusion_matrix, TP, FP, FN, TN, ложное срабатывание, пропуск, ошибка первого рода, ошибка второго рода]
  summary: "Таблица, где для бинарной классификации собраны четыре исхода: верно найденные (TP), ложные срабатывания (FP), пропуски (FN) и верные отказы (TN). В scikit-learn строки — настоящий класс, столбцы — предсказанный, поэтому confusion_matrix(y, pred) = [[TN, FP], [FN, TP]]. Все метрики классификации — доля верных, точность, полнота — считаются из этих четырёх чисел."
  syntax: |
    tn, fp, fn, tp = confusion_matrix(y_test, pred).ravel()
- id: precision-recall
  term: Точность, полнота и F1
  category: Классификация
  aliases: [precision, recall, точность, полнота, F1, f1_score, precision_score, recall_score, TPR, чувствительность]
  summary: "Точность (precision) — доля верных среди найденных: TP / (TP + FP), сколько тревог не ложные. Полнота (recall) — доля найденных среди настоящих: TP / (TP + FN), сколько объектов класса не пропущено. F1 = 2·P·R / (P + R) — среднее гармоническое: оно мало, если мала хотя бы одна из двух. Повышение порога обычно поднимает точность и снижает полноту."
  syntax: |
    precision_score(y_test, pred), recall_score(y_test, pred), f1_score(y_test, pred)
- id: roc-auc
  term: ROC-кривая и AUC
  category: Классификация
  aliases: [ROC, roc_curve, roc_auc_score, AUC, площадь под кривой, FPR, доля ложных срабатываний, кривая точность — полнота, average precision, PR-AUC]
  summary: "ROC-кривая показывает для каждого порога долю найденных положительных (TPR, полнота) против доли ложных срабатываний среди отрицательных (FPR). Площадь под ней — AUC: вероятность того, что случайный объект класса 1 получит оценку выше случайного объекта класса 0. AUC = 0,5 — угадывание, 1 — идеальное разделение; от выбора порога AUC не зависит. При сильном дисбалансе полезнее кривая «точность — полнота» и её площадь (average precision)."
  syntax: |
    fpr, tpr, thresholds = roc_curve(y_test, p)
    roc_auc_score(y_test, p), average_precision_score(y_test, p)
- id: class-imbalance
  term: Несбалансированные классы
  category: Классификация
  aliases: [дисбаланс классов, imbalanced classes, редкий класс, парадокс доли верных, accuracy paradox, stratify, стратификация]
  summary: "Ситуация, когда один класс встречается гораздо реже другого: гибриды среди машин, мошеннические платежи, болезни. Доля верных обманывает: ответ «всегда частый класс» даёт 94 % верных и не находит ни одного редкого объекта. Модель с порогом 0,5 часто тоже почти никогда не называет редкий класс. Данные разбивают со stratify, чтобы доля редкого класса в частях совпадала, а качество смотрят по полноте, точности, F1 и площади под кривой «точность — полнота»."
- id: rebalancing
  term: Как помочь редкому классу
  category: Классификация
  aliases: [class_weight, balanced, oversampling, undersampling, дублирование, прореживание, сдвиг порога, SMOTE, перебалансировка]
  summary: "Три способа. Веса классов (class_weight='balanced') делают ошибку на редком классе дороже. Дублирование редких объектов (oversampling) или прореживание частых (undersampling) меняют обучающую выборку — только обучающую, иначе копии попадут в проверку и оценка станет нечестной. Сдвиг порога подбирают на валидации под нужную полноту или наибольший F1. Каждый способ покупает полноту ценой точности."
  syntax: |
    LogisticRegression(class_weight='balanced')
    idx = rng.choice(np.where(y_train == 1)[0], size=k, replace=True)   # дублирование редких
- id: pca
  term: Метод главных компонент (PCA)
  category: Обучение без учителя
  aliases: [PCA, главные компоненты, principal component analysis, снижение размерности, уменьшение размерности, собственные векторы, ковариационная матрица, components_]
  summary: "Способ заменить много связанных признаков несколькими новыми осями — главными компонентами. Первая компонента — направление, вдоль которого данные разбросаны сильнее всего, вторая — следующее, перпендикулярное первой, и так далее. Это собственные векторы ковариационной матрицы центрированных признаков; признаки в разных единицах сначала стандартизуют, иначе всё решит самый крупный по масштабу. Проекция на 2 компоненты позволяет нарисовать многомерные данные на плоскости."
  syntax: |
    X_std = StandardScaler().fit_transform(X)
    pca = PCA(n_components=2).fit(X_std)
    Z = pca.transform(X_std)                     # координаты в новых осях
    X_back = pca.inverse_transform(Z)            # приближённое восстановление
- id: explained-variance
  term: Объяснённая доля дисперсии
  category: Обучение без учителя
  aliases: [explained_variance_ratio_, explained variance, доля дисперсии, собственное число, eigenvalue, накопленная доля]
  summary: "Сколько разброса данных сохраняет каждая главная компонента: её собственное число, делённое на сумму всех. Накопленная доля показывает, сколько компонент нужно, чтобы сохранить, например, 90 % разброса. Если первые две компоненты объясняют мало, картинка на плоскости многое скрывает."
  syntax: |
    np.cumsum(pca.explained_variance_ratio_)
- id: k-means
  term: Кластеризация k-средних (k-means)
  category: Обучение без учителя
  aliases: [k-means, KMeans, кластеризация, кластер, центроид, центр кластера, обучение без учителя, k-means++, n_init]
  summary: "Обучение без учителя: разбить объекты на k групп похожих. Алгоритм выбирает k начальных центров, относит каждый объект к ближайшему центру, переносит центры в средние своих объектов и повторяет, пока назначения меняются. Результат зависит от начальных центров — поэтому запускают несколько раз (n_init) с умной инициализацией k-means++ — и от масштаба признаков. Ответов для проверки нет: кластеры оценивают по смыслу и по инерции."
  syntax: |
    km = KMeans(n_clusters=4, n_init=10, random_state=0).fit(X_std)
    km.labels_, km.cluster_centers_, km.inertia_
- id: cluster-count
  term: Сколько кластеров — инерция и локоть
  category: Обучение без учителя
  aliases: [инерция, inertia_, метод локтя, elbow, число кластеров, силуэт, silhouette]
  summary: "Инерция — сумма квадратов расстояний объектов до центров их кластеров. С ростом k она всегда падает: при k, равном числу объектов, она 0. Поэтому выбирают k, после которого падение резко замедляется («локоть»), а главное — проверяют, осмысленны ли кластеры: чем отличаются их средние признаки."
  syntax: |
    inertias = [KMeans(n_clusters=k, n_init=10, random_state=0).fit(X_std).inertia_ for k in range(1, 9)]
- id: estimator-api
  term: Устройство модели — fit и predict
  category: Scikit-learn
  aliases: [fit, predict, transform, estimator, оценщик, coef_, cluster_centers_, components_, return self, своя модель]
  summary: "Все модели scikit-learn устроены одинаково. Настройки (число кластеров, шаг обучения) задаются при создании объекта. fit(X, y) учится по данным, сохраняет найденное в атрибутах с подчёркиванием в конце — coef_, cluster_centers_, components_ — и возвращает сам объект, поэтому можно писать model.fit(X, y).predict(X). predict и transform пользуются только сохранённым. Своя реализация с тем же устройством проверяется сравнением с моделью scikit-learn на тех же данных."
  syntax: |
    class MyKMeans:
        def __init__(self, n_clusters):
            self.n_clusters = n_clusters
        def fit(self, X):
            ...
            self.cluster_centers_ = centers
            return self
        def predict(self, X):
            ...
