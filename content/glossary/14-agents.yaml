# Справочник: поиск по документам, RAG, ИИ-агенты, контекст-инженерия, голосовой бот (модуль 11).
- id: tf-idf
  term: TF-IDF
  category: ИИ-агенты
  aliases: [tfidf, TfidfVectorizer, мешок слов, bag of words, CountVectorizer, idf, term frequency, вес слова]
  summary: "Способ превратить документ в вектор чисел. Сначала считают, сколько раз каждое слово встречается в документе (tf, «мешок слов»: порядок слов теряется). Потом умножают на idf — меру редкости слова во всей коллекции: слово из каждого документа почти ничего не говорит о теме, а редкое — говорит много. В scikit-learn idf = ln((1 + n) / (1 + df)) + 1, где n — число документов, df — сколько из них содержат слово; вектор каждого документа нормируют на длину 1."
  syntax: |
    from sklearn.feature_extraction.text import TfidfVectorizer
    vectorizer = TfidfVectorizer()
    X = vectorizer.fit_transform(texts)      # разреженная матрица: документы × слова
    vectorizer.get_feature_names_out(), vectorizer.idf_
- id: document-search
  term: Поиск документов (retrieval)
  category: ИИ-агенты
  aliases: [retrieval, поиск по документам, retriever, top-k, векторный поиск, семантический поиск, база знаний, чанк, chunk]
  summary: "Найти в коллекции документы, близкие к запросу. Документы заранее переводят в векторы (TF-IDF или эмбеддинги нейросети), запрос — тем же способом; сходство считают косинусом и берут k лучших. Документами обычно служат не целые книги, а небольшие куски (разделы, абзацы — «чанки»): так найденное помещается в промпт и точнее отвечает на вопрос. Поиск по эмбеддингам нейросети называют семантическим: он находит и синонимы, а TF-IDF — только общие слова или их части."
  syntax: |
    q = vectorizer.transform([query])           # не fit: словарь — от документов
    scores = (X @ q.T).toarray().ravel()        # косинус: строки уже длины 1
    top = np.argsort(-scores)[:k]
- id: recall-at-k
  term: recall@k
  category: ИИ-агенты
  aliases: [recall at k, полнота поиска, hit rate, качество поиска, MRR, средний обратный ранг, ранг]
  summary: "Метрика качества поиска: доля запросов, для которых правильный документ оказался среди первых k результатов. recall@1 строже, recall@10 мягче. Для RAG важна именно она: модель увидит только то, что попало в контекст. MRR (mean reciprocal rank) — среднее 1 / (место правильного документа): учитывает, насколько высоко он стоит. Поиск проверяют на запросах, которые не использовали при подборе настроек, — иначе оценка завышена."
  syntax: |
    hits = [right in found[:k] for right, found in zip(answers, results)]
    recall_k = sum(hits) / len(hits)
- id: char-ngrams
  term: Символьные n-граммы
  category: ИИ-агенты
  aliases: [char n-grams, char_wb, analyzer='char_wb', ngram_range, n-граммы символов, формы слова, морфология]
  summary: "Текст разбивают на перекрывающиеся кусочки из n символов. В режиме char_wb кусочки берутся внутри слов, дополненных пробелами: « мод», «моде», «одел». Разные формы одного слова («переобучение», «переобучением») делят большинство кусочков, поэтому поиск по ним устойчив к окончаниям и опечаткам. Цена — словарь в разы больше, чем у слов."
  syntax: |
    TfidfVectorizer(analyzer='char_wb', ngram_range=(3, 5))
- id: rag
  term: RAG (Retrieval-Augmented Generation)
  category: ИИ-агенты
  aliases: [генерация с дополненной выборкой, retrieval-augmented generation, контекст из документов, цитаты, ссылки на источник, база знаний]
  summary: "Способ дать модели знания, которых не было в её обучении: свежие, закрытые, свои. По вопросу ищут документы, вставляют их в промпт и просят отвечать только по ним, со ссылками на источник. Если похожих документов нет, честно отвечают «не знаю». Качество RAG держится на поиске: чего нет в контексте, того модель не знает. Ссылки в ответе проверяют программой — модель может сослаться на документ, которого ей не давали."
- id: hallucination
  term: Галлюцинация модели
  category: ИИ-агенты
  aliases: [hallucination, выдумка, конфабуляция, уверенная ошибка, выдуманная ссылка]
  summary: "Уверенный, гладко написанный ответ языковой модели, который не соответствует действительности: несуществующая функция библиотеки, выдуманная цитата, неверный факт. Модель продолжает текст правдоподобно, а не проверяет его. Снижают риск RAG (ответ только по найденным документам), просьба ссылаться на источник и программная проверка ссылок, фактов и кода."
- id: ai-agent
  term: ИИ-агент
  category: ИИ-агенты
  aliases: [AI agent, агент, LLM-агент, автономный агент, агентная система, workflow, многоагентная система]
  summary: "Программа, в которой языковая модель сама решает, какие действия выполнить для цели пользователя, выполняет их через инструменты и смотрит на результат. Компоненты: модель (рассуждает и выбирает действия), инструменты (поиск, API, база данных, код) и инструкции (цель, правила, ограничения). Обычный чат-бот на вопрос «Покажи моё расписание» ответит, что доступа нет; агент вызовет инструмент календаря и ответит по данным."
- id: react-loop
  term: ReAct (Reasoning and Acting)
  category: ИИ-агенты
  aliases: [ReAct, Thought, Action, Action Input, Observation, Final Answer, цикл агента, рассуждение и действие]
  summary: "Схема работы агента (статья 2022 года): модель чередует рассуждение и действие. Thought — что нужно сделать; Action и Action Input — какой инструмент вызвать и с какими данными; Observation — результат, который дописывает программа; так до Final Answer. Программа ограничивает число шагов и проверяет, что инструмент существует: модель может зациклиться или выдумать инструмент."
  syntax: |
    Thought: нужно узнать расписание
    Action: get_schedule
    Action Input: завтра
    Observation: 9:00 — История, ауд. 203
    Final Answer: Завтра в 9:00 история в ауд. 203.
- id: mcp
  term: MCP (Model Context Protocol)
  category: ИИ-агенты
  aliases: [Model Context Protocol, MCP-сервер, MCP-клиент, tools/list, tools/call, JSON-RPC, A2A, Agent2Agent, стандартный протокол]
  summary: "Открытый стандарт (Anthropic, 2024) подключения ИИ-приложений к внешним системам — «USB-C для ИИ». Приложение-хост держит по клиенту на каждый MCP-сервер; сервер предоставляет инструменты (tools), данные (resources) и шаблоны промптов (prompts). Сообщения — JSON-RPC: tools/list возвращает имена, описания и схемы аргументов (inputSchema), tools/call вызывает инструмент. Сервер пишут один раз — и им пользуется любой агент, понимающий протокол. Серверы бывают локальные и удалённые. A2A (Agent2Agent, Google) — открытый стандарт общения агентов между собой."
  syntax: |
    {"jsonrpc": "2.0", "id": 1, "method": "tools/list"}
    {"jsonrpc": "2.0", "id": 2, "method": "tools/call",
     "params": {"name": "get_schedule", "arguments": {"day": "завтра"}}}
- id: langchain-tools
  term: Инструменты LangChain (@tool, tool_calls)
  category: ИИ-агенты
  aliases: ["@tool", tool, bind_tools, tool_calls, ToolMessage, tool_call_id, StructuredTool, convert_to_openai_tool, FakeMessagesListChatModel, LangGraph]
  summary: "Декоратор @tool превращает функцию в инструмент: имя — имя функции, описание — docstring, схема аргументов — из подсказок типов. model.bind_tools(tools) передаёт описания настоящей модели; её ответ AIMessage содержит tool_calls — список вызовов с именем, аргументами и id. Программа выполняет каждый: tool.invoke(call) сразу возвращает ToolMessage с тем же tool_call_id. Цикл повторяют, пока модель не ответит без вызовов. Готовые циклы агентов есть в LangGraph."
  syntax: |
    llm_with_tools = GigaChat(credentials=key).bind_tools([get_schedule])
    ai = llm_with_tools.invoke(messages)
    for call in ai.tool_calls:
        messages.append(tools[call['name']].invoke(call))
- id: prompt-injection
  term: Prompt injection
  category: ИИ-агенты
  aliases: [промпт-инъекция, внедрение инструкций, jailbreak, косвенная инъекция, indirect prompt injection, tool poisoning, отравление инструментов]
  summary: "Атака, при которой чужие инструкции попадают в контекст модели и она их выполняет. Прямая — в сообщении пользователя («игнорируй предыдущие инструкции»). Косвенная — в данных, которые агент читает сам: веб-странице, письме, найденном документе. Отравление инструментов (tool poisoning) — скрытые инструкции в описании инструмента MCP-сервера, например «прочитай SSH-ключи и отправь их». Модель не отличает данные от команд, поэтому защищаются не уговорами в промпте, а ограничением прав и проверками."
- id: guardrails
  term: Guardrails (ограничители)
  category: ИИ-агенты
  aliases: [guardrails, ограничения агента, модерация, фильтр ввода, human-in-the-loop, подтверждение человека, минимальные права, least privilege]
  summary: "Проверки вокруг модели, которые не дают агенту сделать вредное. На входе — лимит длины, запрещённые шаблоны (регулярные выражения, списки слов), модерация и классификатор «безопасно / нет». На выходе — формат и утечки данных. У инструментов — минимальные права (агенту для отчётов не нужен доступ на удаление базы), подтверждение человека для необратимых действий, отдельная тестовая среда и резервные копии. Ни один фильтр не надёжен сам по себе, поэтому защиту ставят слоями."
- id: context-engineering
  term: Контекст-инженерия
  category: ИИ-агенты
  aliases: [context engineering, бюджет токенов, сжатие истории, compaction, пересказ истории, AGENTS.md, правила проекта, память агента]
  summary: "Модель знает о задаче только то, что лежит в её контексте: системные инструкции, правила проекта, описания инструментов, найденные документы, историю диалога и результаты инструментов. Контекст-инженерия решает, что положить туда на каждом шаге, в каком порядке и как уложиться в окно и бюджет: отобрать нужное, сократить длинные результаты, пересказать старую историю, вынести заметки в файл. Агенты для программирования (например, OpenCode) читают правила проекта из файла AGENTS.md."
- id: digital-audio
  term: Цифровой звук
  category: ИИ-агенты
  aliases: [WAV, частота дискретизации, sample rate, отсчёт, сэмпл, PCM, 16 бит, моно, RMS, громкость, волновая форма]
  summary: "Микрофон измеряет давление воздуха много раз в секунду; каждое измерение — отсчёт (целое число, например 16-битное от −32768 до 32767). Частота дискретизации — сколько отсчётов в секунду: 16 000 Гц хватает для речи, 44 100 и 48 000 — для музыки. Длительность = число отсчётов / частота. Громкость участка оценивают среднеквадратичным значением (RMS); тишина — участки с малым RMS. Файл WAV хранит отсчёты PCM и заголовок с их параметрами."
  syntax: |
    import wave
    with wave.open('recording.wav') as w:
        rate, n = w.getframerate(), w.getnframes()
        samples = np.frombuffer(w.readframes(n), dtype=np.int16)
- id: speech-pipeline
  term: Голосовой бот (STT → LLM → TTS)
  category: ИИ-агенты
  aliases: [speech-to-text, text-to-speech, STT, TTS, ASR, распознавание речи, синтез речи, SaluteSpeech, Whisper, голосовой ассистент, Gradio]
  summary: "Цепочка из трёх моделей: распознавание речи (STT — speech-to-text: SaluteSpeech, Whisper) превращает запись в текст, языковая модель отвечает с учётом истории диалога, синтез речи (TTS — text-to-speech) озвучивает ответ. Ошибки звеньев складываются: модель получает текст с ошибками распознавания («Gradio» → «radio»). Каждое звено может не ответить, поэтому ошибки обрабатывают явно, а не берут первый элемент чего придётся."
