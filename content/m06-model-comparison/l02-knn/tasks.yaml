  solution: |
    def knn_predict(X_fit, y_fit, X_new, k):
        diff = X_new[:, None, :] - X_fit[None, :, :]    # q × n × m
        dist = np.sqrt((diff ** 2).sum(axis=2))         # q × n
        nearest = np.argsort(dist, axis=1)[:, :k]       # q × k
        return y_fit[nearest].mean(axis=1)

    pred = knn_predict(X_demo, y_demo, X_query, k=5)
    print(pred.round(2))
  explanation: |
    - `X_new[:, None, :] - X_fit[None, :, :]` даёт разности каждой новой точки с каждой обучающей: массив q × n × m. Сумма квадратов по последней оси и корень — матрица расстояний q × n.
    - `np.argsort(dist, axis=1)[:, :k]` — позиции k ближайших для каждой строки; `y_fit[nearest]` — их ответы (q × k), среднее по строке — прогнозы.
    - Так и работает `KNeighborsRegressor` с перебором всех пар (`algorithm='brute'`). Для больших таблиц scikit-learn строит деревья поиска, чтобы не считать все расстояния. На настоящих данных о машинах бывают одинаковые расстояния — тогда выбор соседей из «ничьих» у разных реализаций может отличаться.
  hints:
