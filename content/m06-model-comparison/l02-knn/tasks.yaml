    X_demo = rng.normal(size=(300, 2))
    y_demo = 10 + 3 * X_demo[:, 0] - 2 * X_demo[:, 1] ** 2 + rng.normal(scale=0.5, size=300)
    X_query = rng.normal(size=(20, 2))
