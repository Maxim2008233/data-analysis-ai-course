    - "Ближайшие для каждой строки — `np.argsort(dist, axis=1)[:, :k]`."
    - "Ответы соседей — `y_fit[nearest]`, прогноз — `.mean(axis=1)`."
  tests: |
    import numpy as np
    from sklearn.neighbors import KNeighborsRegressor
    f = var('knn_predict')
    ensure(callable(f), '`knn_predict` должна быть функцией.')
    rng = np.random.default_rng(123)
    for k in (1, 3, 7):
        Xf = rng.normal(size=(150, 3))
        yf = rng.normal(size=150)
        Xn = rng.normal(size=(12, 3))
        got = np.asarray(f(Xf, yf, Xn, k), dtype=float)
        exp = KNeighborsRegressor(n_neighbors=k, algorithm='brute').fit(Xf, yf).predict(Xn)
        ensure(got.shape == exp.shape, 'Функция должна вернуть по прогнозу на каждую строку `X_new` ({0}), а вернула форму {1}.'.format(exp.shape, got.shape))
        if not np.allclose(got, exp):
            far = np.asarray(yf[np.argsort(np.sqrt(((Xn[:, None, :] - Xf[None, :, :]) ** 2).sum(axis=2)), axis=1)[:, -k:]].mean(axis=1))
            if np.allclose(got, far):
                fail('Взяты самые **далёкие** точки: соседи — первые k позиций после `np.argsort` по возрастанию.')
            fail('При k = {0} прогнозы не совпадают с KNeighborsRegressor на новых данных. Проверьте ось суммы (`axis=2`) и ось сортировки (`axis=1`).'.format(k))
    same_array(np.asarray(var('pred'), dtype=float), ref('pred'), 'Прогнозы для `X_query` не совпадают.')
