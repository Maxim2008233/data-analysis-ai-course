  <text x="392" y="40" fill="currentColor" font-weight="700">Как kNN оценивает цену новой машины ★</text>
  <text x="392" y="66" fill="currentColor">1. Признаки стандартизированы — годы и километры</text>
  <text x="408" y="82" fill="currentColor">весят одинаково (урок 5.7).</text>
  <text x="392" y="106" fill="currentColor">2. Считаем расстояния до всех обучающих машин</text>
  <text x="408" y="122" fill="currentColor">и берём k = 5 ближайших (внутри окружности).</text>
  <text x="392" y="146" fill="currentColor">3. Прогноз — средняя цена соседей:</text>
  <text x="408" y="166" fill="currentColor" font-weight="700">(7,2 + 9,6 + 8,4 + 10,1 + 7,9) / 5 ≈ 8,6 тыс. евро</text>
  <text x="392" y="194" fill="currentColor">Обучения как такового нет: модель хранит таблицу</text>
  <text x="392" y="210" fill="currentColor">обучающих машин, а вся работа — при прогнозе.</text>
  <text x="392" y="236" fill="currentColor" fill-opacity="0.75">Чем насыщеннее цвет точки, тем дороже машина.</text>
</svg>
