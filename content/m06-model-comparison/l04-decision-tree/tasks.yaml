  solution: |
    def best_split(X, y):
        best_sse, best_feature, best_threshold = np.inf, None, None
        for j in range(X.shape[1]):
            order = np.argsort(X[:, j], kind='stable')
            xs, ys = X[order, j], y[order]
            n = len(ys)
            csum, csum2 = np.cumsum(ys), np.cumsum(ys ** 2)
            i = np.arange(1, n)                               # слева первые i строк
            ok = xs[1:] != xs[:-1]                            # порог только между разными значениями
            left_sse = csum2[i - 1] - csum[i - 1] ** 2 / i
            right_sum = csum[-1] - csum[i - 1]
            right_sse = (csum2[-1] - csum2[i - 1]) - right_sum ** 2 / (n - i)
            sse = np.where(ok, left_sse + right_sse, np.inf)
            k = np.argmin(sse)
            if sse[k] < best_sse:
                best_sse, best_feature, best_threshold = sse[k], j, (xs[k] + xs[k + 1]) / 2
        return best_feature, best_threshold

    split_small = best_split(X_small, y_small)
    print(split_small)
  explanation: |
    - Прямой перебор (для каждого порога заново делить массив и считать суммы) работает, но медленно: у пробега тысячи различных значений.
    - Быстрый приём — отсортировать признак и накопленные суммы `cumsum`: сумма квадратов отклонений части равна Σy² − (Σy)²/n, а Σy и Σy² для «первых i строк» дают накопленные суммы сразу для всех порогов.
    - На 3 000 машинах лучший вопрос — снова год (признак 0); `DecisionTreeRegressor(max_depth=1)` находит тот же признак и порог. Так устроен поиск разбиения и в scikit-learn — только на C и с оптимизациями.
