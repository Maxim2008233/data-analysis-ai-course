    def knn_pipe(k):
        return Pipeline([('scale', StandardScaler()), ('model', KNeighborsRegressor(n_neighbors=k))])

    result = {}
    for k in ks:
        scores = cross_val_score(knn_pipe(k), X_temp, y_temp, cv=cv5, scoring='neg_mean_absolute_error')
        result[k] = -scores.mean()
    k_cv = pd.Series(result)
    best_k = k_cv.idxmin()
    final = knn_pipe(best_k).fit(X_temp, y_temp)
    test_mae = mean_absolute_error(y_test, final.predict(X_test))
    print(k_cv.round(1))
    print(best_k, round(test_mae, 1))
  explanation: |
    - С кросс-валидацией отдельная validation не нужна: каждая из 25 653 машин побывала и в обучении, и в проверке. Лучшее k — 20 (≈ 2 704; у k = 50 — ≈ 2 717).
    - Финальная модель учится на всех данных, кроме test, — их больше, чем в любом шаге CV.
    - Test открыт один раз: MAE ≈ 2 739 — честная итоговая оценка kNN (обученный только на train kNN давал на test ≈ 2 768: больше данных — точнее). Ровно так в scikit-learn работает `GridSearchCV` с последующим `refit`.
