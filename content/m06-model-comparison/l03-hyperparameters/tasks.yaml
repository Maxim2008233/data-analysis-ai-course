    - Два гиперпараметра — два вложенных цикла; каждое сочетание — новая модель и строка таблицы.
    - С `weights='distance'` ошибка на train почти нулевая (≈ 360): машина из train — сама себе ближайший сосед на расстоянии 0 с бесконечным весом. На validation эти варианты не лучше простого среднего — лучшим остаётся `k = 20`, `'uniform'` (≈ 2 692).
    - Так устроен перебор по сетке (grid search): в scikit-learn есть `GridSearchCV`, который делает то же самое с кросс-валидацией (урок 6.8).
