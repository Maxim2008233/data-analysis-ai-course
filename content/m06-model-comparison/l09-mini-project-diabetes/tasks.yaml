            result[leaf] = -cross_val_score(forest, X_temp, y_temp, cv=cv, scoring='neg_mean_absolute_error').mean()
        forest_cv = pd.Series(result)
        best_leaf = forest_cv.idxmin()
        forest_best = forest_cv.min()
      expect: "min_samples_leaf=leaf"
