    ensure(list(s.index) == ref('leafs'), 'Индекс `forest_cv` — размеры листа из `leafs`.')
    if (s < 0).all():
        fail('Средние отрицательные — поменяйте знак.')
    same_array(s.to_numpy(dtype=float), ref('forest_cv').to_numpy(dtype=float), 'Средние MAE не совпадают: 100 деревьев, `min_samples_leaf=leaf`, `random_state=42`, блоки `cv`.')
