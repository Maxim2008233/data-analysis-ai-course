description: >-
  Меняем один элемент за раз и честно сравниваем результат. Pipeline соединяет подготовку признаков и модель;
  метод ближайших соседей оценивает цену по похожим машинам; дерево решений задаёт вопросы о признаках, а глубина
  управляет переобучением; случайный лес усредняет много деревьев. Общая функция сравнивает кандидатов на одном
  разбиении, кросс-валидация проверяет устойчивость выбора, тестовая часть открывается один раз — для выбранной модели.
  Мини-проект — выбор модели для небольшого медицинского набора Diabetes.
